# 编排：进 wf → workflows/handoff.md；执行 → 当前 step 步骤包；终端 → _shared/closeout.md。
# 步骤卡 §6 必开技能：整卡读取→执行→回包。禁把 skill 正文嵌进步骤卡。
# 本 YAML 只定义状态/门/产出；不用于运行时通读。
workflow:
  id: handoff
  name: 协作交接
  version: 1
  terminal: closeout
entry_points:
  写交接单: compose
  生成交接包: compose
  发送交接包: send
  接收交接包: receive
  变更通知: change_send
  同步变更: change_receive
  重规划: replan
trigger:
- 写交接单 / 生成交接包 / 接收交接包 / 交接状态
- 变更通知 / 同步变更 / 重规划
steps:
- name: 写交接单文档
  id: compose
  skills: []
  must_read:
  - rules/packets/handoff/compose.md
  - rules/templates/90-handoff/handoff-note-template.md
  agent: pm-lead
  hitl: confirm_intent
  hitl_when: intent_needs_confirm
  output: 自洽交接单文档（默认非 HO；落 outbound/{category}/；同轮记 handoff-ledger.md）
  notes: '**默认入口**。读 `rules/collaboration/handoff.md` 与 `handoff-note-template.md`（择优，非填空卷）。 **意图择优**：先判 `intent_needs_confirm`（澄清方法见
    clarification）。真 → 完整【意图理解】停等再落盘；假 → 一行【意图】回执后直写。禁止含糊「交接」直接成文。 五问→形态 A/B/C 或专模；禁止整表粘贴。确认类优先 B 一页纸。 专模真源写版本目录，同轮实拷 `{workroot}/handoff/outbound/{category}/`；无专模直接写出站类。不建
    HO；禁外印元数据。'
- name: 生成交接包
  id: send
  skills: []
  must_read:
  - rules/packets/handoff/send.md
  agent: pm-lead
  hitl: confirm_handoff
  hitl_when: handoff_send_required
  output: '{workroot}/handoff/outbound/{category}/{HO-ID}/ + 【交接包已生成】'
  verify: python wf-product/rules/tools/validate_handoff.py "{workroot}/handoff/outbound/{category}/{HO-ID}"
  on_fail: 缺 00/01/快照/占位符/链接断 → 不发送；补后重跑校验
  notes: '**仅升包**。未命中包触发 → 改 `compose`。先问后发：确认后写盘到 `handoff/outbound/{category}/{HO-ID}/`；刷新出站散文件；跑 `validate_handoff.py`
    → 台账已发送。 `04` 空白回执≠必须填写。多包同仓直读出站路径；仓外 ZIP。输出【交接包已生成】。'
- name: 接收与签收
  id: receive
  skills: []
  must_read:
  - rules/packets/handoff/receive.md
  agent: pm-lead
  hitl:
  - name: confirm_change
    when: handoff_change_substantive
  - name: confirm_plan
    when: plan_level_change
  output: 入站分析/吸收 + 接收回执（按需）+ 产品计划/文档更新 + 台账状态
  notes: '**硬**：打开→分析→吸收→同步；`inbound/` 为原件、`handoff/inbound/` 为收件工作副本。 多包同仓直读对方出站；仓外主副本原件根 `inbound/` + 工作副本 `{workroot}/handoff/inbound/{类别}/`。
    按类型更新计划/PRD/UAT 等；正式签收才回执。更新台账、计划、索引、activeContext。'
- name: 发送变更通知
  id: change_send
  skills: []
  must_read:
  - rules/packets/handoff/change_send.md
  agent: pm-lead
  hitl:
  - name: confirm_change
    when: handoff_change_substantive
  - name: confirm_handoff
    when: handoff_send_required
  output: '{workroot}/handoff/outbound/变更/{CHG-HO-ID}/ + 更新后的受影响文档'
  notes: 先按 `workflows/change.yaml` 完成受理/影响/处置/变更单；本步只负责“通知包”。 按 `rules/collaboration/handoff.md` 判 C0～C3；C2/C3 先过 `confirm_change`/`confirm_plan`。
    **CHG 包同样先问后发**：`confirm_handoff` 出示拟发摘要，确认后才生成。 必带：变更单、更新后 PRD/AC/原型、影响矩阵、必做事项/截止、兼容/回滚、生效版本。 多包同仓直读，禁止转发；仓外发文件夹/ZIP。
- name: 接收变更并适配
  id: change_receive
  skills: []
  must_read:
  - rules/packets/handoff/change_receive.md
  agent: pm-lead
  hitl:
  - name: confirm_change
    when: handoff_change_substantive
  - name: confirm_plan
    when: plan_level_change
  output: 变更影响分析 + 产品计划/文档调整 + 回执
  notes: 读变更包 00/01/02；按 `rules/collaboration/handoff.md` 判级别；核对变更单、影响矩阵、生效版本、回滚/兼容。 先做影响分析：PRD/AC、原型、范围/优先级、里程碑、UAT/发布、需求池、通知对象。
    C0 → 就地更新并书面答复；C1 → 更新受影响文档/计划，回执；C2/C3 → 重基线并过门，必要时反向发 `CHG`。 更新 `handoff-ledger.md`、产品计划、 `{workroot}/INDEX.md`、activeContext；填写回执。
    与现有 PRD/计划冲突 → 列冲突，不静默选一边；未裁决前不进入实施/排期。
- name: 重规划
  id: replan
  skills: []
  must_read:
  - rules/packets/handoff/replan.md
  agent: pm-lead
  hitl: confirm_plan
  hitl_when: plan_level_change
  output: 更新后的产品计划 + 重规划记录
  notes: 按 `rules/collaboration/handoff.md` 触发（范围/里程碑/依赖/S1-S2/环境/产能/合规）执行；先冻结当前基线快照，再做影响矩阵。 选一个动作并写理由：保持+加缓冲｜重排｜砍范围/降级 MVP｜拆波次｜暂停升级｜重新基线；C2/C3
    必须过 `confirm_plan`。 同轮更新产品计划、`handoff-ledger.md`、 `{workroot}/INDEX.md`、activeContext；受影响的 `REQ/PLAN/UAT/REL` 包标 `已取代`
    并重发。 重规划后重过受影响门（PRD/评审/UAT/发布）；未过门不得把阶段标完成；向受影响角色发 `CHG` 包并收回执。
- name: 收尾与提交
  id: closeout
  skills: []
  must_read:
  - rules/packets/_shared/closeout.md
  agent: pm-lead
  hitl:
  - name: confirm_commit
    when: has_pending_commit
  output: 任务收尾 + 拟提交确认
  notes: 收尾与提交；共享终端；状态=done。
