# 编排：只读当前 step。进 wf → packets/deliver/_chain.md；进子机 → _region-*；执行 → 步骤包。
# 步骤包 §6 必开技能：打开→执行→回包（质量不降）。禁把 skill 正文嵌进步骤包。
# 富编排笔记：packets/deliver/_orch.yaml（重建用）。禁通读本 YAML 其他 step。
workflow:
  id: deliver
  name: 交付与验收
  version: 5
entry_points:
  排期: schedule
  迭代规划: schedule
  交付计划: schedule
  任务拆解: schedule
  交付计划评审: review-plan-deliver
  评审交付计划: review-plan-deliver
  交付跟进: followup
  风险升级: followup
  UAT: uat
  验收: uat
  发布: release
  上线检查: release
  复盘: release
trigger:
- 排期 / 迭代规划 / 交付计划
- 交付跟进 / 风险升级
- UAT / 验收
- 发布 / 上线检查 / 复盘
steps:
- name: 排期与交接
  id: schedule
  must_read:
  - rules/packets/deliver/schedule.md
  agent: pm-lead
  precondition: PRD 头部 status=APPROVED，或用户明确确认本次无需完整 PRD/带缺口排期并记录依据与责任人
  on_fail: 回 prd.review 补定稿/评审；未定稿且未获明确豁免不排期
  output: '{workroot}/{ver}/40-delivery/交付计划-{ver}.md（模板 rules/templates/40-delivery/delivery-plan-template.md）'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/deliver/_orch.yaml。
- name: 交付计划评审
  id: review-plan-deliver
  must_read:
  - rules/packets/deliver/review-plan-deliver.md
  agent: reviewer-agent
  hitl: select_review_mode
  hitl_when: landing_doc_review_needed
  output: 评审记录（评审-交付计划-{ver}-{yyyyMMdd}.md）或 HUMAN_APPROVED 声明
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/deliver/_orch.yaml。
- name: 交付跟进
  id: followup
  must_read:
  - rules/packets/deliver/followup.md
  agent: pm-lead
  output: 产品计划 §7/§8 + 交付计划 §7 状态报告 + 风险/依赖台账
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/deliver/_orch.yaml。
- name: UAT 验收
  id: uat
  must_read:
  - rules/packets/deliver/uat.md
  when: has_uat
  agent: pm-lead
  gate: uat-evidence
  gate_type: machine
  output: '{workroot}/{ver}/40-delivery/UAT-{ver}-{yyyyMMdd}.md（模板 rules/templates/40-delivery/uat-acceptance-template.md）'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/deliver/_orch.yaml。
- name: 发布与复盘
  id: release
  must_read:
  - rules/packets/deliver/release.md
  - rules/templates/60-retro/retro-template.md
  agent: pm-lead
  on_fail: 不发布；回 UAT/审批或报阻塞，不得用“已发布”措辞
  gate: uat-evidence
  gate_type: machine
  gate_when: has_uat
  hitl: confirm_release
  hitl_when: release_decision_needed
  output: 发布决策 + 发布记录 + 复盘（{workroot}/{ver}/40-delivery/、90-retrospectives/）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/deliver/_orch.yaml。
- name: 收尾
  id: wrap
  must_read:
  - rules/packets/deliver/wrap.md
  - rules/templates/90-handoff/closeout-skeleton.md
  agent: pm-lead
  output: 【任务收尾】（交付/验收/复盘置第 1 点）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/deliver/_orch.yaml。
- name: 拟提交
  id: commit
  must_read:
  - rules/packets/deliver/commit.md
  output: 拟提交确认结果
  agent: pm-lead
  hitl: confirm_commit
  hitl_when: has_pending_commit
  tools:
  - git
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/deliver/_orch.yaml。
