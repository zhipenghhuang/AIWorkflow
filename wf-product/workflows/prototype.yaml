# 编排：只读当前 step。进 wf → packets/prototype/_chain.md；进子机 → _region-*；执行 → 步骤包。
# 步骤包 §6 必开技能：打开→执行→回包（质量不降）。禁把 skill 正文嵌进步骤包。
# 富编排笔记：packets/prototype/_orch.yaml（重建用）。禁通读本 YAML 其他 step。
workflow:
  id: prototype
  name: 页面原型设计
  version: 5
entry_points:
  画原型: context
  页面原型: context
  原型设计: context
  设计简报: context
  设计策略: context
  线框图: wireframe
  UI设计: visual
  高保真原型: hi-fi
  设计评审: review
  UI走查: usability
  设计走查: usability
  开发交接: handoff
trigger:
- 画原型 / 页面原型 / 原型设计 / 设计简报 / 设计策略 / 线框图
- UI 设计 / 界面设计 / 高保真原型
- 设计评审 / UI 走查 / 设计走查
steps:
- name: 项目情境与参考基准
  id: context
  must_read:
  - rules/packets/prototype/context.md
  agent: ux-designer
  output: '{workroot}/{ver}/20-design/设计情境-{主题}.md（含设计简报/项目适配/交付等级）'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/prototype/_orch.yaml。
- name: 信息架构与页面清单
  id: ia
  must_read:
  - rules/packets/prototype/ia.md
  agent: ux-designer
  output: '{workroot}/{ver}/20-design/IA-{主题}.md'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/prototype/_orch.yaml。
- name: 低保真线框
  id: wireframe
  must_read:
  - rules/packets/prototype/wireframe.md
  agent: ux-designer
  output: '{workroot}/{ver}/20-design/wireframe-{页面}.html 或 原型说明 §线框'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/prototype/_orch.yaml。
- name: 视觉方向与设计系统
  id: visual
  must_read:
  - rules/packets/prototype/visual.md
  output: 视觉稿/设计 tokens/标注（{workroot}/{ver}/20-design/）
  agent: ux-designer
  hitl: confirm_design
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/prototype/_orch.yaml。
- name: 高保真可点击原型
  id: hi-fi
  must_read:
  - rules/packets/prototype/hi-fi.md
  agent: ux-designer
  output: '{workroot}/{ver}/20-design/prototype/index.html + design-tokens.css'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/prototype/_orch.yaml。
- name: 工程化与可访问性
  id: engineering
  must_read:
  - rules/packets/prototype/engineering.md
  agent: ux-designer
  output: '{workroot}/{ver}/20-design/工程化检查-{主题}.md'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/prototype/_orch.yaml。
- name: 设计评审
  id: review
  must_read:
  - rules/packets/prototype/review.md
  - rules/templates/20-design/design-review-template.md
  agent: reviewer-agent
  hitl: select_review_mode
  hitl_when: landing_doc_review_needed
  gate: design-review
  gate_type: machine
  gate_when: ai_review_chosen
  output: '{workroot}/{ver}/20-design/设计评审-{主题}.md + prototype-coverage.md'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/prototype/_orch.yaml。
- name: 可用性走查
  id: usability
  must_read:
  - rules/packets/prototype/usability.md
  agent: ux-designer
  output: '{workroot}/{ver}/20-design/可用性走查-{主题}.md'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/prototype/_orch.yaml。
- name: 开发交接
  id: handoff
  must_read:
  - rules/packets/prototype/handoff.md
  - rules/templates/20-design/dev-handoff-template.md
  agent: ux-designer
  precondition: prototype.review 已通过；选 B 时 design-review 已 READY；或有用户明确豁免与依据
  on_fail: 回 review 补评审/覆盖矩阵/截图；未过不得交开发
  hitl: confirm_prototype
  output: '{workroot}/{ver}/20-design/开发交接-{主题}.md'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/prototype/_orch.yaml。
- name: 收尾
  id: wrap
  must_read:
  - rules/packets/prototype/wrap.md
  - rules/templates/90-handoff/closeout-skeleton.md
  agent: ux-designer
  output: 【任务收尾】（原型/评审/交接明细置第 1 点）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/prototype/_orch.yaml。
- name: 拟提交
  id: commit
  must_read:
  - rules/packets/prototype/commit.md
  output: 拟提交确认结果
  agent: ux-designer
  hitl: confirm_commit
  hitl_when: has_pending_commit
  tools:
  - git
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/prototype/_orch.yaml。
