# 编排：只读当前 step。进 wf → packets/showcase/_chain.md；进子机 → _region-*；执行 → 步骤包。
# 步骤包 §6 必开技能：打开→执行→回包（质量不降）。禁把 skill 正文嵌进步骤包。
# 富编排笔记：packets/showcase/_orch.yaml（重建用）。禁通读本 YAML 其他 step。
workflow:
  id: showcase
  name: 产品展示与介绍
  version: 3
entry_points:
  准备演示: audience
  客户演示: audience
  产品介绍: audience
  产品汇报: audience
  演示彩排: dryrun
  一页纸: materials
  Deck: materials
  用户手册: docs
  快速开始: docs
  FAQ: docs
  发布说明: docs
  培训材料: docs
trigger:
- 准备演示 / 客户演示 / 产品介绍 / 产品汇报
- 用户手册 / 快速开始 / FAQ / 发布说明 / 培训材料
- 演示彩排
steps:
- name: 受众与目标
  id: audience
  must_read:
  - rules/packets/showcase/audience.md
  agent: pm-lead
  output: '{workroot}/{ver}/50-showcase/展示需求-{受众}-{yyyyMMdd}.md（模板 rules/templates/50-showcase-docs/demo-script-template.md
    §1）'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/showcase/_orch.yaml。
- name: 故事线与流程图
  id: story
  must_read:
  - rules/packets/showcase/story.md
  agent: pm-lead
  hitl: confirm_narrative
  hitl_when: narrative_needs_confirm
  output: '{workroot}/{ver}/50-showcase/故事线-{受众}.md'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/showcase/_orch.yaml。
- name: 演示脚本
  id: demo
  must_read:
  - rules/packets/showcase/demo.md
  agent: pm-lead
  output: '{workroot}/{ver}/50-showcase/演示脚本-{受众}-{yyyyMMdd}.md'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/showcase/_orch.yaml。
- name: Demo 环境与数据
  id: environment
  must_read:
  - rules/packets/showcase/environment.md
  - rules/templates/50-showcase-docs/demo-checklist-template.md
  agent: pm-lead
  output: '{workroot}/{ver}/50-showcase/演示检查单-{yyyyMMdd}.md'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/showcase/_orch.yaml。
- name: 展示材料
  id: materials
  must_read:
  - rules/packets/showcase/materials.md
  agent: ux-designer
  output: '{workroot}/{ver}/50-showcase/一页纸-{产品}.md · {workroot}/{ver}/50-showcase/Deck大纲-{受众}.md（按点名类型产出）'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/showcase/_orch.yaml。
- name: 用户文档
  id: docs
  must_read:
  - rules/packets/showcase/docs.md
  - rules/templates/50-showcase-docs/user-manual-quickstart-template.md
  - rules/templates/50-showcase-docs/release-notes-template.md
  when: docs_requested
  agent: prd-writer
  output: '{workroot}/user/{按点名类型}-{ver}.md（快速开始/用户手册/FAQ/发布说明/培训材料；未点名默认用户手册）'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/showcase/_orch.yaml。
- name: 彩排与反馈
  id: dryrun
  must_read:
  - rules/packets/showcase/dryrun.md
  when: demo_needs_dryrun
  agent: pm-lead
  output: '{workroot}/{ver}/50-showcase/反馈记录-{yyyyMMdd}.md'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/showcase/_orch.yaml。
- name: 对外确认
  id: publish
  must_read:
  - rules/packets/showcase/publish.md
  when: materials_for_external
  agent: pm-lead
  hitl: confirm_materials
  hitl_when: materials_for_external
  output: 对外确认记录（清单 + 数字/截图来源 + 未实现边界 + 批准人）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/showcase/_orch.yaml。
- name: 收尾
  id: wrap
  must_read:
  - rules/packets/showcase/wrap.md
  - rules/templates/90-handoff/closeout-skeleton.md
  agent: pm-lead
  output: 【任务收尾】（展示/文档明细置第 1 点）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/showcase/_orch.yaml。
- name: 拟提交
  id: commit
  must_read:
  - rules/packets/showcase/commit.md
  output: 拟提交确认结果
  agent: pm-lead
  hitl: confirm_commit
  hitl_when: has_pending_commit
  tools:
  - git
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/showcase/_orch.yaml。
