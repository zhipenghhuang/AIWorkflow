# 编排：只读当前 step。进 wf → packets/prd/_chain.md；进子机 → _region-*；执行 → 步骤包。
# 步骤包 §6 必开技能：打开→执行→回包（质量不降）。禁把 skill 正文嵌进步骤包。
# 富编排笔记：packets/prd/_orch.yaml（重建用）。禁通读本 YAML 其他 step。
workflow:
  id: prd
  name: 需求与 PRD
  version: 6
entry_points:
  收集需求: discover
  需求洞察: discover
  竞品分析: discover
  学习竞品: discover
  需求池: discover
  分析客户需求: discover
  需求调研: discover
  客户访谈: discover
  需求澄清: discover
  竞品对标: benchmark
  功能对标: benchmark
  对标分析: benchmark
  功能差距: benchmark
  立项: prioritize
  单需求立项: prioritize
  排优先级: prioritize
  写PRD: prd
  写 PRD: prd
  出PRD: prd
  补PRD: prd
  PRD评审: review
  PRD 评审: review
  定稿: review
trigger:
- 收集需求 / 需求洞察 / 竞品分析 / 学习竞品 / 需求池
- 竞品对标 / 功能对标 / 对标分析 / 功能差距
- 立项 / 排优先级
- 写 PRD / 出 PRD / 补 PRD / PRD 评审 / 定稿
steps:
- name: 需求洞察与需求池
  id: discover
  must_read:
  - rules/packets/prd/discover.md
  output: 需求池/洞察/竞品分析（{workroot}/requirement-pool.md 或 {workroot}/{ver}/10-requirements/洞察|竞品分析-*.md）
  agent: pm-analyst
  hitl: confirm_understanding
  hitl_when: understanding_needs_confirm
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/prd/_orch.yaml。
- name: 竞品对标与差距候选项
  id: benchmark
  must_read:
  - rules/packets/prd/benchmark.md
  output: 竞品对标矩阵 + 需求池候选项（{workroot}/{ver}/10-requirements/竞品对标-*.md + {workroot}/requirement-pool.md）
  agent: pm-analyst
  hitl: confirm_scope
  hitl_when: scope_decision_required
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/prd/_orch.yaml。
- name: 优先级与立项
  id: prioritize
  must_read:
  - rules/packets/prd/prioritize.md
  output: 需求池优先级/立项建议（{workroot}/requirement-pool.md §优先级）
  when: new_requirement_or_scope_change
  agent: pm-analyst
  hitl: confirm_scope
  hitl_when: scope_decision_required
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/prd/_orch.yaml。
- name: PRD 撰写
  id: prd
  must_read:
  - rules/packets/prd/prd.md
  - rules/templates/10-planning/iteration-plan-template.md
  agent: prd-writer
  gate: product-prd
  gate_type: machine
  gate_when: prd_structure_required
  hitl:
  - name: confirm_understanding
    when: understanding_needs_confirm
  - name: confirm_scope
    when: scope_unconfirmed
  output: '{workroot}/{ver}/10-requirements/PRD-{主题}.md（模板 rules/templates/10-planning/prd-template.md）'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/prd/_orch.yaml。
- name: 页面原型（条件）
  id: prototype
  must_read:
  - rules/packets/prd/prototype.md
  when: has_ui_requirement
  agent: ux-designer
  output: '{workroot}/{ver}/20-design/原型-{主题}.html + 原型说明/交接要点（条件）'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/prd/_orch.yaml。
- name: PRD 评审与定稿
  id: review
  must_read:
  - rules/packets/prd/review.md
  output: 评审记录或 HUMAN_APPROVED 声明
  agent: reviewer-agent
  gate: product-review
  gate_type: machine
  gate_when: ai_review_chosen
  hitl:
  - name: select_review_mode
    when: landing_doc_review_needed
  - name: confirm_prd
    when: finalize_requested
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/prd/_orch.yaml。
- name: 需求交接包
  id: handoff
  must_read:
  - rules/packets/prd/handoff.md
  when: prd_ready_for_handoff
  agent: pm-lead
  output: '{workroot}/handoff/outbound/需求/ 自洽 PRD 实拷 + handoff-ledger.md；升 REQ 包时走 handoff.send'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/prd/_orch.yaml。
- name: 收尾
  id: wrap
  must_read:
  - rules/packets/prd/wrap.md
  - rules/templates/90-handoff/closeout-skeleton.md
  agent: prd-writer
  output: 【任务收尾】（PRD/评审明细置第 1 点）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/prd/_orch.yaml。
- name: 拟提交
  id: commit
  must_read:
  - rules/packets/prd/commit.md
  output: 拟提交确认结果
  agent: prd-writer
  hitl: confirm_commit
  hitl_when: has_pending_commit
  tools:
  - git
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/prd/_orch.yaml。
