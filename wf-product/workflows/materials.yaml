# 编排：只读当前 step。进 wf → packets/materials/_chain.md；进子机 → _region-*；执行 → 步骤包。
# 步骤包 §6 必开技能：打开→执行→回包（质量不降）。禁把 skill 正文嵌进步骤包。
# 富编排笔记：packets/materials/_orch.yaml（重建用）。禁通读本 YAML 其他 step。
workflow:
  id: materials
  name: 产品权威文档库发布
  version: 1
  chain: full
entry_points:
  导出项目文档: select
  生成资料库: select
  生成交付资料: select
  发资料: select
  发项目文档: select
  打包项目文档: select
trigger:
- 导出项目文档 / 生成资料库 / 生成交付资料
- 发资料 / 发项目文档 / 打包项目文档
- 版本关闭 / 交接前的完整文档包
steps:
- name: 选择版本与范围
  id: select
  must_read:
  - rules/packets/materials/select.md
  agent: pm-lead
  output: 【材料库发布范围】版本/受众/域/包含/排除
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/materials/_orch.yaml。
- name: 同步权威文档
  id: sync
  must_read:
  - rules/packets/materials/sync.md
  agent: pm-lead
  output: docs/materials/{ver}/（00-overview～07-appendix，按需）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/materials/_orch.yaml。
- name: 版本说明、索引与校验
  id: index
  must_read:
  - rules/packets/materials/index.md
  agent: pm-lead
  output: docs/materials/{ver}/README.md + docs/materials/INDEX.md + 【材料库校验】通过/待补
  gate: materials-validate
  gate_type: checklist
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/materials/_orch.yaml。
- name: 收尾
  id: wrap
  must_read:
  - rules/packets/materials/wrap.md
  - rules/templates/90-handoff/closeout-skeleton.md
  agent: pm-lead
  output: 【任务收尾】
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/materials/_orch.yaml。
- name: 拟提交
  id: commit
  must_read:
  - rules/packets/materials/commit.md
  agent: pm-lead
  hitl: confirm_commit
  hitl_when: has_pending_commit
  tools:
  - git
  output: 拟提交清单
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/materials/_orch.yaml。
