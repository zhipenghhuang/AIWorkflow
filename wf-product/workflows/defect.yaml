# 编排：只读当前 step。进 wf → packets/defect/_chain.md；进子机 → _region-*；执行 → 步骤包。
# 步骤包 §6 必开技能：打开→执行→回包（质量不降）。禁把 skill 正文嵌进步骤包。
# 富编排笔记：packets/defect/_orch.yaml（重建用）。禁通读本 YAML 其他 step。
workflow:
  id: defect
  name: 产品缺陷平台协作
  version: 4
entry_points:
  拉取产品缺陷: preflight
  我的产品缺陷: preflight
  缺陷平台产品缺陷: preflight
  禅道产品缺陷: preflight
  产品缺陷评审: preflight
  开发评估单评审: preflight
  产品缺陷处置: preflight
  产品判定: preflight
  产品判定回流: preflight
  平台回写: writeback
  回写产品缺陷: writeback
  粘贴产品缺陷: pull
  文档产品缺陷: pull
trigger:
- 拉取/查看指派给产品的缺陷（缺陷平台：禅道/Jira/ONES 等，按档案）
- 测试发现产品缺陷，直接指派给产品
- 开发提交产品缺陷评估单，待产品评审
- 产品缺陷分析/评审/平台回写
- 产品判定回流（产品缺陷/实现defects/非问题）
- 无平台时粘贴/导出/评估单文档输入（可降级 change）
steps:
- name: 平台配置与可用性
  id: preflight
  must_read:
  - rules/packets/defect/preflight.md
  agent: pm-lead
  next: pull
  output: 平台可用性/降级说明
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect/_orch.yaml。
- name: 拉取与读取
  id: pull
  must_read:
  - rules/packets/defect/pull.md
  next: source
  agent: pm-lead
  tools:
  - defect-platform
  output: 缺陷清单摘要 + 每条受理单/读取记录
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect/_orch.yaml。
- name: 来源识别
  id: source
  must_read:
  - rules/packets/defect/source.md
  next: analyze
  agent: pm-lead
  output: 来源类型（测试直提/开发评估单/产品复核；逐条标）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect/_orch.yaml。
- name: 分析
  id: analyze
  must_read:
  - rules/packets/defect/analyze.md
  agent: pm-lead
  output: 逐条分析结论（受理单 §3/§4）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect/_orch.yaml。
- name: 处置确认
  id: decide
  must_read:
  - rules/packets/defect/decide.md
  agent: pm-lead
  output: 处置决策（受理单 §5 / 变更单 §4 / 缺陷处置单）
  hitl:
  - name: confirm_change
    when: change_requested
  - name: confirm_plan
    when: plan_level_change
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect/_orch.yaml。
- name: 联动与评审
  id: apply
  must_read:
  - rules/packets/defect/apply.md
  - rules/templates/30-review-change/product-defect-disposition-template.md
  agent: pm-lead
  on_fail: 回 decide；非产品缺陷只产处置单，不改 PRD/AC/计划
  output: 受理单 §6 + 变更单/最新 PRD/AC/计划/UAT + 缺陷处置单 + 附件清单
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect/_orch.yaml。
- name: 重审（条件）
  id: review
  must_read:
  - rules/packets/defect/review.md
  when: substantive_change
  agent: reviewer-agent
  gate: product-review
  gate_type: machine
  gate_when: ai_review_chosen
  hitl:
  - name: select_review_mode
    when: landing_doc_review_needed
  - name: confirm_prd
    when: finalize_requested
  output: 评审记录（{workroot}/{ver}/10-requirements/评审-{主题}-{yyyyMMdd}.md）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect/_orch.yaml。
- name: 平台回写
  id: writeback
  must_read:
  - rules/packets/defect/writeback.md
  - rules/templates/30-review-change/defect-writeup-template.md
  when: remark_writeback
  agent: pm-lead
  gate: writeback-receipt
  gate_type: machine
  tools:
  - defect-platform
  hitl: confirm_remark
  output: 平台回写结果（备注/附件/状态/指派）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect/_orch.yaml。
- name: 验证与关闭
  id: verify
  must_read:
  - rules/packets/defect/verify.md
  - rules/templates/30-review-change/defect-writeup-template.md
  when: needs_linked_update
  agent: pm-lead
  gate: change-closure
  gate_type: machine
  output: 验证结果 + 批末总结
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect/_orch.yaml。
- name: 收尾
  id: wrap
  must_read:
  - rules/packets/defect/wrap.md
  - rules/templates/90-handoff/closeout-skeleton.md
  agent: pm-lead
  output: 【任务收尾】（产品缺陷协作总结置第 1 点）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect/_orch.yaml。
- name: 拟提交
  id: commit
  must_read:
  - rules/packets/defect/commit.md
  output: 拟提交确认结果
  agent: pm-lead
  hitl: confirm_commit
  hitl_when: has_pending_commit
  tools:
  - git
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect/_orch.yaml。
