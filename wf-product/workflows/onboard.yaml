# 接入：点名，或无标记时前置一次；完成后必须打标
workflow:
  id: onboard
  name: 产品规范接入
  version: 3
  read_index: rules/read-index.md
  chain: full   # 接入必须走完 profile/gitignore/verify，不能停在 mount

entry_points:
  接入产品规范: mount
  重新接入: migrate
  生成产品档案: profile
  配置缺陷平台: profile
  装配能力: capabilities
  资料收取: materials
  资料整理: materials
  资料归档: materials
  资料巡检: materials
  文档整理: lifecycle
  文档巡检: lifecycle
  文档清理: lifecycle
  清理临时文件: lifecycle
  清理过程文件: lifecycle
  清理无效文件: lifecycle
  清理失效文件: lifecycle
  清理垃圾文件: lifecycle
  清理临时: lifecycle
  归档失效文档: lifecycle

trigger:
  - 接入产品规范
  - 重新接入
  - 生成产品档案
  - 装配能力
  - 资料收取 / 资料整理 / 资料归档 / 资料巡检
  - 文档整理 / 文档巡检 / 文档清理 / 清理临时文件 / 清理过程文件 / 清理无效文件 / 清理失效文件 / 清理垃圾文件 / 清理临时 / 归档失效文档

steps:
  - name: 旧结构迁移
    id: migrate
    agent: onboard-agent
    hitl: confirm_docs_migration
    hitl_when: docs_migration_needed
    output: 迁移清单/更新后的路径
    notes: >
      「重新接入」= 按现行文档治理规则迁移；先扫描旧结构，按 `rules/doc-governance.md` §4 做覆盖对照，列迁移/改名/归档候选，经 `confirm_docs_migration` 确认后执行，不静默丢文件。
      映射：`{workroot}/输入/`、`inbound/项目文档/{ver}/`、旧扁平前缀文件、`inbound/反馈|调研|竞品|数据/` → `inbound/{ver|topic}/` 或 `_common/`（保持原文件名；类型写索引；**不要**项目文档层、**不要**强制类型前缀扁平）；
      旧工作区/资料副本先判定：原件进 `inbound/`，定稿进 `docs/materials/`，过程稿进工作区；建立/更新 `inbound/INDEX.md`；更新计划 §7、路径引用、activeContext。
      冲突/无法判断先问一次，不覆盖；迁移后核对链接，再进入 mount/profile。
      若存在 `{workroot}/CHANGELOG.md`：列为迁移候选——**用户确认后**改名为 `{workroot}/work-log.md`（内容按工作日志模板整理索引+里程碑条；勿与根 `CHANGELOG.md` 混淆）；未确认不改名。
      共用原件根 `inbound/`：认根=用户指定优先，否则判定表，不定则问。原夹文件不迁出。`keep`/`mix`/`replace` 只管原树；仍可索引/复制/吸收。中途存量全索引，按需复制或 A0～A2。

  - name: 复制与挂载确认
    id: mount
    agent: onboard-agent
    output: 项目根 AGENTS.md 包挂载段（已存在则追加，不覆盖）
    notes: >
      验收：项目根 AGENTS.md 已补入指向本包 AGENTS.md 的引导语句
      （样例见 `rules/templates/00-onboarding/root-agents-pointer.md`；已有则追加、没有则新建）；
      未补入则按样例写入后再继续。单包只写薄指针；多包只写指向 `wf/AGENTS.md` 的薄指针。
      多包模式（项目根自动探测到两个及以上包目录）：根 `AGENTS.md` 只写薄指针（先读 `wf/AGENTS.md`）；按 `rules/templates/00-onboarding/wf-agents-routing-template.md` 生成/补齐 `wf/AGENTS.md`，只列已装包；已有则只补行，不覆盖；三包自动探测共享 inbound/上下文。
      **分层**：母版只写入挂载段；不对根写入偏好/喜好正文（落地项目自写）。档案 §3 为产品事实摘要，不是偏好容器。

  - name: 产品档案与上下文
    id: profile
    agent: onboard-agent
    output: product-profile.md · activeContext.md · {workroot}/work-log.md（如无）·（模板 rules/templates/）
    notes: >
      **按实填档（硬）**：建档前有界探查（`{workroot}/`、既有 PRD/计划/用户材料若有）。档案第一节须含一句话定位、目标用户、workroot（未声明按约定）、`integration_level`（绿场默认 I3，存量必问）、`inbound_structure`（默认 mix）；第二～四节据实填或「无」/「待确认」；**禁止**占位符未换就打「wf-product onboard: done」。
      有根 `README.md` 则按**其实际结构**择要取用；细则见 `rules/core/project-readme.md`。根 README 按用户偏好选档后写（模板仅素材）；已有不覆盖；点名生成/更新/整理时对照市面高标准给可选补强。
      §7 缺陷平台可选：问是否启用禅道/Jira/ONES，启用填 provider/baseUrl/凭据来源/提交方式/适配定义，
      未启用写「无」；同项目已有开发/测试包配置可复用，不重复存凭据。缺陷平台未配置不阻塞接入。
      `activeContext.md`：无则按 `rules/templates/00-onboarding/active-context-template.md` 建（**总览一句话** + `## 产品` + 跨包同步 + 运行时本包行）；已有则只补/更新总览（若空）、本包分节与本包接入行，禁止整文件覆盖他包内容。总览口径对齐产品档案「一句话定位」。
      `{workroot}/work-log.md`：无则按 `rules/templates/00-onboarding/work-log-template.md` 创建（岗位里程碑侧记；索引可空）。已有则跳过不覆盖。接入完成可追加事件=`接入/治理`。
      **不是**根 `CHANGELOG.md`、也不是产品计划 §10 执行日志；勿把本文件当产品发版史。
      若仍存在 `{workroot}/CHANGELOG.md` 且尚无 `{workroot}/work-log.md`：列为改名迁移候选（→`work-log.md`），经 `confirm_docs_migration` 确认后执行；未确认不改。
      **禁止**创建/修改/补链项目根 `CHANGELOG.md`（仅开发维护）。无开发包 → 不建根 CHANGELOG；岗位史只用本包工作日志。用户点名要项目发版史 → 建议接入开发包或由其指定写手；本包默认不替建。
      按 `rules/doc-governance.md` §2.4 定位工作根；登记原件根 `inbound/INDEX.md`；权威文档库 `docs/materials/`。
      建 `docs/materials/INDEX.md` 骨架；外部输入先入 `inbound/`。
      建索引：单包 `docs/INDEX.md`（含工作区导航）；多包 `{workroot}/INDEX.md` + 总览 `docs/INDEX.md`（I2 在总览登记既有目录）；不写阶段/门。
      产品档案 §1 增记工作根 / `inbound/` 原件根 / `docs/materials/` 权威文档库。
      对外用户文档固定 `{workroot}/user/`，不混入 `inbound/`。

  - name: 资料收取与归档
    id: materials
    agent: onboard-agent
    hitl:
      - name: confirm_iteration_close
        when: iteration_close_needed
      - name: confirm_docs_migration
        when: docs_migration_needed
    output: 【入站分析】（确认后登记/A0～A2/发布 materials）
    notes: >
      按 `rules/doc-governance.md` §3～§4：入站意图分析（T1～T9）+ 覆盖对照 → 输出【入站分析】；确认前不改文件。
      有候选 → `docs_migration_needed=true`，停本门；无候选继续。
      确认后：原件留/落入原件根 `inbound/`并**全量可查索引** → 仅对确认需要的文件复制进 `inbound/` → 按 A0～A2 吸收 → 失效只动包内副本/工作区旧稿。存量默认仅索引，不强制全复制。对话/根散落须先留主副本于原件根 `inbound/`。
      部分覆盖/增量/参考保留；冲突停下问。无候选 → 报「无未登记/失效候选」。归档前做引用检查：被当前产品计划/PRD/原型/交付/UAT 引用的文档保留原位或标“基线”，不标失效。
      **换迭代/关版本（强制）**：确认采纳新迭代/换主题后按 `rules/doc-governance.md` §7；不确定则 `confirm_iteration_close`；确认后先按 §3 判 T1/T2/T4，再按 §7.1 关账（跳过仅发版项）；T2/T4 保留仍被引用的 PRD/原型基线，只归档被替代增量与旧稿。不依赖发版。
      关账 materials：**必做**覆盖刷新关闭版 `{prev}/`→superseded，再建 `{next}/` current（默认 overwrite-latest）。

  - name: 文档治理检查
    id: lifecycle
    agent: onboard-agent
    hitl: confirm_docs_migration
    hitl_when: docs_migration_needed
    output: 【文档治理检查】（确认后执行更新/归档/清理）
    notes: >
      按 `rules/doc-governance.md` §2～§5、§8 扫描工作文档与过程文件（本步=点名清理/巡检入口）：
      ① 分类：长期/固定、版本/迭代绑定、失效/替代、过程/临时；
      ② 判定：主档/长期真值就地更新；版本绑定目录关闭时归档；部分覆盖保留；失效确认后归档；**已完结**临时/失败/重复列清理候选；
      ②.1 归档前做引用检查：被当前产品计划/PRD/原型/交付/UAT 引用的文档保留原位或标“基线”，不标失效。
      ③ 输出【文档治理检查】：保留/更新/归档/清理/待确认；**确认前不改/不移/不删**。
      有候选 → `docs_migration_needed=true`，停在本门等确认；无候选 → 报「无生命周期候选」，不改文件。
      清理只删已知临时/缓存/未引用失败产物与过期运行态（`.gate/wf-product/` 非 JSON 媒体、`.gate/logs`）；进行中 draft、现行证据、当前 PRD/原型/计划、源文件、用户文件、密钥永不自动删除；不确定移 `{workroot}/_archive/_pending-cleanup/{yyyyMMdd}/` 并写清理清单。

  - name: 入库策略
    id: gitignore
    agent: onboard-agent
    hitl: confirm_gitignore
    output: .gitignore 更新 + `git check-ignore` 证据
    notes: >
      四选一：①只忽略运行态/缓存；②忽略产物+证据；③忽略产物+证据+资料（保留模板）；④自定义。
      默认②；密钥/PII/真实用户数据任何情况不得入库；写后跑 `git check-ignore -v` 抽查 3 个关键路径并记录。
      不忽略源文件、模板、当前 PRD/计划/原型。
      规范包默认不跟踪：只写已装包一行（如 `/wf-product/`），多包写 `/wf/`；不预列未装包、不加注释；其它项只列路径。

  - name: 环境与工具检查（可选）
    id: capabilities
    agent: onboard-agent
    output: "{workroot}/capabilities/00-能力清单.md（默认静默；点名装配时另出建议）"
    notes: >
      若无 `{workroot}/capabilities/`：自 `rules/templates/00-onboarding/capabilities/` 复制骨架（不覆盖已有清单正文）。
      默认静默：不输出全量工具清单、不冒烟；首次使用按契约降级。
      仅当用户点名「装配能力」时：对照契约+参考目录+现清单，确认后写入 `{workroot}/capabilities/`；刷档案 §6 索引；安装指引见 README「宿主适配」。
      禁强推、禁写回包内契约。

  - name: 核验与打标
    id: verify
    agent: onboard-agent
    output: "{workroot}/00-governance/接入核验-{yyyyMMdd}.md（①～⑥ 逐项 通过/缺口 + 证据）"
    notes: >
      按 onboard-agent 接入清单核验（①～⑥，含写接入标记），逐项给「通过/缺口 + 证据路径」，不得只写“已核验”。
      跑 `rules/tools/Test-Template.ps1`；BLOCKED 不得打标。
      核验通过后写「wf-product onboard: done」；此后按 AGENTS §0 第 3 点（接入状态）跳过落地检查。
      文档根有平铺/根目录有文档残留 → 不通过，回 docs 步整理。

  - name: 收尾
    id: wrap
    agent: onboard-agent
    output: 【任务收尾】（接入明细置第 1 点，六段压缩）
    notes: >
      对照 `rules/templates/90-handoff/closeout-skeleton.md` §2 输出六段压缩（每段一行，须含【遵守自检】）；仅例外/待处理展开；禁逐项罗列工具
