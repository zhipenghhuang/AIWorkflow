# 编排：进 wf → workflows/change.md；执行 → 当前 step 步骤包；终端 → _shared/closeout.md。
# 步骤卡 §6 必开技能：整卡读取→执行→回包。禁把 skill 正文嵌进步骤卡。
# 本 YAML 只定义状态/门/产出；不用于运行时通读。
workflow:
  id: change
  name: 需求/问题受理与变更
  version: 4
  terminal: closeout
entry_points:
  需求受理: intake
  问题受理: intake
  产品缺陷: intake
  需求变更: intake
  需求答疑: intake
  开发不确定: intake
  测试发现产品缺陷: intake
trigger:
- 需求 / 问题 / 缺陷（未分类；对话或文档）
- 需求变更 / 变更单
- 需求答疑 / 跟进
- 开发 / 测试发现产品缺陷，交产品确认
- 开发不确定项 / 待产品确认
steps:
- name: 受理与建档
  id: intake
  skills:
  - customer-needs-discovery
  - change-management
  must_read:
  - rules/packets/change/intake.md
  - rules/templates/30-review-change/intake-disposition-template.md
  agent: pm-lead
  hitl:
  - name: confirm_understanding
    when: understanding_needs_confirm
  - name: confirm_iteration_close
    when: iteration_close_needed
  - name: confirm_docs_migration
    when: docs_migration_needed
  output: '{workroot}/{ver}/30-changes/受理-{主题}-{yyyyMMdd}.md'
  notes: 统一入口建档；先还原问题再分诊；双确认未过不入池/不写正式 PRD。 外部输入/关账见 `rules/doc-governance.md`；方法只认 §6 必开技能闭环。
- name: 分诊与定性
  id: triage
  skills:
  - change-management
  must_read:
  - rules/packets/change/triage.md
  agent: pm-lead
  output: 分诊结论（写入受理单 §3）
  notes: 按技能判定树；理解未确认先回 intake。产品缺陷须依据；无依据禁甩锅。
- name: 新需求与优先级（条件）
  id: new_requirement
  skills: []
  must_read:
  - rules/packets/change/new_requirement.md
  when: new_requirement
  agent: pm-analyst
  hitl: confirm_scope
  hitl_when: scope_decision_required
  output: '{workroot}/requirement-pool.md 更新 + 范围结论'
  notes: 仅新需求；入池须证据；confirm_scope 后进 assess/路线图。细节只认 §6 技能整卡方法。
- name: 影响评估
  id: assess
  skills:
  - change-management
  must_read:
  - rules/packets/change/assess.md
  when: needs_impact_assessment
  agent: pm-lead
  output: 影响评估（受理单 §4；改基线时同步变更单 §3）
  notes: 改已定稿基线须变更单且差量表必填。方法只认 change-management。
- name: 处置确认
  id: decide
  skills: []
  must_read:
  - rules/packets/change/decide.md
  when: decision_required
  agent: pm-lead
  hitl:
  - name: confirm_change
    when: change_requested
  - name: confirm_plan
    when: plan_level_change
  output: 处置结论（受理单 §5；改基线时写变更单 §4）
  notes: confirm_change 出示分诊/影响/差量；产品缺陷须相符证明。纯答疑可跳过本门。
- name: 联动落地
  id: apply
  skills:
  - change-management
  must_read:
  - rules/packets/change/apply.md
  when: change_apply_required
  agent: pm-lead
  on_fail: 回 decide/受理单；拒绝/重复/实现缺陷/补充信息不得更新基线
  output: 更新后的 PRD/AC/原型/计划等 + 受理单 §6
  notes: 仅接受/下期/立即修且有联动项，或 P0/P1 轻量受理（无 AC/范围变化）确有联动项（无需 decide）；逐项闭合并写受理单 §6。平台回写走 `defect.writeback`（本步不写平台）；CHG 包走 handoff。
- name: 重审（条件）
  id: review
  skills:
  - artifact-review
  - review-and-finalize
  must_read:
  - rules/packets/change/review.md
  when: substantive_change
  agent: reviewer-agent
  gate: product-review
  gate_type: machine
  gate_when: ai_review_chosen
  hitl:
  - name: select_review_mode
    when: landing_doc_review_needed
  - name: confirm_prd
    when: finalize_requested
  output: 评审记录（{workroot}/{ver}/10-requirements/评审-{主题}-{yyyyMMdd}.md）
  notes: STOP 选 A/B；选 B 跑 -Mode review。方法只认 §6 `artifact-review` `review-and-finalize` 整卡方法。
- name: 验证与关闭
  id: verify
  skills:
  - change-management
  must_read:
  - rules/packets/change/verify.md
  when: needs_linked_update
  agent: pm-lead
  gate: change-closure
  gate_type: machine
  output: 验证结果（受理单 §7 / UAT / 变更单 §5）
  notes: Invoke-Gate -Mode change；未 READY 不得 closeout 冒充完成。回执未收不得称已接收。
- name: 收尾与提交
  id: closeout
  skills: []
  must_read:
  - rules/packets/_shared/closeout.md
  agent: pm-lead
  hitl:
  - name: confirm_commit
    when: has_pending_commit
  output: 任务收尾 + 拟提交确认
  notes: 收尾与提交；共享终端；状态=done。
