# 编排：只读当前 step。进 wf → packets/new-product/_chain.md；进子机 → _region-*；执行 → 步骤包。
# 步骤包 §6 必开技能：打开→执行→回包（质量不降）。禁把 skill 正文嵌进步骤包。
# 富编排笔记：packets/new-product/_orch.yaml（重建用）。禁通读本 YAML 其他 step。
workflow:
  id: new-product
  name: 新产品 0→1
  version: 3
entry_points:
  启动新产品: discover
  新项目: discover
  从0到1: discover
  产品立项: discover
trigger:
- 启动新产品 / 新项目 / 从0到1 / 产品立项
steps:
- name: 发现与机会评估
  id: discover
  must_read:
  - rules/packets/new-product/discover.md
  agent: pm-analyst
  hitl: confirm_understanding
  hitl_when: understanding_needs_confirm
  output: '{workroot}/{ver}/10-requirements/立项书-{yyyyMMdd}.md'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/new-product/_orch.yaml。
- name: 立项评审
  id: go
  must_read:
  - rules/packets/new-product/go.md
  agent: pm-analyst
  hitl: confirm_go
  output: 立项决策记录（Go/Hold/Kill + 依据/待verify/责任人，并入立项书）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/new-product/_orch.yaml。
- name: 产品定义与计划
  id: define
  must_read:
  - rules/packets/new-product/define.md
  when: go_decision_go
  agent: pm-analyst
  output: '{workroot}/product-plan.md'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/new-product/_orch.yaml。
- name: 需求定义（PRD）
  id: prd
  must_read:
  - rules/packets/new-product/prd.md
  when: go_decision_go
  agent: prd-writer
  output: PRD + 评审记录/原型（{workroot}/{ver}/10-requirements/、20-design/）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/new-product/_orch.yaml。
- name: 交付与验收
  id: deliver
  must_read:
  - rules/packets/new-product/deliver.md
  when: go_decision_go
  agent: pm-lead
  output: 交付计划 + UAT 记录（{workroot}/{ver}/40-delivery/）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/new-product/_orch.yaml。
- name: 上市与复盘
  id: launch
  must_read:
  - rules/packets/new-product/launch.md
  when: go_decision_go
  agent: pm-lead
  gate: uat-evidence
  gate_type: machine
  gate_when: has_uat
  hitl: confirm_release
  output: 发布决策 + GTM 检查 + 复盘（{workroot}/{ver}/40-delivery/、90-retrospectives/）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/new-product/_orch.yaml。
- name: 收尾
  id: wrap
  must_read:
  - rules/packets/new-product/wrap.md
  - rules/templates/90-handoff/closeout-skeleton.md
  agent: pm-lead
  output: 【任务收尾】（0→1/上市明细置第 1 点）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/new-product/_orch.yaml。
- name: 拟提交
  id: commit
  must_read:
  - rules/packets/new-product/commit.md
  output: 拟提交确认结果
  agent: pm-lead
  hitl: confirm_commit
  hitl_when: has_pending_commit
  tools:
  - git
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/new-product/_orch.yaml。
