# 编排：进 wf → workflows/new-product.md；执行 → 当前 step 步骤包；终端 → _shared/closeout.md。
# 步骤卡 §6 必开技能：整卡读取→执行→回包。禁把 skill 正文嵌进步骤卡。
# 本 YAML 只定义状态/门/产出；不用于运行时通读。
workflow:
  id: new-product
  name: 新产品 0→1
  version: 3
  terminal: closeout
entry_points:
  启动新产品: discover
  新项目: discover
  从0到1: discover
  产品立项: discover
trigger:
- 启动新产品 / 新项目 / 从0到1 / 产品立项
steps:
- name: 发现与机会评估
  id: discover
  skills:
  - zero-to-one-product-definition
  - customer-needs-discovery
  must_read:
  - rules/packets/new-product/discover.md
  - rules/templates/10-planning/business-case-template.md
  agent: pm-analyst
  hitl: confirm_understanding
  hitl_when: understanding_needs_confirm
  output: '{workroot}/{ver}/10-requirements/立项书-{yyyyMMdd}.md'
  notes: 市场 用户 竞品 问题验证；技能：`skills/zero-to-one-product-definition/SKILL.md` + `skills/customer-needs-discovery/SKILL.md`（先读再做）；竞品向另按
    `competitive-intelligence-and-learning` 技能 **模式 S**（命中时打开）。 **先问题后方案再确认**：按 `rules/core/clarification.md`；**未双确认不得**提
    Go 写全量 PRD。产出须含谁/场景/问题/代价/目标/非目标/方案要点/承诺信号；单个客户/竞品/领导说法标样本与证据等级；访谈/综合用 `interview-guide-template.md`/`insight-synthesis-template.md`。
    **竞品（模式 S，0→1 默认）**：有 ≥2 可指认竞品/替代或战略定位需要时，落盘 `竞品分析-{主题}-{yyyyMMdd}.md`（`competitor-analysis-template.md`）；学习决策表 **≥3 条**（借/改编/不借）回写立项书；无公开竞品则写替代方案
    +「待补竞品集」。禁只交功能对标矩阵代替选择性学习（对标跟进属迭代 `prd.benchmark`）。 **来源扇出**（子代理编排 ）：≥4 独立来源 → 按来源只读扇出（市场/用户/竞品/问题），各返回证据表/去重键 ≤30 行；立项书与
    Go/Hold/Kill 集中；单来源直做。 产出立项书：`{workroot}/{ver}/10-requirements/立项书-{yyyyMMdd}.md`（模板 `rules/templates/10-planning/business-case-template.md`）；
    引用可回查（来源 + 日期）；禁臆造市场数据与用户反馈；无依据写「待验证」。 能力（可选）：browser-mcp 竞品、analytics 数据、docs-mcp 资料；未装 = 降级。
- name: 立项评审
  id: go
  skills:
  - zero-to-one-product-definition
  - customer-needs-discovery
  - competitive-intelligence-and-learning
  must_read:
  - rules/packets/new-product/go.md
  agent: pm-analyst
  hitl: confirm_go
  output: 立项决策记录（Go/Hold/Kill + 依据/待verify/责任人，并入立项书）
  notes: '出示问题 用户 市场 竞品 方案与 MVP 假设 成本收益 风险 结论（Go Hold Kill）请确认。 批准（Go）才进入产品定义；Hold 列待验证项与责任人；Kill 记录原因并归档。 Hold/Kill 后直接 `closeout`/归档；`define/prd/deliver/launch`
    的 `when: go_decision_go` 会自动跳过，不得继续写 PRD/排期/问发布。 **未过立项不写全量 PRD**（`rules/workflow.md` ）。'
- name: 产品定义与计划
  id: define
  skills:
  - zero-to-one-product-definition
  must_read:
  - rules/packets/new-product/define.md
  when: go_decision_go
  agent: pm-analyst
  hitl: confirm_plan
  hitl_when: plan_needs_confirm
  output: '{workroot}/product-plan.md'
  notes: '**子链**：按 `workflows/plan.yaml` 逐步执行（只读子 workflow **当前 step 块**；goals→roadmap→scope→review→publish）。 **门权威在子链**：`confirm_understanding`
    `confirm_plan` 评审门以 plan.yaml 步上 hitl 为准；本步不另造门、不重复弹已确认门。 落盘 `{workroot}/product-plan.md`；只写总领（做什么 为什么 何时 怎么算成功），需求细节归
    PRD。 子链 closeout 不执行，统一由本文件末 closeout 收尾。'
- name: 需求定义（PRD）
  id: prd
  skills:
  - prd-writing
  - review-and-finalize
  - prototype-and-interaction
  - ui-visual-design-system
  must_read:
  - rules/packets/new-product/prd.md
  - rules/templates/10-planning/prd-template.md
  when: go_decision_go
  agent: prd-writer
  output: PRD + 评审记录/原型（{workroot}/{ver}/10-requirements/、20-design/）
  notes: '**子链**：按 `workflows/prd.yaml` 的 prd → prototype（如需界面）→ review 逐步执行（只读当前 step 块）；不执行其 closeout。 **门权威在子链**：理解门/定稿门以
    prd.yaml hitl 为准；本步不重复弹门；未定稿不排期。 PRD 落 `{workroot}/{ver}/10-requirements/PRD-{主题}.md`。 技能：`skills/prd-writing/SKILL.md`
    `skills/review-and-finalize/SKILL.md`；界面原型见 `skills/prototype-and-interaction/SKILL.md` `skills/ui-visual-design-system/SKILL.md`。'
- name: 交付与验收
  id: deliver
  skills:
  - change-management
  - uat-and-retrospective
  must_read:
  - rules/packets/new-product/deliver.md
  when: go_decision_go
  agent: pm-lead
  output: 交付计划 + UAT 记录（{workroot}/{ver}/40-delivery/）
  notes: '**子链**：按 `workflows/deliver.yaml` 的 schedule followup uat 逐步执行（只读当前 step 块）；需求/问题/产品缺陷 → `workflows/change.yaml`
    受理与处置。 **门权威在子链**：UAT/评审门以 deliver.yaml（及 change）hitl 为准；本步不重复跑门。 UAT 按 PRD 验收标准逐条对照（结果 + 证据）；产品缺陷 vs 实现缺陷要有依据。 技能：`skills/change-management/SKILL.md`
    `skills/uat-and-retrospective/SKILL.md`。'
- name: 上市与复盘
  id: launch
  skills: []
  must_read:
  - rules/packets/new-product/launch.md
  - rules/templates/40-delivery/gtm-template.md
  when: go_decision_go
  agent: pm-lead
  gate: uat-evidence
  gate_type: machine
  gate_when: has_uat
  hitl: confirm_release
  output: 发布决策 + GTM 检查 + 复盘（{workroot}/{ver}/40-delivery/、90-retrospectives/）
  notes: 前置：UAT 通过（带条件须已接受）+ GTM 就绪（模板 `rules/templates/40-delivery/gtm-template.md`：定价 渠道 物料 销售客服）+ 发布检查（回滚 公告 客服 监控）。 confirm_release：出示上市要点请确认；**未过
    UAT 不发布**。 发布后：指标监控 → 复盘（模板 `rules/templates/60-retro/retro-template.md`）→ 改进项回需求池；更新 `{workroot}/product-plan.md`。
- name: 收尾与提交
  id: closeout
  skills: []
  must_read:
  - rules/packets/_shared/closeout.md
  agent: pm-lead
  hitl:
  - name: confirm_commit
    when: has_pending_commit
  output: 任务收尾 + 拟提交确认
  notes: 收尾与提交；共享终端；状态=done。
