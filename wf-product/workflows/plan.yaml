# 编排：只读当前 step。进 wf → packets/plan/_chain.md；进子机 → _region-*；执行 → 步骤包。
# 步骤包 §6 必开技能：打开→执行→回包（质量不降）。禁把 skill 正文嵌进步骤包。
# 富编排笔记：packets/plan/_orch.yaml（重建用）。禁通读本 YAML 其他 step。
workflow:
  id: plan
  name: 产品计划
  version: 7
entry_points:
  产品计划: goals
  产品规划: goals
  路线图: roadmap
  Roadmap: roadmap
  版本规划: roadmap
  下季度做什么: roadmap
  下个月做什么: roadmap
  排优先级（版本级）: roadmap
  计划评审: review-plan
  计划文档评审: review-plan
  按产品计划执行: next
  继续: next
  下一步: next
  当前状态: next
trigger:
- 产品计划 / 产品规划 / 路线图 / Roadmap
- 版本规划 / 下季度做什么 / 下个月做什么
- 排优先级（版本级）
- 按产品计划执行 / 下一步 / 当前状态
steps:
- name: 目标与指标
  id: goals
  must_read:
  - rules/packets/plan/goals.md
  agent: pm-analyst
  hitl: confirm_understanding
  hitl_when: understanding_needs_confirm
  output: 产品计划工作稿 §1 目标/§2 指标（可并入产品计划草稿）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/plan/_orch.yaml。
- name: 路线图与优先级
  id: roadmap
  must_read:
  - rules/packets/plan/roadmap.md
  agent: pm-analyst
  output: 产品计划工作稿 §2 路线图（Now/Next/Later + 依据/依赖/时间窗）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/plan/_orch.yaml。
- name: 本期范围与里程碑
  id: scope
  must_read:
  - rules/packets/plan/scope.md
  agent: pm-lead
  hitl: confirm_plan
  hitl_when: plan_needs_confirm
  output: 产品计划工作稿 §3 范围/§4 里程碑（确认后同轮并入主档）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/plan/_orch.yaml。
- name: 计划文档评审
  id: review-plan
  must_read:
  - rules/packets/plan/review-plan.md
  agent: reviewer-agent
  hitl: select_review_mode
  hitl_when: landing_doc_review_needed
  output: 评审记录（{workroot}/{ver}/10-requirements/评审-计划-{yyyyMMdd}.md）或 HUMAN_APPROVED 声明
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/plan/_orch.yaml。
- name: 落盘与索引
  id: publish
  must_read:
  - rules/packets/plan/publish.md
  agent: pm-lead
  hitl:
  - name: confirm_iteration_close
    when: iteration_close_needed
  - name: confirm_docs_migration
    when: docs_migration_needed
  output: '{workroot}/product-plan.md（模板 rules/templates/10-planning/product-plan-template.md）'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/plan/_orch.yaml。
- name: 计划续跑
  id: next
  must_read:
  - rules/packets/plan/next.md
  agent: pm-lead
  output: 当前阶段/门/下一动作
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/plan/_orch.yaml。
- name: 收尾
  id: wrap
  must_read:
  - rules/packets/plan/wrap.md
  - rules/templates/90-handoff/closeout-skeleton.md
  agent: pm-lead
  output: 【任务收尾】（计划/里程碑明细置第 1 点）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/plan/_orch.yaml。
- name: 拟提交
  id: commit
  must_read:
  - rules/packets/plan/commit.md
  output: 拟提交确认结果
  agent: pm-lead
  hitl: confirm_commit
  hitl_when: has_pending_commit
  tools:
  - git
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/plan/_orch.yaml。
