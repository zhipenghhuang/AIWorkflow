# orch · showcase — packet rebuild source (not runtime must_read)
# YAML step.notes may be thin; rich orchestration lives here.
workflow: showcase
purpose: 编排笔记缓存：生成步骤包 §5 的真源；YAML notes 保持薄指针。勿手改 packet 后丢此文件。
steps:
  audience: 读 `product-profile.md` / `{workroot}/product-plan.md` / PRD / UAT / GTM / 原型； 明确受众（老板/客户/用户/技术）、目标、时长、成功标准、保密边界与不演示项。
    技能：`skills/demo-storytelling/SKILL.md`（先读再做）；受众/目标已明确则直接续跑，不停。
  commit: 无文件变更跳过；拟提交清单按 `rules/workflow.md` ；提交后补一行结果，不重复六段。
  demo: 场景化脚本：每场景写目标/入口/逐步点击路径/数据/预期/兜底/时长； 路径详细到菜单 → 页面 → Tab → 控件/行；优先演真实构建或原型；未实现能力不演。 准备 Q&A 与异议处理；技能 demo-storytelling
    /。
  docs: 点名用户手册/快速开始/FAQ/发布说明/培训材料 → `docs_requested=true`。 技能：`skills/product-docs/SKILL.md`；模板 `rules/templates/50-showcase-docs/user-manual-quickstart-template.md`、`rules/templates/50-showcase-docs/release-notes-template.md`。
    只产被点名的文档类型，不一次生成四类；按任务组织：5 分钟快速开始 → 常用任务 → FAQ/故障 → 版本说明；截图/步骤与当前构建一致； 同时产 ≥3 类文档 → 共享事实表 + 按类型分片（不同文件，单写手/类）；verifier-agent
    核对数字/版本/截图/边界；不并行写同一文档。 不写未发布功能；客户版发布说明面向用户，不写内部实现与内部路径；对外前由 `publish` 步确认。
  dryrun: 准备演示/客户介绍/彩排 → `demo_needs_dryrun=true`。 计时演练；检查故事/路径/数据/兜底/Q&A；记录异议、问题、需求 → 按 `workflows/change.yaml` 回受理/需求池；
    修正材料后再对外。
  environment: 构建/原型版本、账号角色、seed/重置、网络、设备、录屏兜底、权限与隐私； `rules/templates/50-showcase-docs/demo-checklist-template.md` 逐项过；能力（可选）browser-mcp
    走查，未装=手工检查。
  materials: 一页纸：问题/用户/价值/证据/下一步；Deck：10～12 页，每页一个观点 + 证据 + 图； Mermaid 流程图/业务架构图（不写技术架构）。 **共享事实表 + 分片**（子代理编排 ）：同时产 ≥3 类材料/文档
    → 先定事实表（功能/版本/截图/数字/边界），再按类型分片（不同文件）；最后 verifier-agent 一致性核对；单类直做。 技能：`skills/presentation-design/SKILL.md`；能力 doc-suite
    / presentation 可选。 **项目对齐**：数字/截图/流程/术语与 PRD/原型/构建一致，引用可回查；对外发送/承诺前由 `publish` 步 `confirm_materials` 确认，内部草稿不停。
  publish: 材料/文档/演示已就绪；出示对外清单（一页纸/Deck/user/发布说明）、数字与截图来源、未实现/未发布边界， 对外前可派 verifier-agent 只读核对（数字/版本/截图/边界）；确认后才对外发送、承诺或发布；内部汇报/草稿不触发。
  story: 用 Mermaid 流程图表达：背景 → 问题 → 方案 → 价值 → 证据 → 下一步； 每个节点必须对齐当前项目（PRD/原型/当前构建），不写未实现能力、不夸大。 confirm_narrative：故事线成形后出示受众/目标/故事线/演示范围请确认；条件门，仅在叙事不明或首次对外演示时停。
    技能 demo-storytelling ；模板 。
  wrap: 对照 `rules/templates/90-handoff/closeout-skeleton.md` 输出【任务收尾】（须含【遵守自检】）；第1点按本步产出填写； 更新产品计划 //、activeContext、 `{workroot}/INDEX.md`（有实质进展时）；现状三处同拍（执行契约
    规则 7）；`sync=` 含 `triad=aligned|deferred:<原因>`；语义已变禁只改 activeContext。未验证项明示。 本步先出骨架与拟提交清单，提交门在下一步。
