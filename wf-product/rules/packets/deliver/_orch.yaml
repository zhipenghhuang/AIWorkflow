# orch · deliver — packet rebuild source (not runtime must_read)
# YAML step.notes may be thin; rich orchestration lives here.
workflow: deliver
purpose: 编排笔记缓存：生成步骤包 §5 的真源；YAML notes 保持薄指针。勿手改 packet 后丢此文件。
steps:
  commit: 无文件变更跳过；拟提交清单按 `rules/workflow.md` ；提交后补一行结果，不重复六段。
  followup: 交付进度/风险/依赖跟进；答疑书面留痕（评论/文档批注），禁口头改需求。 发现新需求、需求变更、产品缺陷、开发不确定项 → 转 `workflows/change.yaml` intake，按受理/分诊/处置/联动流程执行；
    本步不另造变更单、不直接改 PRD/排期。 收到开发提测/测试报告/澄清/变更包 → 先按 `workflows/handoff.yaml` receive 核对+回执，再更新跟进记录；未回执不得把下游标为已接收。 节奏：默认每周一次状态更新；关键依赖延期
    >2 个工作日或 > 阶段工期 10% → 升级（计划 ），并同步 //。
  release: 技能：`skills/uat-and-retrospective/SKILL.md`（先读再核）。 前置：UAT 通过（带条件须已接受）；发布就绪：回滚预案/公告/客服话术/监控指标（并入 UAT 记录「发布前置」节）。
    直接入口「发布」时：`has_uat=true` → 必须先运行 `verify/Invoke-Gate.ps1 -Mode uat`（读 `.gate/wf-product/uat.json`），未 READY 不得进入 confirm_release；无
    UAT 要求 → 写「不适用+依据」，门条件不满足则跳过，不得伪造回执。 发布前可派 verifier-agent 只读核对发布就绪证据（UAT/回滚/公告/监控），返回缺口 ≤30 行；发布决策仍由本步做。 confirm_release：出示发布要点（版本/时间窗/回滚/通知范围）请确认；**未过
    UAT 不发布**；已发布且仅做复盘 → 条件不满足，跳过本门。本门是业务发布决策；**如启用开发轨**，工程部署由其 `release` 执行（`confirm_deploy`），不重复审批；未启用则由用户安排，本包不执行部署。 发布决策后默认交发布决策正文；`REL`
    包按需先问后发。收到开发发布结果 → 有包则 receive。 发布后：数据监控（指标/埋点）→ 复盘（模板 `rules/templates/60-retro/retro-template.md`，落 `{workroot}/{ver}/90-retrospectives/复盘-{ver}.md`：目标
    vs 实际/根因/改进项→回需求池）；如启用开发轨，研发复盘可由其补充，产品复盘合并引用；未启用则本包独立复盘。 更新 `{workroot}/work-log.md`（仅本文件）：按场景追加里程碑——有发布决策写事件=`发布决策`（结论宜含本版对外变化摘要
    1～5 条产品语言或链到发布说明，供开发写根 CHANGELOG）；有 UAT 结论写=`UAT 结论`；有复盘写=`复盘`。无文件则按模板建。 **不是**根 `CHANGELOG.md`、也不是计划 执行日志。本门=`confirm_release`
    业务决策；根发版史由开发在工程发版时写（有开发包时）。 **禁止**创建/修改/补链项目根 `CHANGELOG.md`；无开发包则不建根。 版本关闭/结项：按 `rules/doc-governance.md` ；先判 T1/T2/T4，T2/T4
    保留仍被引用的 PRD/原型基线，不整夹归档；失效资料 → `inbound/_archive/` + 清单；部分/增量/参考不归档；未确认不移动。 同步按 `rules/doc-governance.md` ～（仅本步关版本/结项时，非日常收尾）：先判
    T1/T2/T4，T2/T4 保留仍被引用的 PRD/原型基线；长期主档就地更新、版本绑定目录归档、已完结临时/失败/重复列清理候选；确认后执行。
  review-plan-deliver: 交付计划将驱动开发/测试窗口：**STOP【评审方式】**（`skills/artifact-review`）A 自行｜B AI。 选 A：出示范围/里程碑/依赖/发布窗自检 → HUMAN_APPROVED。
    选 B：核范围与 PRD 一致、里程碑可执行、依赖显式、测试窗口合理；缺口分级；留痕 `评审-交付计划-{ver}-{yyyyMMdd}.md`。 通过后默认交付计划/排期正文；`PLAN` 包仅多文件/签收/仓外/点名时停问建议，确认后走
    `workflows/handoff.yaml` send（含 `confirm_handoff`），本步不直接落包。未收回执不得称「已接收」。
  schedule: '技能：`skills/change-management/SKILL.md`（先读；排期与变更纪律同源）。 拆解（Epic→Story→Task）/估时/依赖/风险 → 交付计划（范围/里程碑/发布窗口）； **不并行写交付计划**；需要估时/依赖素材时只读分模块
    scout，结论集中写。 前置：PRD 头部 `status: APPROVED`（未定稿 → 只报缺口并回 `workflows/prd.yaml` review 步，不排期）。 落盘后进入 `review-plan-deliver`（选
    A/B）；未过评审方式不得发 PLAN 包。'
  uat: 技能：`skills/uat-and-retrospective/SKILL.md`；按 PRD 验收标准**逐条对照**（结果+证据）。 运行 `verify/Invoke-Gate.ps1 -Mode uat`；未 READY
    不得写“UAT 通过/可发布”。 **分模块核验**（子代理编排 ）：≥3 模块 → 按模块只读扇出（AC 结果+证据+缺口 ≤30 行）；UAT 结论集中；单模块直做。 可选输入：若项目已有测试报告/提测单/其它验收资料（任意路径/来源）则读；无则用现有inbound/用户输入，不阻塞。测试报告是证据，不替代
    UAT 结论。 收到测试报告/准出 → 有包则 `handoff.receive`，无包则读报告正文；UAT 通过后默认交 UAT 记录；`UAT` 包按需先问后发。 判定产品缺陷 vs 实现缺陷（依据：PRD 原文/设计对照）；结论：通过/不通过/有条件通过（有条件通过须列遗留、责任人与接受人）。
  wrap: 对照 `rules/templates/90-handoff/closeout-skeleton.md` 输出【任务收尾】（须含【遵守自检】）；第1点按本步产出填写。 更新产品计划 //、activeContext、 `{workroot}/INDEX.md`；现状三处同拍（执行契约
    规则 7）；`sync=` 含 `triad=aligned|deferred:<原因>`；语义已变禁只改 activeContext。未verify/遗留项明示。 本步先出骨架与拟提交清单，提交门在下一步。
