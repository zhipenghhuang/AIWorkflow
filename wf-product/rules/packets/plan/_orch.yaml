# orch · plan — packet rebuild source (not runtime must_read)
# YAML step.notes may be thin; rich orchestration lives here.
workflow: plan
purpose: 编排笔记缓存：生成步骤包 §5 的真源；YAML notes 保持薄指针。勿手改 packet 后丢此文件。
steps:
  commit: 无文件变更跳过；拟提交清单按 `rules/workflow.md`；提交后补一行结果，不重复六段。
  goals: 读 `product-profile.md` + `{workroot}/requirement-pool.md` + 上期复盘（若有）； 产出本周期目标（O）与成功指标（KR）：基线 目标值 观测窗口；指标口径写清。 **目标有依据**：来自已双确认的客户/业务需求与证据，不自行发明
    KPI/北极星；无基线/无口径标「待验证」并写验证方式；**未双确认不得**进入目标/范围；口径不明须按 `rules/core/clarification.md` 问清并确认。 技能：0→1 读 `skills/zero-to-one-product-definition/SKILL.md`；迭代读
    `skills/requirement-discovery-and-prioritization/SKILL.md` + `skills/customer-needs-discovery/SKILL.md`（先读再做）。 能力（可选）：analytics
    核对口径；未装 = 用户提供数据摘要。
  next: 仅由「下一步/当前状态/继续」入口触发；正常「产品计划」链到 publish 止，不执行本步。 只读 `{workroot}/product-plan.md`：报备当前阶段、当前门、下一动作、需人工项； 「按产品计划执行」= 按
    路由到 plan prd deliver change 对应 step，执行到下一个 `hitl` 停止； 「下一步」只报动作与入口，不执行；「当前状态」只读，不重写计划。 有未吸收的新文档/变化 → 先走 `workflows/change.yaml`
    intake，不直接改 PRD/计划。 有未回执/退回/阻断的交接包 → 先走 `workflows/handoff.yaml` status/receive，不直接推进阶段。 产品包独立运行；开发/测试包为可选输入/输出，缺则不阻塞。
    执行后回写 状态/下一动作、 执行日志；门结论/变更写。
  publish: 须已完成 review-plan 选模式（或本轮跳过条件满足）。核对 Brief+差量表已落盘（或独立迭代变更摘要已互指）。总控表状态回写（阶段 产物 门 状态 下一动作）；版本索引挂 PRD 迭代方案（多需求版本）/ 评审
    受理/变更 交付计划 UAT GTM 原型 复盘 迭代变更摘要（若独立文件）。 多需求/多功能版本：在版本目录落 `迭代方案-{ver}.md`（模板 `rules/templates/10-planning/iteration-plan-template.md`），汇总范围、功能覆盖、验收矩阵、执行记录与发布条件；单需求可只用
    PRD，不强制另立。 更新 `{workroot}/work-log.md`（仅本文件）：索引表新增一行 + 一条里程碑条目，事件类型=`计划确认`（结论/产出/遗留；关联产品计划路径）；无文件则先按工作日志模板创建再写。 **不是**根
    `CHANGELOG.md`、也不是产品计划 执行日志（细粒度过程仍只写 ）。 **禁止**创建/修改/补链项目根 `CHANGELOG.md`；无开发包则不建根。 **主档不移动**：`{workroot}/product-plan.md`
    常青；季度结束复制当期执行到 `{workroot}/_archive/{yyyy-Qn}/产品计划-{yyyy-Qn}.md`，主档保留历史索引并重置当前季度； 版本/结项把当期目录整体移入 `{workroot}/_archive/{yyyyMMdd}-{ver}/`（点名执行）；先判
    T1/T2/T4，T2/T4 增量迭代保留仍被引用的 PRD/原型基线，不整夹归档。 版本/结项归档时按 `rules/doc-governance.md` 扫描；先判 T1/T2/T4，T2/T4 保留仍被引用的 PRD/原型基线；失效资料进
    `inbound/_archive/{ver}/` + 归档清单；部分/增量/参考不动；未确认不移动。 同步按 `rules/doc-governance.md` ～（仅本步关版本/结项时，非日常收尾）：长期主档就地更新、版本绑定目录关闭时归档、已完结临时/失败/重复列清理候选；确认后执行。
    **换代/新版本主题（即使不结项发版）** → 按；不确定则 `confirm_iteration_close`；确认后先判 T1/T2/T4，再按 关账（T2/T4 保留仍被引用的 PRD/原型基线；跳过仅发版项）。 建/更新 `{workroot}/handoff/handoff-ledger.md`（模板
    `rules/templates/90-handoff/handoff-ledger-template.md`）；按模板登记计划/PRD/设计/变更/UAT/发布节点；变更分级与重规划触发写入计划执行日志/变更记录。 稳定真值（愿景/用户/北极星/指标口径）留在主档与
    `product-profile.md`，不随季度归档。
  review-plan: 首版或范围·指标·版本实质变更后、宣称「计划已可驱动 PRD/排期」前：按 `skills/artifact-review` STOP 选 A 自行通过｜B AI 独立审。 选 A：出示目标/反范围/里程碑/风险自检摘要
    → 用户确认 → HUMAN_APPROVED。 选 B：按计划量规（目标可证伪/反范围/依据/里程碑/风险）只报缺口；留痕 `{workroot}/{ver}/10-requirements/评审-计划-{yyyyMMdd}.md`
    或计划旁评审笺；需修回 scope/publish 修订。 小周期微调且已 confirm_plan → `landing_doc_review_needed` 可假。
  roadmap: 路线图 Now Next Later + 版本映射；每项标用户价值、证据、依赖、时间窗。 **未确认不排**：未完成客户需求理解/未确认范围的需求，只能进候选项，不承诺版本；竞品做法/领导偏好/单个客户不得直接排优先级。
    **判断集中**：路线图/优先级不并行生成 A/B/C 方案；可只读拉取数据/反馈/竞品证据（≤30 行/来源），排序与取舍由本步做。 方法按需：RICE Kano MoSCoW；拿不准向上一档并说明。 不写需求细节（细节归 PRD）；需求池只留候选与状态。
  scope: 本期做 不做（MVP）、产能约束、里程碑（设计 开发 提测 UAT 发布）、依赖与风险。 ** Brief+本期差量表必填**（默认权威写在计划本节；增/改/删；首版可「全部为增」）。 **独立迭代变更摘要**：默认不建；仅仓外handoff/版本单独归档/用户点名时才落
    `迭代变更摘要-{ver}.md` 为唯一权威， 只写「见该路径」（模板 `rules/templates/10-planning/iteration-change-summary-template.md`）。禁止双份完整表。 confirm_plan：出示目标
    路线图 本期范围 ** 差量表摘要** / 里程碑 风险请确认；首次计划或范围·指标·版本实质变更必停； 同周期同版本只确认一次（「继续」沿用）。 **确认后必须同轮落盘**：把确认稿并入 `{workroot}/product-plan.md`（/含/），不要等
    wrap；会话中断时以已落盘稿为准。 **计划未确认不进入 PRD 排期**（见 `rules/workflow.md` 第 1 节）。 **无产品计划第 3.0 节 Brief+差量表（权威在独立摘要时须可打开）不得交开发当本期范围已清**。
  wrap: 对照 `rules/templates/90-handoff/closeout-skeleton.md` 输出【任务收尾】（须含【遵守自检】）；第1点按本步产出填写； 更新产品计划、activeContext、 `{workroot}/INDEX.md`（有实质进展时）；现状三处同拍（执行契约
    规则 7）；`sync=` 含 `triad=aligned|deferred:<原因>`；语义已变禁只改 activeContext。未验证项明示。 本步先出骨架与拟提交清单，提交门在下一步。
