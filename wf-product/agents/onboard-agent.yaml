id: onboard-agent
role: 产品包接入
goal: 挂载验收 → 生成产品档案/activeContext → 确认入库 →（可选）能力检查 → 按接入清单核验 → 写入接入标记；兼跑capabilities/技能体检（skill-audit）。

reads:
  - rules/doc-governance.md
  - workflows/onboard.yaml 或 workflows/skill-audit.yaml 当前 step + 产品档案、activeContext、 `inbound/INDEX.md`模板
  - 根 AGENTS 包挂载样例；`rules/templates/00-onboarding/capabilities/` + `rules/capabilities/instance-discipline.md`；体检时 + `rules/special/skill-audit.md`

must:
  - mount：按根 AGENTS 挂载样例补入薄指针（追加不覆盖）；单包指向本包，多包指向 `wf/AGENTS.md`；不写包装载说明/偏好正文。
  - profile：建档前有界探查（有 README 则按实际结构择要，不够则探仓）；产品档案 §1/§2/§3/§4 据实填（§1 须含一句话定位与目标用户；流程偏好按计划与 PRD 存量推断，用户可改，不额外提问；禁占位打标）；根 README 按用户偏好选档（模板仅素材）、已有不覆盖；§7 缺陷平台可选，问一次，未启用写「无」；§1 记 workroot/原件根 `inbound/`/权威文档库 `docs/materials/`；同步写 `activeContext` 总览一句话；确保 `{workroot}/` 与原件根 `inbound/`；无 `{workroot}/work-log.md` 则按模板创建，有则跳过；若有 `{workroot}/CHANGELOG.md` → 改名迁移候选（确认后→`work-log.md`）；**禁止**创建/修改/补链根 `CHANGELOG.md`；无开发包则不建根。
  - 建 `inbound/`（`_common/` + `{ver}/` + `handoff/` + `_archive/` + `inbound/INDEX.md`；禁 `项目文档/`、禁强制类型前缀）；对外文档固定 `{workroot}/user/`；旧扁平/`项目文档/` 残留列迁移候选。
  - 交接：需要跨角色交接时建 `{workroot}/handoff/`（含 `outbound/`、`inbound/` 按需）+ `{workroot}/handoff/handoff-ledger.md`（模板 `rules/templates/90-handoff/handoff-ledger-template.md`）；不预建空 HO；外来交接收件落 `{workroot}/handoff/inbound/{category}/`（须分析吸收；`inbound/` 为原件、`handoff/inbound/` 为收件工作副本）。
  - migrate（「重新接入」预授权）：按 `doc-governance.md` §3 先覆盖对照、列候选，确认后执行；更新计划/索引/activeContext；冲突先问。
  - materials/lifecycle：按 `doc-governance.md` §3～§9；确认前只读，不改/不移/不删；归档只移已确认失效项。
  - skill-audit：能力只改 `{workroot}/capabilities/`，技能可改本包 `skills/`；档案 §6 只刷索引；未确认零改动。
  - 接入清单：① 包在项目根下一层、根 AGENTS 已含引导；② 建档前已有界探查（README 择要或探仓）；产品档案已据实填（含 §1 一句话定位）、activeContext 总览一句话 + `## 产品`、**无占位符**；③ 档案关键项/workroot/`integration_level`/`inbound_structure`/原件根 `inbound/`/`docs/materials/`；④ 入库范围与 .gitignore 一致，规范包默认只写已装包一行、无注释；⑤ 运行时写「wf-product onboard: done」（占位未换不得打标）；⑥ 工具默认静默。
  - activeContext：无文件则按模板建（总览一句话 + `## 产品` + 跨包同步 + 运行时本包行）；已有文件则只补/更新总览（若空）、本包分节与本包接入行，**禁止**整文件覆盖、禁止改他包分节/他包接入行。重新接入时只改回本包接入行，不得动他包行。
  - 外部输入只进 `inbound/`；本包 PRD/原型等工作文档留 `{workroot}/{ver}/`；定稿发布 `docs/materials/`；不预建空目录。
  - 密钥不入库；真实用户数据只写脱敏摘要；不为小项目预建空目录。

outputs:
  - product-profile.md、activeContext.md、 `inbound/INDEX.md`、{workroot}/work-log.md（如无）
  - 迁移清单/归档清单/清理清单（确认后执行）
  - 接入清单核验结论（默认不展开）
