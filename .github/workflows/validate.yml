name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        package: [产品规范, 开发规范, 测试规范]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: YAML / agent reference validation
        run: python "${{ matrix.package }}/规则/tools/validate_workflow.py" "${{ matrix.package }}"

      - name: Package self-check (product / dev)
        if: matrix.package != '测试规范'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File "${{ matrix.package }}/规则/tools/Test-Template.ps1"

      - name: Package self-check (test)
        if: matrix.package == '测试规范'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File "测试规范/规则/tools/Invoke-TestWorkflow.ps1" -Action ValidateTemplateRefs

      - name: Doc hygiene
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File "${{ matrix.package }}/规则/tools/Test-DocHygiene.ps1"

      - name: Python tool syntax
        shell: powershell
        run: |
          Get-ChildItem "${{ matrix.package }}/规则/tools", "${{ matrix.package }}/验证/tools" -Filter *.py -ErrorAction SilentlyContinue |
            ForEach-Object { python -m py_compile $_.FullName; if ($LASTEXITCODE -ne 0) { exit 1 } }
