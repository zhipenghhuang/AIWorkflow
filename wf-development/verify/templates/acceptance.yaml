# 验收清单模板（L2+；复制到项目根 .gate/acceptance.yaml）
# 确认后冻结；实施中新增/变更 AC 走变更记录。
# 规范包只读：勿写入 wf-development/verify/。
# 实施质量（DEV-IQ）：L1+ 有代码须 implement_preflight + sc_trace（门禁硬拦）；取重时 cross_layer/baseline_smoke/debts；见 implementation-quality.md §8
# 非功能（L2+）：nfr.security / nfr.performance 必填（done+证据 或 na+具体理由；禁「无风险」空话）；见 verification.md DEV-VER-19
task_id: DEV-{yyyyMMdd}-{NNN}
title: "{主题}"
level: L2            # L0/L1/L2/L3；L2+ 必须有 process.review
change_types: [frontend]  # frontend/api/db/docs/code
acceptance:
  - id: AC-01
    statement: "{条件 + 动作 + 可观测结果}"
    check: "build + login.spec"       # 可复跑命令/脚本/人工检查
    evidence: ".gate/frontend/smoke-desktop.jpg"  # 路径或命令输出；路径必须存在
    sc_refs: ["SC-01"]                # 可选；指回任务卡条款
  - id: AC-02
    statement: "{空态/错误态/权限态}"
    check: "states.spec"
    evidence: ".gate/frontend/state-empty-desktop.jpg"
    sc_refs: ["SC-02"]
process:
  understanding: "{workroot}/10-requirements/理解-{主题}-{yyyyMMdd}.md"
  design: "{workroot}/20-design/方案-{主题}-{yyyyMMdd}.md"
  review: ".gate/review.md"          # L2+ 必填；reviewer/implementer/verdict/AC 覆盖/SC 对账（或 na）
  security: ""                       # L3 必填：安全扫描/评审证据
  rollback: ""                       # L3 必填：回滚演练/预案证据
# done|na|missing；有代码却 missing → 完成门 BLOCKED（DEV-IQ-09）
implement_preflight: done
# L1+ 有代码必填（done|路径|na+理由）；missing → BLOCKED
sc_trace: "{workroot}/40-tasks/任务清单-….md#SC"   # 或 done: SC table；无行为写 na: …
cross_layer: done   # done | na | missing — 权限/状态/基数/多表面命中须 done
baseline_smoke: na  # done | na | missing — 增量沿用基线时须 done
debts: []           # ["DEBT-01"] 或 []；裁剪/豁免须非空 ID 列表或显式无
# 非功能影响与证据（L2+ 必填；值为 done: <路径/命令/指标> 或 na: <理由>）
# 安全基线见 threat-modeling §3.1，性能预算见 performance-and-capacity §2.1
nfr:
  security: "done: .gate/security/baseline.md（越权负例 2 条；依赖审计无高危）"
  performance: "done: .gate/perf/bench.md（列表 p95 120ms；23 SQL；首屏 554KB）"
  # 不适用示例：security: "na: 纯文案/样式调整，无鉴权、数据、上传或外部调用变化"
  # 不适用示例：performance: "na: 无运行时路径（纯文档）"
scope_files: []                      # L2+ 建议填：允许改动的代码路径/文件
non_goals:
  - "{明确不做}"
assumptions:
  - "{假设 + 影响 + 验证方式}"
