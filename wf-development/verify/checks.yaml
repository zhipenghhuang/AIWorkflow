# 检查矩阵（开发轨 · 人读策略）
# 机器执行以 tools/gate.py 为准；本文件用于评审与调整，不要求 gate 解析。
# 原则：高价值低成本默认做；高价值中成本按风险做；低价值高成本不做。

version: 1
# 检查 id 名实：profile 配了 lint_scoped/test_scoped/e2e_scoped（含 {files}）→ targeted-* / affected-e2e；
# 未配 → project-lint / project-test / project-e2e（全仓命令，勿宣称「只跑受影响」）。
levels:
  L0:
    description: 纯文档/文案/注释；无代码、配置、行为、契约、权限、数据变化
    required: [docs-links, docs-placeholders]
    optional: []
    # 交叉：触及权限/状态/数据基数/唯一约束/多表面 → 升 L1+，并按 skills/cross-layer-consistency；代码/配置至少 L1（见 AGENTS §0.1 / DEV-VER 相关）
  L1:
    description: 代码/配置，≤3 文件且≤1 模块，无接口/数据/权限变化（>3 文件或 >1 模块 → L2；与 rules/gates.md 的 L 档推导一致）
    required: [build, lint-or-targeted-lint, test-or-targeted-test, smoke]
    frontend_required: [e2e-or-affected-e2e, prototype-parity-matrix, route-coverage, per-route-screenshots, states-console-network, design-qa, evidence-integrity]
    optional: [a11y-basic, visual-diff]
  L2:
    description: >3 文件或 >1 模块，或接口/数据/新功能变更
    required: [build, lint-or-targeted-lint, unit, integration, review-record, plan-coverage, nfr-baseline]
    frontend_required: [e2e-or-affected-e2e, prototype-parity-matrix, route-coverage, per-route-screenshots, states-console-network, design-qa, evidence-integrity]
    manual: [review]
    optional: [contract-test]
  L3:
    description: 权限/资金/迁移/公共 API/安全合规/破坏性
    required: [L2, security-scan, security-evidence, rollback-evidence, independent-review]
    manual: [rollback-drill, release-readiness, postrelease]
    optional: [migration-rehearsal, load-test]

post_gate:
  - report-lint   # iterate/change/defect-fix wrap 后由 verify/Test-Report.ps1；不属于 implementation gate

change_types:
  frontend:
    globs:
      - "**/*.tsx"
      - "**/*.jsx"
      - "**/*.vue"
      - "**/*.svelte"
      - "**/*.css"
      - "**/*.scss"
      - "**/*.html"
      - "**/*.htm"
      - "**/pages/**"
      - "**/components/**"
      - "**/views/**"
      - "**/templates/**"
      - "**/layouts/**"
    min_level: L1
    notes: 纯文案/文档可 L0；代码/配置至少 L1（仍需受影响页面截图 + console 无 error）；触及权限/状态/数据基数/多表面不可留 L0，升档并过跨层一致。L1+ 前端按 `frontend-gate` §2.1 分级（`.gate/frontend/tier.json`）：A 全量矩阵+每路由桌面/移动；B 受影响路由矩阵+桌面/移动；C 1 张桌面截图、免 parity；该级缺一 BLOCKED。
  api:
    globs:
      - "**/api/**"
      - "**/*controller*"
      - "**/*.proto"
      - "**/openapi*"
      - "**/swagger*"
    min_level: L2
  db:
    globs:
      - "**/migrations/**"
      - "**/*.sql"
    min_level: L3
  auth_payment:
    globs:
      - "**/auth/**"
      - "**/login/**"
      - "**/payment/**"
      - "**/pay/**"
      - "**/security/**"
      - "**/permission/**"
      - "**/role/**"
    min_level: L3
  docs:
    globs:
      - "**/*.md"
      - "**/*.txt"
    min_level: L0
    required: [links, placeholders]

# 实施质量（人检/清单字段；与 rules/core/implementation-quality.md 对齐）
# 取重时 verify 须对账；机器门仍以 tools/gate.py 可检项为准
quality_gates:
  - implement-preflight  # DEV-IQ-09；acceptance.implement_preflight；有行为却 missing 不得全覆盖通过
  - sc-trace          # 任务卡/acceptance.sc_trace；无 SC 不得开工（L0 除外）
  - selftest-vs-spec  # 断言指回 SC/AC；禁与方案相反刷绿
  - defect-red-green  # 缺陷修复：修复前红证 + 修复后同口径绿证（原单入口/边界）
  - writeback-ready   # 回写：§6.1 八段 + hash/版本 + 状态/指派 + 验证站冒烟
  - cross-layer       # 命中则矩阵+第二次写/角色正反；acceptance.cross_layer
  - important-surface # DEV-IQ-10；预检命中面须同批防护+负面自测
  - debt-register     # 裁剪/豁免须 DEBT/OPEN；acceptance.debts
  - baseline-smoke    # 沿用模块提测前冒烟；acceptance.baseline_smoke
  - nfr-baseline      # L2+：acceptance.nfr.security / nfr.performance（done+证据 或 na+理由）；门禁校验
  - perf-regression   # 性能敏感路径：预算/SQL 次数/首屏字节/基准或回归断言；无则债项
  - frontend-parity   # DEV-IQ-17；parity-matrix + route-coverage + 每路由截图；缺一 BLOCKED
  - evidence-integrity # DEV-VER-14/15；测试日志/截图哈希/新鲜度/base_commit
  - reviewer-independence # DEV-VER-16；复审必须实际复跑最小断言

# 高价值低成本（默认；L1+ 适用；L0 纯文档只跑 docs-links/docs-placeholders）
always:
  - acceptance-checklist
  - build
  - test-or-targeted-test
  - smoke

# 高价值中成本（按风险）
risk_based:
  - lint-or-targeted-lint
  - e2e-or-affected-e2e
  - frontend-screenshots
  - frontend-states
  - frontend-console
  - frontend-network
  - a11y-basic
  - independent-review
  - security-scan      # 命中鉴权/上传/导出/公共 API/外部回调/含 PII 时必做；L3 亦为 required
  - perf-regression    # 命中列表/导出/批量/统计聚合/首屏资源/外部调用时必做

# 低价值高成本（不做/少做）
avoid:
  - full-regression-every-change   # 未配 *_scoped 时 project-* 已是全仓；发布/L3 另跑全量
  - pixel-diff-every-page
  - exhaustive-a11y-every-change
  - multiple-approval-layers
  - new-docs-for-L0-L1
  - read-all-rules-every-task
