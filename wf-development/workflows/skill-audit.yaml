# 编排：只读当前 step。进 wf → packets/skill-audit/_chain.md；进子机 → _region-*；执行 → 步骤包。
# 步骤包 §6 必开技能：打开→执行→回包（质量不降）。禁把 skill 正文嵌进步骤包。
# 富编排笔记：packets/skill-audit/_orch.yaml（重建用）。禁通读本 YAML 其他 step。
workflow:
  id: skill-audit
  name: 能力与技能体检
  version: 2
  chain: full
entry_points:
  体检能力: scope
  能力技能体检: scope
  检查技能能力: scope
  能力优化: scope
  技能优化: scope
  优化能力: scope
  优化技能: scope
  优化技能能力: scope
  更新能力建议: scope
  更新技能: scope
  维护技能能力: scope
  通用优化技能: scope
  通用最优技能: scope
trigger:
- 体检能力 / 能力技能体检 / 检查技能能力 / 能力优化 / 技能优化 / 优化能力 / 优化技能 / 优化技能能力
- 更新能力建议 / 更新技能 / 维护技能能力
- 通用优化技能 / 通用最优技能
steps:
- name: 定范围与模式
  id: scope
  must_read:
  - rules/packets/skill-audit/scope.md
  agent: onboard-agent
  output: 体检范围卡（模式 project/generic、范围、依据）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/skill-audit/_orch.yaml。
- name: 盘点
  id: inventory
  must_read:
  - rules/packets/skill-audit/inventory.md
  agent: onboard-agent
  output: 库存摘要（capabilities/skills/映射/缺口，含证据）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/skill-audit/_orch.yaml。
- name: 生态检索
  id: discover
  must_read:
  - rules/packets/skill-audit/discover.md
  agent: onboard-agent
  output: 生态检索表（query / 候选 / installs / 吸收动作 / 证据）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/skill-audit/_orch.yaml。
- name: 适配分析
  id: fit
  must_read:
  - rules/packets/skill-audit/fit.md
  agent: onboard-agent
  output: 适配分析表（够用/缺口/过重/冲突/重复/映射断裂/可吸收方法 + 证据）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/skill-audit/_orch.yaml。
- name: 出具建议
  id: propose
  must_read:
  - rules/packets/skill-audit/propose.md
  - rules/templates/00-onboarding/capability-skill-audit-report-template.md
  agent: onboard-agent
  output: '{workroot}/00-governance/能力技能体检-{yyyyMMdd}.md（无治理目录则 inbound/_common/ 或用户指定）'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/skill-audit/_orch.yaml。
- name: 确认并应用
  id: apply
  must_read:
  - rules/packets/skill-audit/apply.md
  agent: onboard-agent
  hitl: confirm_skill_changes
  hitl_when: skill_changes_pending
  output: 已应用变更清单 + Test-Template / check_skills 自检结果
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/skill-audit/_orch.yaml。
- name: 收尾
  id: wrap
  must_read:
  - rules/packets/skill-audit/wrap.md
  - rules/templates/90-handoff/closeout-skeleton.md
  agent: onboard-agent
  output: 【任务收尾】
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/skill-audit/_orch.yaml。
- name: 拟提交
  id: commit
  must_read:
  - rules/packets/skill-audit/commit.md
  - rules/templates/90-handoff/closeout-skeleton.md
  agent: onboard-agent
  hitl: confirm_commit
  hitl_when: has_pending_commit
  output: 拟提交确认结果
  tools:
  - git
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/skill-audit/_orch.yaml。
