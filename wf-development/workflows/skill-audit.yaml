# 编排：进 wf → workflows/skill-audit.md；执行 → 当前 step 步骤包；终端 → _shared/closeout.md。
# 步骤卡 §6 必开技能：整卡读取→执行→回包。禁把 skill 正文嵌进步骤卡。
# 本 YAML 只定义状态/门/产出；不用于运行时通读。
workflow:
  id: skill-audit
  name: 能力与技能体检
  version: 2
  chain: full
  terminal: closeout
entry_points:
  体检能力: scope
  能力技能体检: scope
  检查技能能力: scope
  能力优化: scope
  技能优化: scope
  优化能力: scope
  优化技能: scope
  优化技能能力: scope
  更新能力建议: scope
  更新技能: scope
  维护技能能力: scope
  通用优化技能: scope
  通用最优技能: scope
trigger:
- 体检能力 / 能力技能体检 / 检查技能能力 / 能力优化 / 技能优化 / 优化能力 / 优化技能 / 优化技能能力
- 更新能力建议 / 更新技能 / 维护技能能力
- 通用优化技能 / 通用最优技能
steps:
- name: 定范围与模式
  id: scope
  skills: []
  must_read:
  - rules/packets/skill-audit/scope.md
  agent: onboard-agent
  output: 体检范围卡（模式 project/generic、范围、依据）
  notes: 读 `rules/special/skill-audit.md` 模式判定：口令含「通用」「不按项目」「通用优化」→ generic； 否则无填实 `project-profile.md`（占位未换=无）→ **强制 generic**
    并记「无项目对照自动」；有填实档案 → project。 确认范围：全量｜仅外部能力｜仅随包技能｜按域。无偏好时：generic 默认全量；project 按档案栈推荐。
- name: 盘点
  id: inventory
  skills: []
  must_read:
  - rules/packets/skill-audit/inventory.md
  agent: onboard-agent
  output: 库存摘要（能力/技能/映射/缺口，含证据）
  notes: 读 `{workroot}/capabilities/00-能力清单.md`（无则记缺口）+ 包内契约/参考目录；`skills/README.md` 映射；抽查 frontmatter。 禁通读全部技能正文。输出【库存摘要】：已装/未装/已提示能力数
    + 映射覆盖行数。 可顺带跑 `rules/tools/check_skills.py <本包根> --strict`，失败记入缺口。
- name: 生态检索
  id: discover
  skills: []
  must_read:
  - rules/packets/skill-audit/discover.md
  agent: onboard-agent
  output: 生态检索表（query / 候选 / installs / 吸收动作 / 证据）
  notes: 按 `rules/special/skill-audit.md`：对范围内域执行 `npx skills find <query>`（或已装 find-skills 流程）；先看 skills.sh 榜。 质量闸：优先 ≥1K
    installs + 信誉源；写入【生态检索】：可吸收方法｜能力候选｜维持；禁未确认 `skills add` 进母版。 无网络/CLI → 降级只读参考目录并记原因，不得跳过本节留空。
- name: 适配分析
  id: fit
  skills: []
  must_read:
  - rules/packets/skill-audit/fit.md
  agent: onboard-agent
  output: 适配分析表（够用/缺口/过重/冲突/重复/映射断裂/可吸收方法 + 证据）
  notes: project：对照档案、activeContext、近期完成门/降级。generic：对照能力表主选备选与技能完整性/冗余，不写项目特例。 合并 inventory + discover：分类 够用｜缺口｜过重｜冲突｜重复｜映射断裂｜可吸收方法。
- name: 出具建议
  id: propose
  skills: []
  must_read:
  - rules/packets/skill-audit/propose.md
  - rules/templates/00-onboarding/capability-skill-audit-report-template.md
  agent: onboard-agent
  output: '{workroot}/00-governance/能力技能体检-{yyyyMMdd}.md（无治理目录则 inbound/_common/ 或用户指定）'
  notes: 按 `rules/templates/00-onboarding/capability-skill-audit-report-template.md` 与 `rules/special/skill-audit.md` 写报告；含「生态检索」节；P0
    置顶。 能力拟改只针对 `{workroot}/capabilities/`；技能可改本包 `skills/`；未确认不改。可列「下一步：装配能力」。
- name: 确认并应用
  id: apply
  skills: []
  must_read:
  - rules/packets/skill-audit/apply.md
  agent: onboard-agent
  hitl: confirm_skill_changes
  hitl_when: skill_changes_pending
  output: 已应用变更清单 + Test-Template / check_skills 自检结果
  notes: 有拟改技能/能力表/装配步骤 → skill_changes_pending=true，出示【拟变更清单】（文件路径或安装项）等确认。 确认后按 `rules/special/skill-audit.md` 执行；拒绝/无候选
    → 跳过，零改动。改包后**必须**跑 `rules/tools/Test-Template.ps1`；改技能另跑 `check_skills.py --strict`；失败不得声称完成。
- name: 收尾与提交
  id: closeout
  skills: []
  must_read:
  - rules/packets/_shared/closeout.md
  agent: onboard-agent
  hitl:
  - name: confirm_commit
    when: has_pending_commit
  output: 任务收尾 + 拟提交确认
  notes: 收尾与提交；共享终端；状态=done。
