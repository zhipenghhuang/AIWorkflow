# 读取：仅当前 step 块。运行时 must_read[0]=rules/packets/<wf>/<step>.md（自包含）。
# 禁通读规则目录；方法已嵌入步骤包。维护素材：skills/、rules/core 长文、playbooks/、read-index。
workflow:
  id: iterate
  name: 迭代交付
  version: 11
entry_points:
  按方案实施: precheck
  按这个方案做: precheck
  按方案做: precheck
  实施这个方案: precheck
  落地迭代方案: precheck
  继续迭代: precheck
  只出任务清单: precheck
trigger:
- 按方案实施 / 按这个方案做 / 按方案做 / 实施这个方案
- 落地迭代方案
- 继续迭代
- 只出任务清单
steps:
- name: 前置检查
  id: precheck
  must_read:
  - rules/packets/iterate/precheck.md
  agent: iterate-lead
  output: 前置检查结果（需求签收/方案批准/清单/handoff/缺口）
  notes: 缺理解包/未签收方案 → 回 change.analyze_input 或 requirements/design/review-docs；交接包先 receive。 禁本步 -StartTask。并行/关账见 iteration-delivery
    + doc-governance REF。
- name: 读方案与拆清单
  id: plan
  must_read:
  - rules/packets/iterate/plan.md
  agent: iterate-lead
  output: 任务清单 + 冻结的验收清单（{workroot}/40-tasks/任务清单-{ver}.md）
  notes: 只读不改代码；拆 SC → validate_tasklist → 写入 review_required。「只出清单」→ wrap。 无 PRD 先 product-shaping REF；L2+ 读 development-plan。禁本步
    -StartTask。
- name: 确认清单与节奏
  id: confirm
  must_read:
  - rules/packets/iterate/confirm.md
  when: implementation_required
  agent: iterate-lead
  hitl: confirm_backlog
  hitl_when: backlog_approval_required
  output: 已确认清单/节奏
  notes: 清单未变可跳过 hitl；L1 notify、L2+ 实质变化 approve。确认后冻结；变更记清单 。
- name: 实施与定向自验
  id: implement
  must_read:
  - rules/packets/iterate/implement.md
  when: implementation_required
  agent: implementer
  output: 代码/配置改动 + 任务状态回写
  notes: -StartTask → 预检 → 按 SC 落地 → 回写清单；无 UI 时 frontend-gate 标 na。 超出清单先停；未验证不得标完成。细节同 change.implement 技能必做。
- name: 代码评审
  id: review
  must_read:
  - rules/packets/iterate/review.md
  when: review_required
  agent: reviewer-agent
  tools:
  - code-review
  - security-scan
  - design-review
  output: 评审结论/缺口 + `.gate/review.md`
  precondition: 前端变更（页面/路由/静态资源）→ `.gate/frontend/parity-matrix.md`、`route-coverage.json`、`design-qa.md` 存在且非空；L2+ → `.gate/plan-coverage.md`
    存在且后端/功能/前端行有效；非前端/低档→无。
  on_fail: 回 implement 补前端交付物/方案覆盖矩阵；不得以代码/测试/API 200 代替，不得判通过。
  notes: 口径同 change.review（含多波次）；写 .gate/review.md；核验者≠实施者。
- name: 全量门禁与文档同步
  id: gates
  must_read:
  - rules/packets/iterate/gates.md
  when: implementation_required
  agent: verifier-agent
  gate: completion-gate
  gate_type: machine
  output: .gate/wf-development/completion.json + 门禁摘要/文档同步
  notes: Invoke-Gate → Claim；非 COMPLETE 不得 deliver/commit。同步清单/plan/activeContext（triad）。 无 QA 时开发自验同 change.verify。
- name: 提测与发布文档
  id: deliver
  must_read:
  - rules/packets/iterate/deliver.md
  when: has_qa_or_deploy_or_requested
  agent: implementer
  output: 提测单/发布说明/回滚预案
  notes: 单一出处=change.deliver；未 COMPLETE 不得标可提测。
- name: 发布交接
  id: release_handoff
  must_read:
  - rules/packets/iterate/release_handoff.md
  when: has_deploy
  agent: delivery-lead
  output: 发布就绪包
  notes: 单一出处=change.release_handoff；部署走 release.yaml + confirm_deploy。
- name: 迭代复盘
  id: retro
  must_read:
  - rules/packets/iterate/retro.md
  when: iteration_done_or_incident
  agent: delivery-lead
  output: 复盘（{workroot}/80-retrospectives/）
  notes: 小迭代可轻量；行动项须负责人/截止/验收。最终六段由 wrap 出。
- name: 收尾
  id: wrap
  must_read:
  - rules/packets/iterate/wrap.md
  - rules/templates/90-handoff/closeout-skeleton.md
  agent: iterate-lead
  output: 【任务收尾】（迭代交付汇报置第 1 点）
  notes: 只认 closeout-skeleton；同步 plan/INDEX/台账/triad；有门则 Test-Report。 完整【拟提交】留待 commit。
- name: 拟提交
  id: commit
  must_read:
  - rules/packets/iterate/commit.md
  agent: iterate-lead
  hitl: confirm_commit
  hitl_when: has_pending_commit
  tools:
  - git
  output: 拟提交清单
  notes: 无变更跳过；字段见 workflow.md REF；默认仅本地提交。
