# 编排：进 wf → workflows/control.md；执行 → 当前 step 步骤包；终端 → _shared/closeout.md。
# 步骤卡 §6 必开技能：整卡读取→执行→回包。禁把 skill 正文嵌进步骤卡。
# 本 YAML 只定义状态/门/产出；不用于运行时通读。
workflow:
  id: control
  name: 开发计划
  version: 7
  terminal: closeout
entry_points:
  开发计划: init
  项目计划: init
  排期: init
  生成计划: init
  根据文档出计划: init
  按开发计划执行: run
  继续开发计划: run
  进度: sync
  当前阶段: sync
  当前状态: sync
  下一步: next
  阶段检查: check
trigger:
- 开发计划
- 项目计划 / 项目规划
- 排期 / 里程碑
- 生成计划 / 根据文档出计划
- 按开发计划执行 / 继续开发计划
- 进度 / 当前阶段 / 下一步
- 阶段检查 / 开发计划检查
steps:
- name: 初始化开发计划
  id: init
  skills:
  - development-plan
  skills_conditional:
    product-doc-analysis: 输入含 PRD/原型/产品文档
    product-shaping: 无 PRD/只有想法
  must_read:
  - rules/packets/control/init.md
  - rules/templates/10-planning/development-plan-template.md
  agent: iterate-lead
  hitl:
  - name: confirm_plan
    when: plan_needs_confirm
  - name: confirm_iteration_close
    when: iteration_close_needed
  output: 开发计划（{workroot}/development-plan.md）
  notes: 先判换迭代：新方案/新版本到达且当前迭代未关闭 → STOP `confirm_iteration_close`；未决前只做入站/理解/待确认，不得替换 `development-plan.md` 或归档现行绑定文档。 本步只建/更新开发计划，不自动执行后续阶段；要推进说「按开发计划执行」。
    技能：`skills/development-plan/SKILL.md`（先读再做）；模板 `rules/templates/10-planning/development-plan-template.md`。 命名：本文档=开发计划（总览/开发轨总控）；S3=任务与排期（任务清单/依赖/估算/DoR/DoD/检查点），是计划里的一个阶段。
    路径：默认 `{workroot}/development-plan.md`；需按治理分区时用 `{workroot}/00-governance/development-plan.md`；旧项目以 `project-profile.md`
    声明为准。 输入：PRD/原型/AC/接口/仓库/环境（能拿到多少写多少；缺口写 并由用户提供/选择已有资料）。 无 PRD/只有想法 → 先按 `skills/product-shaping/SKILL.md` 给产品判断（问题/用户/价值/MVP/非目标/成功标准），再填；不强制产品定义卡。
    输入含 PRD/迭代方案/原型 → 先按 `skills/product-doc-analysis/SKILL.md` 产出理解摘要/理解包（来源/目标/范围/F-R-AC/冲突/GAP/置信度）；S0 未完成理解确认不得进入 S1/S2。
    新建：复制模板，填 一页状态（计划状态/当前门/下一动作/需人工）、 输入/外部输入、 阶段表（S0 进行中，其余未开始；每阶段“技能”列必填）、 变更、 执行日志、 归档索引。 建 `{workroot}/handoff/handoff-ledger.md`（模板
    `rules/templates/90-handoff/handoff-ledger-template.md`）；按模板登记 REQ/DES/PLAN/QA/TEST/FIX/REL 节点；无跨角色交接可不建包，但台账保留。 L2+ 同时确认
    需求台账/变更记录/待决项/决策记录/`inbound/` + `inbound/INDEX.md` 存在；无则按模板补。 每阶段按阶段表“技能”列加载技能；S2 技术方案按变更面加载 technology-selection/database-design/api-design/frontend-design/threat-modeling/performance-and-capacity，不要求全读。
    已存在：不覆盖；读现状后转 sync，避免丢失进度。 L0 微改可写「不适用」；L2+ 新项目/新产品默认启用；不强制引用其它包。 confirm_plan：首次创建/范围·版本·里程碑实质变更时，出示阶段/范围/门/下一步请确认；确认后计划状态=已确认。
    范围·版本实质变更或换主题（即使不发版）→ 按 `rules/doc-governance.md`；不确定则 `confirm_iteration_close`；确认后先判 T1/T2/T4，再按 `rules/doc-governance.md`
    关账（T2/T4 保留仍被引用的基础设计/流程图/原型）。 关账 materials：**必做**覆盖刷新关闭版 `{prev}/`→superseded，再建 `{next}/` current（默认覆盖最新）。 输出首条：route=workflow:control
    | step=init | stage=S0 | gate=G0 | next_action=补输入/需求分析。
- name: 按计划执行
  id: run
  skills:
  - development-plan
  must_read:
  - rules/packets/control/run.md
  agent: iterate-lead
  output: 切包声明（目标 workflow/step/packet）+ activeContext 运行状态更新；实施/方案/任务正文只在目标步骤卡产出
  notes: 本步=计划切包，不是实施现场。读 `{workroot}/development-plan.md`：确认计划状态、当前阶段、当前门、下一动作。计划状态非「已确认/执行中」→ 回 `control/init`；有未吸收新输入 →
    先 `intake/scan`；上游 HO 未签收/退回 → 先 `handoff/receive`。按 §5 选路表选定唯一目标 `workflow/step` → 同轮更新 `activeContext`（workflow/state/packet/gate/next）→
    **关闭本包** → 只打开目标步骤卡（必开技能/原文回指/前端硬门/完成门以目标卡为准）。禁在本步写代码/方案/任务/理解包/提测正文，禁跑 capture/parity，禁代目标步宣称完成。S4/S5：有确认任务清单或 iterate
    进行中 → `iterate`；否则 → `change`；拿不准推荐 iterate 并一问。S7：本包只收测试结论为可选输入；要跑版本测 → 提示测试包 `testing/execute`（本会话不跨包执行）。目标步到下一 hitl/产出停点即停；之后「进度」→
    `sync`，或再「按开发计划执行」进下一阶段。多波次模式二选一不得混用。缺证据不得标阶段完成。**不降标**：AC/完成门/自验不因单人/无 QA 省略。输出首条：route=workflow:<目标> | step=<目标> | via=control/run
    | stage=… | packet=rules/packets/<目标>.md | next_action=…
- name: 同步阶段与证据
  id: sync
  skills:
  - development-plan
  must_read:
  - rules/packets/control/sync.md
  agent: iterate-lead
  output: 更新后的开发计划
  notes: 本步只同步进度/状态，不自动进入下一阶段；要推进说「按开发计划执行」。 先扫 `inbound/` 未登记/变化文件与 `{workroot}/INDEX.md`：有未登记/未吸收文件 → 先走 `workflows/intake.yaml`/`materials`，不直接改计划。
    同步 `handoff-ledger.md`：已发送未回执/退回/有条件接收逐条对账；阻断下游的项写入 当前阻塞/下一动作；未回执不得把阶段标完成。 读开发计划 → 对照本轮实际进展更新： 计划状态/当前阶段/当前门/下一动作/需人工/健康度/下一步
    3 件事； 阶段状态/产出/证据/下一步；各阶段对应节链接/结论； 风险/决策； 变更记录； 执行日志（追加）。 计划状态：草稿/已确认/执行中/变更中/待关闭/已关闭；门结论写「通过/不通过/有条件通过 + 批准人/日期/条件」。 多波次：总控表带当前
    Wn；门结论 `G{n}-W{k}`；S2～S5 叠写各波次，禁假完成/陈旧输入（`skills/development-plan/SKILL.md` ）；波次切换须同轮改总控表+阶段表+门结论。 只写现行有效；不复制 PRD/方案/任务正文；证据链接必须可打开；未验证写「未验证」。
    发现开发计划与代码/文档不一致 → 以代码/本轮验证为准，先修开发计划。 输出：当前阶段、门状态、缺口、下一步；需要用户决策的放最前。
- name: 阶段门检查
  id: check
  skills:
  - development-plan
  must_read:
  - rules/packets/control/check.md
  agent: reviewer-agent
  gate: dev-plan
  gate_type: checklist
  gate_when: dev_plan_required
  output: 阶段门检查结论/缺口
  notes: 技能：`skills/development-plan/SKILL.md`；只读检查，不改代码。 可运行 `python rules/tools/validate_dev_plan.py <开发计划路径>`（可用时）；核验：阶段表与当前阶段一致；每阶段“技能”列已填；本阶段输入/产出/证据齐；下一阶段输入具备；风险/变更已更新；L2+
    开发计划存在。 交接核验：本阶段应发/应收的 HO 是否有回执；`handoff-ledger.md` 与计划 是否一致；阻断下游的包是否已升级；未回执不得判阶段完成。 多波次（若计划含 W1/W2/波次）：计划总控表（当前阶段/门）带当前波次；门结论有
    G{n}-W{k}；S2～S5 禁因某波次已过就整行「完成」且输入/证据波次不得陈旧（见 `skills/development-plan/SKILL.md` ）。 缺口按「阶段/门/缺什么/影响/建议」列出；不替代机器门禁与测试结论。
    不过门 → 回到对应阶段补；不得把「计划写了」当「已执行」。
- name: 下一步建议
  id: next
  skills: []
  must_read:
  - rules/packets/control/next.md
  agent: iterate-lead
  output: 当前阶段/下一步 3 件事/建议入口
  notes: 本步只读建议，不执行阶段；要执行说「按开发计划执行」（会走 `control/run` 切包到目标步骤卡）。 先确认 `inbound/`、`{workroot}/INDEX.md` 无未吸收输入；有 → 建议先 `intake`/`materials`。
    读 `handoff-ledger.md`：待回执/退回/有条件接收会阻塞哪些阶段，列入“需要用户决策”最前；下一步给对应 handoff.receive/send 入口。 基于开发计划给出：当前阶段、已过门、下一步 3 件事（动作+产出+截止）、**建议入口须写清
    `workflow/step`（与 run 选路表一致）**。 需要用户决策的列最前；缺口不阻塞时给降级路径。 不擅自启用其它包；需要跨包资料时只提示可选输入。
- name: 收尾与提交
  id: closeout
  skills: []
  must_read:
  - rules/packets/_shared/closeout.md
  agent: iterate-lead
  hitl:
  - name: confirm_commit
    when: has_pending_commit
  output: 任务收尾 + 拟提交确认
  notes: 收尾与提交；共享终端；状态=done。
