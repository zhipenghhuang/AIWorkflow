# 编排：只读当前 step。进 wf → packets/control/_chain.md；进子机 → _region-*；执行 → 步骤包。
# 步骤包 §6 必开技能：打开→执行→回包（质量不降）。禁把 skill 正文嵌进步骤包。
# 富编排笔记：packets/control/_orch.yaml（重建用）。禁通读本 YAML 其他 step。
workflow:
  id: control
  name: 开发计划
  version: 6
entry_points:
  开发计划: init
  项目计划: init
  排期: init
  生成计划: init
  根据文档出计划: init
  按开发计划执行: run
  继续开发计划: run
  进度: sync
  当前阶段: sync
  当前状态: sync
  下一步: next
  阶段检查: check
trigger:
- 开发计划
- 项目计划 / 项目规划
- 排期 / 里程碑
- 生成计划 / 根据文档出计划
- 按开发计划执行 / 继续开发计划
- 进度 / 当前阶段 / 下一步
- 阶段检查 / 开发计划检查
steps:
- name: 初始化开发计划
  id: init
  must_read:
  - rules/packets/control/init.md
  - rules/templates/10-planning/development-plan-template.md
  - rules/templates/90-handoff/handoff-ledger-template.md
  agent: iterate-lead
  hitl:
  - name: confirm_plan
    when: plan_needs_confirm
  - name: confirm_iteration_close
    when: iteration_close_needed
  output: 开发计划（{workroot}/development-plan.md）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/control/_orch.yaml。
- name: 按计划执行
  id: run
  must_read:
  - rules/packets/control/run.md
  agent: iterate-lead
  output: 当前阶段执行结果 + 开发计划回写
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/control/_orch.yaml。
- name: 同步阶段与证据
  id: sync
  must_read:
  - rules/packets/control/sync.md
  agent: iterate-lead
  output: 更新后的开发计划
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/control/_orch.yaml。
- name: 阶段门检查
  id: check
  must_read:
  - rules/packets/control/check.md
  agent: reviewer-agent
  gate: dev-plan
  gate_type: checklist
  gate_when: dev_plan_required
  output: 阶段门检查结论/缺口
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/control/_orch.yaml。
- name: 下一步建议
  id: next
  must_read:
  - rules/packets/control/next.md
  agent: iterate-lead
  output: 当前阶段/下一步 3 件事/建议入口
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/control/_orch.yaml。
- name: 收尾
  id: wrap
  must_read:
  - rules/packets/control/wrap.md
  - rules/templates/90-handoff/closeout-skeleton.md
  agent: iterate-lead
  output: 【任务收尾】（计划/进度/下一步明细置第 1 点，六段压缩）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/control/_orch.yaml。
- name: 拟提交
  id: commit
  must_read:
  - rules/packets/control/commit.md
  output: 拟提交确认结果
  agent: iterate-lead
  hitl: confirm_commit
  hitl_when: has_pending_commit
  tools:
  - git
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/control/_orch.yaml。
