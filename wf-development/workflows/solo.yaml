# 编排：只读当前 step。进 wf → packets/solo/_chain.md；进子机 → _region-*；执行 → 步骤包。
# 步骤包 §6 必开技能：打开→执行→回包（质量不降）。禁把 skill 正文嵌进步骤包。
# 富编排笔记：packets/solo/_orch.yaml（重建用）。禁通读本 YAML 其他 step。
workflow:
  id: solo
  name: 轻量开发（单人或小项目）
  version: 1
entry_points:
  轻量开发: frame
  我有个想法: frame
  想法落地: frame
  做个: frame
  快速做: frame
  小项目: frame
  轻量方案: plan
  只出轻量方案: plan
  轻量测试: test
  帮我测一下: test
  验收一下: test
trigger:
- 轻量开发 / 我有个想法 / 想法落地 / 做个 / 快速做 / 小项目
- 轻量方案 / 只出轻量方案
- 轻量测试 / 帮我测一下 / 验收一下
steps:
- name: 产品定义
  id: frame
  must_read:
  - rules/packets/solo/frame.md
  when: new_product_or_unclear_idea
  agent: implementer
  output: 产品定义卡（{workroot}/10-requirements/产品定义-{主题}-{yyyyMMdd}.md）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/solo/_orch.yaml。
- name: 一页方案卡
  id: plan
  must_read:
  - rules/packets/solo/plan.md
  - rules/templates/30-planning-tasks/solution-card-template.md
  agent: implementer
  hitl: confirm_spec
  output: 方案卡（{workroot}/20-design/方案卡-{主题}-{yyyyMMdd}.md）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/solo/_orch.yaml。
- name: 实施与自测
  id: build
  must_read:
  - rules/packets/solo/build.md
  agent: implementer
  precondition: plan 已确认；方案卡验收表已冻结；范围/AC 未确认不得写代码
  on_fail: 回 plan 修方案卡；范围超出先停下说明
  output: 代码/配置改动 + 自测证据
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/solo/_orch.yaml。
- name: 轻量测试
  id: test
  must_read:
  - rules/packets/solo/test.md
  - rules/templates/40-delivery/lite-test-report-template.md
  agent: verifier-agent
  gate: completion-gate
  gate_type: machine
  gate_when: solo_gate_required
  on_fail: 回 build 修复；P0 未过不得进 wrap，修后重跑原用例 + 冒烟 + 影响面
  output: 轻量测试报告（{workroot}/50-verification/测试报告-{主题}-{yyyyMMdd}.md）+ .gate/wf-development/completion.json
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/solo/_orch.yaml。
- name: 收尾
  id: wrap
  must_read:
  - rules/packets/solo/wrap.md
  - rules/templates/90-handoff/closeout-skeleton.md
  agent: implementer
  output: 【任务收尾】（六段 + 汇报，可整段复制）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/solo/_orch.yaml。
- name: 拟提交
  id: commit
  must_read:
  - rules/packets/solo/commit.md
  output: 拟提交确认结果
  agent: implementer
  hitl: confirm_commit
  hitl_when: has_pending_commit
  tools:
  - git
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/solo/_orch.yaml。
