# 编排：只读当前 step。进 wf → packets/onboard/_chain.md；进子机 → _region-*；执行 → 步骤包。
# 步骤包 §6 必开技能：打开→执行→回包（质量不降）。禁把 skill 正文嵌进步骤包。
# 富编排笔记：packets/onboard/_orch.yaml（重建用）。禁通读本 YAML 其他 step。
workflow:
  id: onboard
  name: 开发规范接入
  version: 8
  chain: full
entry_points:
  接入开发规范: mount
  重新接入: migrate
  生成项目档案: profile
  装配能力: capabilities
  文档树: docs
  生成README: docs
  更新README: docs
  整理README: docs
  资料收取: materials
  资料整理: materials
  资料归档: materials
  资料巡检: materials
  文档整理: lifecycle
  文档巡检: lifecycle
  文档清理: lifecycle
  清理临时文件: lifecycle
  清理过程文件: lifecycle
  清理无效文件: lifecycle
  清理失效文件: lifecycle
  清理垃圾文件: lifecycle
  清理临时: lifecycle
  归档失效文档: lifecycle
trigger:
- 接入开发规范
- 重新接入
- 生成项目档案
- 装配能力
- 文档树
- 资料收取 / 资料整理 / 资料归档 / 资料巡检
- 文档整理 / 文档巡检 / 文档清理 / 清理临时文件 / 清理过程文件 / 清理无效文件 / 清理失效文件 / 清理垃圾文件 / 清理临时 / 归档失效文档
steps:
- name: 复制与挂载确认
  id: mount
  must_read:
  - rules/packets/onboard/mount.md
  agent: onboard-agent
  output: 项目根 AGENTS.md 包挂载段（已存在则追加，不覆盖）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/onboard/_orch.yaml。
- name: 档案与规范
  id: profile
  must_read:
  - rules/packets/onboard/profile.md
  agent: onboard-agent
  output: project-profile.md（含 §7 技术要点事实摘要 / §8 交付治理 / §9 文档归档）· activeContext.md
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/onboard/_orch.yaml。
- name: 旧项目迁移
  id: migrate
  must_read:
  - rules/packets/onboard/migrate.md
  agent: onboard-agent
  hitl: confirm_docs_migration
  hitl_when: docs_migration_needed
  output: 迁移清单/更新后的路径
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/onboard/_orch.yaml。
- name: 文档树与归档
  id: docs
  must_read:
  - rules/packets/onboard/docs.md
  agent: onboard-agent
  output: '{workroot}/ 标准树 + {workroot}/INDEX.md + inbound/INDEX.md + docs/materials/INDEX.md + 根 CHANGELOG.md + {workroot}/work-log.md'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/onboard/_orch.yaml。
- name: 资料收取与归档
  id: materials
  must_read:
  - rules/packets/onboard/materials.md
  agent: onboard-agent
  hitl:
  - name: confirm_iteration_close
    when: iteration_close_needed
  - name: confirm_docs_migration
    when: docs_migration_needed
  output: 【入站分析】（确认后登记 / A0～A2 吸收 / 定稿发布 materials）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/onboard/_orch.yaml。
- name: 文档治理检查
  id: lifecycle
  must_read:
  - rules/packets/onboard/lifecycle.md
  agent: onboard-agent
  hitl: confirm_docs_migration
  hitl_when: docs_migration_needed
  output: 【文档治理检查】（确认后执行更新/归档/清理）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/onboard/_orch.yaml。
- name: 开发计划
  id: control
  must_read:
  - rules/packets/onboard/control.md
  agent: onboard-agent
  output: 开发计划（{workroot}/development-plan.md）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/onboard/_orch.yaml。
- name: 入库策略
  id: gitignore
  must_read:
  - rules/packets/onboard/gitignore.md
  agent: onboard-agent
  hitl: confirm_gitignore
  output: .gitignore 更新 + `git check-ignore` 证据
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/onboard/_orch.yaml。
- name: 环境与工具检查
  id: capabilities
  must_read:
  - rules/packets/onboard/capabilities.md
  agent: onboard-agent
  output: '{workroot}/capabilities/00-能力清单.md（默认静默；点名装配时另出建议）'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/onboard/_orch.yaml。
- name: 核验与打标
  id: verify
  must_read:
  - rules/packets/onboard/verify.md
  agent: onboard-agent
  output: '{workroot}/00-governance/接入核验-{yyyyMMdd}.md（①～⑨ 逐项 通过/缺口 + 证据）'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/onboard/_orch.yaml。
- name: 收尾
  id: wrap
  must_read:
  - rules/packets/onboard/wrap.md
  - rules/templates/90-handoff/closeout-skeleton.md
  agent: onboard-agent
  output: 【任务收尾】（接入明细置第 1 点，六段压缩）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/onboard/_orch.yaml。
