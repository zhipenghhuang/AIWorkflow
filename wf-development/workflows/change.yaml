# 编排：进 wf → workflows/change.md；执行 → 当前 step 步骤包；终端 → _shared/closeout.md。
# 步骤卡 §6 必开技能：整卡读取→执行→回包。禁把 skill 正文嵌进步骤卡。
# 本 YAML 只定义状态/门/产出；不用于运行时通读。
workflow:
  id: change
  name: 常规代码变更
  version: 13
  terminal: closeout
entry_points:
  常规变更: clarify
  澄清: clarify
  需求澄清: clarify
  提交: closeout
  推送: closeout
  分析PRD: analyze_input
  分析 PRD: analyze_input
  理解需求: analyze_input
  解析原型: analyze_input
  出方案: design
  方案评审: review-docs
  文档评审: review-docs
  设计文档评审: review-docs
  代码评审: review
  提测: deliver
  提测单: deliver
  发布说明: deliver
  回滚预案: deliver
trigger:
- 常规变更
- 澄清
- 分析 PRD / 迭代方案 / 需求文档 / 页面原型 / 理解需求 / 解析原型
- 出方案 / 需求澄清 / 方案评审 / 文档评审
- 代码评审
- 提测 / 提测单 / 发布说明 / 回滚预案
steps:
- name: 对齐与澄清
  id: clarify
  skills:
  - requirements-and-spec
  - product-shaping
  must_read:
  - rules/packets/change/clarify.md
  agent: implementer
  hitl:
  - name: confirm_iteration_close
    when: iteration_close_needed
  - name: confirm_docs_migration
    when: docs_migration_needed
  output: 需求理解包（有外部输入时）+ L1 开发卡（验收/SC）/ L0 轻量回执
  notes: 按 clarification + requirements-and-spec 必做；一次一问；L0 轻量回执、L2+ 进 requirements。 有 PRD/原型 → 下一步 analyze_input；交接包先 handoff.receive。禁本步
    -StartTask。 外部输入/关账见 `rules/doc-governance.md`；分级见 AGENTS。
- name: 产品资料解析与理解确认
  id: analyze_input
  skills:
  - product-doc-analysis
  - requirements-and-spec
  must_read:
  - rules/packets/change/analyze_input.md
  when: has_product_docs_or_prototypes
  agent: implementer
  hitl: confirm_understanding
  hitl_when: understanding_needs_confirm
  output: 需求理解包（{workroot}/10-requirements/理解-{主题}-{yyyyMMdd}.md；§0 Brief+Delta 必填）+ 用户版业务变化说明（L1+ 用户可见变化必出）
  notes: 只读输入；多源合看（方案/原型/接口/代码），冲突不静默选边；Brief+差量表必填；DEV-AC 进开发，QA/REL-AC 转交接。 confirm_understanding 主屏=理解包 §0（Brief+差量表）+(P/D/S)
    用户版+待确认摘要；未确认不进基线/设计/实施。 细节只认 §6 `product-doc-analysis` 整卡方法（含用户版说明、P/D/S）。
- name: 需求基线
  id: requirements
  skills:
  - requirements-and-spec
  skills_conditional:
    cross-layer-consistency: 命中权限/状态/数据基数/多表面
  must_read:
  - rules/packets/change/requirements.md
  - rules/templates/10-planning/requirement-baseline-template.md
  when: new_feature_or_scope_change_or_requested
  agent: implementer
  hitl: confirm_requirements
  hitl_when: requirements_need_confirm
  output: 需求基线（{workroot}/10-requirements/）
  notes: 以理解包为输入、引用不重写；基线每条 AC 带方案来源（文件+章节/画板），供实施按方案→分析理解→实施择优（DEV-IQ-22）；只收 DEV-AC；GAP/冲突必须继承；未签收不得进设计/排期；L2+ 若 design 因
    when 假被跳过，基线仍须经 review-docs。
- name: 方案与设计
  id: design
  skills:
  - solution-design
  - engineering-quality
  skills_conditional:
    cross-layer-consistency: 命中权限/状态/数据基数/多表面
    threat-modeling: 命中鉴权/权限/敏感数据/上传/回调/公共 API/资金/AI
    performance-and-capacity: 命中列表/批量/导出/循环查库/无界集合/统计/首屏/高并发
  must_read:
  - rules/packets/change/design.md
  - rules/templates/20-design/solution-template.md
  when: new_feature_or_architecture_or_breaking_change_or_high_risk_or_requested
  agent: implementer
  hitl: confirm_spec
  hitl_when: design_needs_spec_approval
  output: 方案/ADR（{workroot}/20-design/）
  notes: L0 可跳过；L1 本步 confirm_spec；L2+ 落盘后进 review-docs。 子域技能（api/db/frontend/threat/…）按变更面读对应技能当前节；前端补设计说明模板。
- name: 落地文档评审
  id: review-docs
  skills:
  - design-doc-review
  - engineering-quality
  must_read:
  - rules/packets/change/review-docs.md
  when: do_landing_doc_review
  agent: doc-reviewer
  hitl:
  - name: select_review_mode
    when: need_select_review_mode
  - name: confirm_spec
  output: 评审-文档-*.md 或 HUMAN_APPROVED 声明
  notes: STOP 选 A/B；未选不得 implement。本步不审 diff（代码走 review）。 方法只认 §6 `design-doc-review` 整卡方法。
- name: 任务清单
  id: plan
  skills:
  - task-breakdown
  skills_conditional:
    cross-layer-consistency: 命中权限/状态/数据基数/多表面
  must_read:
  - rules/packets/change/plan.md
  - rules/templates/30-planning-tasks/task-list-template.md
  when: multi_file_or_new_feature_or_requested
  agent: iterate-lead
  hitl: confirm_backlog
  hitl_when: backlog_approval_required
  output: 任务清单 + 冻结的验收清单（{workroot}/40-tasks/）
  notes: 只读不改代码；拆 SC 后自检 + validate_tasklist.py；写入 review_required。 IQ 词典见 `rules/core/implementation-quality.md`；L1 小批 notify，L2+
    实质变化才 approve。
- name: 实施
  id: implement
  skills:
  - implementation-and-selftest
  - engineering-quality
  skills_conditional:
    frontend-implementation: 有 UI / 有原型
    product-doc-analysis: 输入含 PRD/原型/产品文档
  must_read:
  - rules/packets/change/implement.md
  agent: implementer
  precondition: clarify 已完成；按级别适用的 10-requirements/20-design/review-docs/plan 已完成并确认；任务 SC 已抽或已标不适用；缺一停，不跳过门直接写代码
  on_fail: 回 20-design/review-docs 或 requirements；不得以「先写再补」绕过
  output: 代码/配置改动
  notes: 本步任务：按已确认基线/方案/SC 实施并自测。-StartTask → 勾选 `rules/core/iq-checklist.md` → 预检（命中须扩 SC/债项）→ 按 SC 自证（单元=一条 SC）→ 自测。无 UI
    本包前端硬门 `na`。条件技能见 §6。禁刷绿/主路径先合。子代理见 `rules/collaboration/subagents.md`。DEV-IQ-22 与预检硬门槛见本包规则卡；方法见 §6。
- name: 代码评审
  id: review
  skills:
  - code-review
  - engineering-quality
  must_read:
  - rules/packets/change/review.md
  when: review_required
  agent: reviewer-agent
  tools:
  - code-review
  - security-scan
  - design-review
  output: 评审结论/缺口 + `.gate/review.md`
  precondition: 前端变更（页面/路由/静态资源）→ `.gate/frontend/parity-matrix.md`、`route-coverage.json`、`design-qa.md` 存在且非空；L2+ → `.gate/plan-coverage.md`
    存在且后端/功能/前端行有效；非前端/低档→无。
  on_fail: 回 implement 补前端交付物/方案覆盖矩阵；不得以代码/测试/API 200 代替，不得判通过。
  notes: 核验者≠实施者；覆盖本轮 diff+AC/SC；写 .gate/review.md。有 UI 核 parity 产物。 免审须记理由；免审不免自测。方法只认 code-review。
- name: 自验与完成门
  id: verify
  skills:
  - test-design-and-execution
  must_read:
  - rules/packets/change/verify.md
  when: work_changed_or_requested
  agent: verifier-agent
  gate: completion-gate
  gate_type: machine
  output: .gate/wf-development/completion.json + 验证回执
  notes: 按 AC 追溯来源走查方案对应段（DEV-IQ-22）；合看原型/接口/现有实现；理解包接在方案后不抢入口；示例/死边界在实施择优中记偏离；Invoke-Gate 门末自动 Claim（-Claim 仅复核）；只认 ALLOWED。非
    COMPLETE 不得进 deliver/closeout。 无 QA 时开发自验报告必齐（`rules/core/lightweight.md`）；有 UI 跑 frontend_parity。
- name: 提测与发布文档
  id: deliver
  skills:
  - qa-handoff-and-release
  must_read:
  - rules/packets/change/deliver.md
  - rules/templates/40-delivery/qa-handoff-template.md
  when: has_qa_or_deploy_or_requested
  agent: implementer
  hitl: confirm_intent
  hitl_when: intent_needs_confirm
  gate: s6-admission
  gate_type: checklist
  output: 提测单/发布说明/回滚预案（{workroot}/60-release/）
  notes: 自洽提测单真源 60-release，同轮拷 handoff/outbound；未 COMPLETE 不得标可提测。 跳过本步≠跳过自验。附加 HO 包另走 handoff。
- name: 收尾与提交
  id: closeout
  skills: []
  must_read:
  - rules/packets/_shared/closeout.md
  agent: implementer
  hitl:
  - name: confirm_commit
    when: has_pending_commit
  output: 任务收尾 + 拟提交确认
  notes: 收尾与提交；共享终端；状态=done。
