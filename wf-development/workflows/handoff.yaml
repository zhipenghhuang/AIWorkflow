# 编排：只读当前 step。进 wf → packets/handoff/_chain.md；进子机 → _region-*；执行 → 步骤包。
# 步骤包 §6 必开技能：打开→执行→回包（质量不降）。禁把 skill 正文嵌进步骤包。
# 富编排笔记：packets/handoff/_orch.yaml（重建用）。禁通读本 YAML 其他 step。
workflow:
  id: handoff
  name: 协作交接
  version: 1
entry_points:
  写交接单: compose
  生成交接包: send
  接收交接包: receive
  交接状态: status
  变更通知: change_send
  同步变更: change_receive
  重规划: replan
trigger:
- 写交接单 / 生成交接包 / 接收交接包 / 交接状态
- 变更通知 / 同步变更 / 重规划
steps:
- name: 交接状态
  id: status
  must_read:
  - rules/packets/handoff/status.md
  - rules/templates/90-handoff/handoff-ledger-template.md
  agent: iterate-lead
  output: handoff-ledger.md摘要（待回执/超时/退回/阻断）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/handoff/_orch.yaml。
- name: 写交接单文档
  id: compose
  must_read:
  - rules/packets/handoff/compose.md
  agent: iterate-lead
  hitl: confirm_intent
  hitl_when: intent_needs_confirm
  output: 自洽交接单文档（默认非 HO；落 outbound/{category}/）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/handoff/_orch.yaml。
- name: 生成交接包
  id: send
  must_read:
  - rules/packets/handoff/send.md
  agent: iterate-lead
  hitl: confirm_handoff
  hitl_when: handoff_send_required
  output: '{workroot}/handoff/outbound/{category}/{HO-ID}/ + 【交接包已生成】'
  verify: python wf-development/rules/tools/validate_handoff.py "{workroot}/handoff/outbound/{category}/{HO-ID}"
  on_fail: 缺 00/01/快照/占位符/链接断 → 不发送；补后重跑校验
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/handoff/_orch.yaml。
- name: 接收与签收
  id: receive
  must_read:
  - rules/packets/handoff/receive.md
  agent: iterate-lead
  hitl:
  - name: confirm_change
    when: handoff_change_substantive
  - name: confirm_plan
    when: plan_needs_confirm
  output: 入站分析/吸收 + 接收回执（按需）+ 开发计划/文档更新 + 台账状态
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/handoff/_orch.yaml。
- name: 发送变更通知
  id: change_send
  must_read:
  - rules/packets/handoff/change_send.md
  agent: iterate-lead
  hitl:
  - name: confirm_change
    when: handoff_change_substantive
  - name: confirm_handoff
    when: handoff_send_required
  output: '{workroot}/handoff/outbound/变更/{CHG-HO-ID}/ + 更新后的受影响文档'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/handoff/_orch.yaml。
- name: 接收变更并适配
  id: change_receive
  must_read:
  - rules/packets/handoff/change_receive.md
  agent: iterate-lead
  hitl:
  - name: confirm_change
    when: handoff_change_substantive
  - name: confirm_plan
    when: plan_needs_confirm
  output: 变更影响分析 + 开发计划/文档调整 + 回执
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/handoff/_orch.yaml。
- name: 重规划
  id: replan
  must_read:
  - rules/packets/handoff/replan.md
  agent: iterate-lead
  hitl: confirm_plan
  hitl_when: plan_needs_confirm
  output: 更新后的开发计划 + 重规划记录
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/handoff/_orch.yaml。
- name: 收尾
  id: wrap
  must_read:
  - rules/packets/handoff/wrap.md
  - rules/templates/90-handoff/closeout-skeleton.md
  agent: iterate-lead
  output: 【任务收尾】（handoff/回执/变更置第 1 点）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/handoff/_orch.yaml。
- name: 拟提交
  id: commit
  must_read:
  - rules/packets/handoff/commit.md
  agent: implementer
  hitl: confirm_commit
  hitl_when: has_pending_commit
  output: 拟提交确认结果
  tools:
  - git
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/handoff/_orch.yaml。
