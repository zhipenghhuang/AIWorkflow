# 编排：只读当前 step。进 wf → packets/defect-fix/_chain.md；进子机 → _region-*；执行 → 步骤包。
# 步骤包 §6 必开技能：打开→执行→回包（质量不降）。禁把 skill 正文嵌进步骤包。
# 富编排笔记：packets/defect-fix/_orch.yaml（重建用）。禁通读本 YAML 其他 step。
workflow:
  id: defect-fix
  name: 缺陷修复协作
  version: 11
entry_points:
  缺陷修复: preflight
  指派给我: preflight
  我的待修: preflight
  修复#: preflight
  '#数字': preflight
  拉取产品回复: product_decision
  产品回复: product_decision
  产品退回: product_decision
  继续缺陷: product_decision
trigger:
- 缺陷修复
- 指派给我
- 我的待修
- 修复#
- '#数字'
- 落地…#编号…优化方案
- 拉取产品回复 / 产品回复 / 产品退回 / 继续缺陷
steps:
- name: 平台可用性
  id: preflight
  must_read:
  - rules/packets/defect-fix/preflight.md
  agent: defect-fixer
  next: pull
  output: 平台可用性/鉴权结果 + 降级路由（route/reason/next_action）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect-fix/_orch.yaml。
- name: 拉取与归组
  id: pull
  must_read:
  - rules/packets/defect-fix/pull.md
  agent: defect-fixer
  tools:
  - defect-platform
  output: 清单摘要/分组
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect-fix/_orch.yaml。
- name: 分类与处置
  id: triage
  must_read:
  - rules/packets/defect-fix/triage.md
  agent: defect-fixer
  output: 分类结论（中文结论/依据/下一步）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect-fix/_orch.yaml。
- name: 产品缺陷评估
  id: assess_product
  must_read:
  - rules/packets/defect-fix/assess_product.md
  when: product_defect
  agent: defect-fixer
  output: 产品缺陷评估单（模板 rules/templates/20-design/product-defect-assessment-template.md）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect-fix/_orch.yaml。
- name: 评估单提交产品
  id: handoff_product
  must_read:
  - rules/packets/defect-fix/handoff_product.md
  - rules/templates/40-delivery/defect-writeup-template.md
  when: product_defect
  agent: defect-fixer
  tools:
  - defect-platform
  hitl: confirm_remark
  output: 平台回写结果（备注+附件+指派产品）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect-fix/_orch.yaml。
- name: 等待产品处置
  id: await_product
  must_read:
  - rules/packets/defect-fix/await_product.md
  when: product_defect
  agent: defect-fixer
  output: 等待回执（AWAIT_PRODUCT）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect-fix/_orch.yaml。
- name: 产品处置读取
  id: product_decision
  must_read:
  - rules/packets/defect-fix/product_decision.md
  when: product_decision_received
  agent: defect-fixer
  tools:
  - defect-platform
  output: 产品结论/附件/对齐清单
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect-fix/_orch.yaml。
- name: 文档对齐
  id: align
  must_read:
  - rules/packets/defect-fix/align.md
  when: product_decision_requires_alignment
  agent: defect-fixer
  output: 对齐记录（受影响文档/计划清单）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect-fix/_orch.yaml。
- name: 红证与修复
  id: fix
  must_read:
  - rules/packets/defect-fix/fix.md
  - rules/templates/20-design/solution-template.md
  when: implementation_required
  agent: defect-fixer
  output: 修复/方案/验证结果
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect-fix/_orch.yaml。
- name: 澄清/非缺陷回写
  id: clarify
  must_read:
  - rules/packets/defect-fix/clarify.md
  - rules/templates/40-delivery/defect-writeup-template.md
  when: need_clarification
  agent: defect-fixer
  tools:
  - defect-platform
  hitl: confirm_remark
  output: 回写结果（【无法确认·待澄清】/重复/设计如此/非defects/外部/已在其它构建修复）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect-fix/_orch.yaml。
- name: 门禁
  id: gates
  must_read:
  - rules/packets/defect-fix/gates.md
  output: .gate/wf-development/completion.json + 门禁摘要
  when: has_code_change
  agent: verifier-agent
  gate: completion-gate
  gate_type: machine
  precondition: 缺陷修复卡/任务清单含本轮 AC 验收表（L1+）；无则先补
  on_fail: 停止本批；不得进入 menu/close，先修复、补证据或报阻塞
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect-fix/_orch.yaml。
- name: 总结菜单
  id: menu
  must_read:
  - rules/packets/defect-fix/menu.md
  when: implementation_required
  agent: defect-fixer
  precondition: gates 已 COMPLETE，或本批无代码/配置改动
  on_fail: 门禁未过先回 gates/fix；不得输出提交/回写菜单
  hitl: select_menu
  output: 【缺陷修复处理总结】+【用户选择菜单】
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect-fix/_orch.yaml。
- name: 提交推送部署回写
  id: close
  must_read:
  - rules/packets/defect-fix/close.md
  - rules/templates/40-delivery/release-notes-template.md
  - rules/templates/40-delivery/go-live-checklist-template.md
  when: implementation_required
  agent: defect-fixer
  precondition: gates 已 COMPLETE，或本批无代码/配置改动
  on_fail: 门禁未过先回 gates/fix；不得提交/部署/回写
  tools:
  - git
  - defect-platform
  hitl:
  - name: confirm_commit
    when: menu_includes_commit
  - name: confirm_deploy
    when: menu_includes_deploy
  - name: confirm_remark
    when: menu_includes_writeback
  output: 提交/部署/回写结果
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect-fix/_orch.yaml。
- name: 发布后验证
  id: postrelease
  must_read:
  - rules/packets/defect-fix/postrelease.md
  when: has_deployed
  agent: defect-fixer
  output: 发布后verify/发布记录
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect-fix/_orch.yaml。
- name: 复盘
  id: retro
  must_read:
  - rules/packets/defect-fix/retro.md
  - rules/templates/60-retro/retro-template.md
  when: recurring_defect_or_incident
  agent: defect-fixer
  output: 复盘（{workroot}/80-retrospectives/）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect-fix/_orch.yaml。
- name: 收尾
  id: wrap
  must_read:
  - rules/packets/defect-fix/wrap.md
  - rules/templates/90-handoff/closeout-skeleton.md
  when: not_awaiting_product
  agent: defect-fixer
  output: 【任务收尾】（缺陷修复总结置第 1 点）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect-fix/_orch.yaml。
