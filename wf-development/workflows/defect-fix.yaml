# 编排：进 wf → workflows/defect-fix.md；执行 → 当前 step 步骤包；终端 → _shared/closeout.md。
# 步骤卡 §6 必开技能：整卡读取→执行→回包。禁把 skill 正文嵌进步骤卡。
# 本 YAML 只定义状态/门/产出；不用于运行时通读。
workflow:
  id: defect-fix
  name: 缺陷修复协作
  version: 12
  terminal: closeout
entry_points:
  缺陷修复: preflight
  指派给我: preflight
  我的待修: preflight
  修复#: preflight
  '#数字': preflight
  拉取产品回复: product_decision
  产品回复: product_decision
  产品退回: product_decision
  继续缺陷: product_decision
trigger:
- 缺陷修复
- 指派给我
- 我的待修
- 修复#
- '#数字'
- 落地…#编号…优化方案
- 拉取产品回复 / 产品回复 / 产品退回 / 继续缺陷
steps:
- name: 平台可用性
  id: preflight
  skills: []
  must_read:
  - rules/packets/defect-fix/preflight.md
  agent: defect-fixer
  next: pull
  output: 平台可用性/鉴权结果 + 降级路由（route/reason/next_action）
  notes: '读项目档案 provider。若为「无」或未配置： route=workflow:change | reason=no_defect_platform | next_action=按现象走常规变更；终止本 workflow（不执行
    next: pull）； 禁止向用户索要编号、禁止空转拉平台。 **勿在本步 `-StartTask`**；有代码修复时在 `fix` 动手前冻结任务窗口。 **开工门（硬）**：进入本 workflow 先按 `confirm_task_intent`
    输出【需求与意图理解】（目标/范围/验收/不做/假设/风险）并等确认；未确认不得进入 pull、不得改测试或业务代码；批量入口（指派给我/我的待修）不豁免。确认后 pull 首条回执须含【清单摘要】，triage 须先出【分类表】再进
    fix。'
- name: 拉取与归组
  id: pull
  skills: []
  must_read:
  - rules/packets/defect-fix/pull.md
  agent: defect-fixer
  tools:
  - defect-platform
  output: 清单摘要/分组
  notes: 首条回执含 mode=（缺陷批加严，见 subagents）。拉取后读全单：提交信息（标题/steps/数据/环境/附件）＋历史备注/讨论＋产品评估/回复附件； **批量侦察**（子代理编排 ）：≥5 单且读单成本高（多备注/附件/评估单）或合计
    ≥20k token → 逐单只读扇出（一单/小批一子代理），返回「分类候选/证据缺口/查重键/产品评估要点」≤30 行；达阈值未扇出→deviation=subagent_skipped:<理由>；编排集中读回执并读关键单原文；不可用→deviation=subagent_skipped:unavailable，仍进
    triage 出分类表。 同号重复修复预检；归组后进入 triage（未 triage 禁改码）。 历史预检跳过项：产品缺陷待产品确认 → 跳过标注「待产品」；已修复未再激活 → 跳过标注「已处理」； 无法确认被激活 → 重新分类处置；产品已回复/已退回
    → 直接进 product_decision。
- name: 分类与处置
  id: triage
  skills: []
  skills_conditional:
    cross-layer-consistency: 命中权限/状态/数据基数/多表面
  must_read:
  - rules/packets/defect-fix/triage.md
  agent: defect-fixer
  output: 分类结论（中文结论/依据/下一步）
  notes: '**§4.0 门禁**：本步必产出【分类表】（≥2 单逐行：单号|处置|依据一句|下一步）；未出表禁进 fix/禁改业务代码；禁「多为实现缺陷」代替逐单。子代理不可用→mode=直做|单写手 + deviation=…，仍须出表。
    按 rules/defects/fix-collaboration.md 分类： 实现缺陷→implementation_required；产品缺陷/需求缺口/设计口径不明→product_defect； 信息不足/无法复现/环境数据不一致/预期不明/重复/设计如此/非defects/外部/已在其它构建修复→need_clarification；
    延期/不修复须产品/项目确认，不得开发单方关闭。 产品缺陷不得先写完整技术方案，只写评估单；口径存疑但实现路径清晰 → 出评审版修复方案（solution-template 裁剪，落 20-design/BUG优化修复方案/），评估单与评审版方案二选一，不重复出。
    混批含产品缺陷+实现缺陷：两轨并行——实现项照常 fix（可先提交），产品项出评估单/评审版方案并 AWAIT_PRODUCT；仅当实现项依赖产品结论时该实现项等待，不整批阻塞。 pull 已标「待产品」→ 直接输出 AWAIT_PRODUCT，不重新评估/不重复
    handoff。 分类结论须引用原单 steps/数据/环境/设计依据，禁只看标题；批量时以侦察回执为输入，**分类/五选一/处置集中**，不采信子代理终态。 拟标 product_defect 前须完成实现核对（相关代码路径与/或接口行为），只凭页面观感不得判产品缺陷。
    测试无设计文档默认实现缺陷属正确；开发改判需求缺口须写明并交产品终审，不与测试争默认。 不挡主路径且无合规/资金/数据风险的体验类 → 不硬推 product_defect；点名要改走产品 change/需求池。 每条实现缺陷同时记「根因层（需求/设计/数据模型/实现/测试/契约/文档）+
    同类路径候选（同模型写入口/同谓词消费方/同权限端点/同状态表面）+ 规则缺口」；按 `skills/cross-layer-consistency/SKILL.md` 取矩阵，不只修表面现象。 内部处置码只用于路由，不写进平台备注。'
- name: 产品缺陷评估
  id: assess_product
  skills: []
  must_read:
  - rules/packets/defect-fix/assess_product.md
  - rules/templates/20-design/product-defect-assessment-template.md
  when: product_defect
  agent: defect-fixer
  output: 产品缺陷评估单（模板 rules/templates/20-design/product-defect-assessment-template.md）
  notes: 按 rules/defects/fix-collaboration.md： 写评估单前必做实现核对（代码路径与/或接口契约·响应），结论写入评估单「实现核对」；未核对不得出单。 写 缺陷评估-{BUG-ID}-{主题}-{yyyyMMdd}.md，落
    {workroot}/00-governance/缺陷评估； 只客观写实现核对摘要/判定依据/问题影响/方案选项 A/B/C/推荐/影响面/待产品确认； 不写可编码实现细节、不拆开发任务、不排开发排期；不写期望回复/时限威胁/超期升级/评估单版本过程史；不得与正常迭代方案
    方案-{主题}-… 混用。 口径存疑但实现路径清晰时，改出评审版修复方案（fix-collaboration §5.1 档位，落 20-design/BUG优化修复方案/），与评估单二选一、不重复出。 没有相符证明且不属于需求缺口变体
    → 不判产品缺陷：按实现缺陷或 need_clarification 处理。 无平台/export/文档输入 → 评估单经 change/handoff 交付，口径与平台备注同源。
- name: 评估单提交产品
  id: handoff_product
  skills: []
  must_read:
  - rules/packets/defect-fix/handoff_product.md
  - rules/templates/40-delivery/defect-writeup-template.md
  when: product_defect
  agent: defect-fixer
  tools:
  - defect-platform
  hitl: confirm_remark
  output: 平台回写结果（备注+附件+指派产品）
  notes: 按 rules/templates/40-delivery/defect-writeup-template.md 出备注全文；上传评估单附件并回查挂载； **双通道**：本步已交/回写平台（评估附件+指派产品）→ **不**再强制
    `BUG` 整包。无平台/点名「缺陷交接包」→ **先问后发**，确认后 `handoff.send` 自包含评估详单。未回执不得写“产品已接收”。 指派产品经理；状态按档案映射置「待产品确认/待评审」；resolution 不填。 确认前展示备注全文+附件名+状态/指派变更；备注与状态同轮。
    提交后停，不进入 fix；输出 AWAIT_PRODUCT。
- name: 等待产品处置
  id: await_product
  skills: []
  must_read:
  - rules/packets/defect-fix/await_product.md
  when: product_defect
  agent: defect-fixer
  output: 等待回执（AWAIT_PRODUCT）
  notes: STOP：本步输出后结束，不执行 closeout/后续 step；不改代码、不提交、不部署、不按自己的评估方案实施。 输出【缺陷修复处理总结】的待产品部分（评估单/附件/待决定项）+ 一行 AWAIT_PRODUCT； 同批实现项按
    fix-collaboration §4.1 并行处理（不受本单等待阻塞），澄清项照常回写；不输出提交菜单中未实施的项。 下次用户说「拉取产品回复/产品回复/产品退回/继续缺陷」→ 从 product_decision 进入。
- name: 产品处置读取
  id: product_decision
  skills: []
  must_read:
  - rules/packets/defect-fix/product_decision.md
  when: product_decision_received
  agent: defect-fixer
  tools:
  - defect-platform
  output: 产品结论/附件/对齐清单
  notes: 入口直达（拉取产品回复/产品回复/产品退回/继续缺陷）视为本步条件成立； 未读产品回复/附件前不得进 fix；平台仍无产品回复/仍指派产品 → 输出 AWAIT_PRODUCT，不重复 handoff。 按 rules/defects/fix-collaboration.md
    读全单：状态/解决码/指派人/全部备注/附件/新产品文档/关联需求。 归类：认可方案/修改后认可/判定实现缺陷/判定非问题/要求补充信息。 仅“回派”无备注/附件说明 → 视为未确认，输出 AWAIT_PRODUCT 请产品补结论。 认可或修改后认可或改判实现
    → implementation_required + product_decision_requires_alignment； 要求补充/非问题 → need_clarification； 非问题按产品要求退回测试/关闭，不自行改代码。
    读不全（solutionChannel=manual）→ 请用户补关键附件/备注，禁只看标题或只读一句备注。
- name: 文档对齐
  id: align
  skills: []
  must_read:
  - rules/packets/defect-fix/align.md
  when: product_decision_requires_alignment
  agent: defect-fixer
  output: 对齐记录（受影响文档/计划清单）
  notes: 仅产品回复且需实施（认可/修改后认可/改判实现）时执行；非问题/补充信息跳过，转 clarify。 按 rules/defects/fix-collaboration.md： ≥3 份新产品文档 → 只读抽取扇出（每份返回变更点/AC/影响面候选
    ≤30 行）；对齐结论由本步集中写，不并行改同一文档。 产品新文档按 `rules/doc-governance.md` （T6）：确认后原件落 `inbound/{ver|topic}/`，登记索引；S1/S2/S3 同批进 `inbound/_archive/`；结论同步工作区。
    构成需求/范围/AC/接口/数据实质变更 → 按 workflows/intake.yaml 与 rules/workflow.md 做影响分析/CR； 逐项对照评估单/原方案，列一致/差异/新增/删除； 更新 {workroot}/10-requirements/需求台账、{workroot}/20-design/方案-…/ADR/接口/DB、{workroot}/40-tasks/任务清单、
    {workroot}/50-verification/UAT、{workroot}/60-release/提测单/发布说明/回滚、开发计划、 项目档案（新入口/命令/规范变化）、{workroot}/00-governance/变更记录（CR）、`{workroot}/INDEX.md`、`activeContext`；
    不适用写原因；未对齐不得 fix。
- name: 红证与修复
  id: fix
  skills:
  - debugging-and-error-recovery
  - implementation-and-selftest
  skills_conditional:
    cross-layer-consistency: 命中权限/状态/数据基数/多表面
  must_read:
  - rules/packets/defect-fix/fix.md
  - rules/templates/20-design/solution-template.md
  when: implementation_required
  agent: defect-fixer
  output: 修复/方案/验证结果
  notes: '**前置**：本批 triage【分类表】已输出；未出表禁改业务代码（fix-collaboration §4.0）。仅修表中「实现缺陷」行；待产品行不扩写。开跑声明 mode=（同文件集→单写手）。 修前红证；无根因不修；复现与写回按原单口径对齐、引用原单信息（红绿/换路径/回归细则见
    fix-collaboration §4.5 与 §6 `debugging-and-error-recovery`）。 **先写缺陷修复卡**（原单口径/SC 差集/同类路径/红证/验证站证据），再改代码；矩阵与判定只认 `implementation-quality.md`，不另造表。
    L1+ 验收表用 `verify/templates/acceptance.yaml`（task_id: BUG-<id>）或任务清单 AC 表；须含原单复现/红证与回归/同类路径。 **动手前**：先 `verify/Invoke-Gate.ps1
    -StartTask -TaskId "BUG-<id>" -ProjectRoot "."`（冻结 `base_commit`；截图须晚于 `started_at`/验收清单）→ 来源完整性检查=0 缺漏（DEV-IQ-16，含相关方案/原型/接口/同类路径）→
    短【实施预检】（DEV-IQ-09；**命中须先扩 SC/债项**）；命中重要面同批硬补（DEV-IQ-10）；勾选 `iq-checklist.md`；单元=一条 SC；方法 `skills/implementation-and-selftest/SKILL.md`。
    按 `skills/cross-layer-consistency/SKILL.md` 做同类路径扫描：同模型其他写入口、同谓词其他消费方、同权限端点/菜单、同状态其他表面；逐条判「同defects/已正确/不适用」，原单+同类路径各补一条回归；记录根因层/规则缺口。
    **DEV-IQ-08**：同根因族 ≥2 → 除回归外须拟改 rules/skills/检查项缺口（先拟改+原因+影响，用户确认后改母版或项目适配）；禁止只关单号。 实现缺陷→按缺陷修复协作修；产品已认可/修改后认可→按新产品文档/评估单实施；产品改判实现缺陷→按产品说明修，备注引用产品结论。
    复杂实施再按 `rules/templates/20-design/solution-template.md` 展开，文件名 `方案-BUG-{id}-{主题}-{yyyyMMdd}.md`；简单修复不强制完整方案，但须更新受影响文档/任务清单。
    L1+ UI 命中前端硬门 A 级、L2+ / 高风险/大改/破坏性：核验者≠实施者（派 `reviewer-agent` 独立核验或走 `code-review` 技能；只给原单＋diff＋红绿命令；核验不替代门禁），并写 `.gate/review.md`
    供完成门核对。 **修复分片**（子代理编排）：≥3 单且文件不重叠 → 一组一子代理（worker-agent；文件不相交可并行≤3；同文件/同根因合并组；「同为实现缺陷」alone 不够）；达阈值未分片→deviation=subagent_skipped:<理由>；不达阈值直做；子代理禁
    commit/push/改平台，返回 ≤30 行可直填备注的事实素材（`rules/defects/fix-collaboration.md`）。'
- name: 澄清/非缺陷回写
  id: clarify
  skills: []
  must_read:
  - rules/packets/defect-fix/clarify.md
  - rules/templates/40-delivery/defect-writeup-template.md
  when: need_clarification
  agent: defect-fixer
  tools:
  - defect-platform
  hitl: confirm_remark
  output: 回写结果（【无法确认·待澄清】/重复/设计如此/非defects/外部/已在其它构建修复）
  notes: 按 rules/templates/40-delivery/defect-writeup-template.md /： 先按原单口径复现；一次列清缺什么/谁补/截止；给条件式下一步，避免来回踢皮球。 平台备注用中文结论，禁英文处置码、类名、命令、仓库路径；本条是给测试看的。
    重复→duplicateBug=主单；设计如此→引用设计原文；外部→给外部证据； 延期/不修复须产品/项目确认，不得开发单方关闭。 不改代码；备注与状态同轮；确认前展示全文。
- name: 门禁
  id: gates
  skills: []
  must_read:
  - rules/packets/defect-fix/gates.md
  output: .gate/wf-development/completion.json + 门禁摘要
  when: has_code_change
  agent: verifier-agent
  gate: completion-gate
  gate_type: machine
  precondition: 缺陷修复卡/任务清单含本轮 AC 验收表（L1+）；无则先补
  on_fail: 停止本批；不得进入 menu/close，先修复、补证据或报阻塞
  notes: 本批无代码/配置改动 → 跳过。有改动默认跑定向 completion（profile `*_scoped` + 受影响前端证据）；升全量条件见 verification §7。L1+ 无验收表先补；`task_id=BUG-*`
    须含原单红证与回归/同类路径。用户明示跳过 Claim → 本步可记 `deviation=skip_claim` 并以本地验证摘要代替 COMPLETE（禁再开全量空转）。日志分诊：原始日志落盘；仅多文件语义归因才派子代理（≤30 行）。
- name: 总结菜单
  id: menu
  skills: []
  must_read:
  - rules/packets/defect-fix/menu.md
  when: implementation_required
  agent: defect-fixer
  precondition: gates 已 COMPLETE，或 skip_claim 且本地验证摘要已落，或本批无代码/配置改动
  on_fail: 门禁未过且未获 skip_claim → 先回 gates/fix；不得输出提交/回写菜单
  hitl: select_menu
  output: 【缺陷修复处理总结】+【用户选择菜单】
  notes: 预授权（一次性/直接跑完）：声明默认界并直接执行（见 AGENTS）；默认只到本步（修复＋门禁或 skip_claim 验证摘要＋总结菜单）；禁静默连跑提交/推送/部署/回写。总结与菜单同轮。产品缺陷项列评估单/产品结论/对齐状态。
- name: 提交推送部署回写
  id: close
  skills: []
  must_read:
  - rules/packets/defect-fix/close.md
  when: implementation_required
  agent: defect-fixer
  precondition: gates 已 COMPLETE，或 skip_claim 且本地验证摘要已落，或本批无代码/配置改动
  on_fail: 门禁未过且未获 skip_claim → 先回 gates/fix；不得提交/部署/回写
  tools:
  - git
  - defect-platform
  hitl:
  - name: confirm_commit
    when: menu_includes_commit
  - name: confirm_deploy
    when: menu_includes_deploy
  - name: confirm_remark
    when: menu_includes_writeback
  output: 提交/部署/回写结果
  notes: 按菜单精确执行；hitl 只认本步列表。回写就绪见 fix-collaboration §4.5（含自部署/skip_claim）。含部署须发布说明+回滚+confirm_deploy。未验证不得 resolved；产品缺陷回写按
    §5.3/§6.2/§6.3。不强制 FIX 整包。
- name: 发布后验证
  id: postrelease
  skills: []
  must_read:
  - rules/packets/defect-fix/postrelease.md
  when: has_deployed
  agent: defect-fixer
  output: 发布后verify/发布记录
  notes: 条件步：本轮含部署才走。按发布说明跑主链路冒烟与关键回归；观察日志/指标/告警。 触发回滚条件 → 按发布说明回滚，不恋战；更新 {workroot}/60-release/发布记录-{版本}.md、发布说明、`{workroot}/INDEX.md`、`activeContext`。
    失败/回滚不重复回写已回写项；需要时转 retro。
- name: 复盘
  id: retro
  skills:
  - retrospective-and-improvement
  must_read:
  - rules/packets/defect-fix/retro.md
  - rules/templates/60-retro/retro-template.md
  when: recurring_defect_or_incident
  agent: defect-fixer
  output: 复盘（{workroot}/80-retrospectives/）
  notes: 条件步：重复defects/事故/回滚才走；技能 skills/retrospective-and-improvement/SKILL.md，模板 rules/templates/60-retro/retro-template.md。
    行动项必须有负责人/截止/验收；进任务清单或 {workroot}/80-retrospectives/改进项.md。
- name: 收尾与提交
  id: closeout
  skills: []
  must_read:
  - rules/packets/_shared/closeout.md
  agent: defect-fixer
  hitl:
  - name: confirm_commit
    when: has_pending_commit
  output: 任务收尾 + 拟提交确认
  notes: 收尾与提交；共享终端；状态=done。
