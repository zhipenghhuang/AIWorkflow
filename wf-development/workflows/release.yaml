# 编排：只读当前 step。进 wf → packets/release/_chain.md；进子机 → _region-*；执行 → 步骤包。
# 步骤包 §6 必开技能：打开→执行→回包（质量不降）。禁把 skill 正文嵌进步骤包。
# 富编排笔记：packets/release/_orch.yaml（重建用）。禁通读本 YAML 其他 step。
workflow:
  id: release
  name: 发布与上线
  version: 3
entry_points:
  发布: readiness
  上线: readiness
  发版: readiness
  生产部署: readiness
  正式部署: readiness
  回滚: rollback
trigger:
- 发布 / 上线 / 发版
- 生产部署 / 正式部署
- 回滚
- 发布后验证
steps:
- name: 发布就绪检查
  id: readiness
  must_read:
  - rules/packets/release/readiness.md
  - rules/templates/40-delivery/go-live-checklist-template.md
  agent: delivery-lead
  gate: release-readiness
  gate_type: checklist
  output: 上线检查单（{workroot}/60-release/）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/release/_orch.yaml。
- name: 业务验收
  id: acceptance
  must_read:
  - rules/packets/release/acceptance.md
  - rules/templates/40-delivery/uat-acceptance-template.md
  when: has_uat
  agent: delivery-lead
  hitl: confirm_acceptance
  output: UAT/验收记录（{workroot}/50-verification/）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/release/_orch.yaml。
- name: 工程部署审批
  id: approval
  must_read:
  - rules/packets/release/approval.md
  when: release_ready_and_acceptance_passed
  agent: delivery-lead
  hitl: confirm_deploy
  output: 工程部署审批记录
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/release/_orch.yaml。
- name: 部署
  id: deploy
  must_read:
  - rules/packets/release/deploy.md
  when: release_approved
  agent: delivery-lead
  on_fail: 停止发布，按回滚预案处理；不得隐瞒失败或继续观察
  tools:
  - git
  - ci
  - release-automation
  output: 部署记录
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/release/_orch.yaml。
- name: 发布验证
  id: verify
  must_read:
  - rules/packets/release/verify.md
  when: has_deployed
  agent: delivery-lead
  on_fail: 触发回滚/事故流程；未验证不得称发布成功
  tools:
  - browser-mcp
  output: 发布验证结果/发布记录
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/release/_orch.yaml。
- name: 回滚
  id: rollback
  must_read:
  - rules/packets/release/rollback.md
  when: release_failed_or_direct_rollback
  agent: delivery-lead
  on_fail: 升级事故处理；不重复无效操作，不掩盖数据/业务影响
  hitl: confirm_rollback
  tools:
  - git
  - ci
  output: 回滚记录
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/release/_orch.yaml。
- name: 发布后观察
  id: postrelease
  must_read:
  - rules/packets/release/postrelease.md
  when: has_deployed
  agent: delivery-lead
  output: 发布后verify/观察记录
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/release/_orch.yaml。
- name: 发布记录
  id: record
  must_read:
  - rules/packets/release/record.md
  when: has_deployed
  agent: delivery-lead
  output: 发布汇报/发布记录（{workroot}/60-release/）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/release/_orch.yaml。
- name: 发布复盘
  id: retro
  must_read:
  - rules/packets/release/retro.md
  - rules/templates/60-retro/retro-template.md
  when: incident_or_major_release
  agent: delivery-lead
  output: 复盘（{workroot}/80-retrospectives/）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/release/_orch.yaml。
- name: 收尾
  id: wrap
  must_read:
  - rules/packets/release/wrap.md
  - rules/templates/90-handoff/closeout-skeleton.md
  agent: delivery-lead
  output: 【任务收尾】（发布/verify/回滚/复盘明细置第 1 点）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/release/_orch.yaml。
- name: 拟提交
  id: commit
  must_read:
  - rules/packets/release/commit.md
  agent: delivery-lead
  hitl: confirm_commit
  hitl_when: has_pending_commit
  tools:
  - git
  output: 拟提交确认结果
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/release/_orch.yaml。
