workflow:
  id: retro
  name: 复盘与改进
  version: 2
entry_points:
  复盘: gather
  事故复盘: gather
  迭代复盘: gather
  版本复盘: gather
trigger:
- 复盘 / 事故复盘 / 迭代复盘 / 版本复盘
- 发布回滚后复盘
steps:
- name: 收集事实
  id: gather
  must_read:
  - rules/packets/retro/gather.md
  agent: delivery-lead
  output: 时间线/影响/证据/指标
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/retro/_orch.yaml。
- name: 根因分析
  id: analyze
  must_read:
  - rules/packets/retro/analyze.md
  agent: delivery-lead
  output: 直接原因/根本原因/贡献因素
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/retro/_orch.yaml。
- name: 行动项
  id: actions
  must_read:
  - rules/packets/retro/actions.md
  agent: delivery-lead
  hitl: confirm_actions
  output: 行动项（负责人/截止/验收）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/retro/_orch.yaml。
- name: 落盘与索引
  id: record
  must_read:
  - rules/packets/retro/record.md
  agent: delivery-lead
  output: 复盘文档（{workroot}/80-retrospectives/）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/retro/_orch.yaml。
- name: 收尾
  id: wrap
  must_read:
  - rules/packets/retro/wrap.md
  - rules/templates/90-handoff/closeout-skeleton.md
  agent: delivery-lead
  output: 【任务收尾】（复盘结论/行动项置第 1 点）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/retro/_orch.yaml。
- name: 拟提交
  id: commit
  must_read:
  - rules/packets/retro/commit.md
  output: 拟提交确认结果
  agent: delivery-lead
  hitl: confirm_commit
  hitl_when: has_pending_commit
  tools:
  - git
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/retro/_orch.yaml。
