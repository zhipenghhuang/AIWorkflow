# 编排：只读当前 step。进 wf → packets/intake/_chain.md；进子机 → _region-*；执行 → 步骤包。
# 步骤包 §6 必开技能：打开→执行→回包（质量不降）。禁把 skill 正文嵌进步骤包。
# 富编排笔记：packets/intake/_orch.yaml（重建用）。禁通读本 YAML 其他 step。
workflow:
  id: intake
  name: 变更吸收
  version: 6
entry_points:
  新文档: scan
  新变化: scan
  确认项: scan
  收件箱: scan
  变更吸收: scan
trigger:
- 新文档 / 收件箱 / 吸收这份文档
- 新变化 / 需求变化 / 方案变化 / 范围变化
- 确认项 / 这个定了 / 按 B 方案
- 变更吸收
steps:
- name: 扫描新输入
  id: scan
  must_read:
  - rules/packets/intake/scan.md
  agent: iterate-lead
  output: 新输入候选清单
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/intake/_orch.yaml。
- name: 分类与登记
  id: classify
  must_read:
  - rules/packets/intake/classify.md
  agent: iterate-lead
  output: DOC/CR/OPEN/DEC 登记
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/intake/_orch.yaml。
- name: 解析与理解
  id: parse
  must_read:
  - rules/packets/intake/parse.md
  agent: iterate-lead
  hitl: confirm_understanding
  hitl_when: understanding_needs_confirm
  output: 资料理解摘要（Brief+本期差量 + 来源/目标/范围/F-R-AC/冲突/GAP/置信度）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/intake/_orch.yaml。
- name: 影响分析
  id: impact
  must_read:
  - rules/packets/intake/impact.md
  agent: iterate-lead
  hitl:
  - name: confirm_change
    when: change_is_substantive
  - name: confirm_requirements
    when: requirements_need_confirm
  - name: confirm_replan
    when: c2_or_c3
  output: 影响矩阵/待确认项 + C2/C3 重基线清单
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/intake/_orch.yaml。
- name: 局部更新
  id: absorb
  must_read:
  - rules/packets/intake/absorb.md
  agent: iterate-lead
  hitl:
  - name: confirm_iteration_close
    when: iteration_close_needed
  - name: confirm_docs_migration
    when: docs_migration_needed
  output: 已更新文档/台账/任务 · 【迭代关账/归档候选】（如有）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/intake/_orch.yaml。
- name: 吸收报告
  id: report
  must_read:
  - rules/packets/intake/report.md
  agent: iterate-lead
  output: 【变更吸收报告】
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/intake/_orch.yaml。
- name: 收尾
  id: wrap
  must_read:
  - rules/packets/intake/wrap.md
  - rules/templates/90-handoff/closeout-skeleton.md
  agent: iterate-lead
  output: 【任务收尾】（变更吸收报告置第 1 点）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/intake/_orch.yaml。
- name: 拟提交
  id: commit
  must_read:
  - rules/packets/intake/commit.md
  output: 拟提交确认结果
  agent: iterate-lead
  hitl: confirm_commit
  hitl_when: has_pending_commit
  tools:
  - git
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/intake/_orch.yaml。
