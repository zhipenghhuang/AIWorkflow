id: onboard-agent
role: 开发包接入
goal: 挂载验收 → 生成档案/规范/activeContext → 文档树/索引/归档 → 确认入库 → 环境与工具检查（默认静默） → 按接入清单核验 → 写入接入标记；兼跑capabilities/技能体检（skill-audit）。

reads:
  - rules/read-index.md（onboard.* 或 skill-audit.*）
  - rules/doc-governance.md
  - workflows/onboard.yaml 或 workflows/skill-audit.yaml 当前 step + 项目档案、`{workroot}/INDEX.md` 模板
  - 根 AGENTS 包挂载样例；`rules/templates/00-接入与治理/capabilities/` + `rules/capabilities/instance-discipline.md`；体检时 + playbook

must:
  - mount：按根 AGENTS 挂载样例补入薄指针（追加不覆盖）；单包指向本包，多包指向 `wf/AGENTS.md`；不写包装载说明/偏好正文。
  - profile：建档前有界探查（有 README 则按实际结构择要，不够则探仓）；按项目档案模板建档；§1 项目名称/一句话定位/项目阶段/协作模式/流程偏好；§2 代码地图/门禁、§7～§9 据实填或「无」；同步 `activeContext` 总览；根 README 按用户偏好选档（A/B/C/D），模板仅素材、已有不覆盖（见 `rules/core/project-readme.md`）。
  - docs：建工作区标准树 + `{workroot}/INDEX.md` + `inbound/INDEX.md` + `handoff/`（台账；按需 outbound/inbound；升包才建 `handoff/outbound/{category}/{HO-ID}/`；`inbound/` 为原件、`handoff/inbound/` 为收件工作副本）+ `_archive`；L2+ 建需求台账/变更记录/待决项/决策记录；根 `CHANGELOG.md`（无则建空骨架、有则只补不覆盖；产品发版史；**禁止**写接入/文档树条目）；`{workroot}/work-log.md`（无则建、有则跳过；接入完成可记事件=`接入/治理`；≠根 CHANGELOG）；产品/测试用各自工作日志、不写根；无内容不建空目录。
  - migrate（「重新接入」预授权）：按 `doc-governance.md` §3 先覆盖对照、列候选，确认后执行；更新档案/索引/计划/activeContext；冲突先问。
  - materials/lifecycle：按 `doc-governance.md` §3～§9；确认前只读，不改/不移/不删；归档只移已确认失效项。
  - gitignore：四选一确认资产入库范围，写档案 §1，改 `.gitignore`；临时/凭据/日志不入库；全不加入时只写已装包一行、无注释、不预列未装包。
  - capabilities：默认静默；点名「装配能力」才盘点并写入 `{workroot}/capabilities/`；未配置=降级，不阻塞打标。
  - skill-audit：能力只改 `{workroot}/capabilities/`，技能可改本包 `skills/`；档案 §6 只刷索引；未确认零改动。
  - 接入清单：① 包在项目根下一层、根指引文件已含本包引导；② 项目档案/activeContext（总览一句话 + `## 开发`）齐全**无占位符**（建档前有界探查：README 择要或探仓）；③ §1 一句话定位 + 代码地图/门禁/档案 §8/§9 据实填或「无」/「待确认」；④ 入库范围与 .gitignore 一致；⑤ 文档树/索引/根 CHANGELOG/`{workroot}/work-log.md` 存在、根目录无残留；⑥ L2+ 开发计划存在；⑦ 运行时写「wf-development onboard: done」（占位未换不得打标）；⑧ 工具默认静默；⑨ 旧结构迁移。
  - activeContext：无文件则按模板建（只含 `## 开发` + 跨包同步 + 运行时本包行）；已有文件则只补/更新本包分节与本包接入行，**禁止**整文件覆盖、禁止改他包分节/他包接入行。重新接入时只改回本包接入行，不得动他包行。
  - 技术要点少 → 内联档案 §7 事实摘要；无对应栈写「不适用」；不擅自删用户文档。
  - 缺陷配置真值只在档案；provider=「无」时写明缺陷口令降级 change。

outputs:
  - 产出：`project-profile.md`、`activeContext.md`、`{workroot}/INDEX.md`、`inbound/INDEX.md`、根 `CHANGELOG.md`、`{workroot}/work-log.md`、开发计划（L2+）
  - 迁移清单/归档清单/清理清单/常青清单（确认后执行）
  - 接入清单核验结论（默认不展开）
