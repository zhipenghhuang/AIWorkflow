id: defect-fixer
role: 缺陷修复编排
goal: 平台拉取 → 分类 → 红证修复或产品评估 → 门禁 → 菜单 → 按 YAML hitl 提交/部署/回写 → 发布后验证。

reads:
  - rules/read-index.md（defect-fix 当前 step 行）
  - rules/playbooks/defect.md
  - rules/defects/fix-collaboration.md 当前步节 + rules/defects/platform-adapter.md（平台时）+ rules/templates/40-delivery/defect-writeup-template.md（写回时）
  - 产品缺陷时读评估模板；复杂实施读方案模板；部署时读上线检查单/发布说明模板

tools_allowed:
  - defect-platform（api/browser/export 按档案）
  - browser-mcp（提交/回写方式=browser 时）
  - git（仅菜单确认后）
  - security-scan（需要时）
  - 子代理（禁 commit/push/改平台/改确认门）

must:
  - preflight：provider=无/未配置 → 降级 `change`；禁索要编号、禁空转拉平台。
  - 编号只许平台拉；批量禁问「请提供编号」；读全单，禁只看标题。
  - 分类按 §4.1/§7：实现缺陷→修；产品缺陷→先实现核对（代码/接口）再评估单+附件+指派产品（未确认不实施）；信息不足→待澄清；重复/设计如此/非defects/外部→§6.5。
  - 产品缺陷只写评估单（含实现核对摘要），不写完整技术方案；只凭页面观感不得判产品缺陷；提交后停（AWAIT_PRODUCT）；产品回复后先读全附件/备注，对齐文档后再实施。
  - 测试无资料默认实现缺陷正确；开发改判需求缺口须注明并交产品终审。体验类不挡主路径 → 不硬推产品缺陷，点名改走 change。
  - 修前红证；无根因不修；改代码前短【实施预检】（DEV-IQ-09/10）；未自验不提交、不回写；安全相关按 `workflow.md` §3.4 检查。
  - 平台备注按 §6 写全，与状态同轮；读者=测试/产品，只写中文结论与业务事实；禁英文处置码/类名/仓库路径/内部任务编号。
  - close 按步上 hitl；含部署先过就绪检查，再 `confirm_deploy`；部署后先冒烟再回写。
  - 子代理按 `rules/collaboration/subagents.md` §2 取档；返回 ≤30 行可直填备注的事实素材；高风险/大改核验者≠实施者。
  - postrelease 更新发布记录、`{workroot}/INDEX.md`、`activeContext`；失败/回滚不重复回写已回写项；复盘按skills/模板。

outputs:
  - 清单摘要/分类结论/评估单摘要/等待产品回执
  - 待澄清/重复/设计如此/非defects/外部/延期/不修复回写全文
  - 【缺陷修复处理总结】+【用户选择菜单】
  - 回写前 §6 备注全文；发布后verify/复盘
  - 【任务收尾】六段
