# orch · skill-audit — packet rebuild source (not runtime must_read)
# YAML step.notes may be thin; rich orchestration lives here.
workflow: skill-audit
purpose: 编排笔记缓存：生成步骤包 §5 的真源；YAML notes 保持薄指针。勿手改 packet 后丢此文件。
steps:
  apply: 有拟改 skills / capabilities表/装配步骤 → skill_changes_pending=true，出示【拟变更清单】（文件路径或安装项）等确认。 确认后按 playbook 执行；拒绝/无候选 → 跳过，零改动。改包后**必须**跑
    `rules/tools/Test-Template.ps1`；改技能另跑 `check_skills.py --strict`；失败不得声称完成。
  commit: 有skills/capabilities/档案改动才走；拟提交清单按 `rules/templates/90-handoff/closeout-skeleton.md` / 与 `rules/workflow.md` （git）；无变更跳过。
  discover: 按 `rules/playbooks/skill-audit.md` ：对范围内域执行 `npx skills find <query>`（或已装 find-skills 流程）；先看 skills.sh 榜。 质量闸：优先
    ≥1K installs + 信誉源；写入【生态检索】：可吸收方法｜能力候选｜维持；禁未确认 `skills add` 进母版。 无网络/CLI → 降级只读参考目录并记原因，不得跳过本节留空。
  fit: project：对照档案 ///、activeContext、近期完成门/降级。generic：对照能力表主选备选与技能完整性/冗余，不写项目特例。 合并 inventory + discover：分类 够用｜缺口｜过重｜冲突｜重复｜映射断裂｜可吸收方法。
  inventory: 读 `{workroot}/capabilities/00-能力清单.md`（无则记缺口）+ 包内契约/参考目录；`skills/README.md` 映射；抽查 frontmatter。 禁通读全部技能正文。输出【库存摘要】：已装/未装/已提示能力数
    + 映射覆盖行数。 可顺带跑 `rules/tools/check_skills.py <本包根> --strict`，失败记入缺口。
  propose: 按 `rules/templates/00-onboarding/capability-skill-audit-report-template.md` 与 playbook 写报告；含「生态检索」节；P0 置顶。 能力拟改只针对
    `{workroot}/capabilities/`；技能可改本包 `skills/`；未确认不改。可列「下一步：装配能力」。
  scope: 读 `rules/playbooks/skill-audit.md` 模式判定：口令含「通用」「不按项目」「通用优化」→ generic； 否则无填实 `project-profile.md`（占位未换=无）→ **强制 generic**
    并记「无项目对照自动」；有填实档案 → project。 确认范围：全量｜仅外部能力｜仅随包技能｜按域。无偏好时：generic 默认全量；project 按档案栈推荐。
  wrap: 对照 `rules/templates/90-handoff/closeout-skeleton.md` ；第1点含模式/范围/建议数/已应用数；可提示「装配能力」或下次体检。
