# orch · defect-fix — packet rebuild source (not runtime must_read)
# YAML step.notes may be thin; rich orchestration lives here.
workflow: defect-fix
purpose: 编排笔记缓存：生成步骤包 §5 的真源；YAML notes 保持薄指针。勿手改 packet 后丢此文件。
steps:
  align: 仅产品回复且需实施（认可/修改后认可/改判实现）时执行；非问题/补充信息跳过，转 clarify。 按 rules/defects/fix-collaboration.md ： ≥3 份新产品文档 → 只读抽取扇出（每份返回变更点/AC/影响面候选
    ≤30 行）；对齐结论由本步集中写，不并行改同一文档。 产品新文档按 `rules/doc-governance.md` （T6）：确认后原件落 `inbound/{ver|topic}/`，登记索引；S1/S2/S3 同批进 `inbound/_archive/`；结论同步工作区。
    构成需求/范围/AC/接口/数据实质变更 → 按 workflows/intake.yaml 与 rules/workflow.md 做影响分析/CR； 逐项对照评估单/原方案，列一致/差异/新增/删除； 更新 {workroot}/10-requirements/需求台账、{workroot}/20-design/方案-…/ADR/接口/DB、{workroot}/40-tasks/任务清单、
    {workroot}/50-verification/UAT、{workroot}/60-release/提测单/发布说明/回滚、开发计划 //、 项目档案 //（新入口/命令/规范变化）、{workroot}/00-governance/变更记录（CR）、`{workroot}/INDEX.md`、`activeContext`；
    不适用写原因；未对齐不得 fix。
  assess_product: 按 rules/defects/fix-collaboration.md ： 写评估单前必做实现核对（代码路径与/或接口契约·响应），结论写入评估单「实现核对」；未核对不得出单。 写 缺陷评估-{BUG-ID}-{主题}-{yyyyMMdd}.md，落
    {workroot}/00-governance/缺陷评估/； 只客观写实现核对摘要/判定依据/问题影响/方案选项 A/B/C/推荐/影响面/待产品确认； 不写可编码实现细节、不拆开发任务、不排开发排期；不写期望回复/时限威胁/超期升级/评估单版本过程史；不得与正常迭代方案
    方案-{主题}-… 混用。 口径存疑但实现路径清晰时，改出评审版修复方案（fix-collaboration §5.1 档位，落 20-design/BUG优化修复方案/），与评估单二选一、不重复出。 没有相符证明且不属于需求缺口变体
    → 不判产品缺陷：按实现缺陷或 need_clarification 处理。 无平台/export/文档输入 → 评估单经 change/handoff 交付，口径与平台备注同源。
  await_product: STOP：本步输出后结束，不执行 wrap/后续 step；不改代码、不提交、不部署、不按自己的评估方案实施。 输出【缺陷修复处理总结】的待产品部分（评估单/附件/待决定项）+ 一行 AWAIT_PRODUCT；
    同批实现项按 fix-collaboration §4.1 并行处理（不受本单等待阻塞），澄清项照常回写；不输出提交菜单中未实施的项。 下次用户说「拉取产品回复/产品回复/产品退回/继续缺陷」→ 从 product_decision 进入。
  clarify: 按 rules/templates/40-delivery/defect-writeup-template.md /： 先按原单口径复现；一次列清缺什么/谁补/截止；给条件式下一步，避免来回踢皮球。 平台备注用中文结论，禁英文处置码、类名、命令、仓库路径；本条是给测试看的。
    重复→duplicateBug=主单；设计如此→引用设计原文；外部→给外部证据； 延期/不修复须产品/项目确认，不得开发单方关闭。 不改代码；备注与状态同轮；确认前展示全文。
  close: 按菜单精确执行（组合=并集、重复步骤只执行一次）；确认门以本步 hitl 列表为准（专规不另造门）： 含提交/推送 → confirm_commit（【拟提交】块）；含部署 → 先过就绪检查并产出/更新发布说明+回滚预案+上线检查单
    （rules/templates/40-delivery/release-notes-template.md、rules/templates/40-delivery/go-live-checklist-template.md，落 {workroot}/60-release/），再
    confirm_deploy（版本/窗口/影响面/回滚决策人）； 未批准不部署；含回写 → confirm_remark（ 备注全文）。 **回写就绪四条件**：①本地复测通过且部署冒烟通过（不崩、可回归）；②按 生成备注并带提交 hash/版本；③展示全文+状态/指派/resolvedBuild；④状态+备注同轮写入。任一未满足只写「待验证」，不得
    resolved。 可与菜单同轮展示拟提交清单+备注全文+部署要点，用户一次确认后连续执行 （预授权已含本步时，展示照常、免重复等待，见 AGENTS ）。 部署失败即停、不继续回写；部署后先冒烟再回写；未验证不得写成“已修复”。 产品缺陷回写按
    /，点名产品文档/评估单/对齐记录。 修复/回归完成且已写回平台 → **不**强制 `FIX` 整包；无平台/点名 → **先问后发** 自包含 FIX 包。未回执不得写“测试已回归/产品已验收”。
  fix: '**前置**：本批 triage【分类表】已输出；未出表禁改业务代码（fix-collaboration §4.0）。仅修表中「实现缺陷」行；待产品行不扩写。开跑声明 mode=（同文件集→单写手）。 修前红证；无根因不修；复现与写回按原单口径对齐、引用原单信息（协作
    ；红绿与换路径细则见 AGENTS ）。 **先写缺陷修复卡**（原单口径/SC 差集/同类路径/红证/验证站证据），再改代码；矩阵与判定只认 `implementation-quality.md` ～，不另造表。 **动手前**：先
    `verify/Invoke-Gate.ps1 -StartTask -TaskId "BUG-<id>" -ProjectRoot "."`（冻结 `base_commit`；截图须晚于 `started_at`/验收清单）→ 来源完整性检查=0
    缺漏（DEV-IQ-16，含相关方案/原型/接口/同类路径）→ 短【实施预检】（DEV-IQ-09）；命中重要面同批硬补（DEV-IQ-10）；方法 `skills/implementation-and-selftest/SKILL.md`
    。 按 `skills/cross-layer-consistency/SKILL.md` 做同类路径扫描：同模型其他写入口、同谓词其他消费方、同权限端点/菜单、同状态其他表面；逐条判「同defects/已正确/不适用」，原单+同类路径各补一条回归；记录根因层/规则缺口。
    **DEV-IQ-08**：同根因族 ≥2 → 除回归外须拟改rules/skills/检查项缺口（先拟改+原因+影响，用户确认后改母版或项目适配）；禁止只关单号。 实现缺陷→按 修；产品已认可/修改后认可→按新产品文档/评估单实施（/）；
    产品改判实现缺陷→按产品说明修，备注引用产品结论。 复杂实施再按 rules/templates/20-design/solution-template.md 展开，文件名 方案-BUG-{id}-{主题}-{yyyyMMdd}.md；
    简单修复不强制完整方案，但须更新受影响文档/任务清单。 **修复分片**（子代理编排 ）：≥3 单且文件不重叠 → 一组一子代理（worker-agent；默认串行；同文件集合并组）；不达阈值直做；子代理禁 commit/push/改平台，返回
    ≤30 行可直填备注的事实素材（rules/defects/fix-collaboration.md ）。 高风险/大改/破坏性缺陷：核验者≠实施者（派 reviewer-agent 独立核验，只给原单＋diff＋红绿命令；核验不替代门禁），并写
    `.gate/review.md` 供完成门核对。'
  gates: 本批无代码/配置改动项 → 跳过（纯文档/纯评估）；有改动运行 `verify/Invoke-Gate.ps1 -Acceptance <缺陷修复卡/任务清单>`，门写 `.gate/wf-development/completion.json`；L1+
    无验收表先补，不得空跑门。 `has_code_change` = 本轮 diff 非空（不含生成物）；与 `implementation_required`（清单已确认）区分，避免纯文档批空跑门。 日志分诊（子代理编排 ）：原始日志落盘，先脚本过滤；仅多文件语义归因才派子代理，返回摘要
    ≤30 行。 失败不声称完成；存量失败只对账新增；工具/环境缺失 → BLOCKED。
  handoff_product: 按 rules/templates/40-delivery/defect-writeup-template.md 出备注全文；上传评估单附件并回查挂载； **双通道**：本步已交/回写平台（评估附件+指派产品）→
    **不**再强制 `BUG` 整包。无平台/点名「缺陷交接包」→ **先问后发**，确认后 `handoff.send` 自包含评估详单。未回执不得写“产品已接收”。 指派产品经理；状态按档案映射置「待产品确认/待评审」；resolution
    不填。 确认前展示备注全文+附件名+状态/指派变更；备注与状态同轮。 提交后停，不进入 fix；输出 AWAIT_PRODUCT。
  menu: 预授权（一次性/直接跑完）：声明默认界并直接执行（见 AGENTS ）；默认只到本步输出 （修复＋门禁＋总结菜单）待选择，仅含后续且范围不明时一问， 禁静默连跑提交/推送/部署/回写；含后续由范围确认覆盖。总结与菜单必须同轮输出。
    产品缺陷项须列评估单/产品结论/对齐状态。
  postrelease: 条件步：本轮含部署才走。按发布说明跑主链路冒烟与关键回归；观察日志/指标/告警。 触发回滚条件 → 按发布说明回滚，不恋战；更新 {workroot}/60-release/发布记录-{版本}.md、发布说明、`{workroot}/INDEX.md`、`activeContext`。
    失败/回滚不重复回写已回写项；需要时转 retro。
  preflight: '读项目档案 provider。若为「无」或未配置： route=workflow:change | reason=no_defect_platform | next_action=按现象走常规变更；终止本 workflow（不执行
    next: pull）； 禁止向用户索要编号、禁止空转拉平台。 **勿在本步 `-StartTask`**；有代码修复时在 `fix` 动手前冻结任务窗口。'
  product_decision: 入口直达（拉取产品回复/产品回复/产品退回/继续缺陷）视为本步条件成立； 未读产品回复/附件前不得进 fix；平台仍无产品回复/仍指派产品 → 输出 AWAIT_PRODUCT，不重复 handoff。
    按 rules/defects/fix-collaboration.md / 读全单：状态/解决码/指派人/全部备注/附件/新产品文档/关联需求。 归类：认可方案/修改后认可/判定实现defects/判定非问题/要求补充信息。 仅“回派”无备注/附件说明
    → 视为未确认，输出 AWAIT_PRODUCT 请产品补结论。 认可或修改后认可或改判实现 → implementation_required + product_decision_requires_alignment； 要求补充/非问题
    → need_clarification； 非问题按产品要求退回测试/关闭，不自行改代码。 读不全（solutionChannel=manual）→ 请用户补关键附件/备注，禁只看标题或只读一句备注。
  pull: 首条回执含 mode=（缺陷批加严，见 subagents）。拉取后读全单：提交信息（标题/steps/数据/环境/附件）＋历史备注/讨论＋产品评估/回复附件； **批量侦察**（子代理编排 ）：≥5 单且读单成本高（多备注/附件/评估单）或合计
    ≥20k token → 逐单只读扇出（一单/小批一子代理），返回「分类候选/证据缺口/查重键/产品评估要点」≤30 行；编排集中读回执并读关键单原文；不可用→deviation=subagent_skipped:unavailable，仍进
    triage 出分类表。 同号重复修复预检；归组后进入 triage（未 triage 禁改码）。 历史预检跳过项：产品缺陷待产品确认 → 跳过标注「待产品」；已修复未再激活 → 跳过标注「已处理」； 无法确认被激活 → 重新分类处置；产品已回复/已退回
    → 直接进 product_decision。
  retro: 条件步：重复defects/事故/回滚才走；技能 skills/retrospective-and-improvement/SKILL.md，模板 rules/templates/60-retro/retro-template.md。
    行动项必须有负责人/截止/验收；进任务清单或 {workroot}/80-retrospectives/改进项.md。
  triage: '**§4.0 门禁**：本步必产出【分类表】（≥2 单逐行：单号|处置|依据一句|下一步）；未出表禁进 fix/禁改业务代码；禁「多为实现缺陷」代替逐单。子代理不可用→mode=直做|单写手 + deviation=…，仍须出表。
    按 rules/defects/fix-collaboration.md 分类： 实现缺陷→implementation_required；产品缺陷/需求缺口/设计口径不明→product_defect； 信息不足/无法复现/环境数据不一致/预期不明/重复/设计如此/非defects/外部/已在其它构建修复→need_clarification；
    延期/不修复须产品/项目确认，不得开发单方关闭。 产品缺陷不得先写完整技术方案，只写评估单；口径存疑但实现路径清晰 → 出评审版修复方案（solution-template 裁剪，落 20-design/BUG优化修复方案/），评估单与评审版方案二选一，不重复出。
    混批含产品缺陷+实现缺陷：两轨并行——实现项照常 fix（可先提交），产品项出评估单/评审版方案并 AWAIT_PRODUCT；仅当实现项依赖产品结论时该实现项等待，不整批阻塞。 pull 已标「待产品」→ 直接输出 AWAIT_PRODUCT，不重新评估/不重复
    handoff。 分类结论须引用原单 steps/数据/环境/设计依据，禁只看标题；批量时以侦察回执为输入，**分类/五选一/处置集中**，不采信子代理终态。 拟标 product_defect 前须完成实现核对（相关代码路径与/或接口行为），只凭页面观感不得判产品缺陷。
    测试无设计文档默认实现缺陷属正确；开发改判需求缺口须写明并交产品终审，不与测试争默认。 不挡主路径且无合规/资金/数据风险的体验类 → 不硬推 product_defect；点名要改走产品 change/需求池。 每条实现缺陷同时记「根因层（需求/设计/数据模型/实现/测试/契约/文档）+
    同类路径候选（同模型写入口/同谓词消费方/同权限端点/同状态表面）+ 规则缺口」；按 `skills/cross-layer-consistency/SKILL.md` 取矩阵，不只修表面现象。 内部处置码只用于路由，不写进平台备注。'
  wrap: 对照 `rules/templates/90-handoff/closeout-skeleton.md` ；第1点含【缺陷修复处理总结】与动作+单号 有代码改动时读本轮 `.gate/wf-development/completion.json`；有门回执时运行
    `verify/Test-Report.ps1 -Report <收尾文件>`，lint 不过先修报告。 **现状三处同拍**：更新 `activeContext` + 开发计划 （实质进入/处于 S7 写「S7 进行中」；G6 未签则注明正式门待补）+
    `{workroot}/INDEX.md` 当前入口；索引不写状态；发布记录按需。 `sync=` 须含 `triad=aligned|deferred:<原因>`；禁只改 activeContext。未verify/待回写/待产品/跳过项明示。
