# orch · retro — packet rebuild source (not runtime must_read)
# YAML step.notes may be thin; rich orchestration lives here.
workflow: retro
purpose: 编排笔记缓存：生成步骤包 §5 的真源；YAML notes 保持薄指针。勿手改 packet 后丢此文件。
steps:
  actions: 每条行动项：具体动作 + 负责人 + 截止 + 验收标准 + 跟踪位置；优先系统性缺口。 能落到rules/skills/templates/门禁的直接改；不能落地的建跟踪项。 confirm_actions：出示行动项清单与优先级，确认后落盘；未确认不宣称改进完成。
  analyze: 5 Whys/因果链追到可改变的系统性原因；不要停在“人为疏忽”。 贡献因素：流程/工具/测试/评审/监控/文档/排期/沟通；做得好/做不好各列。 只对事不对人；结论附证据。
  commit: 无文件变更跳过；拟提交清单按 `rules/workflow.md` ；复盘文件与索引/计划更新同批提交；提交后补一行结果，不重复六段。
  gather: 技能：`skills/retrospective-and-improvement/SKILL.md`（先读再做）。 输入：发布记录/上线检查单、缺陷单、测试报告、日志/监控/告警、沟通记录、activeContext。 只收事实：时间线（发现→响应→止损→恢复→关闭）、影响（用户/业务/数据/资损/合规/时长）、指标（lead
    time/cycle time/CFR/escaped defects/MTTR）。 无法确认写「未知」，不猜。
  record: 按 `rules/templates/60-retro/retro-template.md` 落 `{workroot}/80-retrospectives/复盘-{版本或事件}-{yyyyMMdd}.md`。 需要跨角色同步时**建议**是否发
    `RETRO` 包；确认后才生成。 更新 `{workroot}/INDEX.md`、`activeContext.md`；更新开发计划 S9（复盘链接/项目关闭或下一迭代）；行动项进任务清单或 `{workroot}/80-retrospectives/改进项.md`；按
    `rules/core/context-memory.md` 复盘沉淀（升级 / 清理偏好与洞见）。 下次复盘先对账上次行动项；未完成项说明原因与新截止。
  wrap: 对照 `rules/templates/90-handoff/closeout-skeleton.md` ；第1点含复盘结论/行动项 未确认/未闭环行动项明示。 本步先出骨架与拟提交清单；完整【拟提交】在下一步 commit 只展示一次。
