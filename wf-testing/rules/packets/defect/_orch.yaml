# orch · defect — packet rebuild source (not runtime must_read)
# YAML step.notes may be thin; rich orchestration lives here.
workflow: defect
purpose: 编排笔记缓存：生成步骤包 §5 的真源；YAML notes 保持薄指针。勿手改 packet 后丢此文件。
steps:
  classify: 回归/提交/修改/查重/列表/巡检/补充澄清/产品判定回流；回归默认 LIST=指派给我·未关闭（含打开/已解决），巡检=我提交的/我关注的未关闭，只读变化不默认回归； 读单/快照/分流见 缺陷协作 ；开发无法复现/请补充
    → ；产品确认/新文档 → testing plan ，不在本轨直接改用例； 产品判定非问题/重复/信息不足 → /；产品缺陷直提 → 指派产品，不经开发； 未点子类先 LIST 再问；本轨专规读够（见 bug-agent reads）。
    **批量侦察**（多Agent ）：≥5 单且读单成本高（多备注/附件/评估单）或合计 ≥20k token → 逐单只读扇出（一单/小批一子代理），返回子类候选/证据缺口/查重键；子类结论与处置集中，不采信子代理终态。
  search: 提交前查重；回归/巡检拉单读 status/resolution/assignedTo/resolvedBuild/actions/files/lastEditedDate，按 缺陷协作 做快照 diff； api 读不全
    → browser；仍不全 → 请用户补关键备注/附件，禁只看标题分析。 批量查重/快照 diff 可按单只读扇出；主上下文只收「单号/变化/查重键/证据缺口」≤30 行，判定集中。
  submit: remark_writeback＝拟关/激/解决/标重复/补充澄清/回归写回备注；先出 id+备注全文再执行。 platform_submit＝计划 为批末/阶段末/收尾确认且本轮拟新建单时触发；执行批 ID 与计划 对齐；修复批可另立
    `B-FIX-xx` 并在计划 登记；细则见 `rules/defects/collaboration.md` /（分流：本地消化/盯办/缺陷；待实现进缺陷清单；测本地消化不开单；外力盯办须实机类型+指派匹配或问用户）。 补充澄清用 ；回归未通过用
    ；新问题用 ；非修复处置用 ；产品判定回流用 ；写后按 回查。 产品缺陷：提交后直接指派产品负责人，不经开发；产品判定非问题/重复/信息不足 → 指派回测试，按 / 处理。 建单标题：`[V版本?][测试类型]`+正文（已确认迭代版本才加
    `[V…]`；类型必加；）。 列表/仅查重展示/仅建单（无状态回写）→ 跳过 remark 门；拟新建单仍按 platform_submit 门；列表子类可跳过本步直 wrap。 回写内容由编排集中生成；子代理只提供事实素材，不写平台、不改状态。
    **缺陷通道（）**：`api`/`browser`/「提交禅道|平台」→ **完整交平台即完成**（writeback 回执 + 台账单号）；**禁止**同轮导出包、BUG HO、出站实拷详单、一缺陷一目录。 无平台/`export`/点名「缺陷交接包|发给开发|仅导出」→
    **先问后发**：出示【拟统一导出】（条数/单文件或单 EXPORT 目录）；确认后本批**只落一份**（见 handoff ；禁「拟提交」充数；禁逐条文件夹）。 基线 不全 → 先问补适配直提 vs 统一导出；确认前零落盘。 更新台账/计划平台号；仅导出路径才更新
    `handoff-ledger.md`；未回执不得写“开发/产品已接收”。
  wrap: '**git 提交门**：有文件变更时按 `confirm_commit` 出示【拟提交·仓库】；平台提交/回写已在 submit 步按门3确认，不在本步重复问。 确认后对照 `rules/templates/90-handoff/closeout-skeleton.md`
    ；第1点含提交/回归结果（动作+单号） 本轮若用过浏览器 MCP → 按多Agent 全链终局退程（本套 Chrome）；结果写入「运行态：」；失败/仍在运行 → 第 4 点问关闭/保持。'
