# orch · testing — packet rebuild source (not runtime must_read)
# YAML step.notes may be thin; rich orchestration lives here.
workflow: testing
purpose: 编排笔记缓存：生成步骤包 §5 的真源；YAML notes 保持薄指针。勿手改 packet 后丢此文件。
steps:
  analyze: 主读一问即止； 必填；confirm_understanding 主屏=。方法只认 test-basis-analysis 必做。 用户版/交接/入站见技能与 doc-governance REF。
  execute: 计划驱动按 / 装填；批末 execute -Scope；能脚本不 AI；P0-Smoke 未过不进正式全库。 SSOT=execute playbook + 当前轨 + 技能必做；禁把整本方法抄回本 notes。
  generate: 须有分析表；功能双读原文+表；覆盖闸仅功能/专项；ACTIVE 禁整版空域（Q11/release-train-load）。生成后 T1+ 须衔接收 review-cases。 细则只认 testcase-design
    / multi-track-quality / script-execution REF。
  handoff: 骨架后问平台/git；回写前 -Claim -Mode writeback。浏览器退程见 multi-agent-output 。
  plan: 无分析表或缺 → 先 analyze。版本级四卷+批次表；T0/T1 轻量。when 假则跳过对应门。 依据覆盖见 verification ；方法只认 test-analysis-and-plan 必做。
  report: 先正文再 -Mode report；未 PASS/CONDITIONAL 不得写整体通过。同步 plan/台账/activeContext（triad）。 关账/materials/禁改根 CHANGELOG 见 doc-governance
    REF；门3 在 handoff。
  review-cases: STOP 选 A/B；不重生成。功能选 B 跑 -Mode review。方法只认 testcase-review / artifact-review 必做。
  status: 只读 test-plan //；「下一步」只报不执行。未吸收文档→plan；未回执交接→handoff。 只读可 2～3 行简报；首条含 route/step/phase/gate/next_action。
