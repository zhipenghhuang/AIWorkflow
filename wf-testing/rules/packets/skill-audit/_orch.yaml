# orch · skill-audit — packet rebuild source (not runtime must_read)
# YAML step.notes may be thin; rich orchestration lives here.
workflow: skill-audit
purpose: 编排笔记缓存：生成步骤包 §5 的真源；YAML notes 保持薄指针。勿手改 packet 后丢此文件。
steps:
  apply: 有拟改项 → skill_changes_pending=true，出示【拟变更清单】确认后按 playbook 执行；否则跳过。 改包后**必须**跑 `rules/tools/Invoke-TestWorkflow.ps1
    -Action ValidateTemplateRefs`；改技能另跑 `check_skills.py --strict`；失败不得声称完成；结果写入体检报告。
  commit: 有skills/实例capabilities/基线索引改动才走；拟提交清单按 `rules/templates/90-handoff/closeout-skeleton.md` 与 `AGENTS.md` git；无变更跳过。
  discover: 按 `rules/playbooks/skill-audit.md`：`npx skills find <query>` 或 find-skills；先看 skills.sh 榜。 质量闸 ≥1K installs +
    信誉源；【生态检索】只列可吸收方法｜能力候选｜维持；禁未确认 skills add 进母版；禁外部生成器绕过分析表/oracle。 无网络/CLI → 降级只读参考目录并记原因。
  fit: project：对照环境基线、T 级、轨道、计划缺口、近期门/降级。generic：对照主选备选与技能完整性，不写环境特例。 合并 inventory + discover：够用｜缺口｜过重｜冲突｜重复｜映射断裂｜可吸收方法。
  inventory: 读 `{workroot}/capabilities/00-能力清单.md`（无则记缺口）+ 包内契约/参考目录；`skills/README.md` 映射；抽查本范围 SKILL frontmatter；禁通读全部技能正文。
    输出【库存摘要】。可顺带跑 `rules/tools/check_skills.py <本包根> --strict`，失败记入缺口。
  propose: 按 `rules/templates/00-onboarding/capability-skill-audit-report-template.md` 与 playbook；含「生态检索」节；P0 置顶。 能力拟改只针对
    `{workroot}/capabilities/`；技能可改本包 `skills/`；未确认不改；可列「下一步：装配能力」。
  scope: 读 playbook：含「通用/不按项目/通用最优」→ generic；无填实基线且无 `{workroot}/capabilities/00-能力清单.md` → **强制 generic**；有填实清单或基线 → project。
    范围：全量｜仅能力｜仅技能｜按轨。generic 默认全量。
  wrap: 对照 `rules/templates/90-handoff/closeout-skeleton.md`；第1点写模式/范围/建议数/已应用数
