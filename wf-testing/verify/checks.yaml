# 检查矩阵（测试轨）
# 机器执行以 tools/test_gate.py 为准；本文件用于评审与调整。

version: 5
modes:
  coverage:
    required: [env-baseline, analysis-structure, plan-structure]
    optional: []
    manual: [source-reconciliation, chapter-receipt, basis-coverage, ac-design-ledger, coverage-matrix, method-matrix, detail-dimensions, impact-surface, core-chains, p0-oracle, risk-scan-complete, na-accepted, ambiguity-gap, exploration-plan]
  execute:
    required: [env-baseline, analysis-structure, plan-structure, execution-record, evidence-exists, blocked-reasons, p0-status, intent-conclusion]
    optional: [scope-required, intent-coverage]
    manual: [batch-merge, result-self-check, batch-spotcheck, autonomy-log, s6-s7-s11]
  report:
    required: [env-baseline, analysis-structure, plan-structure, execution-record, evidence-exists, blocked-reasons, p0-status, intent-coverage, intent-conclusion, p0-missing, report-structure, report-verdict]
    optional: []
    manual: [gap-accepted, release-gate, defect-regression, coverage-matrix, exploration-close, s6-s7-s11, p0-conclusion]
  writeback:
    required: [writeback-receipt]
    manual: [note-status-same-round, attachment-check, platform-id]

# 高价值低成本（默认）
always:
  - analysis-structure
  - plan-structure
  - execution-record
  - evidence-exists
  - p0-status
  - intent-conclusion
  - report-verdict

# 高价值中成本（按范围）
risk_based:
  - blocked-reasons
  - intent-coverage
  - writeback-receipt

# 软项（人读；不单独机器 hard-fail）
soft:
  - scope-required
  - p0-missing
  - gap-accepted
  - autonomy-log

# 低价值高成本（不做/少做）
avoid:
  - full-regression-every-patch
  - re-read-all-cases-every-report
  - screenshot-every-pass-case
  - full-case-library-maintenance
  - per-artifact-multi-round-check
  - multiple-approval-layers
