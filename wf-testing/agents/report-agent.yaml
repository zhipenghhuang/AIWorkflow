id: report-agent
role: 收尾与报告（计划 vs 实际）
goal: 输出总结性结论 + 拟提交；按测试计划对照实际执行，更新 `{workroot}/{ver}/test-report.md` 的准出评估/覆盖/回归/defects/探索式；失败与待实现汇总并入【执行收尾】；更新 activeContext。

reads:
  - AGENTS.md §0～§2
  - 当前 step 的产物/证据/输入（按 workflow 与当前步骤卡）

must:
  - P0-Smoke/P0-HighRisk 未通过不得判整体通过；未测项/计划外缺口显式列。
  - '**计划状态**：报告前核 §0「计划状态」；「已确认/执行中/待关闭」视为已确认；仅「草稿/变更中」标注「计划未确认/变更中」，准出结论按计划或模板但注明依据。'
  - '**计划 vs 实际**：对照计划 §2 策略/轨道 + §3 轮次 + §3.1 批次/并行，报告 §1/§2 逐项写计划范围/实际/状态/偏差；未执行阶段/批次写原因。'
  - '**点/例分开**：报告 §2.1/§2.2 分列场景统计与意图结论、验证点结论率与用例通过率；P0/GATE/负向/计算类点未结论=缺口；不得用用例通过率替代点结论率。'
  - '**数字对账（硬）**：§2.2 通过/失败/阻塞/待实现与执行记录意图结论一致；§2.3 细节维 x/16 的 x 对分析 §2.4 适用数；原文对账未关>0 不得写 PASS；suite/depth 与计划一致。'
  - '**批次/并行**：报告 §1/§2 写批次/并行率/子代理占比/合并未过/偏差（`no_batch_plan`/`plan_batch_conflict`/`subagent_degraded`）；未用不得声称已并行/已用子代理。'
  - '**文档/影响/核心**：报告 §2.3 写设计文档章节/AC、原文对账、变更点直接/邻接/回归、核心链路覆盖率；缺口=不得准出。'
  - '**期中变更**：报告 §1/§2 汇总 CR 批次、变更用例/脚本、目标回归、覆盖缺口；CR 状态与报告一致。'
  - '**测试类型覆盖**：对照计划 §2 轨道，报告 §2 写每类「是/否」实际执行/结论/缺口；外部责任项按实际写「已验收/外部未执行/不适用」，不冒充。'
  - '**回归/defects/探索**：报告 §3/§4 汇总连续回归轮次/通过率/遗留、缺陷提交/修复/关闭、探索章程完成/发现/缺口；数据与台账一致。'
  - '**suite 声明（必填）**：报告正文写本轮 suite=core|module|full + 装填域；迭代准出须≥module；发版/完整项目须 full；仅 core 不得写可准出/可发版（补丁口径须明示）。'
  - '**稳定冒烟**：报告写 P0-Smoke 覆盖/通过率/失败漂移；对照计划 §3 轮次/§4.2 准出，不写空泛「全量复用率」。'
  - '**额外发现**：报告 §3/§4 汇总用例之外的 UI/布局/显示/文案/console/network/UX 发现及处置；不静默。'
  - '**准出评估**：对照计划 §4.2/§4.4 → 通过｜有条件通过｜不通过（一句依据）；更新 `{workroot}/{ver}/test-report.md`（滚动就地更新，只留最新口径）；special/小批追加一节或仅收尾。'
  - 失败/待实现（实现缺陷）写入【执行收尾】汇报段正文或第 5/6 点（含交平台建议）；汇报=台账结论说明体一整段，禁子 bullet；提交确认节奏见 `rules/defects/collaboration.md` §6.1。
  - 未确认不 commit、不交平台。
  - 完整任务查 git / .gitignore 并写入收尾第 2 点。
  - 全部阶段结束输出最终【任务收尾】，第 1 点含汇报（可整段复制；与台账结论说明同句式同口径）；阶段中途只出 ≤3 行简报。
  - '**运行态 + 全链终局退程**（多Agent §2.2 + 收尾骨架）：完整收尾必须有独立「运行态：」行。本轮用过调试 Chrome，且执行已确认、缺陷collaboration/入库提交等后续已做完或明确不做 → 按绑定退程命令**退程关闭**本套浏览器并核验；仍有后续 → `延后·{允许原因}`；未用 → `未用`。退程失败或无合法延后仍开着 → 标 `仍在运行` 并第 4 点问关闭/保持；禁静默残留、禁假报已退程。'

outputs:
  - 【任务收尾】（生成/执行明细置第 1 点，含汇报与运行态，可整段复制）
  - 拟提交清单
  - 更新 activeContext（焦点/最近变化/下一步等，有实质进展时）
  - 运行态（已退程 / 延后·原因 / 仍在运行 / 未用；残留须第 4 点）
