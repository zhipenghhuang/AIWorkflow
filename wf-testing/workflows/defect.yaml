# 编排：进 wf → workflows/defect.md；执行 → 当前 step 步骤包；终端 → _shared/closeout.md。
# 步骤卡 §6 必开技能：整卡读取→执行→回包。禁把 skill 正文嵌进步骤卡。
# 本 YAML 只定义状态/门/产出；不用于运行时通读。
workflow:
  id: defect
  name: 测试缺陷协作
  version: 7
  terminal: closeout
entry_points:
  缺陷协作: classify
  查重: classify
  提交到平台: classify
  指派给我: classify
  已解决: classify
  复测: classify
  缺陷变化巡检: classify
  补充澄清: classify
  产品判定回流: classify
trigger:
- 缺陷协作
- 查重
- 提交到平台
- 回归（指派给我 / 已解决 / 平台）
- 指派给我 + 回归|验证|复测
- 缺陷变化巡检 / 我提交的缺陷有没有新回复 / 看产品确认
- 补充澄清 / 开发无法复现 / 请补充说明
- 产品判定回流 / 产品退回测试 / 产品说非问题
preflight:
  skip_if: activeContext 中 wf-testing onboard 的值为 done
  once: 按 agents/onboard-agent.yaml 接入清单核验
  on_fail: 'onboard → 写 wf-testing onboard: done → resume'
steps:
- name: 识别子类
  id: classify
  skills: []
  must_read:
  - rules/packets/defect/classify.md
  agent: bug-agent
  next: search
  output: 子类判定（回归/提交/修改/查重/列表/巡检/澄清/产品回流 + 依据）
  notes: 回归/提交/修改/查重/列表/巡检/补充澄清/产品判定回流；回归默认 LIST=指派给我·未关闭（含打开/已解决），巡检=我提交的/我关注的未关闭，只读变化不默认回归； 读单/快照/分流见 缺陷协作；开发无法复现/请补充 →
    挂起并列出缺失信息，退回提交人补充；产品确认/新文档 → testing plan，不在本轨直接改用例； 产品判定非问题/重复/信息不足 → 关闭或合并，记录依据；产品缺陷直提 → 指派产品，不经开发； 未点子类先 LIST 再问；本轨专规读够（见
    bug-agent reads）。 首条回执含 mode=直跑|只读扇出（平台回归加严，见 subagents）。 **批量侦察**：≥5 单且读单成本高（多备注/附件/评估单）或合计 ≥20k token → 逐单只读扇出（一单/小批一子代理），返回子类候选/证据缺口/查重键；达阈值未扇出→deviation=subagent_skipped:<理由>；子类结论与处置集中，不采信子代理终态；复测默认串行。
- name: 查重或拉取
  id: search
  skills: []
  must_read:
  - rules/packets/defect/search.md
  agent: bug-agent
  next: submit
  tools:
  - defect-platform
  output: 查重键/拉取快照 + diff 摘要（单号/变化/证据缺口）
  notes: 提交前查重（先列表再本地过滤，至多1～2次高信号search；禁同质连环search）。回归/巡检拉单读 status/resolution/assignedTo/resolvedBuild/actions/files/lastEditedDate，按
    缺陷协作 做快照 diff； api 读不全 → browser；仍不全 → 请用户补关键备注/附件，禁只看标题分析。 批量查重/快照 diff：达只读扇出阈值则按单扇出，未拆记 deviation；主上下文只收「单号/变化/查重键/证据缺口」≤30
    行，判定/复测/回写集中；复测同账号写域禁并行。
- name: 提交或回写
  id: submit
  skills: []
  must_read:
  - rules/packets/defect/submit.md
  - rules/templates/30-execution/defect-writeup-template.md
  when: defect_submit_required
  agent: bug-agent
  on_fail: 不提交/不回写；补证据、补探查或问用户；不得为交平台改标失败
  gate: writeback-receipt
  gate_type: machine
  hitl:
  - name: confirm_remark
    when: remark_writeback
  - name: confirm_platform
    when: platform_submit
  notes: remark_writeback＝拟关/激/解决/标重复/补充澄清/回归写回备注；先出 id+备注全文再执行。 platform_submit＝拟新建单且命中 collaboration §6.1（发现即提交｜批末/阶段末/收尾确认｜用户口令提交到平台）；执行批
    ID 与计划对齐；修复批可另立 `B-FIX-xx` 并在计划登记。 细则见 `rules/defects/collaboration.md`。 **交前复判（硬）**：collaboration §5.1 Q13–Q19、Q21–Q22
    + §6.0（尤 Q13/Q15/Q19/Q21）；无 `入口指纹` 或（空列表/404/未交付且）`误用已排除≠是` → 禁建单，回 execute；搬运禁自拟精简十段、禁现网补证/重开补拍；回执=`{ver}/写回回执.md`（本轮覆盖）。
    产品缺陷直提产品；建单标题 `[V?][测试类型]+正文`。 列表/仅查重/仅建单（无状态回写）→ 跳过 remark 门；拟新建仍走 platform_submit。 **缺陷通道**完整交平台即完成（writeback 回执+台账单号）；禁同轮导出包。
    未回执不得写“已接收”。
  templates:
  - rules/templates/30-execution/defect-writeup-template.md
  output: 平台单号（或待确认后的统一导出路径）· 备注与状态同轮 · 可复制汇总块（collaboration.md §5.2）
- name: 收尾与提交
  id: closeout
  skills: []
  must_read:
  - rules/packets/_shared/closeout.md
  agent: report-agent
  hitl:
  - name: confirm_commit
    when: has_pending_commit
  output: 任务收尾 + 拟提交确认
  notes: 收尾与提交；共享终端；状态=done。
