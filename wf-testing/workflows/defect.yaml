# 编排：只读当前 step。进 wf → packets/defect/_chain.md；进子机 → _region-*；执行 → 步骤包。
# 步骤包 §6 必开技能：打开→执行→回包（质量不降）。禁把 skill 正文嵌进步骤包。
# 富编排笔记：packets/defect/_orch.yaml（重建用）。禁通读本 YAML 其他 step。
workflow:
  id: defect
  name: 测试缺陷协作
  version: 7
entry_points:
  缺陷协作: classify
  查重: classify
  提交到平台: classify
  回归: classify
  指派给我: classify
  已解决: classify
  复测: classify
  缺陷变化巡检: classify
  补充澄清: classify
  产品判定回流: classify
trigger:
- 缺陷协作
- 查重
- 提交到平台
- 回归（指派给我 / 已解决 / 平台）
- 指派给我 + 回归|验证|复测
- 缺陷变化巡检 / 我提交的缺陷有没有新回复 / 看产品确认
- 补充澄清 / 开发无法复现 / 请补充说明
- 产品判定回流 / 产品退回测试 / 产品说非问题
preflight:
  skip_if: activeContext 中 wf-testing onboard 的值为 done
  once: 按 agents/onboard-agent.yaml 接入清单核验
  on_fail: 'onboard → 写 wf-testing onboard: done → resume'
steps:
- name: 识别子类
  id: classify
  must_read:
  - rules/packets/defect/classify.md
  agent: bug-agent
  next: search
  output: 子类判定（回归/提交/修改/查重/列表/巡检/澄清/产品回流 + 依据）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect/_orch.yaml。
- name: 查重或拉取
  id: search
  must_read:
  - rules/packets/defect/search.md
  agent: bug-agent
  next: submit
  tools:
  - defect-platform
  output: 查重键/拉取快照 + diff 摘要（单号/变化/证据缺口）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect/_orch.yaml。
- name: 提交或回写
  id: submit
  must_read:
  - rules/packets/defect/submit.md
  when: defect_submit_required
  agent: bug-agent
  on_fail: 不提交/不回写；补证据、补探查或问用户；不得为交平台改标失败
  gate: writeback-receipt
  gate_type: machine
  gate_when: remark_writeback
  hitl:
  - name: confirm_remark
    when: remark_writeback
  - name: confirm_platform
    when: platform_submit
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect/_orch.yaml。
  output: 平台单号（或待确认后的统一导出路径）· 备注与状态同轮 · 可复制汇总块（collaboration.md §5.2）
- name: 收尾
  id: wrap
  must_read:
  - rules/packets/defect/wrap.md
  - rules/templates/90-handoff/closeout-skeleton.md
  output: 【任务收尾】
  agent: report-agent
  hitl: confirm_commit
  hitl_when: has_pending_commit
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/defect/_orch.yaml。
