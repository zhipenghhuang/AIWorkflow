# 编排：进 wf → workflows/testing.md；执行 → 当前 step 步骤包；终端 → _shared/closeout.md。
# 步骤卡 §6 必开技能：打开→执行→回包。禁把 skill 正文嵌进步骤卡。
# 本 YAML 只定义状态/门/产出；不用于运行时通读。
workflow:
  id: testing
  name: AI测试流程（分析驱动）
  version: 22
  terminal: closeout
entry_points:
  分析需求: plan
  梳理测试依据: plan
  理解PRD: plan
  理解 PRD: plan
  需求建模: plan
  测试计划: plan
  生成测试计划: plan
  根据迭代生成测试计划: plan
  按迭代生成测试计划: plan
  根据版本生成测试计划: plan
  根据需求生成测试计划: plan
  根据方案生成测试计划: plan
  功能测试计划: plan
  更新计划: plan
  本期变更: plan
  计划变更: plan
  增量变更: plan
  新文档更新测试计划: plan
  按测试计划执行: execute
  按计划执行: execute
  继续测试计划: execute
  执行测试计划: execute
  执行测试: execute
  执行: execute
  跑: execute
  按计划回归: execute
  回归重跑: execute
  重跑: execute
  执行专项: execute
  执行接口测试: execute
  执行探索式测试: execute
  执行随机业务流程: execute
  执行性能测试: execute
  执行安全测试: execute
  执行兼容性测试: execute
  测试报告: report
  出报告: report
  准出评估: report
trigger:
- 生成测试计划 / 根据迭代生成测试计划 / 根据版本生成测试计划
- 按测试计划执行 / 执行测试计划 / 继续测试计划
- 测试报告 / 准出评估 / 当前状态 / 下一步
- 功能 / 接口 / 探索式 / 发布前 / 按计划回归（裸「回归」先消歧 defect 单回归 vs execute）
- 缺陷 / 交接 / 接入 / 资料（另链）
preflight:
  skip_if: activeContext 中 wf-testing onboard 的值为 done
  once: 按 agents/onboard-agent.yaml 接入清单核验
  on_fail: 'onboard → 写 wf-testing onboard: done → resume'
steps:
- name: 分析并生成测试计划
  id: plan
  must_read:
  - rules/packets/testing/plan.md
  - rules/templates/10-planning/test-analysis-template.md
  - rules/templates/10-planning/test-plan-template.md
  agent: test-planner
  gate: coverage-map
  gate_type: machine
  gate_when: analysis_coverage_required
  hitl:
  - name: select_mainread
    when: mainread_unspecified
  - name: confirm_understanding
    when: understanding_needs_confirm
  - name: confirm_plan
    when: plan_needs_confirm
  - name: confirm_iteration_close
    when: iteration_close_needed
  - name: confirm_docs_migration
    when: docs_migration_needed
  next: execute
  output: '{workroot}/{ver}/test-analysis.md（必做；来源/AC/设计点/意图/风险/覆盖）+ {workroot}/{ver}/test-plan.md（总排）'
  notes: 先完整分析主读（至少再读 1 个互补源：原型/接口/代码/现网/历史缺陷）并读 `env-baseline.md` 命中节，再写计划。模板两份都填：`rules/templates/10-planning/test-analysis-template.md`（分析）+
    `rules/templates/10-planning/test-plan-template.md`（总排）。分析必做：来源盘点/章节回执/依据覆盖/AC 设计点账本；每条有意图或 N/A+依据+接受人；覆盖矩阵/方法矩阵/D01–D13+S6/S7/S11/风险/影响面/核心链路无未接受空格。计划只做总排（引用计数/摘要/轨道轮次/准入准出），不重复分析大表。分析未确认不得写计划；计划未确认不得执行。
- name: 按计划执行
  id: execute
  must_read:
  - rules/packets/testing/execute.md
  - rules/templates/20-test-cases/test-case-template.md
  agent: test-orchestrator
  prev: plan
  precondition: 分析表与测试计划已确认；按计划执行全部在范围意图
  gate: execute-batch
  gate_type: machine
  gate_when: module_batch_complete
  hitl:
  - name: confirm_execution_scope
    when: scope_needs_confirm
  output: 执行记录（场景+步骤+结果+证据）+ 缺陷 + 计划状态
  notes: 按计划执行全部在范围 P0/P1/P2 意图：功能/接口/探索/发布前/回归按计划轮次与批次推进；开跑前读 `env-baseline.md` 命中节；开跑先按原文目录/可验收单元对账分析 §1.1/§1.2/§2.1.1，漏来源/漏章、漏
    AC/字段规则/入口先补分析再执行；对账写功能/接口执行记录 §0「原文对账」行（探索/发布前在本轨记录信息写同义对账；可验收单元 N/已覆盖 n/本轮补录 n/未关 0+接受人）。多源对照硬门槛：逐场景打开原文对应段并另读≥1互补源，分析只作索引，禁只读分析（做法按
    §6 执行技能闭环）；边执行边写执行记录（场景+原文/依据+步骤+数据+Oracle+结果+证据+缺陷+意图结论）；步骤写清位置/数据/预期，供人复核；不把步骤当预写脚本逐条点。全部 `处置=测` 意图到终态，P1/P2 不得用低优先级跳过；失败/阻塞/待实现留证并进缺陷；P0
    意图至少一条证伪场景（负向/状态/权限/幂等/恢复按适用），只有正向通过不得记 P0 完整；T1+ 功能收口前 S6/S7/S11 有落点；批末按计划 §3.1 批次/意图范围核对本轮记录，缺意图补测或写缺口+接受人，未关不得合并，并更新计划
    §0/§6 与执行记录结论。
- name: 输出报告
  id: report
  must_read:
  - rules/packets/testing/report.md
  - rules/templates/40-report-review/test-report-template.md
  agent: report-agent
  prev: execute
  next: closeout
  on_fail: 先修数据/证据或报阻塞；未 PASS/CONDITIONAL 不得进入 closeout
  gate: report-consistency
  gate_type: machine
  output: '{workroot}/{ver}/test-report.md + 【任务收尾】'
  notes: 按意图/优先级/轨道汇总：结论唯一（PASS/CONDITIONAL/FAIL/BLOCKED）；声明 runId/构建/suite/depth；P0 全过；全部 P0/P1/P2 意图有终态；覆盖矩阵/影响面/核心链路/S6-S7-S11/探索缺口显式列接受人；报告
    §2.3 写执行记录 §0 原文对账、来源/章节、AC/设计点、细节维、影响面、核心链路、S6/S7/S11 的落点与缺口，只写模块名/无 ID 不算收口；数字与执行记录一致；先正文再 `-Mode report`；未 PASS/CONDITIONAL
    不得写整体通过。
- name: 收尾与提交
  id: closeout
  must_read:
  - rules/packets/_shared/closeout.md
  agent: report-agent
  hitl:
  - name: confirm_platform
    when: platform_ask_required
  - name: confirm_commit
    when: has_pending_commit
  output: 任务收尾 + 拟提交确认
  notes: 收尾与提交；共享终端；状态=done。
