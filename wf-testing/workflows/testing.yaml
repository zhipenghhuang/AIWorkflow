# 编排：进 wf → workflows/testing.md；执行 → 当前 step 步骤包；终端 → _shared/closeout.md。
# 步骤卡 §6 必开技能：整卡读取→执行→回包。禁把 skill 正文嵌进步骤卡。
# 本 YAML 只定义状态/门/产出；不用于运行时通读。
workflow:
  id: testing
  name: AI测试流程（分析驱动）
  version: 23
  terminal: closeout
entry_points:
  分析需求: plan
  梳理测试依据: plan
  理解PRD: plan
  理解 PRD: plan
  需求建模: plan
  测试计划: plan
  生成测试计划: plan
  根据迭代生成测试计划: plan
  按迭代生成测试计划: plan
  根据版本生成测试计划: plan
  根据需求生成测试计划: plan
  根据方案生成测试计划: plan
  功能测试计划: plan
  更新计划: plan
  本期变更: plan
  计划变更: plan
  增量变更: plan
  新文档更新测试计划: plan
  按测试计划执行: execute
  按计划执行: execute
  继续测试计划: execute
  执行测试计划: execute
  执行测试: execute
  执行: execute
  跑: execute
  按计划回归: execute
  回归重跑: execute
  重跑: execute
  执行专项: execute
  执行接口测试: execute
  执行探索式测试: execute
  执行探索式: execute
  执行随机业务流程: execute
  执行性能测试: execute
  执行安全测试: execute
  执行兼容性测试: execute
  执行兼容性: execute
  执行发布前: execute
  测试报告: report
  出报告: report
  准出评估: report
  测试计划评审: review-plan
  分析评审: review-plan
  计划文档评审: review-plan
trigger:
- 生成测试计划 / 根据迭代生成测试计划 / 根据版本生成测试计划
- 按测试计划执行 / 执行测试计划 / 继续测试计划
- 测试报告 / 准出评估 / 当前状态 / 下一步
- 功能 / 接口 / 探索式 / 发布前 / 按计划回归（裸「回归」先消歧 defect 单回归 vs execute）
- 缺陷 / 交接 / 接入 / 资料（另链）
preflight:
  skip_if: activeContext 中 wf-testing onboard 的值为 done
  once: 按 agents/onboard-agent.yaml 接入清单核验
  on_fail: 'onboard → 写 wf-testing onboard: done → resume'
steps:
- name: 分析并生成测试计划
  id: plan
  skills:
  - test-basis-analysis
  - test-analysis-and-plan
  - test-data-and-environment
  must_read:
  - rules/packets/testing/plan.md
  - rules/templates/10-planning/test-analysis-template.md
  - rules/templates/10-planning/test-plan-template.md
  agent: test-planner
  gate: coverage-map
  gate_type: machine
  gate_when: analysis_coverage_required
  hitl:
  - name: select_mainread
    when: mainread_unspecified
  - name: confirm_understanding
    when: understanding_needs_confirm
  - name: confirm_exploratory_scope
    when: exploratory_scope_reduced
  - name: confirm_plan
    when: plan_confirm_without_doc_review
  - name: confirm_iteration_close
    when: iteration_close_needed
  - name: confirm_docs_migration
    when: docs_migration_needed
  next: review-plan
  output: '{workroot}/{ver}/test-analysis.md（必做；来源/AC/设计点/意图/风险/覆盖）+ {workroot}/{ver}/test-plan.md（总排）'
  notes: 本步任务：先完整分析入账再计划总排（分析+计划两份模板见 §7）。硬门槛：方案为主参考；主读+≥1 互补源；读 env-baseline 命中节；方案每一个应测细节/设计点入账；§2.1 INT+字段级 Oracle（禁主题句充数，见
    testcase-design §3.1）；可独立证伪的设计规则默认分列 INT（映射≠合并；覆盖深度与发现问题优先，禁为通过率折叠）；覆盖面/方法矩阵无未接受空格；计数被行数支撑；禁「先粗计划、执行再补分析」；分析未确认不写计划；覆盖闸未过不得称分析完整；版本级可执行授权在
    `review-plan`（独立评审+`confirm_plan`）；lite 无落地评审时本步 `confirm_plan`。§0/§3.1 与分析联动；§3.2 探索每行有主责/同路径 SC/为什么不能固化；准出/轨道纳入见 multi-track-quality
    §0+文首；不预生成全量用例≠可浅测。做法见 §6；门槛细则见本步规则卡。 读 `project-guide.md`（若有）作为存量行为基线；本期变化仍以 PRD/方案/提测单为准；冲突记 GAP。
- name: 测试计划独立评审
  id: review-plan
  skills:
  - test-doc-review
  must_read:
  - rules/packets/testing/review-plan.md
  when: plan_doc_review_required
  agent: reviewer-agent
  prev: plan
  next: execute
  on_fail: 回 plan 修订分析/计划；未过不得 execute
  hitl:
  - name: select_review_mode
    when: landing_doc_review_needed
  - name: confirm_plan
    when: plan_needs_confirm
  output: 评审-测试计划-*.md 或 HUMAN_APPROVED；计划可执行确认
  notes: 技能：`skills/test-doc-review/SKILL.md`（整卡）。版本级分析+计划落盘且覆盖闸可 PASS 后：STOP 选 A｜B；选 B 按量规只报缺口。通过后再 `confirm_plan`（可执行授权）。lite/T0
    无新增功能面 → when 假跳过，确认留在 plan。不替代 coverage/execute/report 机检；不与执行拆分档证据复核混用。
- name: 按计划执行
  id: execute
  skills:
  - testcase-design
  - test-execution-and-exploration
  - test-data-and-environment
  skills_conditional:
    test-interface: 计划含接口轨/执行接口批
    test-performance-security-compatibility: 计划含发布前/性能/安全/兼容
    ai-feature-testing: 被测含 LLM/RAG/Agent
  must_read:
  - rules/packets/testing/execute.md
  - rules/templates/20-test-cases/test-case-template.md
  agent: test-orchestrator
  prev: review-plan
  precondition: 分析表与测试计划已确认；landing_doc_review_needed 曾为真 → review-plan 已通过（或 when 假已跳过）；按计划执行全部在范围意图
  gate: execute-batch
  gate_type: machine
  gate_when: module_batch_complete
  hitl:
  - name: confirm_execution_scope
    when: scope_needs_confirm
  output: 执行记录（场景+步骤+结果+证据）+ 缺陷 + 计划状态
  notes: 本步任务：按计划执行全部在范围 P0/P1/P2 意图与轨道（功能/接口/探索/发布前/回归）。**记录写法（硬）**：功能记录步骤=业务 UI；API/脚本/Network 只进「技术核对」列或失败卡接口判定；纯 API 场景归
    `api/` 轨；通过行实际写可见事实，禁只写「符合」。开跑前读 `env-baseline.md` 命中节；取档以计划 §3.1 为真值；开跑声明 `exec_mode=`+`pg=`。**门槛以机检为 SSOT**：批末跑 `-Mode
    execute -Scope "{模块/域}"`，按其输出逐条清零；包内与本闸冲突时以闸为准。**机检覆盖（包内不复述）**：原文对账与 §0 分析索引/每场景实际差异；§1.1 九项（六类+同源/入口空态/终态）SC（UI/视觉禁弱
    N/A）；处置=测意图终态/P0 证据；INT∈分析 §2.1；失败/待实现失败卡（含 surface；surface=ui 须截图）。**人工必守（机检不覆盖）**：① 记录步骤写业务 UI，API/Network 只进「技术核对」。②
    命中页面·路由·控件·布局·导出时 UI 面须 ≥1 条浏览器实点（E1），无面对才写事实句。③ 缺数据/账号/入口先自助造数/换样/换角（有界），阻塞摘要须卡点+已尝试+恢复条件，专用负向无配方不得标通过。④ 深度与 Oracle 按
    `testcase-design` §3/§3.1（禁浅打勾、禁删负向 Q9、禁主题句撑 P0）。⑤ 探索主责面批末自查：主责=探索面有非空记录+功能化，功能主责面不重复；空壳/缺功能化在报告门 FAIL。⑥ 接口 `api/` 记录、depth、维表与缺口
    N/A 批末自查（缺口仅用户确认，Q19）；报告门复核。⑦ 批末更新计划 §0/§6、失败进缺陷、对人进度（global-rules §8）。
- name: 输出报告
  id: report
  skills:
  - test-report
  must_read:
  - rules/packets/testing/report.md
  - rules/templates/40-report-review/test-report-template.md
  agent: report-agent
  prev: execute
  next: closeout
  on_fail: 先修数据/证据或报阻塞；未 PASS/CONDITIONAL 不得进入 closeout
  gate: report-consistency
  gate_type: machine
  output: '{workroot}/{ver}/test-report.md + 【任务收尾】'
  notes: 本步任务：出准出报告。报告正文按开发/产品可读写；不写内部用例号/意图号/门禁名/测试数据编号；内部追溯留在执行记录/分析。 结论唯一（PASS/CONDITIONAL/FAIL/BLOCKED）；失败与阻塞并存优先 FAIL（用例态见
    `rules/defects/classification.md`）。硬门槛：P0 全过；全部处置=测意图有终态；报告计数与执行记录一致；对账/细节维在执行记录/分析可回指；报告正文不写内部 ID；原文对账未关>0 不得 PASS；计划纳入的功能/接口/探索/发布前四轨记录可复核（发布前须有硬映射行、探索须有主责/同路径
    SC/为什么不能固化/检查点结论/功能化）；报告 §2.4 探索行/功能化列与计划 §3.2 已跑探索面数量一致；S6/S7/S11 在计划 §3.2/执行记录回指，报告 §2.4 用业务风险名写落点；CONDITIONAL 须 §4
    有接受人与复审点；缺口显式。先正文再 `-Mode report`。模板见 §7。
- name: 收尾与提交
  id: closeout
  skills: []
  must_read:
  - rules/packets/_shared/closeout.md
  agent: report-agent
  hitl:
  - name: confirm_platform
    when: platform_ask_required
  - name: confirm_commit
    when: has_pending_commit
  output: 任务收尾 + 拟提交确认
  notes: 收尾与提交；共享终端；状态=done。
