# 读取：仅当前 step 块。运行时 must_read[0]=rules/packets/<wf>/<step>.md（自包含）。
# 禁通读规则目录；方法已嵌入步骤包。维护素材：skills/、rules/core 长文、playbooks/、read-index。
workflow:
  id: testing
  name: AI测试流程
  version: 19
entry_points:
  分析需求: analyze
  理解PRD: analyze
  理解 PRD: analyze
  梳理测试依据: analyze
  需求建模: analyze
  测试计划: plan
  生成测试计划: plan
  功能测试计划: plan
  更新计划: plan
  本期变更: plan
  计划变更: plan
  增量变更: plan
  新文档更新测试计划: plan
  按测试计划执行: execute
  按计划执行: execute
  执行测试计划: execute
  继续测试计划: execute
  回归: execute
  重跑: execute
  脚本执行: execute
  跑脚本: execute
  执行: execute
  跑: execute
  专题: execute
  当前状态: status
  计划状态: status
  下一步: status
  生成测试资产: generate
  生成用例: generate
  生成接口测试资产: generate
  生成探索式用例: generate
  生成随机业务流程: generate
  生成业务随机: generate
  生成性能测试资产: generate
  生成安全测试资产: generate
  生成兼容测试资产: generate
  用例评审: review-cases
  评审用例: review-cases
  测试用例评审: review-cases
  测试计划评审: review-cases
  接口资产评审: review-cases
  修改方案专项: generate
  执行测试: execute
  执行专项: execute
  执行接口测试: execute
  执行探索式测试: execute
  执行随机业务流程: execute
  执行业务随机: execute
  执行性能测试: execute
  执行安全测试: execute
  执行兼容性测试: execute
  测试报告: report
  出报告: report
  准出评估: report
  用例脚本: generate
  更新脚本: generate
trigger:
- 生成测试资产
- 执行测试
- 测试计划 / 测试报告 / 生成测试计划
- 本期变更 / 计划变更 / 增量变更 / 新文档更新测试计划
- 按计划执行 / 执行测试计划 / 按测试计划执行 / 继续测试计划
- 当前状态 / 下一步
- 执行专题
- 用例脚本（编写/执行）
- 用例评审 / 评审用例 / 测试用例评审
- 探索式 / 探索测试 / 随机业务流程 / 业务随机 / 接口 / 发布前（同文件，按轨契约分产物；随机为计划外）
preflight:
  skip_if: activeContext 中 wf-testing onboard 的值为 done
  once: 按 agents/onboard-agent.yaml 接入清单核验
  on_fail: 'onboard → 写 wf-testing onboard: done → resume'
steps:
- name: 当前状态与下一步
  id: status
  must_read:
  - rules/packets/testing/status.md
  agent: test-planner
  output: 当前阶段/门/下一动作/需人工
  notes: 只读 test-plan //；「下一步」只报不执行。未吸收文档→plan；未回执交接→handoff。 只读可 2～3 行简报；首条含 route/step/phase/gate/next_action。
- name: 分析需求
  id: analyze
  must_read:
  - rules/packets/testing/analyze.md
  agent: test-analyzer
  hitl:
  - name: select_mainread
    when: mainread_unspecified
  - name: confirm_understanding
    when: understanding_needs_confirm
  output: '{workroot}/test-analysis.md（§0 Brief+Delta 必填）+ 用户版说明（T1+ 可见变化）'
  notes: 主读一问即止； 必填；confirm_understanding 主屏=。方法只认 test-basis-analysis 必做。 用户版/交接/入站见技能与 doc-governance REF。
- name: 测试计划
  id: plan
  must_read:
  - rules/packets/testing/plan.md
  agent: test-planner
  hitl:
  - name: select_mainread
    when: mainread_unspecified
  - name: confirm_understanding
    when: understanding_needs_confirm
  - name: select_review_mode
    when: landing_doc_review_needed
  - name: confirm_review
    when: review_needs_confirm
  - name: confirm_plan
    when: plan_needs_confirm
  - name: confirm_iteration_close
    when: iteration_close_needed
  - name: confirm_docs_migration
    when: docs_migration_needed
  output: '{workroot}/test-plan.md（+ 版本级四卷按 §3.8；T0/T1 可无）'
  notes: 无分析表或缺 → 先 analyze。版本级四卷+批次表；T0/T1 轻量。when 假则跳过对应门。 依据覆盖见 verification ；方法只认 test-analysis-and-plan 必做。
- name: 生成用例
  id: generate
  must_read:
  - rules/packets/testing/generate.md
  agent: testcase-agent
  gate: coverage-map
  gate_type: machine
  gate_when: functional_coverage_required
  hitl:
  - name: confirm_understanding
    when: understanding_needs_confirm
  - name: select_mainread
    when: mainread_unspecified_for_generate
  - name: confirm_platform
    when: standalone_generate_with_pending
  output: '{workroot}/functional|api|… 用例/台账/脚本（按轨）'
  notes: 须有分析表；功能双读原文+表；覆盖闸仅功能/专项。生成后 T1+ 须衔接收 review-cases。 细则只认 testcase-design / multi-track-quality / script-execution
    REF。
- name: 用例与多轨资产评审
  id: review-cases
  must_read:
  - rules/packets/testing/review-cases.md
  agent: testcase-reviewer
  gate: case-review
  gate_type: machine
  gate_when: case_review_required
  hitl:
  - name: select_review_mode
    when: landing_doc_review_needed
  - name: confirm_review
    when: review_needs_confirm
  output: 评审记录（单域或合卷路径见 templates）
  notes: STOP 选 A/B；不重生成。功能选 B 跑 -Mode review。方法只认 testcase-review / artifact-review 必做。
- name: 执行测试
  id: execute
  must_read:
  - rules/packets/testing/execute.md
  agent: test-orchestrator
  precondition: 功能/专项 T1+ 已由 review-cases 放行（T0 可 SELF_CHECKED）；未放行不得开跑
  on_fail: 回 review-cases 补齐；不得先执行后补评审
  gate: execute-batch
  gate_type: machine
  gate_when: module_batch_complete
  hitl:
  - name: confirm_understanding
    when: understanding_needs_confirm
  - name: select_mainread
    when: exploratory_mainread_missing
  - name: confirm_execution_scope
    when: scope_needs_confirm
  output: 执行结果/≤3 行简报
  notes: 计划驱动按 / 装填；批末 execute -Scope；能脚本不 AI；P0-Smoke 未过不进正式全库。 SSOT=execute playbook + 当前轨 + 技能必做；禁把整本方法抄回本 notes。
- name: 输出报告
  id: report
  must_read:
  - rules/packets/testing/report.md
  agent: report-agent
  next: handoff
  on_fail: 先修数据/证据或报阻塞；未 PASS/CONDITIONAL 不得进入 handoff
  gate: report-consistency
  gate_type: machine
  output: '{workroot}/test-report.md + 【任务收尾】'
  notes: 先正文再 -Mode report；未 PASS/CONDITIONAL 不得写整体通过。同步 plan/台账/activeContext（triad）。 关账/materials/禁改根 CHANGELOG 见 doc-governance
    REF；门3 在 handoff。
- name: 收尾与提交确认
  id: handoff
  must_read:
  - rules/packets/testing/handoff.md
  agent: report-agent
  hitl:
  - name: confirm_platform
    when: platform_ask_required
  - name: confirm_commit
    when: has_pending_commit
  output: 提交/交平台确认结果
  notes: 骨架后问平台/git；回写前 -Claim -Mode writeback。浏览器退程见 multi-agent-output 。
