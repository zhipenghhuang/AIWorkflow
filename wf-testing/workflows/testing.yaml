# 编排：进 wf → workflows/testing.md；执行 → 当前 step 步骤包；终端 → _shared/closeout.md。
# 步骤卡 §6 必开技能：打开→执行→回包。禁把 skill 正文嵌进步骤卡。
# 本 YAML 只定义状态/门/产出；不用于运行时通读。
workflow:
  id: testing
  name: AI测试流程（分析驱动）
  version: 22
  terminal: closeout
entry_points:
  分析需求: plan
  梳理测试依据: plan
  理解PRD: plan
  理解 PRD: plan
  需求建模: plan
  测试计划: plan
  生成测试计划: plan
  根据迭代生成测试计划: plan
  按迭代生成测试计划: plan
  根据版本生成测试计划: plan
  根据需求生成测试计划: plan
  根据方案生成测试计划: plan
  功能测试计划: plan
  更新计划: plan
  本期变更: plan
  计划变更: plan
  增量变更: plan
  新文档更新测试计划: plan
  按测试计划执行: execute
  按计划执行: execute
  继续测试计划: execute
  执行测试计划: execute
  执行测试: execute
  执行: execute
  跑: execute
  按计划回归: execute
  回归重跑: execute
  重跑: execute
  执行专项: execute
  执行接口测试: execute
  执行探索式测试: execute
  执行随机业务流程: execute
  执行性能测试: execute
  执行安全测试: execute
  执行兼容性测试: execute
  测试报告: report
  出报告: report
  准出评估: report
trigger:
- 生成测试计划 / 根据迭代生成测试计划 / 根据版本生成测试计划
- 按测试计划执行 / 执行测试计划 / 继续测试计划
- 测试报告 / 准出评估 / 当前状态 / 下一步
- 功能 / 接口 / 探索式 / 发布前 / 按计划回归（裸「回归」先消歧 defect 单回归 vs execute）
- 缺陷 / 交接 / 接入 / 资料（另链）
preflight:
  skip_if: activeContext 中 wf-testing onboard 的值为 done
  once: 按 agents/onboard-agent.yaml 接入清单核验
  on_fail: 'onboard → 写 wf-testing onboard: done → resume'
steps:
- name: 分析并生成测试计划
  id: plan
  must_read:
  - rules/packets/testing/plan.md
  - rules/templates/10-planning/test-analysis-template.md
  - rules/templates/10-planning/test-plan-template.md
  agent: test-planner
  gate: coverage-map
  gate_type: machine
  gate_when: analysis_coverage_required
  hitl:
  - name: select_mainread
    when: mainread_unspecified
  - name: confirm_understanding
    when: understanding_needs_confirm
  - name: confirm_plan
    when: plan_needs_confirm
  - name: confirm_iteration_close
    when: iteration_close_needed
  - name: confirm_docs_migration
    when: docs_migration_needed
  next: execute
  output: '{workroot}/{ver}/test-analysis.md（必做；来源/AC/设计点/意图/风险/覆盖）+ {workroot}/{ver}/test-plan.md（总排）'
  notes: 本步任务：先完整分析入账再计划总排（分析+计划两份模板见 §7）。硬门槛：方案为主参考；主读+≥1 互补源；读 env-baseline 命中节；方案每一个应测细节/设计点入账；§2.1 INT+Oracle；覆盖面/方法矩阵无未接受空格；计数被行数支撑；禁「先粗计划、执行再补分析」；分析未确认不写计划；覆盖闸未过不得称可执行；计划未确认不执行；§0/§3.1
    与分析联动；准出/轨道纳入见 multi-track-quality §0+文首；不预生成全量用例≠可浅测。做法见 §6；门槛细则见本步规则卡。
- name: 按计划执行
  id: execute
  must_read:
  - rules/packets/testing/execute.md
  - rules/templates/20-test-cases/test-case-template.md
  agent: test-orchestrator
  prev: plan
  precondition: 分析表与测试计划已确认；按计划执行全部在范围意图
  gate: execute-batch
  gate_type: machine
  gate_when: module_batch_complete
  hitl:
  - name: confirm_execution_scope
    when: scope_needs_confirm
  output: 执行记录（场景+步骤+结果+证据）+ 缺陷 + 计划状态
  notes: 本步任务：按计划执行全部在范围 P0/P1/P2 意图与轨道（功能/接口/探索/发布前/回归）。开跑前读 `env-baseline.md` 命中节；取档以计划 §3.1 为真值；开跑声明 `exec_mode=`+`pg=`。**硬门槛**：①
    执行记录原文对账齐（可验收单元 N；未关 0，缺口仅用户确认 Q19）② 功能六类有面对须 SC（无面对才 N/A+事实句）③ 全部 `处置=测` 意图终态；P0 须证伪；深度按 Q17；禁浅打勾、禁删负向（Q9）④ INT 须在分析
    §2.1 台账；意图结论回指场景表⑤ 计划含接口轨须非空 `api/` 契约记录+场景表+depth（Q18）；发布前须先建方案+硬映射；探索已跑须非空记录⑥ 缺数据/账号/入口先自助造数/换样/换角（有界），未穷尽禁阻塞；阻塞摘要须卡点+已尝试+恢复条件⑦
    批末跑 execute 闸并更新计划状态；失败/待实现留证进缺陷，真阻塞进盯办。
- name: 输出报告
  id: report
  must_read:
  - rules/packets/testing/report.md
  - rules/templates/40-report-review/test-report-template.md
  agent: report-agent
  prev: execute
  next: closeout
  on_fail: 先修数据/证据或报阻塞；未 PASS/CONDITIONAL 不得进入 closeout
  gate: report-consistency
  gate_type: machine
  output: '{workroot}/{ver}/test-report.md + 【任务收尾】'
  notes: 本步任务：出准出报告。结论唯一（PASS/CONDITIONAL/FAIL/BLOCKED）；失败与阻塞并存优先 FAIL（用例态见 `rules/defects/classification.md`）。硬门槛：P0 全过；全部处置=测意图有终态；报告计数与执行记录一致；对账/细节维可回指（无
    ID 不算收口）；原文对账未关>0 不得 PASS；计划纳入的功能/接口/探索/发布前四轨记录可复核（发布前须有硬映射行、探索须有章程与结论）；S6/S7/S11 有落点；CONDITIONAL 须 §4 有接受人与复审点；缺口显式。先正文再
    `-Mode report`。模板见 §7。
- name: 收尾与提交
  id: closeout
  must_read:
  - rules/packets/_shared/closeout.md
  agent: report-agent
  hitl:
  - name: confirm_platform
    when: platform_ask_required
  - name: confirm_commit
    when: has_pending_commit
  output: 任务收尾 + 拟提交确认
  notes: 收尾与提交；共享终端；状态=done。
