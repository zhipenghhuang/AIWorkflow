# 编排：进 wf → workflows/handoff.md；执行 → 当前 step 步骤包；终端 → _shared/closeout.md。
# 步骤卡 §6 必开技能：打开→执行→回包。禁把 skill 正文嵌进步骤卡。
# 本 YAML 只定义状态/门/产出；不用于运行时通读。
workflow:
  id: handoff
  name: 协作交接
  version: 1
  terminal: closeout
entry_points:
  写交接单: compose
  生成交接包: send
  接收交接包: receive
  变更通知: change_send
  同步变更: change_receive
  重规划: replan
trigger:
- 写交接单 / 生成交接包 / 接收交接包 / 交接状态
- 变更通知 / 同步变更 / 重规划
steps:
- name: 写交接单文档
  id: compose
  must_read:
  - rules/packets/handoff/compose.md
  - rules/templates/90-handoff/handoff-note-template.md
  agent: test-planner
  hitl: confirm_intent
  hitl_when: intent_needs_confirm
  output: 自洽交接单文档（默认非 HO；落 outbound/{category}/；同轮记 handoff-ledger.md）
  notes: '**默认入口**。读 `rules/collaboration/handoff.md` 与 `handoff-note-template.md`（择优，非填空卷）。 **意图择优**：先判 `intent_needs_confirm`（澄清方法见
    clarification）。真 → 完整【意图理解】停等再落盘；假 → 一行【意图】回执后直写。禁止含糊「交接」直接成文。 五问→形态 A/B/C 或专模；禁止整表粘贴。 专模真源写 `{workroot}/{ver}/`（如 `test-report.md`），同轮实拷
    `{workroot}/handoff/outbound/{category}/`；无专模直接写出站类。不建 HO；禁外印元数据。'
- name: 生成交接包
  id: send
  must_read:
  - rules/packets/handoff/send.md
  agent: test-planner
  hitl: confirm_handoff
  hitl_when: handoff_send_required
  output: '{workroot}/handoff/outbound/{category}/{HO-ID}/ + 【交接包已生成】'
  verify: python wf-testing/rules/tools/validate_handoff.py "{workroot}/handoff/outbound/{category}/{HO-ID}"
  on_fail: 缺 00/01/快照/占位符/链接断 → 不发送；补后重跑校验
  notes: '**仅升包**。未命中包触发 → 改 `compose`。先问后发；写盘到 `handoff/outbound/{category}/{HO-ID}/`；刷新出站散文件；跑 `validate_handoff.py` → 台账已发送。
    `04` 空白≠必须填写。有平台已交 → 拒绝重复 BUG 整包。输出【交接包已生成】。'
- name: 接收与签收
  id: receive
  must_read:
  - rules/packets/handoff/receive.md
  agent: test-planner
  hitl:
  - name: confirm_understanding
    when: understanding_needs_confirm
  - name: confirm_plan
    when: plan_needs_confirm
  output: 入站分析/吸收 + 接收回执（按需）+ 测试计划/文档更新 + 台账状态
  notes: '**硬**：打开→分析→吸收→同步；`inbound/` 为原件、`handoff/inbound/` 为收件工作副本。 多包同仓直读对方出站；仓外主副本原件根 `inbound/` + 工作副本 `{workroot}/handoff/inbound/{类别}/`。
    按类型更新计划/分析表/准入；正式签收才回执。更新台账、计划、索引、activeContext。'
- name: 发送变更通知
  id: change_send
  must_read:
  - rules/packets/handoff/change_send.md
  agent: test-planner
  hitl:
  - name: confirm_plan
    when: plan_needs_confirm
  - name: confirm_handoff
    when: handoff_send_required
  output: '{workroot}/handoff/outbound/变更/{CHG-HO-ID}/ + 更新后的测试计划/用例/脚本'
  notes: 先按 `workflows/testing.yaml` 的 plan 期中变更完成 CR/影响分析；本步只负责“通知包”。 按 `rules/collaboration/handoff.md` 判 C0/C1/C2/C3；C2/C3
    必须先过计划门。 **CHG 包同样先问后发**：`confirm_handoff` 出示拟发摘要，用户确认后才生成 HO 包。 必带：CR、影响矩阵、更新后的计划/用例/脚本/报告、接收方必须做的事/截止、回归范围、生效版本。 受影响角色逐个发（产品/开发）；同一变更一个包可多接收方，但回执逐个登记。
    更新 `handoff-ledger.md`、测试计划、 `{workroot}/INDEX.md`、activeContext；输出【变更通知已生成】+ 回执截止。 未确认不得发；不得用口头/聊天替代变更包。
- name: 接收变更并适配
  id: change_receive
  must_read:
  - rules/packets/handoff/change_receive.md
  agent: test-planner
  hitl:
  - name: confirm_understanding
    when: understanding_needs_confirm
  - name: confirm_plan
    when: plan_needs_confirm
  output: 变更影响分析 + 测试计划/用例调整 + 回执
  notes: 读变更包 00/01/02；按 判级别；核对 CR、影响矩阵、生效版本、回归范围。 先做影响分析：需求/AC、范围/准出、用例/脚本、执行编排、缺陷、报告、数据/环境。 更新 `{workroot}/changes/CR-*.md`、测试计划、受影响用例/脚本；C2/C3
    回计划门。 更新 `handoff-ledger.md`、 `{workroot}/INDEX.md`、activeContext；填写回执。 与现有计划/用例冲突 → 列冲突，不静默选一边；未裁决前不执行。
- name: 重规划
  id: replan
  must_read:
  - rules/packets/handoff/replan.md
  agent: test-planner
  hitl: confirm_plan
  hitl_when: plan_needs_confirm
  output: 更新后的测试计划 + 重规划记录
  notes: 按 `rules/collaboration/handoff.md` 触发（需求/提测退回/P0/环境数据/S1-S2/产能/发布窗口）执行；先冻结当前基线快照，再做影响矩阵。 选一个动作并写理由：保持+加缓冲｜重排轮次｜降范围/抽样｜拆轮次｜暂停升级｜重新基线；C2/C3
    必须过计划门。 同轮更新测试计划、`handoff-ledger.md`、 `{workroot}/INDEX.md`、activeContext；受影响的 `TEST/REL` 包标 `已取代` 并重发。 重规划后重过受影响门（计划门/覆盖闸/报告门）；未过门不得准出；向产品/开发发
    `CHG` 包并收回执。
- name: 收尾与提交
  id: closeout
  must_read:
  - rules/packets/_shared/closeout.md
  agent: report-agent
  hitl:
  - name: confirm_commit
    when: has_pending_commit
  output: 任务收尾 + 拟提交确认
  notes: 收尾与提交；共享终端；状态=done。
