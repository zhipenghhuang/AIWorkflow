# 编排：只读当前 step。进 wf → packets/onboard/_chain.md；进子机 → _region-*；执行 → 步骤包。
# 步骤包 §6 必开技能：打开→执行→回包（质量不降）。禁把 skill 正文嵌进步骤包。
# 富编排笔记：packets/onboard/_orch.yaml（重建用）。禁通读本 YAML 其他 step。
workflow:
  id: onboard
  name: 测试规范接入
  version: 5
  chain: full
entry_points:
  接入: baseline
  重新接入: migrate
  生成环境基线: baseline
  装配能力: capabilities
  生成README: baseline
  更新README: baseline
  整理README: baseline
  资料收取: materials
  资料整理: materials
  资料归档: materials
  资料巡检: materials
  文档整理: lifecycle
  文档巡检: lifecycle
  文档清理: lifecycle
  清理临时文件: lifecycle
  清理过程文件: lifecycle
  清理无效文件: lifecycle
  清理失效文件: lifecycle
  清理垃圾文件: lifecycle
  清理临时: lifecycle
  归档失效文档: lifecycle
trigger:
- 接入
- 重新接入
- 生成环境基线
- 装配能力
- 资料收取 / 资料整理 / 资料归档 / 资料巡检
- 文档整理 / 文档巡检 / 文档清理 / 清理临时文件 / 清理过程文件 / 清理无效文件 / 清理失效文件 / 清理垃圾文件 / 清理临时 / 归档失效文档
- preflight-once
steps:
- name: 旧结构迁移
  id: migrate
  must_read:
  - rules/packets/onboard/migrate.md
  agent: onboard-agent
  hitl: confirm_docs_migration
  hitl_when: docs_migration_needed
  output: 迁移清单/更新后的路径
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/onboard/_orch.yaml。
- name: 挂载与基线
  id: baseline
  must_read:
  - rules/packets/onboard/baseline.md
  agent: onboard-agent
  output: env-baseline.md（§1/§2.1/§2.2/§8）· {workroot}/work-log.md（如无）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/onboard/_orch.yaml。
- name: 资料收取与归档
  id: materials
  must_read:
  - rules/packets/onboard/materials.md
  agent: onboard-agent
  hitl:
  - name: confirm_iteration_close
    when: iteration_close_needed
  - name: confirm_docs_migration
    when: docs_migration_needed
  output: 【入站分析】（确认后登记/A0～A2/发布 materials）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/onboard/_orch.yaml。
- name: 文档治理检查
  id: lifecycle
  must_read:
  - rules/packets/onboard/lifecycle.md
  agent: onboard-agent
  hitl: confirm_docs_migration
  hitl_when: docs_migration_needed
  output: 【文档治理检查】（确认后执行更新/归档/清理）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/onboard/_orch.yaml。
- name: activeContext
  id: context
  must_read:
  - rules/packets/onboard/context.md
  agent: onboard-agent
  output: activeContext.md
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/onboard/_orch.yaml。
- name: 入库策略
  id: gitignore
  must_read:
  - rules/packets/onboard/gitignore.md
  agent: onboard-agent
  hitl: confirm_gitignore
  output: .gitignore 更新 + `git check-ignore` 证据
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/onboard/_orch.yaml。
- name: 环境与工具检查
  id: capabilities
  must_read:
  - rules/packets/onboard/capabilities.md
  agent: onboard-agent
  output: '{workroot}/capabilities/00-能力清单.md（默认静默；点名装配时另出建议）'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/onboard/_orch.yaml。
- name: 核验与打标
  id: verify
  must_read:
  - rules/packets/onboard/verify.md
  agent: onboard-agent
  output: '{workroot}/changes/接入核验-{yyyyMMdd}.md（①～⑦ 逐项 通过/缺口 + 证据）'
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/onboard/_orch.yaml。
- name: 收尾
  id: wrap
  must_read:
  - rules/packets/onboard/wrap.md
  - rules/templates/90-handoff/closeout-skeleton.md
  agent: onboard-agent
  output: 【任务收尾】（接入明细置第 1 点，六段压缩）
  notes: 只读 must_read 步骤包（+流程链 `_chain` 进 workflow 时一次）。本字段非规则正文；编排笔记见 packets/onboard/_orch.yaml。
