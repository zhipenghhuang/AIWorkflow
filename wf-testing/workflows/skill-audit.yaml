# 读取：仅当前 step 块。运行时 must_read[0]=rules/packets/<wf>/<step>.md（自包含）。
# 禁通读规则目录；方法已嵌入步骤包。维护素材：skills/、rules/core 长文、playbooks/、read-index。
workflow:
  id: skill-audit
  name: 能力与技能体检
  version: 2
  chain: full
entry_points:
  体检能力: scope
  能力技能体检: scope
  检查技能能力: scope
  能力优化: scope
  技能优化: scope
  优化能力: scope
  优化技能: scope
  优化技能能力: scope
  更新能力建议: scope
  更新技能: scope
  维护技能能力: scope
  通用优化技能: scope
  通用最优技能: scope
trigger:
- 体检能力 / 能力技能体检 / 检查技能能力 / 能力优化 / 技能优化 / 优化能力 / 优化技能 / 优化技能能力
- 更新能力建议 / 更新技能 / 维护技能能力
- 通用优化技能 / 通用最优技能
steps:
- name: 定范围与模式
  id: scope
  must_read:
  - rules/packets/skill-audit/scope.md
  agent: onboard-agent
  output: 体检范围卡（模式 project/generic、范围、依据）
  notes: 读 playbook ：含「通用/不按项目/通用最优」→ generic；无填实基线且无 `{workroot}/capabilities/00-能力清单.md` → **强制 generic**；有填实清单或基线 → project。
    范围：全量｜仅能力｜仅技能｜按轨。generic 默认全量。
- name: 盘点
  id: inventory
  must_read:
  - rules/packets/skill-audit/inventory.md
  agent: onboard-agent
  output: 库存摘要（capabilities/skills/映射/缺口，含证据）
  notes: 读 `{workroot}/capabilities/00-能力清单.md`（无则记缺口）+ 包内契约/参考目录；`skills/README.md` 映射；抽查本范围 SKILL frontmatter；禁通读全部技能正文。
    输出【库存摘要】。可顺带跑 `rules/tools/check_skills.py <本包根> --strict`，失败记入缺口。
- name: 生态检索
  id: discover
  must_read:
  - rules/packets/skill-audit/discover.md
  agent: onboard-agent
  output: 生态检索表（query / 候选 / installs / 吸收动作 / 证据）
  notes: 按 `rules/playbooks/skill-audit.md` ：`npx skills find <query>` 或 find-skills；先看 skills.sh 榜。 质量闸 ≥1K installs + 信誉源；【生态检索】只列可吸收方法｜能力候选｜维持；禁未确认
    skills add 进母版；禁外部生成器绕过分析表/oracle。 无网络/CLI → 降级只读参考目录并记原因。
- name: 适配分析
  id: fit
  must_read:
  - rules/packets/skill-audit/fit.md
  agent: onboard-agent
  output: 适配分析表（够用/缺口/过重/冲突/重复/映射断裂/可吸收方法 + 证据）
  notes: project：对照环境基线、T 级、轨道、计划缺口、近期门/降级。generic：对照主选备选与技能完整性，不写环境特例。 合并 inventory + discover：够用｜缺口｜过重｜冲突｜重复｜映射断裂｜可吸收方法。
- name: 出具建议
  id: propose
  must_read:
  - rules/packets/skill-audit/propose.md
  agent: onboard-agent
  output: '{workroot}/changes/能力技能体检-{yyyyMMdd}.md（工作产物，不进资料区）'
  notes: 按 `rules/templates/00-onboarding/capability-skill-audit-report-template.md` 与 playbook ；含「生态检索」节；P0 置顶。 能力拟改只针对 `{workroot}/capabilities/`；技能可改本包
    `skills/`；未确认不改；可列「下一步：装配能力」。
- name: 确认并应用
  id: apply
  must_read:
  - rules/packets/skill-audit/apply.md
  agent: onboard-agent
  hitl: confirm_skill_changes
  hitl_when: skill_changes_pending
  output: 已应用变更清单 + ValidateTemplateRefs / check_skills 自检结果
  notes: 有拟改项 → skill_changes_pending=true，出示【拟变更清单】确认后按 playbook 执行；否则跳过。 改包后**必须**跑 `rules/tools/Invoke-TestWorkflow.ps1
    -Action ValidateTemplateRefs`；改技能另跑 `check_skills.py --strict`；失败不得声称完成；结果写入体检报告。
- name: 收尾
  id: wrap
  must_read:
  - rules/packets/skill-audit/wrap.md
  - rules/templates/90-handoff/closeout-skeleton.md
  agent: onboard-agent
  output: 【任务收尾】
  notes: 对照 `rules/templates/90-handoff/closeout-skeleton.md` ；第1点写模式/范围/建议数/已应用数
- name: 拟提交
  id: commit
  must_read:
  - rules/packets/skill-audit/commit.md
  - rules/templates/90-handoff/closeout-skeleton.md
  agent: onboard-agent
  hitl: confirm_commit
  hitl_when: has_pending_commit
  output: 拟提交确认结果
  tools:
  - git
  notes: 有skills/实例capabilities/基线索引改动才走；拟提交清单按 `rules/templates/90-handoff/closeout-skeleton.md` / 与 `AGENTS.md` git；无变更跳过。
