# 交付与验收（排期 → 跟进/变更 → UAT → 发布 → 复盘）
# 入口即止：排期/跟进/UAT/发布/复盘各自独立，不自动串完整条链。
workflow:
  id: deliver
  name: 交付与验收
  version: 4
  read_index: 规则/读取索引.md

entry_points:
  排期: schedule
  迭代规划: schedule
  交付计划: schedule
  任务拆解: schedule
  交付跟进: followup
  风险升级: followup
  UAT: uat
  验收: uat
  发布: release
  上线检查: release
  复盘: release

trigger:
  - 排期 / 迭代规划 / 交付计划
  - 交付跟进 / 风险升级
  - UAT / 验收
  - 发布 / 上线检查 / 复盘

steps:
  - name: 排期与交接
    id: schedule
    agent: pm-lead
    output: 产品/{版本或主题}/04-交付与验收/交付计划-{版本}.md（模板 规则/模板/40-交付与验收/交付计划模板.md）
    notes: >
      技能：`技能/change-management/SKILL.md`（先读；排期与变更纪律同源）。
      拆解（Epic→Story→Task）/估时/依赖/风险 → 交付计划（范围/里程碑/发布窗口）；
      **不并行写交付计划**；需要估时/依赖素材时只读分模块 scout，结论集中写。
      前置：PRD 头部 `status: APPROVED`（未定稿 → 只报缺口并回 `workflows/prd.yaml` review 步，不排期）。
      落盘后进入 `review-plan-deliver`（选 A/B）；未过评审方式不得发 PLAN 包。

  - name: 交付计划评审
    id: review-plan-deliver
    agent: reviewer-agent
    hitl: select_review_mode
    hitl_when: landing_doc_review_needed
    output: 评审记录（评审-交付计划-{版本}-{yyyyMMdd}.md）或 HUMAN_APPROVED 声明
    notes: >
      交付计划将驱动开发/测试窗口：**STOP【评审方式】**（`技能/artifact-review`）A 自行｜B AI。
      选 A：出示范围/里程碑/依赖/发布窗自检 → HUMAN_APPROVED。
      选 B：核范围与 PRD 一致、里程碑可执行、依赖显式、测试窗口合理；缺口分级；留痕 `评审-交付计划-{版本}-{yyyyMMdd}.md`。
      通过后默认交付计划/排期正文；`PLAN` 包仅多文件/签收/仓外/点名时停问建议，确认后走 `workflows/handoff.yaml` send（含 `confirm_handoff`），本步不直接落包。未收回执不得称「已接收」。

  - name: 交付跟进
    id: followup
    agent: pm-lead
    output: 产品计划 §7/§8 + 交付计划 §7 状态报告 + 风险/依赖台账
    notes: >
      交付进度/风险/依赖跟进；答疑书面留痕（评论/文档批注），禁口头改需求。
      发现新需求、需求变更、产品缺陷、开发不确定项 → 转 `workflows/change.yaml` intake，按受理/分诊/处置/联动流程执行；
      本步不另造变更单、不直接改 PRD/排期。
      收到开发提测/测试报告/澄清/变更包 → 先按 `workflows/handoff.yaml` receive 核对+回执，再更新跟进记录；未回执不得把下游标为已接收。
      节奏：默认每周一次状态更新；关键依赖延期 >2 个工作日或 > 阶段工期 10% → 升级（计划 §13），并同步 §0/§8/§10。

  - name: UAT 验收
    id: uat
    when: has_uat
    agent: pm-lead
    gate: uat-evidence
    gate_type: machine
    output: 产品/{版本或主题}/04-交付与验收/UAT-{版本}-{yyyyMMdd}.md（模板 规则/模板/40-交付与验收/UAT验收模板.md）
    notes: >
      技能：`技能/uat-and-retrospective/SKILL.md`；按 PRD 验收标准**逐条对照**（结果+证据）。
      运行 `验证/Invoke-Gate.ps1 -Mode uat`；未 READY 不得写“UAT 通过/可发布”。
      **分模块核验**（子代理编排 §2）：≥3 模块 → 按模块只读扇出（AC 结果+证据+缺口 ≤30 行）；UAT 结论集中；单模块直做。
      可选输入：若项目已有测试报告/提测单/其它验收资料（任意路径/来源）则读；无则用现有资料/用户输入，不阻塞。测试报告是证据，不替代 UAT 结论。
      收到测试报告/准出 → 有包则 `handoff.receive`，无包则读报告正文；UAT 通过后默认交 UAT 记录；`UAT` 包按需先问后发。
      判定产品缺陷 vs 实现缺陷（依据：PRD 原文/设计对照）；结论：通过/不通过/有条件通过（有条件通过须列遗留、责任人与接受人）。

  - name: 发布与复盘
    id: release
    agent: pm-lead
    on_fail: 不发布；回 UAT/审批或报阻塞，不得用“已发布”措辞
    gate: uat-evidence
    gate_type: machine
    gate_when: has_uat
    hitl: confirm_release
    hitl_when: release_decision_needed
    output: 发布决策 + 发布记录 + 复盘（产品/{版本或主题}/04-交付与验收/、06-复盘/）
    notes: >
      技能：`技能/uat-and-retrospective/SKILL.md`（先读再核）。
      前置：UAT 通过（带条件须已接受）；发布就绪：回滚预案/公告/客服话术/监控指标（并入 UAT 记录「发布前置」节）。
      直接入口「发布」时：`has_uat=true` → 必须先运行 `验证/Invoke-Gate.ps1 -Mode uat`（读 `.gate/产品规范/uat.json`），未 READY 不得进入 confirm_release；无 UAT 要求 → 写「不适用+依据」，门条件不满足则跳过，不得伪造回执。
      发布前可派 verifier-agent 只读核对发布就绪证据（UAT/回滚/公告/监控），返回缺口 ≤30 行；发布决策仍由本步做。
      confirm_release：出示发布要点（版本/时间窗/回滚/通知范围）请确认；**未过 UAT 不发布**；已发布且仅做复盘 → 条件不满足，跳过本门。本门是业务发布决策；**如启用开发轨**，工程部署由其 `release` 执行（`confirm_deploy`），不重复审批；未启用则由用户安排，本包不执行部署。
      发布决策后默认交发布决策正文；`REL` 包按需先问后发。收到开发发布结果 → 有包则 receive。
      发布后：数据监控（指标/埋点）→ 复盘（模板 `规则/模板/60-复盘与改进/复盘模板.md`，落 `产品/{版本或主题}/06-复盘/复盘-{版本}.md`：目标 vs 实际/根因/改进项→回需求池）；如启用开发轨，研发复盘可由其补充，产品复盘合并引用；未启用则本包独立复盘。
      更新 `产品/工作日志.md`（仅本文件）：按场景追加里程碑——有发布决策写事件=`发布决策`（结论宜含本版对外变化摘要 1～5 条产品语言或链到发布说明，供开发写根 CHANGELOG）；有 UAT 结论写=`UAT 结论`；有复盘写=`复盘`。无文件则按模板建。
      **不是**根 `CHANGELOG.md`、也不是计划 §10 执行日志。本门=`confirm_release` 业务决策；根发版史由开发在工程发版时写（有开发包时）。
      **禁止**创建/修改/补链项目根 `CHANGELOG.md`；无开发包则不建根。
      版本关闭/结项：按 `规则/文档治理.md` §7；先判 T1/T2/T4，T2/T4 保留仍被引用的 PRD/原型基线，不整夹归档；失效资料 → `产品/资料/_归档/` + 清单；部分/增量/参考不归档；未确认不移动。
      同步按 `规则/文档治理.md` §7～§8（仅本步关版本/结项时，非日常收尾）：先判 T1/T2/T4，T2/T4 保留仍被引用的 PRD/原型基线；长期主档就地更新、版本绑定目录归档、已完结临时/失败/重复列清理候选；确认后执行。

  - name: 收尾
    id: wrap
    agent: pm-lead
    output: 【任务收尾】（交付/验收/复盘置第 1 点）
    notes: >
      对照 `规则/模板/90-交接与收尾/收尾骨架.md` §2 输出【任务收尾】（须含【遵守自检】）；第1点按本步产出填写。
      更新产品计划 §0/§7/§10、activeContext、资料索引；现状三处同拍（执行契约 §4 规则 7）；`sync=` 含 `triad=aligned|deferred:<原因>`；语义已变禁只改 activeContext。未验证/遗留项明示。
      本步先出骨架与拟提交清单，提交门在下一步。

  - name: 拟提交
    id: commit
    output: 拟提交确认结果
    agent: pm-lead
    hitl: confirm_commit
    hitl_when: has_pending_commit
    tools:
      - git
    notes: 无文件变更跳过；拟提交清单按 `规则/工作流.md` §3；提交后补一行结果，不重复六段。
