# 交付与验收（排期 → 跟进/变更 → UAT → 发布 → 复盘）
# 入口即止：排期/跟进/UAT/发布/复盘各自独立，不自动串完整条链。
workflow:
  id: deliver
  name: 交付与验收
  version: 4
  read_index: 规则/读取索引.md

entry_points:
  排期: schedule
  交付计划: schedule
  任务拆解: schedule
  交付跟进: followup
  UAT: uat
  验收: uat
  发布: release
  上线检查: release
  复盘: release

trigger:
  - 排期 / 迭代规划 / 交付计划
  - 交付跟进 / 风险升级
  - UAT / 验收
  - 发布 / 上线检查 / 复盘

steps:
  - name: 排期与交接
    id: schedule
    agent: pm-lead
    output: 产品/{版本或主题}/交付计划-{版本}.md（模板 规则/模板/交付计划模板.md）
    notes: >
      技能：`技能/change-management/SKILL.md`（先读；排期与变更纪律同源）。
      拆解（Epic→Story→Task）/估时/依赖/风险 → 交付计划（范围/里程碑/发布窗口）；
      **不并行写交付计划**；需要估时/依赖素材时只读分模块 scout，结论集中写。
      前置：PRD 头部 `status: APPROVED`（未定稿 → 只报缺口并回 `workflows/prd.yaml` review 步，不排期）。

  - name: 交付跟进
    id: followup
    agent: pm-lead
    notes: >
      交付进度/风险/依赖跟进；答疑书面留痕（评论/文档批注），禁口头改需求。
      发现新需求、需求变更、产品缺陷、开发不确定项 → 转 `workflows/change.yaml` intake，按受理/分诊/处置/联动流程执行；
      本步不另造变更单、不直接改 PRD/排期。

  - name: UAT 验收
    id: uat
    agent: pm-lead
    gate: uat-evidence
    output: 产品/{版本或主题}/UAT-{版本}-{yyyyMMdd}.md（模板 规则/模板/UAT验收模板.md）
    notes: >
      技能：`技能/uat-and-retrospective/SKILL.md`；按 PRD 验收标准**逐条对照**（结果+证据）。
      运行 `验证/Invoke-Gate.ps1 -Mode uat`；未 READY 不得写“UAT 通过/可发布”。
      **分模块核验**（子代理编排 §2）：≥3 模块 → 按模块只读扇出（AC 结果+证据+缺口 ≤30 行）；UAT 结论集中；单模块直做。
      可选输入：若项目已有测试报告/提测单/其它验收资料（任意路径/来源）则读；无则用现有资料/用户输入，不阻塞。测试报告是证据，不替代 UAT 结论。
      判定产品缺陷 vs 实现缺陷（依据：PRD 原文/设计对照）；结论：通过/不通过/带条件（带条件须列遗留、责任人与接受人）。

  - name: 发布与复盘
    id: release
    agent: pm-lead
    hitl: confirm_release
    hitl_when: release_decision_needed
    notes: >
      技能：`技能/uat-and-retrospective/SKILL.md`（先读再核）。
      前置：UAT 通过（带条件须已接受）；发布就绪：回滚预案/公告/客服话术/监控指标（并入 UAT 记录「发布前置」节）。
      发布前可派 verifier-agent 只读核对发布就绪证据（UAT/回滚/公告/监控），返回缺口 ≤30 行；发布决策仍由本步做。
      confirm_release：出示发布要点（版本/时间窗/回滚/通知范围）请确认；**未过 UAT 不发布**；已发布且仅做复盘 → 条件不满足，跳过本门。本门是业务发布决策；**如启用开发轨**，工程部署由其 `release` 执行（`confirm_deploy`），不重复审批；未启用则由用户安排，本包不执行部署。
      发布后：数据监控（指标/埋点）→ 复盘（模板 `规则/模板/复盘模板.md`，落 `产品/{版本或主题}/复盘-{版本}.md`：目标 vs 实际/根因/改进项→回需求池）；如启用开发轨，研发复盘可由其补充，产品复盘合并引用；未启用则本包独立复盘。
      更新项目根 `CHANGELOG.md`：版本/迭代状态（已发布/已关闭）、日期、产品变化摘要、客户发布说明/复盘链接；无则新增，有则只补不覆盖。
      版本关闭/结项：按 `规则/文档治理.md` §3～§5 扫描 `产品/资料/`，输出【资料收取与归档候选】；只归档用户确认的 `失效` 项，部分覆盖/增量/参考不归档；未确认不移动。
      同步按 `规则/文档治理.md` 扫描工作文档与过程文件：长期主档就地更新、版本绑定目录归档、临时/失败/重复文件列清理候选；确认后执行。

  - name: 收尾
    id: wrap
    agent: pm-lead
    output: 【任务收尾】（交付/验收/复盘置第 1 点）
    notes: >
      按 AGENTS §2 输出【任务收尾】：第 1 点含汇报（可整段复制），第 2～6 点齐。
      更新产品计划 §0/§7/§10、activeContext、资料索引；未验证/遗留项明示。
      本步先出骨架与拟提交清单，提交门在下一步。

  - name: 拟提交
    id: commit
    agent: pm-lead
    hitl: confirm_commit
    hitl_when: has_pending_commit
    tools:
      - git
    notes: 无文件变更跳过；拟提交清单按 `规则/工作流.md` §3；提交后补一行结果，不重复六段。
