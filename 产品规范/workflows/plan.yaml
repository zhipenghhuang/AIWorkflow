# 产品计划（目标 → 路线图 → 本期范围 → 计划确认 → 落盘）
workflow:
  id: plan
  name: 产品计划
  version: 6
  read_index: 规则/读取索引.md

entry_points:
  产品计划: goals
  产品规划: goals
  路线图: roadmap
  Roadmap: roadmap
  版本规划: roadmap
  下季度做什么: roadmap
  下个月做什么: roadmap
  排优先级（版本级）: roadmap
  按产品计划执行: next
  下一步: next
  当前状态: next

trigger:
  - 产品计划 / 产品规划 / 路线图 / Roadmap
  - 版本规划 / 下季度做什么 / 下个月做什么
  - 排优先级（版本级）
  - 按产品计划执行 / 下一步 / 当前状态

steps:
  - name: 目标与指标
    id: goals
    agent: pm-analyst
    hitl: confirm_understanding
    hitl_when: understanding_needs_confirm
    output: 产品计划工作稿 §1 目标/§2 指标（可并入产品计划草稿）
    notes: >
      读 `产品档案.md` §1/§2/§3 + `产品/需求池.md` + 上期复盘（若有）；
      产出本周期目标（O）与成功指标（KR）：基线 / 目标值 / 观测窗口；指标口径写清。
      **目标有依据**：来自确认的客户/业务需求与证据，不自行发明 KPI/北极星；无基线/无口径标「待验证」并写验证方式；未确认需求不进入目标/范围。
      技能：0→1 读 `技能/zero-to-one-product-definition/SKILL.md`；迭代读 `技能/requirement-discovery-and-prioritization/SKILL.md` + `技能/customer-needs-discovery/SKILL.md`（先读再做）。
      能力（可选）：analytics 核对口径；未装 = 用户提供数据摘要。

  - name: 路线图与优先级
    id: roadmap
    agent: pm-analyst
    output: 产品计划工作稿 §2 路线图（Now/Next/Later + 依据/依赖/时间窗）
    notes: >
      路线图 Now / Next / Later + 版本映射；每项标用户价值、证据、依赖、时间窗。
      **未确认不排**：未完成客户需求理解/未确认范围的需求，只能进候选项，不承诺版本；竞品做法/领导偏好/单个客户不得直接排优先级。
      **判断集中**：路线图/优先级不并行生成 A/B/C 方案；可只读拉取数据/反馈/竞品证据（≤30 行/来源），排序与取舍由本步做。
      方法按需：RICE / Kano / MoSCoW；拿不准向上一档并说明。
      不写需求细节（细节归 PRD）；需求池只留候选与状态。

  - name: 本期范围与里程碑
    id: scope
    agent: pm-lead
    hitl: confirm_plan
    hitl_when: plan_needs_confirm
    output: 产品计划工作稿 §3 范围/§4 里程碑（确认后同轮并入主档）
    notes: >
      本期做 / 不做（MVP）、产能约束、里程碑（设计 / 开发 / 提测 / UAT / 发布）、依赖与风险。
      confirm_plan：出示目标 / 路线图 / 本期范围 / 里程碑 / 风险请确认；首次计划或范围·指标·版本实质变更必停；
      同周期同版本只确认一次（「继续」沿用）。
      **确认后必须同轮落盘**：把确认稿并入 `产品/产品计划.md`（§0/§3/§4），不要等 wrap；会话中断时以已落盘稿为准。
      **计划未确认不进入 PRD / 排期**（`规则/工作流.md` §1）。

  - name: 计划文档评审
    id: review-plan
    agent: reviewer-agent
    hitl: select_review_mode
    hitl_when: landing_doc_review_needed
    output: 评审记录（产品/{版本或主题}/01-需求与定义/评审-计划-{yyyyMMdd}.md）或 HUMAN_APPROVED 声明
    notes: >
      首版或范围·指标·版本实质变更后、宣称「计划已可驱动 PRD/排期」前：按 `技能/artifact-review` STOP 选 A 自行通过｜B AI 独立审。
      选 A：出示目标/反范围/里程碑/风险自检摘要 → 用户确认 → HUMAN_APPROVED。
      选 B：按计划量规（目标可证伪/反范围/依据/里程碑/风险）只报缺口；留痕 `产品/{版本}/01-需求与定义/评审-计划-{yyyyMMdd}.md` 或计划旁评审笺；需修回 scope/publish 修订。
      小周期微调且已 confirm_plan → `landing_doc_review_needed` 可假。

  - name: 落盘与索引
    id: publish
    agent: pm-lead
    hitl:
      - name: confirm_iteration_close
        when: iteration_close_needed
      - name: confirm_docs_migration
        when: docs_migration_needed
    output: 产品/产品计划.md（模板 规则/模板/10-规划与需求/产品计划模板.md）
    notes: >
      须已完成 review-plan 选模式（或本轮跳过条件满足）。总控表状态回写（阶段 / 产物 / 门 / 状态 / 下一动作）；版本索引挂 PRD / 评审 / 受理/变更 / 交付计划 / UAT / GTM / 原型 / 复盘。
      更新 `产品/工作日志.md`（仅本文件）：索引表新增一行 + 一条里程碑条目，事件类型=`计划确认`（结论/产出/遗留；关联产品计划路径）；无文件则先按工作日志模板创建再写。
      **不是**根 `CHANGELOG.md`、也不是产品计划 §10 执行日志（细粒度过程仍只写 §10）。
      **禁止**创建或修改项目根 `CHANGELOG.md`。
      **主档不移动**：`产品/产品计划.md` 常青；季度结束复制当期执行到 `产品/_归档/{yyyy-Qn}/产品计划-{yyyy-Qn}.md`，主档保留历史索引并重置当前季度；
      版本/结项把当期目录整体移入 `产品/_归档/{yyyyMMdd}-{版本}/`（点名执行）。
      版本/结项归档时按 `规则/文档治理.md` §7 扫描；失效资料进 `产品/资料/_归档/{版本}/` + 归档清单；部分/增量/参考不动；未确认不移动。
      同步按 `规则/文档治理.md` §7～§8（仅本步关版本/结项时，非日常收尾）：长期主档就地更新、版本绑定目录关闭时归档、已完结临时/失败/重复列清理候选；确认后执行。
      **换代/新版本主题（即使不结项发版）** → 按 §7；不确定则 `confirm_iteration_close`；确认后 §7.1 完整关账（跳过仅发版项）。
      建/更新 `产品/交接/交接台账.md`（模板 `规则/模板/90-交接与收尾/交接台账模板.md`）；按模板登记计划/PRD/设计/变更/UAT/发布节点；变更分级与重规划触发写入计划执行日志/变更记录。
      稳定真值（愿景/用户/北极星/指标口径）留在主档与 `产品档案.md`，不随季度归档。

  - name: 计划续跑
    id: next
    agent: pm-lead
    output: 当前阶段/门/下一动作
    notes: >
      仅由「下一步/当前状态/继续」入口触发；正常「产品计划」链到 publish 止，不执行本步。
      只读 `产品/产品计划.md` §0/§7/§8/§10：报备当前阶段、当前门、下一动作、需人工项；
      「按产品计划执行」= 按 §0 路由到 plan / prd / deliver / change 对应 step，执行到下一个 `hitl` 停止；
      「下一步」只报动作与入口，不执行；「当前状态」只读，不重写计划。
      有未吸收的新文档/变化 → 先走 `workflows/change.yaml` intake，不直接改 PRD/计划。
      有未回执/退回/阻断的交接包 → 先走 `workflows/handoff.yaml` status/receive，不直接推进阶段。
      产品包独立运行；开发/测试包为可选输入/输出，缺则不阻塞。
      执行后回写 §0 状态/下一动作、§10 执行日志；门结论/变更写 §8。

  - name: 收尾
    id: wrap
    agent: pm-lead
    output: 【任务收尾】（计划/里程碑明细置第 1 点）
    notes: >
      按 AGENTS §2 输出【任务收尾】：第 1 点含汇报（可整段复制），按收尾骨架六点输出：第 1 点纯执行汇报（代号带中文描述，不写待确认指针），第 4 点含待你确认表，第 6 点含当前/下一步/建议理由/完成标志；
      更新产品计划 §0/§7/§10、activeContext、资料索引（有实质进展时）；未验证项明示。
      本步先出骨架与拟提交清单，提交门在下一步。

  - name: 拟提交
    id: commit
    output: 拟提交确认结果
    agent: pm-lead
    hitl: confirm_commit
    hitl_when: has_pending_commit
    tools:
      - git
    notes: 无文件变更跳过；拟提交清单按 `规则/工作流.md` §3；提交后补一行结果，不重复六段。
