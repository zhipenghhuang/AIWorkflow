# 新产品 0→1（发现 → 立项 → 定义 → 需求 → 交付 → 上市 → 复盘）
# 子流程只执行各步所列步骤；其 wrap/commit 不在本链重复，统一由本文件末 wrap/commit 收尾。
workflow:
  id: new-product
  name: 新产品 0→1
  version: 3
  read_index: 规则/读取索引.md

entry_points:
  启动新产品: discover
  新项目: discover
  从0到1: discover
  产品立项: discover

trigger:
  - 启动新产品 / 新项目 / 从0到1 / 产品立项

steps:
  - name: 发现与机会评估
    id: discover
    agent: pm-analyst
    hitl: confirm_understanding
    hitl_when: understanding_needs_confirm
    output: 产品/{主题}/01-需求与定义/立项书-{yyyyMMdd}.md
    notes: >
      市场 / 用户 / 竞品 / 问题验证；技能：`技能/zero-to-one-product-definition/SKILL.md` + `技能/customer-needs-discovery/SKILL.md`（先读再做）。
      **先问题后方案**：按 `规则/核心/澄清.md` 先给理解回执，再一次一问至无实质缺口（95% 仅参考）；写清谁/场景/问题/现有替代/代价/目标结果/成功标准/非目标；单个客户/竞品/领导说法标样本与证据等级，不直接当市场结论。
      **来源扇出**（子代理编排 §2）：≥4 独立来源 → 按来源只读扇出（市场/用户/竞品/问题），各返回证据表/去重键 ≤30 行；立项书与 Go/Hold/Kill 集中；单来源直做。
      产出立项书：`产品/{主题}/01-需求与定义/立项书-{yyyyMMdd}.md`（模板 `规则/模板/10-规划与需求/立项书模板.md`）；
      引用可回查（来源 + 日期）；禁臆造市场数据与用户反馈；无依据写「待验证」。
      能力（可选）：browser-mcp 竞品、analytics 数据、docs-mcp 资料；未装 = 降级。

  - name: 立项评审
    id: go
    agent: pm-analyst
    hitl: confirm_go
    output: 立项决策记录（Go/Hold/Kill + 依据/待验证/责任人，并入立项书）
    notes: >
      出示问题 / 用户 / 市场 / 竞品 / 方案与 MVP 假设 / 成本收益 / 风险 / 结论（Go / Hold / Kill）请确认。
      批准（Go）才进入产品定义；Hold 列待验证项与责任人；Kill 记录原因并归档。
      **未过立项不写全量 PRD**（`规则/工作流.md` §1）。

  - name: 产品定义与计划
    id: define
    agent: pm-analyst
    output: 产品/产品计划.md
    notes: >
      按 `workflows/plan.yaml` 执行：目标与指标 → 路线图 → 本期范围与里程碑 → `confirm_plan` → 落盘 `产品/产品计划.md`。
      计划门由 plan.scope 执行，本步不重复弹门。
      只写总领（做什么 / 为什么 / 何时 / 怎么算成功），需求细节归 PRD。

  - name: 需求定义（PRD）
    id: prd
    agent: prd-writer
    output: PRD + 评审记录/原型（产品/{版本或主题}/01-需求与定义/、02-原型与设计/）
    notes: >
      按 `workflows/prd.yaml` 的 prd → prototype（如需界面）→ review 执行；只执行所列步骤，不执行其 wrap/commit；PRD 落 `产品/{版本或主题}/01-需求与定义/PRD-{主题}.md`；
      评审/定稿门由 prd.review 执行，本步不重复弹门；未定稿不排期。
      技能：`技能/prd-writing/SKILL.md` / `技能/review-and-finalize/SKILL.md`；界面原型见 `技能/prototype-and-interaction/SKILL.md` / `技能/ui-visual-design-system/SKILL.md`。

  - name: 交付与验收
    id: deliver
    agent: pm-lead
    output: 交付计划 + UAT 记录（产品/{版本或主题}/04-交付与验收/）
    notes: >
      按 `workflows/deliver.yaml` 的 schedule / followup / uat 执行；需求/问题/产品缺陷 → `workflows/change.yaml` 受理与处置；
      UAT 门由 deliver.uat 执行，本步不重复跑门。
      UAT 按 PRD 验收标准逐条对照（结果 + 证据）；产品缺陷 vs 实现缺陷要有依据。
      技能：`技能/change-management/SKILL.md` / `技能/uat-and-retrospective/SKILL.md`。

  - name: 上市与复盘
    id: launch
    agent: pm-lead
    hitl: confirm_release
    output: 发布决策 + GTM 检查 + 复盘（产品/{版本或主题}/04-交付与验收/、06-复盘/）
    notes: >
      前置：UAT 通过（带条件须已接受）+ GTM 就绪（模板 `规则/模板/40-交付与验收/GTM模板.md`：定价 / 渠道 / 物料 / 销售客服）+ 发布检查（回滚 / 公告 / 客服 / 监控）。
      confirm_release：出示上市要点请确认；**未过 UAT 不发布**。
      发布后：指标监控 → 复盘（模板 `规则/模板/60-复盘与改进/复盘模板.md`）→ 改进项回需求池；更新 `产品/产品计划.md` §9。

  - name: 收尾
    id: wrap
    agent: pm-lead
    output: 【任务收尾】（0→1/上市明细置第 1 点）
    notes: >
      按 AGENTS §2 输出【任务收尾】：第 1 点含汇报（可整段复制），按收尾骨架六点输出：第 1 点纯执行汇报（代号带中文描述，不写待确认指针），第 4 点含待你确认表，第 6 点含当前/下一步/建议理由/完成标志；
      更新产品计划 §0/§7/§10、activeContext、资料索引；未验证/待决策项明示。
      本步先出骨架与拟提交清单，提交门在下一步。

  - name: 拟提交
    id: commit
    agent: pm-lead
    hitl: confirm_commit
    hitl_when: has_pending_commit
    tools:
      - git
    notes: 无文件变更跳过；拟提交清单按 `规则/工作流.md` §3；提交后补一行结果，不重复六段。
