# 产品展示与介绍（受众 → 故事线/流程图 → 演示脚本 → 环境 → 材料/文档 → 彩排 → 对外确认）
# 入口即止：文档/材料只到 docs/materials→publish（对外时）；准备演示才按链执行到 publish/wrap。
workflow:
  id: showcase
  name: 产品展示与介绍
  version: 3
  read_index: 规则/读取索引.md

entry_points:
  准备演示: audience
  客户演示: audience
  产品介绍: audience
  产品汇报: audience
  演示彩排: dryrun
  一页纸: materials
  Deck: materials
  用户手册: docs
  快速开始: docs
  FAQ: docs
  发布说明: docs
  培训材料: docs

trigger:
  - 准备演示 / 客户演示 / 产品介绍 / 产品汇报
  - 用户手册 / 快速开始 / FAQ / 发布说明 / 培训材料
  - 演示彩排

steps:
  - name: 受众与目标
    id: audience
    agent: pm-lead
    output: 产品/{版本或主题}/05-展示与材料/展示需求-{受众}-{yyyyMMdd}.md（模板 规则/模板/50-展示与文档/演示脚本模板.md §1）
    notes: >
      读 `产品档案.md` / `产品/产品计划.md` / PRD / UAT / GTM / 原型；
      明确受众（老板/客户/用户/技术）、目标、时长、成功标准、保密边界与不演示项。
      技能：`技能/demo-storytelling/SKILL.md`（先读再做）；受众/目标已明确则直接续跑，不停。

  - name: 故事线与流程图
    id: story
    agent: pm-lead
    hitl: confirm_narrative
    hitl_when: narrative_needs_confirm
    output: 产品/{版本或主题}/05-展示与材料/故事线-{受众}.md
    notes: >
      用 Mermaid 流程图表达：背景 → 问题 → 方案 → 价值 → 证据 → 下一步；
      每个节点必须对齐当前项目（PRD/原型/当前构建），不写未实现能力、不夸大。
      confirm_narrative：故事线成形后出示受众/目标/故事线/演示范围请确认；条件门，仅在叙事不明或首次对外演示时停。
      技能 demo-storytelling §2；模板 §2。

  - name: 演示脚本
    id: demo
    agent: pm-lead
    output: 产品/{版本或主题}/05-展示与材料/演示脚本-{受众}-{yyyyMMdd}.md
    notes: >
      场景化脚本：每场景写目标/入口/逐步点击路径/数据/预期/兜底/时长；
      路径详细到菜单 → 页面 → Tab → 控件/行；优先演真实构建或原型；未实现能力不演。
      准备 Q&A 与异议处理；技能 demo-storytelling §3/§4。

  - name: Demo 环境与数据
    id: environment
    agent: pm-lead
    output: 产品/{版本或主题}/05-展示与材料/演示检查单-{yyyyMMdd}.md
    notes: >
      构建/原型版本、账号角色、seed/重置、网络、设备、录屏兜底、权限与隐私；
      `规则/模板/50-展示与文档/演示检查单模板.md` 逐项过；能力（可选）browser-mcp 走查，未装=手工检查。

  - name: 展示材料
    id: materials
    agent: ux-designer
    next: publish
    output: 产品/{版本或主题}/05-展示与材料/一页纸-{产品}.md · 产品/{版本或主题}/05-展示与材料/Deck大纲-{受众}.md（按点名类型产出）
    notes: >
      一页纸：问题/用户/价值/证据/下一步；Deck：10～12 页，每页一个观点 + 证据 + 图；
      Mermaid 流程图/业务架构图（不写技术架构）。
      **共享事实表 + 分片**（子代理编排 §2）：同时产 ≥3 类材料/文档 → 先定事实表（功能/版本/截图/数字/边界），再按类型分片（不同文件）；最后 verifier-agent 一致性核对；单类直做。
      技能：`技能/presentation-design/SKILL.md`；能力 doc-suite / presentation 可选。
      **项目对齐**：数字/截图/流程/术语与 PRD/原型/构建一致，引用可回查；对外发送/承诺前由 `publish` 步 `confirm_materials` 确认，内部草稿不停。

  - name: 用户文档
    id: docs
    when: docs_requested
    agent: prd-writer
    next: publish
    output: 产品/用户文档/{按点名类型}-{版本}.md（快速开始/用户手册/FAQ/发布说明/培训材料；未点名默认用户手册）
    notes: >
      点名用户手册/快速开始/FAQ/发布说明/培训材料 → `docs_requested=true`。
      技能：`技能/product-docs/SKILL.md`；模板 `规则/模板/50-展示与文档/用户手册与快速开始模板.md`、`规则/模板/50-展示与文档/发布说明模板.md`。
      只产被点名的文档类型，不一次生成四类；按任务组织：5 分钟快速开始 → 常用任务 → FAQ/故障 → 版本说明；截图/步骤与当前构建一致；
      同时产 ≥3 类文档 → 共享事实表 + 按类型分片（不同文件，单写手/类）；verifier-agent 核对数字/版本/截图/边界；不并行写同一文档。
      不写未发布功能；客户版发布说明面向用户，不写内部实现与内部路径；对外前由 `publish` 步确认。

  - name: 彩排与反馈
    id: dryrun
    when: demo_needs_dryrun
    agent: pm-lead
    output: 产品/{版本或主题}/05-展示与材料/反馈记录-{yyyyMMdd}.md
    notes: >
      准备演示/客户介绍/彩排 → `demo_needs_dryrun=true`。
      计时演练；检查故事/路径/数据/兜底/Q&A；记录异议、问题、需求 → 按 `workflows/change.yaml` 回受理/需求池；
      修正材料后再对外。

  - name: 对外确认
    id: publish
    agent: pm-lead
    hitl: confirm_materials
    hitl_when: materials_for_external
    output: 对外确认记录（清单 + 数字/截图来源 + 未实现边界 + 批准人）
    notes: >
      材料/文档/演示已就绪；出示对外清单（一页纸/Deck/用户文档/发布说明）、数字与截图来源、未实现/未发布边界，
      对外前可派 verifier-agent 只读核对（数字/版本/截图/边界）；确认后才对外发送、承诺或发布；内部汇报/草稿不触发。

  - name: 收尾
    id: wrap
    agent: pm-lead
    output: 【任务收尾】（展示/文档明细置第 1 点）
    notes: >
      按 AGENTS §2 输出【任务收尾】：第 1 点含汇报（可整段复制），按收尾骨架六点输出：第 1 点纯执行汇报（代号带中文描述，不写待确认指针），第 4 点含待你确认表，第 6 点含当前/下一步/建议理由/完成标志；
      更新产品计划 §0/§7/§10、activeContext、资料索引（有实质进展时）；未验证项明示。
      本步先出骨架与拟提交清单，提交门在下一步。

  - name: 拟提交
    id: commit
    agent: pm-lead
    hitl: confirm_commit
    hitl_when: has_pending_commit
    tools:
      - git
    notes: 无文件变更跳过；拟提交清单按 `规则/工作流.md` §3；提交后补一行结果，不重复六段。
