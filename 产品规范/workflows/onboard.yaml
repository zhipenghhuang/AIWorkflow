# 接入：点名，或无标记时前置一次；完成后必须打标
workflow:
  id: onboard
  name: 产品规范接入
  version: 3
  read_index: 规则/读取索引.md
  chain: full   # 接入必须走完 profile/gitignore/verify，不能停在 mount

entry_points:
  接入产品规范: mount
  重新接入: migrate
  生成产品档案: profile
  配置缺陷平台: profile
  装配能力: capabilities
  资料收取: materials
  资料整理: materials
  资料归档: materials
  资料巡检: materials
  文档整理: lifecycle
  文档巡检: lifecycle
  文档清理: lifecycle
  清理临时文件: lifecycle
  清理过程文件: lifecycle
  清理无效文件: lifecycle
  清理失效文件: lifecycle
  清理垃圾文件: lifecycle
  清理临时: lifecycle
  归档失效文档: lifecycle

trigger:
  - 接入产品规范
  - 重新接入
  - 生成产品档案
  - 装配能力
  - 资料收取 / 资料整理 / 资料归档 / 资料巡检
  - 文档整理 / 文档巡检 / 文档清理 / 清理临时文件 / 清理过程文件 / 清理无效文件 / 清理失效文件 / 清理垃圾文件 / 清理临时 / 归档失效文档

steps:
  - name: 旧结构迁移
    id: migrate
    agent: onboard-agent
    hitl: confirm_docs_migration
    hitl_when: docs_migration_needed
    output: 迁移清单/更新后的路径
    notes: >
      「重新接入」= 按最新布局迁移；先扫描旧结构，按 `规则/文档治理.md` §4 做覆盖对照，列迁移/改名/归档候选，经 `confirm_docs_migration` 确认后执行，不静默丢文件。
      映射：`产品/输入/`、`产品/资料/项目文档/{ver}/`、旧扁平前缀文件、`产品/资料/反馈|调研|竞品|数据/` → `产品/资料/{版本或主题}/` 或 `_通用/`（保持原文件名；类型写索引；**不要**项目文档层、**不要**强制类型前缀扁平）；
      旧 `产品/_归档/**/资料/` 失效件可迁到 `产品/资料/_归档/`；`产品/资料/用户文档/` → `产品/用户文档/`；建立/更新 `产品/资料/资料索引.md`；更新计划 §7、路径引用、activeContext。
      冲突/无法判断先问一次，不覆盖；迁移后核对链接，再进入 mount/profile。
      若存在 `产品/CHANGELOG.md`：列为迁移候选——**用户确认后**改名为 `产品/工作日志.md`（内容按工作日志模板整理索引+里程碑条；勿与根 `CHANGELOG.md` 混淆）；未确认不改名。
      多包模式（项目根自动探测到两个及以上包目录）：`项目资料/` 是共享根，不迁入 `产品/资料/`；只迁本包自有 `产品/` 资料。`doc_mode=keep/mix` 时既有目录不迁，只登记引用。

  - name: 复制与挂载确认
    id: mount
    agent: onboard-agent
    notes: >
      验收：项目根 AGENTS.md 已补入指向本包 AGENTS.md 的引导语句
      （样例见 `规则/模板/00-接入与治理/根AGENTS薄指针.md`；已有则追加、没有则新建）；
      未补入则按样例写入后再继续。**单包**时写明本会话只启用产品规范；多包时不写这一句。
      多包模式（项目根自动探测到两个及以上包目录）：不写「本会话只启用产品规范」；根 `AGENTS.md` 只做路由，按实际包目录补齐已启用包列表（本包及同项目其它包各一行）；三包自动探测共享资料/上下文。

  - name: 产品档案与上下文
    id: profile
    agent: onboard-agent
    output: 产品档案.md · activeContext.md · 产品/工作日志.md（如无）·（模板 规则/模板/）
    notes: >
      产品档案 §1/§2/§3/§4 必填；§7 缺陷平台可选：问是否启用禅道/Jira/ONES，启用填 provider/baseUrl/凭据来源/提交方式/适配定义，
      未启用写「无」；同项目已有开发/测试包配置可复用，不重复存凭据。缺陷平台未配置不阻塞接入。
      `activeContext.md`：无则按 `规则/模板/00-接入与治理/activeContext模板.md` 建（只含 `## 产品` + 跨包同步 + 运行时本包行）；已有则只补/更新本包分节与本包接入行，禁止整文件覆盖他包内容。
      `产品/工作日志.md`：无则按 `规则/模板/00-接入与治理/工作日志模板.md` 创建（岗位里程碑侧记；索引可空，待首次里程碑写入）。已有则跳过不覆盖。
      **不是**根 `CHANGELOG.md`、也不是产品计划 §10 执行日志；勿把本文件当项目发版史。
      若仍存在 `产品/CHANGELOG.md` 且尚无 `产品/工作日志.md`：列为改名迁移候选（→`工作日志.md`），经 `confirm_docs_migration` 确认后执行；未确认不改。
      **禁止**创建或修改项目根 `CHANGELOG.md`（根仅开发规范维护，给人看的项目发版史）。
      建固定资料区：`产品/资料/`（`_通用/` + `{版本或主题}/` + `交接/` + `_归档/` + `资料索引.md`；模板 `规则/模板/00-接入与治理/资料索引模板.md`）；与工作文档分开；禁 `项目文档/`、禁新资料平铺根下。
      产品档案 §1 增记 `资料模式`（keep/mix/replace，默认 mix）/ `既有资料目录` / `资料根` / `目录结构=版本或主题子目录`；多包时资料根=`项目资料/`，本包 `资料/` 仅专属/历史。
      检测到既有资料目录 → 默认 `mix`，登记路径；用户点名 keep/replace 再改。
      对外用户文档固定 `产品/用户文档/`，不混入 `资料/`。

  - name: 资料收取与归档
    id: materials
    agent: onboard-agent
    hitl:
      - name: confirm_iteration_close
        when: iteration_close_needed
      - name: confirm_docs_migration
        when: docs_migration_needed
    output: 【资料收取与归档候选】（确认后执行落位/归档）
    notes: >
      按 `规则/文档治理.md` §3～§4：入站意图分析（T1～T9）+ 覆盖对照 → 输出【入站分析】与候选；**确认前不改文件**。
      有候选 → `docs_migration_needed=true`，停本门；无候选继续。
      用户确认采纳后同批：落位 `资料/{版本或主题}/` 或 `_通用/` → 同步工作区 → S1/S2/S3 标失效 → 移 `产品/资料/_归档/{yyyyMMdd}-{版本或批次}/` + 归档清单 → 更新索引/计划 §11/activeContext。
      部分覆盖/增量/参考保留；冲突停下问。无候选 → 报「无未登记/失效候选」。
      **换迭代/关版本（强制）**：确认采纳新迭代/换主题后按 `规则/文档治理.md` §7；不确定则 `confirm_iteration_close`；确认后 §7.1 完整关账（跳过仅发版项）。不依赖发版。

  - name: 文档治理检查
    id: lifecycle
    agent: onboard-agent
    hitl: confirm_docs_migration
    hitl_when: docs_migration_needed
    output: 【文档治理检查】（确认后执行更新/归档/清理）
    notes: >
      按 `规则/文档治理.md` §2～§5 扫描工作文档与过程文件：
      ① 分类：长期/固定、版本/迭代绑定、失效/替代、过程/临时；
      ② 判定：主档/长期真值就地更新；版本绑定目录关闭时归档；部分覆盖保留；失效确认后归档；临时/失败/重复文件列清理候选；
      ③ 输出【文档治理检查】：保留/更新/归档/清理/待确认；**确认前不改/不移/不删**。
      有候选 → `docs_migration_needed=true`，停在本门等确认；无候选 → 报「无生命周期候选」，不改文件。
      清理只删已知临时/缓存/未引用失败产物；证据、当前 PRD/原型/计划、源文件、用户文件、密钥永不自动删除；不确定移 `产品/_归档/_待清理/{yyyyMMdd}/` 并写清理清单。

  - name: 入库策略
    id: gitignore
    agent: onboard-agent
    hitl: confirm_gitignore

  - name: 环境与工具检查（可选）
    id: capabilities
    agent: onboard-agent
    notes: >
      默认静默：不输出工具清单、不冒烟（可用性由首次使用流程自行探测与降级）。
      仅当用户点名「装配能力」时，按 `能力/00-能力注册表.md` 盘点并给装配建议（安装指引指向 README「宿主适配」节）。
      记录（如需要）写 `产品档案.md` §6——自动记录，不是待办；禁强推、禁清单式输出。

  - name: 核验与打标
    id: verify
    agent: onboard-agent
    notes: >
      按 onboard-agent 接入清单核验（①～⑥，含写接入标记）；
      此后按 AGENTS §0 第 3 点（接入状态）跳过落地检查。

  - name: 收尾
    id: wrap
    agent: onboard-agent
    output: 【任务收尾】（接入明细置第 1 点，六段压缩）
    notes: >
      按 AGENTS §2 输出六段压缩（每段一行）；第 1 点纯执行汇报（代号带中文描述），第 4 点含待你确认表，第 6 点含当前/下一步；仅有例外/待处理项时逐条展开；禁逐项罗列工具。
