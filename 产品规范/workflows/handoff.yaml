# 产品协作交接（发送 / 接收 / 回执 / 变更通知 / 状态）
# 入口即止：send/receive/status/change_* 各自独立，不自动串跑。
workflow:
  id: handoff
  name: 协作交接
  version: 1
  read_index: 规则/读取索引.md

entry_points:
  生成交接包: send
  交接给开发: send
  交接给测试: send
  交接给产品: send
  产品交接包: send
  接收交接包: receive
  签收交接包: receive
  导入交接包: receive
  交接回执: receive
  交接状态: status
  待回执: status
  发变更通知: change_send
  变更通知: change_send
  同步变更: change_receive
  收到变更: change_receive
  变更影响分析: change_receive
  重规划: replan
  计划调整: replan
  重新基线: replan
  计划偏离: replan

trigger:
  - 生成交接包 / 交接给开发 / 交接给测试
  - 接收交接包 / 签收交接包 / 导入交接包 / 交接回执
  - 交接状态 / 待回执
  - 发变更通知 / 变更通知 / 同步变更 / 收到变更 / 变更影响分析
  - 重规划 / 计划调整 / 重新基线 / 计划偏离

steps:
  - name: 交接状态
    id: status
    agent: pm-lead
    output: 交接台账摘要（待回执/超时/退回/阻断）
    notes: >
      只读 `产品/交接/交接台账.md` 与 `产品/产品计划.md` §0/§12；不重写计划、不发包。
      报备：当前未回执 n 个、超时 n 个、退回 n 个、阻断下游的 HO-ID、下一步入口。
      有未登记新包（`产品/资料/交接/` 有目录但台账无记录）→ 建议先 `receive`，不直接实施。
      台账缺失 → 按 `规则/模板/90-交接与收尾/交接台账模板.md` 建，但不虚构历史。
      输出首条：route=workflow:handoff | step=status | pending=… | overdue=… | next_action=…

  - name: 生成交接包
    id: send
    agent: pm-lead
    hitl: confirm_handoff
    hitl_when: handoff_send_required
    output: 产品/交接/{HO-ID}/ + 【交接包已生成】
    notes: >
      先读 `规则/协作/协作与交接.md` §3.1/§4 与交接包说明/清单模板。
      **内容优先**：默认交自洽 PRD/设计/变更等主文档；本步仅用户确认后落 HO。
      **先问后发**：出示【拟发包】；确认后才写盘；禁止静默发包。
      选类型：REQ/DES/PLAN/UAT/REL/BUG（无平台或点名）/DEC/RETRO；CHG 走 change_send。
      包须读包即懂；多包同仓直读禁转发；仓外文件夹/ZIP。输出【交接包已生成】。

  - name: 接收与签收
    id: receive
    agent: pm-lead
    hitl:
      - name: confirm_change
        when: handoff_change_substantive
      - name: confirm_plan
        when: plan_level_change
    output: 接收回执 + 产品计划/文档更新 + 台账状态
    notes: >
      读包顺序：`00-交接说明.md` → `01-交接清单.md` → `02-文档/` → `03-证据/`。
      定位：多包同仓 → 直接打开发送方路径（如 `开发/交接/{HO-ID}/`），**不要求**拷入 `产品/资料/交接/`；仓外 → 在用户放置处读文件夹/ZIP，台账可登记路径，归档有用时再可选拷到 `产品/资料/交接/`。
      核对五件事：清单齐/版本对/阻断缺口/互相矛盾/需产品拍板项；结论=接受/有条件接受/退回。
      回执默认可选；用户点名正式签收或发布/C2/C3 → 填写 `04-回执/接收回执.md` 并回传，台账改 `已接收/有条件接收/退回`。无回执只可称已发送，不得称已接收；正式签收时不得替对方签收。
      按包类型更新：提测/测试报告 → 产品计划 §7/§8、UAT 准备；开发任务/排期 → 产品计划 §4/§7；缺陷证据/评估单 → 受理单/缺陷处置；
      变更 → 先影响评估与 `confirm_change`/`confirm_plan`，再更新 PRD/AC/原型/交付计划/UAT/发布检查；
      发布结果 → 发布记录/复盘。更新 `交接台账.md`、产品计划 §0/§10/§12、文档索引、activeContext。
      阻断缺口 → 正式回执=退回，不进入下游；有条件 → 条件写进计划风险与责任人/截止；退回补件后发新版本。

  - name: 发送变更通知
    id: change_send
    agent: pm-lead
    hitl:
      - name: confirm_change
        when: handoff_change_substantive
      - name: confirm_handoff
        when: handoff_send_required
    output: 产品/交接/{CHG-HO-ID}/ + 更新后的受影响文档
    notes: >
      先按 `workflows/change.yaml` 完成受理/影响/处置/变更单；本步只负责“通知包”。
      按 §6 判 C0～C3；C2/C3 先过 `confirm_change`/`confirm_plan`。
      **CHG 包同样先问后发**：`confirm_handoff` 出示拟发摘要，确认后才生成。
      必带：变更单、更新后 PRD/AC/原型、影响矩阵、必做事项/截止、兼容/回滚、生效版本。
      多包同仓直读，禁止转发；仓外发文件夹/ZIP。

  - name: 接收变更并适配
    id: change_receive
    agent: pm-lead
    hitl:
      - name: confirm_change
        when: handoff_change_substantive
      - name: confirm_plan
        when: plan_level_change
    output: 变更影响分析 + 产品计划/文档调整 + 回执
    notes: >
      读变更包 00/01/02；按 §6 判级别；核对变更单、影响矩阵、生效版本、回滚/兼容。
      先做影响分析：PRD/AC、原型、范围/优先级、里程碑、UAT/发布、需求池、通知对象。
      C0 → 就地更新并书面答复；C1 → 更新受影响文档/计划，回执；C2/C3 → 重基线并过门，必要时反向发 `CHG`。
      更新 `交接台账.md`、产品计划 §0/§8/§10/§12、文档索引、activeContext；填写回执。
      与现有 PRD/计划冲突 → 列冲突，不静默选一边；未裁决前不进入实施/排期。

  - name: 重规划
    id: replan
    agent: pm-lead
    hitl: confirm_plan
    hitl_when: plan_level_change
    output: 更新后的产品计划 + 重规划记录
    notes: >
      按 `规则/协作/协作与交接.md` §6.2 触发（范围/里程碑/依赖/S1-S2/环境/产能/合规）执行；先冻结当前基线快照，再做影响矩阵。
      选一个动作并写理由：保持+加缓冲｜重排｜砍范围/降级 MVP｜拆波次｜暂停升级｜重新基线；C2/C3 必须过 `confirm_plan`。
      同轮更新产品计划 §0/§1/§3/§4/§8/§10/§12、`交接台账.md`、文档索引、activeContext；受影响的 `REQ/PLAN/UAT/REL` 包标 `已取代` 并重发。
      重规划后重过受影响门（PRD/评审/UAT/发布）；未过门不得把阶段标完成；向受影响角色发 `CHG` 包并收回执。

  - name: 收尾
    id: wrap
    agent: pm-lead
    output: 【任务收尾】（交接/回执/变更置第 1 点）
    notes: >
      按 AGENTS §2 输出【任务收尾】：第 1 点含 HO-ID/方向/类型/对方/包路径/状态/回执/阻断项与汇报（可整段复制），按收尾骨架六点输出：第 1 点纯执行汇报（代号带中文描述，不写待确认指针），第 4 点含待你确认表，第 6 点含当前/下一步/建议理由/完成标志。
      更新产品计划 §0/§10/§12、activeContext、文档索引；未回执/退回/待补项明示。
      本步只出骨架与拟提交清单；提交门在下一步。

  - name: 拟提交
    id: commit
    output: 拟提交确认结果
    agent: pm-lead
    hitl: confirm_commit
    hitl_when: has_pending_commit
    tools:
      - git
    notes: 无文件变更跳过；拟提交清单按 `规则/工作流.md` §3；提交后补一行结果，不重复六段。
