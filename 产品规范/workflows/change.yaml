# 读取：仅当前 step 块（当前 - name: 至下一个）；全文件仅供维护，禁止整文件通读。
# 需求/问题受理与变更（统一入口：新需求 / 变更 / 答疑 / 产品缺陷 / 开发不确定）
workflow:
  id: change
  name: 需求/问题受理与变更
  version: 3
  read_index: 规则/读取索引.md

entry_points:
  需求受理: intake
  问题受理: intake
  产品缺陷: intake
  需求变更: intake
  需求答疑: intake
  开发不确定: intake
  测试发现产品缺陷: intake

trigger:
  - 需求 / 问题 / 缺陷（未分类；对话或文档）
  - 需求变更 / 变更单
  - 需求答疑 / 跟进
  - 开发 / 测试发现产品缺陷，交产品确认
  - 开发不确定项 / 待产品确认

steps:
  - name: 受理与建档
    id: intake
    agent: pm-lead
    hitl:
      - name: confirm_understanding
        when: understanding_needs_confirm
      - name: confirm_iteration_close
        when: iteration_close_needed
      - name: confirm_docs_migration
        when: docs_migration_needed
    output: 产品/{版本或主题}/03-变更与缺陷/受理-{主题}-{yyyyMMdd}.md（模板 规则/模板/30-评审与变更/受理与处置模板.md）
    notes: >
      统一入口：对话、文档（md/txt/docx/pdf/链接/截图）、缺陷单、测试报告、提测单均可；
      文档能读则读，不能读则请用户给关键段/截图，禁假装已读。
      抽取：提出人/来源/日期、原始描述、期望、关联需求/PRD/AC、版本/环境/构建、证据、时间要求。
      技能：`技能/change-management/SKILL.md` + `技能/customer-needs-discovery/SKILL.md`（新需求/客户反馈/需求洞察时先读）。
      **先还原需求，再建档**：客户说的“想要 X”先还原为“谁/什么场景/遇到什么问题/现在怎么绕过/代价/要什么结果/怎么算成功/明确不做什么”；单个客户/领导/销售的说法标样本与证据等级，不直接当市场结论。
      按 `规则/核心/澄清.md` 先给理解回执，再一次一问至无实质缺口（95% 仅参考）；不确定项按 §2.1 分流（阻塞即时问，非阻塞收尾汇总）；用户明确确认后才分诊/写 PRD/计划。信息不足标「待确认」，未知标「假设/待验证」，禁臆造。理解未确认 → 仅记草稿/待确认，不生成正式受理结论、不分诊。
      confirm_understanding：出示客户/用户、场景、问题、现有替代、目标结果、范围/非目标、证据/假设、成功标准；确认后才进入 triage/PRD/计划。
      生成受理编号（RQ/CR/BUG-…），落受理单；同一问题去重合并，重复项指向主条目。
      若输入含外部文档/新 PRD/原型/专项/方案变更/未决确认：先按 `规则/文档治理.md` §3 输出【入站分析】（意图 T1～T9｜落点｜同步｜归档）；确认前不改文件。确认采纳后同批：**多包 → `项目资料/{版本或主题}/`**（登记索引，只吸收本包）；**单包 → `产品/资料/{版本或主题}/` 或 `_通用/`** → 同步工作区 SSOT → S1/S2/S3 失效进 `产品/资料/_归档/{批次}/` + 清单；部分/参考保留；冲突停下。本包活文档直接改工作区，不进资料。放入共享收件箱≠分发他包。
      确认采纳或换代/换主题后按 `规则/文档治理.md` §7（不确定则 `confirm_iteration_close`；确认后 §7.1 完整关账，跳过仅发版项）。
      **文档抽取分片**（子代理编排 §2）：≥3 份新文档/长文档 → 只读扇出（每份返回来源/期望/证据/关联/时间 ≤30 行）；建档与分诊集中；单份直做。

  - name: 分诊与定性
    id: triage
    agent: pm-lead
    output: 分诊结论（写入受理单 §3）
    notes: >
      按技能 §2 判定树分类：新需求 / 需求变更 / 答疑 / 产品缺陷 / 实现缺陷 / 技术不确定 / 重复 / 无效。
      分诊前确认需求理解已确认；理解与实际不符（例如把客户方案当问题）→ 先回 intake 澄清，不硬分诊。
      产品缺陷必须给依据：PRD/设计原文 + 现网或测试证据 + 相符证明（实现符合 PRD 但口径不合理/有风险）；
      无依据按实现缺陷或「待确认」处理，禁把实现缺陷甩成产品缺陷。
      判定处置路径：立即修 / 下版 / 不修 / 退回开发 / 补充信息 / 进需求池 / 进 PRD。
      结论写入受理单，不在此实施。

  - name: 新需求与优先级（条件）
    id: new_requirement
    when: new_requirement
    agent: pm-analyst
    hitl: confirm_scope
    hitl_when: scope_decision_required
    output: 产品/需求池.md 更新 + 范围结论
    notes: >
      条件步：分诊为**新需求**才走；已定稿基线的需求变更/缺陷/答疑跳过（走 assess/decide 的 confirm_change）。
      技能：`技能/customer-needs-discovery/SKILL.md` + `技能/requirement-discovery-and-prioritization/SKILL.md`（先读）。
      入需求池（R-xx，价值/成本/风险/优先级/版本/状态），决定本期/下期/不做；每条附来源/证据/假设；未确认的需求不排期、不承诺版本。
      优先级依据=确认的需求+证据，不用竞品/领导偏好/单个客户替代；拿不准向上一档并说明。
      confirm_scope：出示范围（MVP）/排除/粗排期/依赖风险；批准后进入 assess 或路线图。
      下期需求 → 更新产品计划 §2 路线图与需求池状态，不产生本期变更单。

  - name: 影响评估
    id: assess
    when: needs_impact_assessment
    agent: pm-lead
    output: 影响评估（受理单 §4；改动已定稿基线时同步 产品/{版本或主题}/03-变更与缺陷/变更-{主题}-{yyyyMMdd}.md §3）
    notes: >
      评估：需求/范围、AC/验收、成本/排期、技术/测试风险、数据/合规/权限、回滚、依赖。
      列出受影响产物：PRD 正文/§13 AC、原型、交付计划、产品计划 §0/§8、需求池、UAT、发布检查/GTM、通知对象。
      改动已定稿基线 → 必须产生变更单（模板 `规则/模板/30-评审与变更/变更单模板.md`），不得只写受理单 §4。
      结论：接受/拒绝/延后/下版/退回开发/补充信息 + 建议方案。
      **影响面分域**（子代理编排 §2）：跨版本/高价值且 ≥3 影响域 → 只读分域评估（PRD/AC、计划/里程碑、UAT/发布、通知/客服），各返回受影响/依据/动作 ≤30 行；影响评估与变更单集中写，不并行改同一文档。
      可选输入（不强制）：缺陷单、测试报告、提测单、开发方案/附件（任意路径/来源）；缺则不阻塞，一句话说明。

  - name: 处置确认
    id: decide
    agent: pm-lead
    hitl:
      - name: confirm_change
        when: change_requested
      - name: confirm_plan
        when: plan_level_change
    output: 处置结论（受理单 §5；改动已定稿基线时写变更单 §4）
    notes: >
      confirm_change：出示分诊结论/依据/影响/处置选项（立即修/下版/不修/退回开发/补充信息）与变更单要点；
      产品缺陷必须给 PRD/设计对照与相符证明；实现缺陷退回也要出示依据与回执，但不产生变更单；批准后才实施。
      confirm_plan：影响版本范围/里程碑/KPI 时叠加计划门；只改需求细节不触发。
      纯答疑 → 受理单即答复记录，可跳过本门。

  - name: 联动落地
    id: apply
    when: needs_linked_update
    agent: pm-lead
    output: 更新后的 PRD/AC/原型/交付计划/产品计划/需求池/UAT/发布检查 + 受理单 §6 联动清单
    notes: >
      按受理单 §6 逐项更新，只写现行有效；每项标「已更新/不适用/待补」，待补写责任人与截止，不得静默漏项。
      联动清单未闭合/待补无主 → 不得关闭；闭合门在下一步 `verify` 统一跑（先更新、后对账）。
      PRD 正文/§13 AC/§16.4 变更记录；原型/交互；交付计划范围/里程碑；产品计划 §0/§2/§7/§8/§10/§11；
      需求池状态；UAT 验收范围；发布检查/GTM；开发/测试/运营/客服通知包。
      若缺陷在平台且未走 defect 工作流，按 `规则/缺陷/缺陷平台协作.md` 回写处置结论/附件；平台不可用则由用户转贴（禁猜接口）。
      变更单与受理单互相链接；旧版归档，不堆「最终版」。
      按 §6 判 C0～C3；默认更新变更单/PRD。`CHG` 包仅多角色冻结/签收/仓外/点名时停问建议；确认后 `handoff.send`。C2/C3 先重基线。
      联动审计（子代理编排 §2）：≥4 份受影响文档 → 单写手完成后派 verifier-agent 只读核验（受理单 §6＋改动产物），返回未更新/旧口径/待补 ≤30 行；不并行写同一文档。
      输出「联动变更清单」+「最新产物路径」。

  - name: 重审（条件）
    id: review
    when: substantive_change
    agent: reviewer-agent
    gate: product-review
    gate_when: ai_review_chosen
    hitl:
      - name: select_review_mode
        when: landing_doc_review_needed
      - name: confirm_prd
    output: 评审记录（产品/{版本或主题}/01-需求与定义/评审-{主题}-{yyyyMMdd}.md）
    notes: >
      条件步：实质变更（范围/AC/状态机/权限/数据规则/NFR/版本目标）才走；纯文字澄清跳过。
      **先 STOP【评审方式】**（`技能/artifact-review`）：A 自行通过｜B AI 独立审；未选不得恢复定稿。
      **选 A**：出示【完稿自检摘要】+ 变更影响/AC/追溯 → HUMAN_APPROVED → `confirm_prd`；不跑 `-Mode review`；须 `-Mode prd` 非 BLOCKED。
      **选 B**：`技能/review-and-finalize`；先写评审记录再 `-Mode review`；未 READY 不得恢复定稿。
      **评审分片**：大 PRD 维度扇出；评分卡只算一次。
      confirm_prd：通过才恢复「已定稿」并回写 `status: APPROVED`；需修回 apply（≤1）。未重审不得标已定稿。

  - name: 验证与关闭
    id: verify
    when: needs_linked_update
    agent: pm-lead
    gate: change-closure
    output: 验证结果（受理单 §7 / UAT 更新 / 变更单 §5）
    notes: >
      运行 `验证/Invoke-Gate.ps1 -Mode change`（读 `.gate/产品规范/change.json`）；受理单联动清单未闭合、验证结果缺失 → 不得关闭。
      未 READY → **保持受理单打开，不得进入 wrap/commit 冒充完成**；先补联动/证据或报阻塞。
      影响 AC/UAT/发布 → 受影响项重验（结果+证据），更新 UAT 记录与发布检查；
      未 UAT/未发布 → 以测试报告/回归/冒烟证据关闭；确实不适用写原因。
      开发/测试回执：处置结论、需要做什么、影响 AC、目标版本、负责人/截止。
      退回开发 → 产品侧回执后关闭受理单，缺陷状态由开发/测试流程跟踪，禁写「已修复」；
      下版 → 回池/路线图后关闭本期受理单；不修 → 留理由与接受人后关闭。
      处置=补充信息/仍有待补项 → 保持打开，不关闭；未验证不得关闭。
      检查 `交接台账.md`：受影响角色的 `CHG` 是否已接收/有条件接收；未回执不得关闭变更，列待回执与升级对象。
      关闭后更新产品计划 §0/§7/§10、activeContext；资料变更同步 `产品/资料/资料索引.md`。

  - name: 收尾
    id: wrap
    agent: pm-lead
    output: 【任务收尾】（受理/处置/缺陷等置第 1 点）
    notes: >
      按 AGENTS §2 输出【任务收尾】：第 1 点含汇报（可整段复制），按收尾骨架六点输出：第 1 点纯执行汇报（代号带中文描述，不写待确认指针），第 4 点含待你确认表，第 6 点含当前/下一步/建议理由/完成标志。
      更新产品计划 §0/§7/§10、activeContext、资料索引；未验证/待回写项明示。
      本步先出骨架与拟提交清单，提交门在下一步。

  - name: 拟提交
    id: commit
    agent: pm-lead
    hitl: confirm_commit
    hitl_when: has_pending_commit
    tools:
      - git
    notes: 无文件变更跳过；拟提交清单按 `规则/工作流.md` §3；提交后补一行结果，不重复六段。
