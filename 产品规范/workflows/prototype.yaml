# 页面原型设计（IA → 线框 → 视觉 → 高保真 → 评审 → 交接）
workflow:
  id: prototype
  name: 页面原型设计
  version: 1

trigger:
  - 画原型 / 页面原型 / 原型设计 / 线框图
  - UI 设计 / 界面设计 / 高保真原型
  - 设计评审 / UI 走查 / 设计走查

steps:
  - name: 项目情境与参考基准
    id: context
    agent: ux-designer
    output: 产品/{版本或主题}/原型/设计情境-{主题}.md
    notes: >
      读 PRD/产品计划/UAT/现有系统截图/品牌/约束；写清用户/任务/环境/设备/数据量/权限/术语/合规。
      2～3 个竞品/同类系统/设计规范参考（链接+日期），写借什么/不借什么；设计原则 3～5 条。
      覆盖目标：PRD F/A/AC → 页面/路由/状态；未读项目资料不得开画。
      技能：`技能/prototype-and-interaction/SKILL.md` §0；能力 design-intelligence/browser-mcp 可选。

  - name: 信息架构与页面清单
    id: ia
    agent: ux-designer
    output: 产品/{版本或主题}/原型/IA-{主题}.md
    notes: >
      技能：`技能/prototype-and-interaction/SKILL.md`（先读再做）。
      站点地图/导航/页面清单/关键流程/角色与权限；每页写目标、入口、主操作、出口；
      明确本期做/不做；桌面/移动适配策略；覆盖矩阵初稿（PRD F/A/AC → 页面/路由）。

  - name: 低保真线框
    id: wireframe
    agent: ux-designer
    output: 产品/{版本或主题}/原型/wireframe-{页面}.html 或 原型说明 §线框
    notes: >
      先结构后视觉：导航/标题/筛选/内容/操作/反馈区；一屏一个主任务。
      每页覆盖空/加载/失败/成功/禁用/无权限状态；交互与文案就地标注。
      可用 `规则/模板/原型脚手架.html` 起步（离线、无依赖）。

  - name: 视觉方向与设计系统
    id: visual
    agent: ux-designer
    hitl: confirm_design
    notes: >
      技能：`技能/ui-visual-design-system/SKILL.md`。
      2～3 个视觉方向（气质/配色/字体/适用场景），推荐 1 个并说明理由；
      产出 design tokens（颜色/字体/间距/圆角/阴影/组件）。
      confirm_design：出示 IA/线框/视觉方向/tokens 请确认；确认后才做高保真。
      能力（可选）：design-intelligence / ui-generation / frontend-design；未装 = 按包内技能。

  - name: 高保真可点击原型
    id: hi-fi
    agent: ux-designer
    output: 产品/{版本或主题}/原型/prototype/index.html + design-tokens.css
    notes: >
      静态 HTML/CSS（可少量 JS），浏览器直接打开；覆盖核心流程、状态、响应式、无障碍基础。
      数据模型/seed/重置；导航/历史/返回/未保存提醒；每页状态矩阵逐项落地；单据类 A4 打印/导出。
      原型/PRD 版本元数据（页面 title/meta 或说明文件）。
      不做生产级后端；无设计师时以“清晰、一致、可用”为准，不冒充品牌级视觉。
      技能：`技能/prototype-and-interaction/SKILL.md`、`技能/ui-visual-design-system/SKILL.md`；能力 ui-generation 可选增强，未装不影响。

  - name: 工程化与可访问性
    id: engineering
    agent: ux-designer
    output: 产品/{版本或主题}/原型/工程化检查-{主题}.md
    notes: >
      导航/路由/历史/返回/未保存提醒；数据模型/seed/重置；状态矩阵逐页核对。
      响应式断点 + 手机完整流程；单据类 A4 打印/导出与打印门槛。
      WCAG 2.2 AA：键盘/焦点/对比度/ARIA/语义/label/alt，留证据（截图/检查结果）。
      原型/PRD 版本元数据；缺项列阻断，修完再评审。

  - name: 设计评审
    id: review
    agent: ux-designer
    output: 产品/{版本或主题}/原型/设计评审-{主题}.md
    notes: >
      按 `技能/ui-visual-design-system/SKILL.md` 评审清单 + `规则/模板/设计评审模板.md`：
      信息架构/一致性/状态/交互/文案/响应式/无障碍/视觉层级；12 项评分卡 0～2 分，阻断项必须 2 分。
      问题分级（阻断/重要/建议）；需修回 hi-fi（同回合≤1 次）；证据=截图/路径。
      能力（可选）：design-review（web-design-guidelines）；未装 = 按清单人工核。

  - name: 可用性走查
    id: usability
    agent: ux-designer
    output: 产品/{版本或主题}/原型/可用性走查-{主题}.md
    notes: >
      3～5 个关键任务走查：任务完成/步数/卡点/错误；Nielsen 10 启发式；
      记录问题/严重度/建议；需修回 hi-fi（同回合≤1）。
      无真实用户时标注“内部走查”，不冒充用户测试结论。

  - name: 开发交接
    id: handoff
    agent: ux-designer
    hitl: confirm_prototype
    output: 产品/{版本或主题}/原型/开发交接-{主题}.md
    notes: >
      组件/状态/交互/动效/tokens/响应式/无障碍证据/验收对照；覆盖矩阵与版本元数据；
      回链 PRD §7；标注“原型≠生产代码”。
      confirm_prototype：出示原型路径/设计评审与可用性结论/交接要点请确认；确认后交开发。
      PRD §1 原型链接回填；拟提交按 `规则/工作流.md` §3。

  - name: 拟提交
    id: commit
    agent: ux-designer
    hitl: confirm_commit
    hitl_when: has_pending_commit
    tools:
      - git
    notes: 无文件变更跳过；拟提交清单按 `规则/工作流.md` §3。
