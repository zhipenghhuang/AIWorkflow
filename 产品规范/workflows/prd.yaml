# 需求与 PRD（洞察 → 立项 → PRD → 评审定稿）
workflow:
  id: prd
  name: 需求与 PRD
  version: 1

trigger:
  - 收集需求 / 需求洞察 / 竞品分析 / 需求池
  - 立项 / 排优先级
  - 写 PRD / 出 PRD / 补 PRD / PRD 评审 / 定稿

steps:
  - name: 需求洞察与需求池
    id: discover
    agent: pm-analyst
    notes: >
      来源分层（用户反馈/客服/数据/销售/竞品/合规）；每条入 `产品/需求池.md`（价值/成本/风险初判 + 状态）；
      引用须可回查（来源+日期），无依据写「待验证」。
      能力（可选）：docs-mcp 查资料、browser-mcp 查竞品/后台；未装=按主读与用户输入。
      技能：`技能/requirement-discovery-and-prioritization/SKILL.md`（先读再做）。

  - name: 优先级与立项
    id: prioritize
    agent: pm-analyst
    hitl: confirm_scope
    notes: >
      条件步：跨版本/高价值需求或点名「立项」才走；小需求直接进 PRD（不设门）。
      方法按需：RICE / Kano / MoSCoW；产出：优先级 + 版本范围（MVP）+ 排除项 + 粗排期 + 依赖风险。
      confirm_scope：出示范围/目标/粗排期请确认，批准后才进 PRD。

  - name: PRD 撰写
    id: prd
    agent: prd-writer
    output: 产品/{版本或主题}/PRD-{主题}.md（模板 规则/模板/PRD模板.md）
    notes: >
      技能：`技能/prd-writing/SKILL.md`（先读再写）。
      要素齐：背景/目标与指标/用户场景/功能清单/流程/状态机/权限矩阵/字段规则/异常边界/非功能/埋点/验收标准/范围排除/依赖风险/里程碑；
      写不出验收标准 = 需求未定义完；禁臆造用户反馈与数据（引用可回查）。
      完稿按评审清单自检（技能03 同源），带缺口禁落盘。

  - name: 页面原型（条件）
    id: prototype
    agent: ux-designer
    notes: >
      条件步：有界面/页面需求或用户点名「画原型」才走；纯后端/接口跳过。
      按 `workflows/prototype.yaml` 执行（IA → 线框 → 视觉 → 高保真 → 设计评审 → 交接）；
      原型完成后回 PRD 评审；PRD §1 原型链接回填。
      技能：`技能/prototype-and-interaction/SKILL.md`、`技能/ui-visual-design-system/SKILL.md`。

  - name: PRD 评审与定稿
    id: review
    agent: reviewer-agent
    hitl: confirm_prd
    notes: >
      技能：`技能/review-and-finalize/SKILL.md`；独立复核（完整/可测/无歧义/范围/依赖/风险/验收标准/埋点）。
      产出评审记录 `产品/{版本或主题}/评审-{主题}-{yyyyMMdd}.md` 与【评审结论】。
      confirm_prd：出示结论与定稿要点，批准才定稿；缺口回 prd 修订（同回合≤1 次）。
      **未定稿不排期**（`规则/工作流.md` §1）。

  - name: 拟提交
    id: commit
    agent: prd-writer
    hitl: confirm_commit
    hitl_when: has_pending_commit
    tools:
      - git
    notes: 无文件变更跳过本步与 hitl；拟提交清单按 `规则/工作流.md` §3。
