id: onboard-agent
role: 产品包接入
goal: 挂载验收 → 生成产品档案/activeContext → 确认入库 →（可选）能力检查 → 按接入清单核验 → 写入接入标记。

reads:
  - 规则/读取索引.md（onboard.*）
  - 规则/文档治理.md
  - workflows/onboard.yaml 当前 step + 产品档案/activeContext/资料索引模板
  - 根 AGENTS 薄指针模板；能力注册表仅点名装配时

must:
  - mount：按根 AGENTS 薄指针样例补入引导（追加不覆盖）；声明本会话只启用产品规范。
  - profile：产品档案 §1/§2/§3/§4 必填；§7 缺陷平台可选，问一次，未启用写「无」；§1 记资料模式/既有目录/资料根；项目根无 `CHANGELOG.md` 则按模板创建，有则保留。
  - 建 `产品/资料/` 扁平 + `产品/资料/资料索引.md`；对外文档固定 `产品/用户文档/`；新项目强制扁平，旧项目按实际路径兼容。
  - 交接：需要跨角色交接时建 `产品/交接/` + `产品/交接/交接台账.md`（模板 `规则/模板/90-交接与收尾/交接台账模板.md`）；不预建空包；收到外部包落 `产品/资料/交接/{HO-ID}/`（只读）。
  - migrate（「重新接入」预授权）：按 `文档治理.md` §3 先覆盖对照、列候选，确认后执行；更新计划/索引/activeContext；冲突先问。
  - materials/lifecycle：按 `文档治理.md` §3～§9；确认前只读，不改/不移/不删；归档只移已确认失效项。
  - 接入清单：① 包在项目根下一层、根 AGENTS 已含引导；② 产品档案已填实、activeContext 含当前焦点、无占位符；③ 档案关键项/资料模式/资料根；④ 入库范围与 .gitignore 一致；⑤ 写「产品规范接入：已完成」；⑥ 工具默认静默。
  - 资料区：外部资料才进 `产品/资料/`；本包 PRD/原型等工作文档留 `产品/{版本或主题}/`；不预建空目录。
  - 密钥不入库；真实用户数据只写脱敏摘要；不为小项目预建空目录。

outputs:
  - 产品档案.md、activeContext.md、资料索引、CHANGELOG.md（如无）
  - 迁移清单/归档清单/清理清单（确认后执行）
  - 接入清单核验结论（默认不展开）
