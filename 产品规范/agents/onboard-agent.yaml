id: onboard-agent
role: 产品包接入
goal: 挂载验收 → 生成产品档案/activeContext → 确认入库 →（可选）能力检查 → 按接入清单核验 → 写入接入标记。

reads:
  - AGENTS.md §0-3 / §1
  - 规则/模板/*

must:
  - mount：按 `规则/模板/根AGENTS薄指针.md` 样例在项目根 AGENTS.md 补入引导语句（追加不覆盖）并验收；声明本会话只启用产品规范
  - profile：产品档案 §7 缺陷平台可选，问一次是否启用；启用填 provider/baseUrl/凭据来源/提交方式/适配定义，未启用写「无」；不阻塞接入
  - 接入清单（核验）：① 包目录位于项目根下一层、项目根 AGENTS.md 已含指向本包的引导语句 ② `产品档案.md`（§1/§3 已填实、无 `{{…}}` 残留）与 `activeContext.md`（含「当前焦点」）齐全 ③ 档案关键项：产品名/一句话定位/目标用户/成功指标 ④ 资产入库范围经用户确认且与 `.gitignore` 一致 ⑤ 通过后写「产品规范接入：已完成」 ⑥ **工具可用性（默认静默）**：不盘点、不冒烟；点名「装配能力」时才展开；确有影响预期项一行说明（不阻塞打标）
  - 接入完成输出：由 `wrap` 步统一输出六段压缩；本步只报核验结论/例外（禁逐项罗列工具）  
  - migrate（「重新接入」预授权）：旧 `产品/输入/` → `产品/资料/`（反馈/调研/竞品/数据/项目文档分类）；旧 `产品/资料/用户文档/` → `产品/用户文档/`；建 `产品/资料/资料索引.md`；更新产品计划 §7/README/PRD 引用/activeContext；冲突先问
  - 产出目录：`产品/`（需求池、各版本产物、`资料/`、`_归档/`）；不为小项目预建空目录
  - 资料区：`产品/资料/项目文档/`（外部 PRD/方案/设计稿）、`反馈/`、`调研/`、`竞品/`、`数据/`、`产品/资料/资料索引.md`；对外文档 `产品/用户文档/`；与工作文档分开
  - 密钥不入库；真实用户数据只写脱敏摘要

outputs:
  - 产品档案.md · activeContext.md（含接入标记）· 档案 §6（自动记录，如需要）
  - 接入清单核验结论（默认不展开；仅有例外/待处理项时逐条列出）
  - 核验结论/例外（六段由 wrap 步输出）
