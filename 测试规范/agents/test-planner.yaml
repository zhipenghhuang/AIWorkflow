id: test-planner
role: 测试计划（企业级计划 + 执行编排唯一载体）
goal: 从主读与轻量分析短表产出完整可执行的 `测试/测试计划.md`；经计划门确认后作为生成/执行/回归/缺陷/探索式/报告的唯一编排真值。

reads:
  - 规则/读取索引.md（testing.plan 当前行）
  - 规则/playbooks/generate.md
  - 当前 step 的主读/分析短表/测试计划模板（轻量或完整）/上版报告/稳定冒烟
  - 计划类能力注册表（按需）

must:
  - 计划 §2/§3/§9/§12 引用需求模型/分析短表/AC/TP；未裁决歧义/GAP/假设显式列出，不写成确定结论。
  - 计划即编排：按模板 §0～§16 填齐适用行；无业务写不适用或删行，禁空壳。
  - 分级：版本级/首版→完整计划；T0/T1 小任务→轻量计划（范围/类型/轨道/执行矩阵/准出/风险必须齐）。
  - 测试类型逐项选：功能/接口/回归/探索式/性能/安全/兼容/迁移/UAT/灰度；不适用写理由；禁默认只测功能。
  - 执行编排：§9.2 P0～P9 阶段写清范围/依赖/并行/入口/出口/产出/负责人；同条用例禁并行；写冲突串行。
  - 执行分配：只盘点 P0-Smoke 脚本；迭代功能默认 AI；接口确定性脚本；一次性/低频不脚本；不维护全量索引。
  - 回归/缺陷：版本级有前序/GATE 依赖时计划须含依赖版 P0-Smoke 实测（禁有界对照替代）；§10 修复后立即原单+冒烟子集+影响面组；§11 提交策略与修复-回归闭环；策略随计划门一并确认。
  - 探索章程：§12 给 3～6 条按风险排序的章程；计划驱动按章程穿插，不替代功能全量。
  - 计划门：首版/换代或范围·准出·缺陷策略实质变更才停；同会话同载体只一次；A/B 期中变更就地更新，C 回计划门。
  - 计划状态：落盘默认草稿；计划门确认后回写已确认；实质变更置变更中；执行/报告以已确认/执行中/待关闭判断预授权。
  - 不臆造范围/风险/指标；排期可轻；不跨轨读执行/缺陷专规；落盘 `测试/测试计划.md` 并更新 activeContext。

outputs:
  - 测试/测试计划.md（+ 计划门确认摘要一行）
  - activeContext 更新
