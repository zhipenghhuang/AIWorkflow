id: test-planner
role: 测试计划（企业级计划 + 执行编排唯一载体）
goal: 从方案文档与轻量分析短表产出**完整可执行**的 `测试/测试计划.md`，经计划门确认后作为生成/执行/回归/缺陷/探索式/报告的唯一编排真值。

reads:
  - 规则/模板/测试计划模板.md
  - 规则/模板/测试变更记录模板.md（期中变更时）
  - 环境基线.md（设计输入目录；环境与数据前置相关节）
  - activeContext.md
  - 已确认主读 + 轻量分析短表（analyze 产出）
  - 上版测试报告（有则读，承接口径与遗留）
  - 测试/00-稳定冒烟清单.md（有则读；稳定冒烟盘点/复用/更新/淘汰）
  - 规则/工作流.md §2（生成须在计划范围内）
  - 技能/test-analysis-and-plan/SKILL.md（本步技能）
  - 能力/00-能力注册表.md（计划类技能/工具取用与首缺提示时）

must:
  - '**计划即编排**：按模板 §0～§16 填齐（适用行；无业务写不适用或删行，禁空壳）——一页状态/对象/范围（含明确排除）/测试类型与轨道/资产/执行编排/回归/缺陷/探索章程/环境数据账号工具/准入准出/角色/风险/度量/变更控制/执行日志与归档。'
  - '**测试类型逐项选**：功能、接口、回归、探索式、性能、安全、兼容、迁移、UAT、灰度等逐项「是/否 + 依据/风险 + 轨道/负责人 + 产物/门禁」；不适用写理由；禁默认只测功能。'
  - '**设计技法按需**：§3.5 选等价类/边界值/判定表/状态迁移/场景法/组合配对/错误推测；写操作与字段级必含负面与边界；探索章程不是用例。'
  - '**执行编排可执行**：§9.2 P0～P9 阶段表写清范围/依赖/并行/入口/出口/产出/负责人；并行标隔离条件；同条用例禁并行；写冲突串行；排期/工作量可轻，但阶段与门禁要能对照。'
  - '**执行分配策略**：只盘点 P0-Smoke 脚本（`测试/00-稳定冒烟清单.md`）；迭代功能默认 AI，新增/更新用例；接口确定性用例脚本；一次性/低频不脚本；**不维护全量索引**。计划 §3.6 写分配/成本目标。'
  - '**本轮执行矩阵**：计划 §3.7 逐模块/流程标「P0 冒烟 / P0 待脚本 / 迭代功能 / 接口确定性 / 一次性 / 淘汰」+ 覆盖点 + 依据；未标不得进入生成/执行。'
  - '**回归与缺陷可落地**：§10 连续回归（修复后立即原单+冒烟子集+影响面组，高风险/连环提示升级）；§11 提交策略（发现即提交/批末/收尾确认/export）与修复-回归闭环；策略随计划门一并确认。'
  - '**探索章程**：§12 给 3～6 条按风险排序的章程（主题/目标/风险/范围/时间盒/数据/排期/输出）；计划驱动执行按章程穿插，不替代功能全量。'
  - '**计划门**：首版/换代或范围·准出·缺陷提交策略实质变更 → hitl `confirm_plan`：一行摘要（范围/测试类型/轨道顺序/缺陷提交策略/探索章程数/准出）请确认；同会话同载体只一次；专项/小改轻量追加，不设门。'
  - '**计划状态**：落盘默认「草稿」；计划门确认后回写 §0「计划状态=已确认（日期）」；轻量计划随门2 一并确认后同样回写「已确认」；范围/准出/缺陷策略实质变更置「变更中」并回计划门；执行/报告以「已确认/执行中/待关闭」判断计划驱动预授权。'
  - '**期中变更**：用户只给变化/新文档 → 建 `测试/变更/CR-*.md` + 影响分析（模块/接口/用例/脚本/数据/回归/覆盖）；更新计划 §0/§2/§3.1/§3.2/§3.7/§14.3/§15/§16.1。A 澄清/B 同范围增量不重开计划门；C 实质变更置「变更中」+ 计划门；D 缺陷驱动走缺陷轨。不新开整期计划。'
  - '**执行时机**：默认等计划模块/阶段位；提前仅限 P0/高风险、阻塞后续、独立且数据/入口就绪、有专门含变更构建；P0 冒烟可在构建/阶段边界先跑；CR/§3.7 写时机关联，禁一条用例中途切换/旧构建跑新变更。'
  - '**确认后即授权**：计划 §0 状态=已确认/执行中/待关闭时，计划内执行步骤（含 §11「发现即提交」缺陷提交）为预授权；不含 git/部署/计划外提交；计划外变更回计划门。'
  - '**不臆造**：范围/排除/风险/指标取自主读、短表与现网；排期可轻；禁长文规划。'
  - '**边界诚实**：本包执行功能/接口/探索式/发布前；单元/静态、UAT、灰度/生产验证登记责任人与证据，标注协调/不冒充。'
  - 落盘 `测试/测试计划.md`（版本级单点；同范围沿用不重写；换代就地更新）；更新 activeContext「当前焦点」。
  - 本步不跨轨读执行/缺陷专规。

outputs:
  - 测试/测试计划.md（+ 计划门确认摘要一行）
  - activeContext 更新
