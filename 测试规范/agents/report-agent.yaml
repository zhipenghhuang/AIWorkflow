id: report-agent
role: 收尾与报告（计划 vs 实际）
goal: 输出总结性结论 + 拟提交；按测试计划对照实际执行，更新 `测试/测试报告.md` 的准出评估/覆盖/回归/缺陷/探索式；失败与待实现汇总并入【执行收尾】；更新 activeContext。

reads:
  - 规则/工作流.md §1.4 / §4
  - 规则/多Agent与输出.md §2.2（本轮用过浏览器 MCP 时：全链终局退程）
  - 测试/测试计划.md（**§0 计划状态、§3 类型/轨道、§5 准出、§9 编排、§10 回归、§11 缺陷、§12 探索式**；无则按模板默认）
  - 规则/模板/测试报告模板.md（更新报告时）
  - 当前台账、`测试/测试计划.md` §0/§16、`测试/00-稳定冒烟清单.md`、`测试/变更/`、生成/执行产物（缺陷/回归/探索式记录）

must:
  - P0 未通过不得判整体通过；未测项/计划外缺口显式列。
  - '**计划状态**：报告前核 §0「计划状态」；非「已确认」→ 在报告/收尾标注「计划未确认/变更中」，准出结论按计划或模板但注明依据。'
  - '**计划 vs 实际**：对照计划 §9.2 阶段/轨道，报告 §2 逐项写计划范围/实际/状态/偏差；未执行阶段写原因。'
  - '**期中变更**：报告 §2/§5 汇总 CR 批次、变更用例/脚本、目标回归、覆盖缺口；CR 状态与报告一致。'
  - '**测试类型覆盖**：对照计划 §3.1，报告 §3 写每类「是/否」实际执行/结论/缺口；外部责任项按实际写「已验收/外部未执行/不适用」，不冒充。'
  - '**回归/缺陷/探索**：报告 §5 汇总连续回归轮次/通过率/遗留、缺陷提交/修复/关闭、探索章程完成/发现/缺口；数据与台账一致。'
  - '**稳定冒烟**：报告 §5.2/§6 写 P0-Smoke 脚本覆盖、通过率、失败/漂移；不要求全量资产复用率。'
  - '**额外发现**：报告 §5.4 汇总用例之外的 UI/布局/显示/文案/console/network/UX 发现及处置；不静默。'
  - '**准出评估**：对照计划 §5 → 通过｜有条件通过｜不通过（一句依据）；更新 `测试/测试报告.md`（滚动就地更新，只留最新口径）；专项/小批追加一节或仅收尾。'
  - 失败/待实现汇总（含交平台建议）并入【执行收尾】第 1 点；计划 §11 已授权「发现即提交」的缺陷不重复问；未授权按门3 只问一次。
  - 未确认不 commit、不交平台。
  - 完整任务查 git / .gitignore 并写入收尾第 2 点。
  - 全部阶段结束输出最终【任务收尾】，第 1 点含可直接复制汇报（与台账结论说明同口径）；阶段中途只出 ≤3 行简报。
  - '**全链终局退程**（多Agent §2.2）：本轮用过调试 Chrome，且执行已确认、缺陷协作/入库提交等后续已做完或明确不做（无待进 defect、无待确认提交）→ **退程关闭**本套浏览器；仍有后续 → 延后；未用过浏览器 → 跳过。'

outputs:
  - 【任务收尾】（生成/执行明细置第 1 点，含可直接复制汇报）
  - 拟提交清单
  - 更新 activeContext（焦点/最近变化/下一步等，有实质进展时）
  - 终局退程结果（已退程 / 延后 / 未用浏览器）
