id: onboard-agent
role: 测试包接入
goal: 挂载 → 基线关键节 → activeContext → 入库确认 → 环境与工具检查（默认静默） → 按接入清单核验 → 打标 landing=ok，避免后续任务重复预检。

reads:
  - AGENTS.md §0-3 / §1
  - workflows/onboard.yaml
  - 规则/模板/环境基线模板.md（文首接入最小集）
  - 规则/模板/activeContext模板.md
  - 规则/模板/根AGENTS薄指针.md（项目根 AGENTS 引导样例）
  - 能力/00-能力注册表.md（环境与工具检查步 / 点名「装配能力」时）

must:
  - 顺序不可跳：挂载 → 基线关键节 → activeContext → 入库确认 → 环境与工具检查（默认静默） → 清单核验 → 打标
  - 接入清单（核验）：① 包目录位于项目根下一层、项目根 AGENTS.md 已含指向本包的引导语句（缺失则按 `规则/模板/根AGENTS薄指针.md` 补写；落地通常只装本包）② 实例齐全：环境基线.md + activeContext.md（含「当前焦点」或旧版 A/B）③ 无占位符残留（基线 `{…}`／activeContext `{{…}}`）；基线最小集 §1/§2.1/§2.2/§8 已填实 ④ 资产入库范围与 .gitignore 一致 ⑤ 通过后写入 `landing=ok` ⑥ **脚本档（按需落地）**：用户启用脚本档，或首次生成/执行接口轨、P0-Smoke 脚本时，按 `规则/脚本执行.md` §2 自动复制 executor/config 模板并填基线（模板 §16；实例以实际编号为准）、先跑通 1 条只读脚本；不要求用户点名，但禁强推全套/空跑 ⑦ **工具可用性（默认静默）**：不盘点、不冒烟；点名「装配能力」时才展开；确有影响预期项一行说明（不阻塞打标）
  - 接入完成输出：由 `wrap` 步统一输出六段压缩；本步只报核验结论/例外（禁逐项罗列工具）
  - 旧结构迁移（「重新接入」= 预授权）：扫描并迁移到最新布局——根 `项目资料/` → `测试/资料/项目文档/`；`测试/测试用例/` + `测试/执行台账/` → `测试/功能测试/`；`测试/测试脚本/` → `测试/脚本/`；`测试/变更记录/` → `测试/变更/`；`测试/发布前测试/{专项}/` 保持并确保性能/安全/兼容各自独立；`测试/计划执行看板.md` 并入测试计划 §0/§16 后删除。更新基线 §2.1/计划/报告/索引/activeContext；冲突或无法判断先问一次，不覆盖。
  - 设计输入整理（一次性建议）：`测试/资料/项目文档/` 平铺且文件多 → 一问是否按「版本/主题」建子目录（建议；拒则保持并据实写基线 §2.1 目录结构）
  - 新布局固定：测试相关根文件只留 `环境基线.md`、`activeContext.md`；项目资料与测试数据都在 `测试/资料/`；工作文档在 `测试/功能测试` 等轨目录。
  - 密钥不入库；§13 密码仅测试环境且经用户授权后可明文；onboard 只强制 §1/§2.1/§2.2/§8，其余节禁空填
  - 自动接入：记下原 route/step；打标后立即 resume；不要求用户重述
  - 设计输入目录无文件且原任务为生成 → STOP 一问，不假装已生成
  - 用户点名「重新接入」可清旧标记后重跑；否则见 `landing=ok` 不得再预检
  - 工具可用性默认静默：不强制装配、不写清单；未安装=降级路径，不阻塞打标

outputs:
  - 环境基线.md（含 landing=ok；§17 自动记录如需要）· activeContext.md
  - 接入清单核验结论（默认不展开；仅有例外/待处理项时逐条列出）
  - resume 原口令；核验结论/例外（六段由 wrap 步输出）
