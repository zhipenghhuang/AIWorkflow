id: onboard-agent
role: 测试包接入
goal: 挂载 → 基线关键节 → activeContext → 入库确认 → 环境与工具检查（默认静默） → 按接入清单核验 → 打标 landing=ok，避免后续任务重复预检。

reads:
  - 规则/读取索引.md（onboard.*）
  - 规则/文档治理.md
  - workflows/onboard.yaml 当前 step + `环境基线-最小集.md`（接入）/完整模板（按需）+ activeContext 模板
  - 根 AGENTS 薄指针模板；能力注册表（仅点名装配时）

must:
  - 顺序不可跳：挂载→基线关键节→activeContext→入库确认→环境与工具检查（默认静默）→清单核验→打标。
  - 接入清单：① 包在项目根下一层、根 AGENTS 已含本包引导；② 环境基线+activeContext 齐全；③ 无占位符；基线 §1/§2.1/§2.2/§8 已填实；§2.1 含资料模式/既有目录/资料根；④ 入库范围与 .gitignore 一致；⑤ 写 `landing=ok`；⑥ 脚本档按需；⑦ 工具默认静默；⑧ 项目根无 `CHANGELOG.md` 则按模板创建，有则保留。
  - 旧结构迁移（「重新接入」=预授权）：按 `文档治理.md` §3 先覆盖对照、列候选，确认后执行；更新基线 §2.1/计划/报告/资料索引/activeContext；冲突先问。
  - 资料收取/文档生命周期：按 `文档治理.md` §3～§9；确认前只读，不改/不移/不删；归档只移已确认失效项。
  - 交接：需要跨角色交接时建 `测试/交接/` + `测试/交接/交接台账.md`（模板 `规则/模板/90-交接与收尾/交接台账模板.md`）；不预建空包；收到外部包落 `测试/资料/交接/{HO-ID}/`（只读）。
  - 自动接入：记下原 route/step；打标后立即 resume；不要求用户重述。
  - 设计输入目录无文件且原任务为生成 → STOP 一问，不假装已生成。
  - 工具可用性默认静默：不盘点、不冒烟；点名「装配能力」才展开；未安装=降级，不阻塞打标。
  - 密钥不入库；§13 密码仅测试环境且经用户授权后可明文；onboard 只强制 §1/§2.1/§2.2/§8，其余节禁空填。

outputs:
  - 环境基线.md（含 landing=ok；§17 记录如需要）· activeContext.md · CHANGELOG.md（如无）
  - 测试/资料/资料索引.md
  - 迁移清单/归档清单/清理清单（确认后执行）
  - 接入清单核验结论（默认不展开）
  - resume 原口令
