id: onboard-agent
role: 测试包接入
goal: 挂载 → 基线关键节 → activeContext → 入库确认 → 环境与工具检查（默认静默） → 按接入清单核验 → 打标「测试规范接入：已完成」；兼跑能力/技能体检（skill-audit）。

reads:
  - 规则/读取索引.md（onboard.* 或 skill-audit.*）
  - 规则/文档治理.md
  - workflows/onboard.yaml 或 workflows/skill-audit.yaml 当前 step + `环境基线-最小集.md`（接入）/完整模板（按需）+ activeContext 模板
  - 根 AGENTS 薄指针模板；能力注册表在装配/体检时；体检时 + `规则/playbooks/skill-audit.md`

must:
  - 顺序不可跳：挂载→基线关键节→activeContext→入库确认→环境与工具检查（默认静默）→清单核验→打标。
  - 接入清单：① 包在项目根下一层、根 AGENTS 已含本包引导；② 环境基线+activeContext 齐全；③ 无占位符；基线 §1/§2.1/§2.2/§8 已填实；§2.1 含资料模式/既有目录/资料根；④ 入库范围与 .gitignore 一致；⑤ 运行时写 `测试规范接入：已完成`（若有旧 `landing=ok` 删除并改写为本标记）；⑥ 脚本档按需；⑦ 工具默认静默；⑧ 无 `测试/工作日志.md` 则按 `规则/模板/00-接入与基线/工作日志模板.md` 创建，有则跳过；若有 `测试/CHANGELOG.md` → 改名迁移候选（确认后→`工作日志.md`）；**禁止**创建或修改根 `CHANGELOG.md`。
  - activeContext：无文件则按模板建（只含 `## 测试` + 跨包同步 + 运行时本包行）；已有文件则只补/更新本包分节与本包接入行，**禁止**整文件覆盖、禁止改他包分节/他包接入行。
  - 旧结构迁移（「重新接入」=预授权）：按 `文档治理.md` §3～§4 先意图分析/覆盖对照、列候选，确认后执行；**资料建齐 `{版本或主题}/` + `_通用/`（禁 `项目文档/` 层、禁强制类型前缀）**；旧 `资料/项目文档/{ver}/` → `资料/{ver}/`；根 `_归档` 内错位的各轨资产/失效资料 → 各自轨 `_归档` / `资料/_归档`；更新基线 §2.1/计划/报告/资料索引/activeContext；冲突先问。重新接入时删除或改回本包「测试规范接入」行后重核验，不得动他包行。
  - 资料收取/文档生命周期：按 `文档治理.md` §3～§9；确认前只读，不改/不移/不删；失效资料只进 `测试/资料/_归档/`；各轨资产进各自 `_归档/`。
  - 交接：需要跨角色交接时建 `测试/交接/` + `测试/交接/交接台账.md`（模板 `规则/模板/90-交接与收尾/交接台账模板.md`）；不预建空包；收到外部包落 `测试/资料/交接/{HO-ID}/`（只读）。
  - 自动接入：记下原 route/step；打标后立即 resume；不要求用户重述。
  - 设计输入目录无文件且原任务为生成 → STOP 一问，不假装已生成。
  - 工具可用性默认静默：不盘点、不冒烟；点名「装配能力」才展开；未安装=降级，不阻塞打标。
  - skill-audit（「体检能力」等）：按 playbook `规则/playbooks/skill-audit.md` 与 workflow `skill-audit`；默认 project，含「通用/母版」→ generic；报告后 `confirm_skill_changes` 可就地改本包 `技能/`·`能力/`·环境基线可用性节；未确认零改动；不要求母版仓。
  - 密钥不入库；§13 密码仅测试环境且经用户授权后可明文；onboard 只强制 §1/§2.1/§2.2/§8，其余节禁空填。

outputs:
  - 环境基线.md（checklist 勾选已写入接入标记；§17 记录如需要）· activeContext.md · 测试/工作日志.md（如无）
  - 测试/资料/资料索引.md
  - 迁移清单/归档清单/清理清单（确认后执行）
  - 接入清单核验结论（默认不展开）
  - resume 原口令
