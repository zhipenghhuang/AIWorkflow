# 接入：点名，或无「测试规范接入：已完成」（兼容旧 landing=ok）且业务口令触发时前置一次；完成后必须打标
workflow:
  id: onboard
  name: 测试规范接入
  version: 5
  read_index: 规则/读取索引.md
  chain: full   # 接入必须走完 baseline/context/gitignore/verify，不能停在 baseline

entry_points:
  接入: baseline
  重新接入: migrate
  生成环境基线: baseline
  装配能力: capabilities
  资料收取: materials
  资料整理: materials
  资料归档: materials
  资料巡检: materials
  文档整理: lifecycle
  文档巡检: lifecycle
  文档清理: lifecycle
  清理临时文件: lifecycle
  清理过程文件: lifecycle
  清理无效文件: lifecycle
  清理失效文件: lifecycle
  清理垃圾文件: lifecycle
  清理临时: lifecycle
  归档失效文档: lifecycle

trigger:
  - 接入
  - 重新接入
  - 生成环境基线
  - 装配能力
  - 资料收取 / 资料整理 / 资料归档 / 资料巡检
  - 文档整理 / 文档巡检 / 文档清理 / 清理临时文件 / 清理过程文件 / 清理无效文件 / 清理失效文件 / 清理垃圾文件 / 清理临时 / 归档失效文档
  - preflight-once   # 仅当无「测试规范接入：已完成」（兼容旧 landing=ok）

steps:
  - name: 旧结构迁移
    id: migrate
    agent: onboard-agent
    hitl: confirm_docs_migration
    hitl_when: docs_migration_needed
    output: 迁移清单/更新后的路径
    notes: >
      「重新接入」先扫描旧结构，列出迁移清单与目标，经 `confirm_docs_migration` 确认后执行，不静默丢文件；不重复问同一迁移。
      迁移映射：建齐 `测试/资料/{版本或主题}/` + `_通用/`（**不要** `项目文档/` 层）；旧 `资料/项目文档/{ver}/` → `资料/{ver}/`；根 `项目资料/` 单包确认后可迁入对应版本目录；多包共享根不迁入。`doc_mode=keep/mix` 只登记引用；`replace` 才迁移。
      错位归档纠正：根 `测试/_归档/` 内各轨资产 → 各自轨 `_归档/`；散落失效资料 → `测试/资料/_归档/`；列清单确认后执行。
      `测试/资料/测试数据/` 保持；`测试/测试用例/` + `测试/执行台账/` → `测试/功能测试/`（用例/台账/评审/证据同级；证据按模块）；
      `测试/测试脚本/` → `测试/脚本/`；`测试/变更记录/` → `测试/变更/`；`测试/发布前测试/{专项}/` 保持，性能/安全/兼容各自独立；
      `测试/计划执行看板.md` → 合并进 `测试/测试计划.md` §0/§16 后删除。
      资料迁移前先按 `规则/文档治理.md` 做覆盖对照，输出迁移/改名/归档候选；确认后执行，不静默丢文件。
      若存在 `测试/CHANGELOG.md`：列为迁移候选——**用户确认后**改名为 `测试/工作日志.md`（内容按工作日志模板整理索引+里程碑条；勿与根 `CHANGELOG.md` 混淆）；未确认不改名。
      更新 `环境基线.md` §2.1、测试计划/报告、资料索引、activeContext；旧路径不改则注明兼容，不强迁。
      文件冲突/无法判断归属/三项混在一个方案 → 停下问一次，不擅自覆盖。
      迁移后核对链接与引用，再进入 baseline/context。

  - name: 挂载与基线
    id: baseline
    agent: onboard-agent
    output: 环境基线.md（§1/§2.1/§2.2/§8）· 测试/工作日志.md（如无）
    notes: >
      建固定资料区：`测试/资料/_通用/` + `{版本或主题}/` + `资料索引.md`（模板 `规则/模板/00-接入与基线/资料索引模板.md`）+ `测试数据/` + `_归档/`（可先空）；禁 `项目文档/`；
      `测试/工作日志.md`：无则按 `规则/模板/00-接入与基线/工作日志模板.md` 创建（岗位里程碑侧记；索引可空，待首次里程碑写入）。已有则跳过不覆盖。
      **不是**根 `CHANGELOG.md`、也不是测试计划 §16.1 执行日志；勿把本文件当项目发版史或报告正文。
      若仍存在 `测试/CHANGELOG.md` 且尚无 `测试/工作日志.md`：列为改名迁移候选（→`工作日志.md`），经 `confirm_docs_migration` 确认后执行；未确认不改。
      **禁止**创建或修改项目根 `CHANGELOG.md`（根仅开发规范维护，给人看的项目发版史）。
      `环境基线.md` §2.1 设计输入目录填 `测试/资料`（已有则按实际）；增记 `资料模式`（keep/mix/replace，默认 mix）/ `既有资料目录` / `资料根` / `目录结构=版本或主题子目录（无项目文档层）`。
      多包时资料根=`项目资料/`；本包 `资料/` 仅专属/历史。
      检测到既有资料目录 → 默认 `mix`，登记路径。
      **禁**类型前缀扁平；**禁**再建 `项目文档/`；新项目直接 `资料/{版本或主题}/`。
      不建 `测试/计划执行看板.md`；状态写测试计划 §0/§16。

  - name: 资料收取与归档
    id: materials
    agent: onboard-agent
    hitl:
      - name: confirm_iteration_close
        when: iteration_close_needed
      - name: confirm_docs_migration
        when: docs_migration_needed
    output: 【资料收取与归档候选】（确认后执行落位/归档）
    notes: >
      按 `规则/文档治理.md` §3～§5 执行：扫描本包资料根 + 既有资料目录（环境基线 §2.1；keep/mix）+ 项目根（replace/用户投放）的未登记/变化文件 → 按版本/主题归属分类 → 与同主题旧文件做覆盖对照
      （全量替代/全量覆盖/部分覆盖/增量补充/仅新增/重复/冲突）→ 输出【资料收取与归档候选】；**此时不改索引、不改名、不移动、不标记失效**。
      有未登记/变化文件、拟改名/搬迁/归档候选 → `docs_migration_needed=true`，停在本门等确认；无候选才继续。
      按 `规则/文档治理.md` §3～§4【入站分析】；确认前不改文件。确认采纳后同批：落位 `资料/{版本或主题}/` → 同步计划/用例指针 → S1/S2/S3 失效 → `测试/资料/_归档/{yyyyMMdd}-{版本或批次}/` + 清单 → 更新索引/计划/报告/activeContext。
      部分覆盖/增量补充/参考/待确认 → 保留原文件，不归档；冲突/无法判断 → 停下问一次。归档前做引用检查：被当前计划/用例/脚本/报告引用的设计输入、测试数据、稳定冒烟清单保留原位或标“基线”，不标失效。
      无候选 → 报「无未登记/失效候选」，不改文件。
      **换迭代/关版本（强制）**：确认采纳新迭代/换主题后按 `规则/文档治理.md` §7；不确定则 `confirm_iteration_close`；确认后先按 §3 判 T1/T2/T4，再按 §7.1 关账（跳过仅发版项）；T2/T4 保留仍被引用的设计输入/测试数据/稳定冒烟清单/脚本，只归档被替代的用例轮次/报告/CR。不依赖关报告。

  - name: 文档治理检查
    id: lifecycle
    agent: onboard-agent
    hitl: confirm_docs_migration
    hitl_when: docs_migration_needed
    output: 【文档治理检查】（确认后执行更新/归档/清理）
    notes: >
      按 `规则/文档治理.md` §2～§5、§8 与 `规则/工作流.md` §1.3 扫描（本步=点名清理/巡检入口）：
      ① 分类：长期/固定、版本/迭代绑定、失效/替代、过程/临时；
      ② 判定：长期就地更新；版本绑定关闭时快照/归档；部分覆盖保留；失效确认后归档；**已完结**临时/失败/重复（含已完结 `.draft/`）列清理候选；
      ②.1 归档前做引用检查：被当前计划/用例/脚本/报告引用的设计输入、测试数据、稳定冒烟清单保留原位或标“基线”，不标失效。
      ③ 输出【文档治理检查】：保留/更新/归档/清理/待确认；**确认前不改/不移/不删**。
      有候选 → `docs_migration_needed=true`，停在本门等确认；无候选 → 报「无生命周期候选」，不改文件。
      关账按 `规则/文档治理.md` §7：计划/报告/CR/交接落 `测试/_归档/`；**功能/接口域主档常青留下**；轨内 `_归档/` 仅下线域/重生快照/旧探索轮；失效资料落 `测试/资料/_归档/`。
      清理只删已知临时/缓存/未引用失败产物；进行中 draft、证据、当前计划/报告、源文件、用户文件、密钥永不自动删除；不确定移 `测试/_归档/_待清理/{yyyyMMdd}/` 并写清理清单。

  - name: activeContext
    id: context
    agent: onboard-agent
    output: activeContext.md
    notes: >
      无文件：按 `规则/模板/00-接入与基线/activeContext模板.md` 建（只含 `## 测试` + 跨包同步 + 运行时本包行）。
      已有文件：只补/更新 `## 测试` 与运行时「测试规范接入」行；保留他包分节与他包接入行；禁止整文件套模板覆盖。

  - name: 入库策略
    id: gitignore
    agent: onboard-agent
    hitl: confirm_gitignore
    output: .gitignore 更新 + `git check-ignore` 证据
    notes: >
      四选一：①只忽略运行态/缓存；②忽略产物+证据；③忽略产物+证据+资料（保留模板）；④自定义。
      默认②；密钥/PII/真实用户数据任何情况不得入库；写后跑 `git check-ignore -v` 抽查 3 个关键路径并记录。
      不忽略源文件、模板、当前计划/报告/用例。

  - name: 环境与工具检查
    id: capabilities
    agent: onboard-agent
    output: 环境基线 §17 能力可用性记录（默认静默；点名装配时另出建议）
    notes: >
      默认静默：不输出工具清单、不冒烟（可用性由首次使用时的对应流程自行探测与降级）。
      仅当用户点名「装配能力」时，按 `能力/00-能力注册表.md` 盘点并给装配建议（安装指引指向 README「宿主适配」节）。
      例外：已配置且明显不可用、会影响预期的事项，一句话说明。
      记录（如需要）写 环境基线.md §17——自动记录，不是待办；禁强推、禁清单式输出。

  - name: 核验与打标
    id: verify
    agent: onboard-agent
    output: 测试/00-项目治理/接入核验-{yyyyMMdd}.md（①～⑦ 逐项 通过/缺口 + 证据）
    notes: >
      按 onboard-agent 接入清单核验（①～⑦，含写「测试规范接入：已完成」；若有旧 landing=ok 删除并改写），逐项给「通过/缺口 + 证据路径」，不得只写“已核验”。
      跑 `规则/tools/Invoke-TestWorkflow.ps1 -Action ValidateTemplateRefs`；BLOCKED 不得打标。
      有挂起原口令则 resume；此后业务任务见标记直跑。

  - name: 收尾
    id: wrap
    agent: onboard-agent
    output: 【任务收尾】（接入明细置第 1 点，六段压缩）
    notes: >
      对照 `规则/模板/90-交接与收尾/收尾骨架.md` §2 输出六段压缩；仅例外/待处理展开；禁逐项罗列工具
