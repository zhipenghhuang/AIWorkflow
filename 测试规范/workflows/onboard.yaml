# 接入：点名，或无 landing=ok 且业务口令触发时前置一次；完成后必须打标
workflow:
  id: onboard
  name: 测试规范接入
  version: 5
  read_index: 规则/读取索引.md
  chain: full   # 接入必须走完 baseline/context/gitignore/verify，不能停在 baseline

entry_points:
  接入: baseline
  重新接入: migrate
  生成环境基线: baseline
  装配能力: capabilities
  资料收取: materials
  资料整理: materials
  资料归档: materials
  资料巡检: materials
  文档整理: lifecycle
  文档巡检: lifecycle
  清理临时文件: lifecycle
  清理过程文件: lifecycle

trigger:
  - 接入
  - 重新接入
  - 生成环境基线
  - 装配能力
  - 资料收取 / 资料整理 / 资料归档 / 资料巡检
  - 文档整理 / 文档巡检 / 清理临时文件 / 清理过程文件
  - preflight-once   # 仅当无 landing=ok

steps:
  - name: 旧结构迁移
    id: migrate
    agent: onboard-agent
    hitl: confirm_docs_migration
    hitl_when: docs_migration_needed
    output: 迁移清单/更新后的路径
    notes: >
      「重新接入」先扫描旧结构，列出迁移清单与目标，经 `confirm_docs_migration` 确认后执行，不静默丢文件；不重复问同一迁移。
      迁移映射：资料默认保持/建齐 `测试/资料/项目文档/{版本或主题}/`（**不扁平化**）；根 `项目资料/` 在单包且用户确认时可迁入 `测试/资料/项目文档/` 对应子目录并登记索引；多包时 `项目资料/` 是共享根，不迁入。`doc_mode=keep/mix` 时既有目录不迁，只登记引用；`replace` 才按映射迁移。
      错位归档纠正：根 `测试/_归档/` 内的功能/接口/探索式/发布前资产 → 各自轨 `_归档/`；根 `_归档/**/资料/` 或散落失效资料 → `测试/资料/_归档/`；列清单确认后执行。
      `测试/资料/测试数据/` 保持；`测试/测试用例/` + `测试/执行台账/` → `测试/功能测试/`（用例/台账/评审/证据同级；证据按模块）；
      `测试/测试脚本/` → `测试/脚本/`；`测试/变更记录/` → `测试/变更/`；`测试/发布前测试/{专项}/` 保持，性能/安全/兼容各自独立；
      `测试/计划执行看板.md` → 合并进 `测试/测试计划.md` §0/§16 后删除。
      资料迁移前先按 `规则/文档治理.md` 做覆盖对照，输出迁移/改名/归档候选；确认后执行，不静默丢文件。
      更新 `环境基线.md` §2.1、测试计划/报告、资料索引、activeContext；旧路径不改则注明兼容，不强迁。
      文件冲突/无法判断归属/三项混在一个方案 → 停下问一次，不擅自覆盖。
      迁移后核对链接与引用，再进入 baseline/context。

  - name: 挂载与基线
    id: baseline
    agent: onboard-agent
    output: 环境基线.md（§1/§2.1/§2.2/§8）· CHANGELOG.md（如无）
    notes: >
      建固定资料区：`测试/资料/项目文档/`（版本/主题子目录）+ `测试/资料/资料索引.md`（模板 `规则/模板/00-接入与基线/资料索引模板.md`）+ `测试/资料/测试数据/` + `测试/资料/_归档/`（可先空）；
      项目根无 `CHANGELOG.md` → 按 `规则/模板/00-接入与基线/CHANGELOG模板.md` 创建（当前版本/最近更新）；已有则保留，不覆盖。
      `环境基线.md` §2.1 设计输入目录填 `测试/资料/项目文档`（已有设计目录则按实际填）；增记 `资料模式`（keep/mix/replace，默认 mix）/ `既有资料目录` / `资料根` / `目录结构=版本或主题子目录`。
      多包时资料根=`项目资料/`，索引=`项目资料/资料索引.md`；`测试/资料/` 只放本包专属/历史资料，共享资料在 `项目资料/` 保留一份主副本。
      检测到既有资料目录（`项目资料/`、`docs/` 等）→ 默认 `mix`，登记路径；用户点名 keep/replace 再改，不阻塞。
      **禁**把 `项目文档/` 压成类型前缀扁平；新项目也按版本/主题子目录建。
      不建 `测试/计划执行看板.md`；状态写测试计划 §0/§16。

  - name: 资料收取与归档
    id: materials
    agent: onboard-agent
    hitl: confirm_docs_migration
    hitl_when: docs_migration_needed
    output: 【资料收取与归档候选】（确认后执行落位/归档）
    notes: >
      按 `规则/文档治理.md` §3～§5 执行：扫描本包资料根 + 既有资料目录（环境基线 §2.1；keep/mix）+ 项目根（replace/用户投放）的未登记/变化文件 → 按版本/主题归属分类 → 与同主题旧文件做覆盖对照
      （全量替代/全量覆盖/部分覆盖/增量补充/仅新增/重复/冲突）→ 输出【资料收取与归档候选】；**此时不改索引、不改名、不移动、不标记失效**。
      有未登记/变化文件、拟改名/搬迁/归档候选 → `docs_migration_needed=true`，停在本门等确认；无候选才继续。
      候选含拟归档旧文件时逐项写：旧文件/替代文件/覆盖范围/归档目标；用户确认（或点名「一并归档」）后才：登记/按需落位 → 旧文件标 `失效` → 移 `测试/资料/_归档/{yyyyMMdd}-{版本或批次}/` → 写 `归档清单` → 更新索引/计划/报告/activeContext。
      部分覆盖/增量补充/参考/待确认 → 保留原文件，不归档；冲突/无法判断 → 停下问一次。
      无候选 → 报「无未登记/失效候选」，不改文件。

  - name: 文档治理检查
    id: lifecycle
    agent: onboard-agent
    hitl: confirm_docs_migration
    hitl_when: docs_migration_needed
    output: 【文档治理检查】（确认后执行更新/归档/清理）
    notes: >
      按 `规则/文档治理.md` §2～§5 扫描工作文档与过程文件：
      ① 分类：长期/固定、版本/迭代绑定、失效/替代、过程/临时；
      ② 判定：长期就地更新；版本绑定关闭时快照/归档；部分覆盖保留；失效确认后归档；临时/失败/重复文件列清理候选；
      ③ 输出【文档治理检查】：保留/更新/归档/清理/待确认；**确认前不改/不移/不删**。
      有候选 → `docs_migration_needed=true`，停在本门等确认；无候选 → 报「无生命周期候选」，不改文件。
      版本绑定资产归档落各自轨 `_归档/`（见 `规则/文档治理.md` §6）；失效资料落 `测试/资料/_归档/`；计划/报告/CR/交接落 `测试/_归档/`。
      清理只删已知临时/缓存/未引用失败产物；证据、当前计划/报告、源文件、用户文件、密钥永不自动删除；不确定移 `测试/_归档/_待清理/{yyyyMMdd}/` 并写清理清单。

  - name: activeContext
    id: context
    agent: onboard-agent
    output: activeContext.md

  - name: 入库策略
    id: gitignore
    agent: onboard-agent
    hitl: confirm_gitignore

  - name: 环境与工具检查
    id: capabilities
    agent: onboard-agent
    notes: >
      默认静默：不输出工具清单、不冒烟（可用性由首次使用时的对应流程自行探测与降级）。
      仅当用户点名「装配能力」时，按 `能力/00-能力注册表.md` 盘点并给装配建议（安装指引指向 README「宿主适配」节）。
      例外：已配置且明显不可用、会影响预期的事项，一句话说明。
      记录（如需要）写 环境基线.md §17——自动记录，不是待办；禁强推、禁清单式输出。

  - name: 核验与打标
    id: verify
    agent: onboard-agent
    notes: >
      按 onboard-agent 接入清单核验（①～⑦，含写 landing=ok）；
      有挂起原口令则 resume；此后业务任务见标记直跑。

  - name: 收尾
    id: wrap
    agent: onboard-agent
    output: 【任务收尾】（接入明细置第 1 点，六段压缩）
    notes: >
      按 AGENTS §5 输出六段压缩（每段一行）；仅有例外/待处理项时逐条展开；禁逐项罗列工具。
