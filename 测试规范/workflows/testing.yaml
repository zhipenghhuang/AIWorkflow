# AI 测试主流程（声明式 Workflow · 执行宿主执行）
# - 口令可切入任一步：仅执行 → 直接 execute（勿强制 analyze）；生成未点名主读才门1（一问即止，禁重问）
# - 无「测试规范接入：已完成」（兼容旧 landing=ok）时才按 onboard-agent 清单核验一次，打标后免检（AGENTS 开工第3点）
# - 正式轨：功能全量/专项 · 探索式 · 随机业务流程（计划外） · 接口 · 发布前（工作流 §1.2 + 规则/轨契约/）
# - 确认门只认步上 hitl（标量或列表，可带 when）；条件不满足则该门跳过，不算违例
# - 入口即止：单步口令只执行该步 + 收尾；「按计划执行」才走 analyze→plan→generate→review-cases→execute→report
workflow:
  id: testing
  name: AI测试流程
  version: 17
  read_index: 规则/读取索引.md

entry_points:
  分析需求: analyze
  理解PRD: analyze
  理解 PRD: analyze
  梳理测试依据: analyze
  需求建模: analyze
  测试计划: plan
  生成测试计划: plan
  功能测试计划: plan
  更新计划: plan
  本期变更: plan
  计划变更: plan
  增量变更: plan
  新文档更新测试计划: plan
  按测试计划执行: execute
  按计划执行: execute
  执行测试计划: execute
  继续测试计划: execute
  回归: execute
  重跑: execute
  脚本执行: execute
  跑脚本: execute
  执行: execute
  跑: execute
  专题: execute
  阶段二: execute
  当前状态: status
  计划状态: status
  下一步: status
  生成测试资产: generate
  生成用例: generate
  生成接口测试资产: generate
  生成探索式用例: generate
  生成随机业务流程: generate
  生成业务随机: generate
  生成性能测试资产: generate
  生成安全测试资产: generate
  生成兼容测试资产: generate
  用例评审: review-cases
  评审用例: review-cases
  测试用例评审: review-cases
  执行测试: execute
  执行专项: execute
  执行接口测试: execute
  执行探索式测试: execute
  执行随机业务流程: execute
  执行业务随机: execute
  执行性能测试: execute
  执行安全测试: execute
  执行兼容性测试: execute
  测试报告: report
  出报告: report
  准出评估: report
  用例脚本: generate
  更新脚本: generate

trigger:
  - 生成测试资产
  - 执行测试
  - 测试计划 / 测试报告 / 生成测试计划
  - 本期变更 / 计划变更 / 增量变更 / 新文档更新测试计划
  - 按计划执行 / 执行测试计划 / 按测试计划执行 / 继续测试计划
  - 当前状态 / 下一步
  - 执行专题
  - 阶段二
  - 用例脚本（编写/执行）
  - 用例评审 / 评审用例 / 测试用例评审
  - 探索式 / 探索测试 / 随机业务流程 / 业务随机 / 接口 / 发布前（同文件，按轨契约分产物；随机为计划外）

preflight:
  skip_if: activeContext 测试规范接入：已完成
  once: 按 agents/onboard-agent.yaml 接入清单核验
  on_fail: onboard → write 测试规范接入：已完成 → resume

steps:
  - name: 当前状态与下一步
    id: status
    agent: test-planner
    output: 当前阶段/门/下一动作/需人工
    notes: >
      只读 `测试/测试计划.md` §0/§9/§16：报备计划状态、当前阶段、当前门、下一动作、需人工项、健康度。
      「下一步」只报动作与入口，不执行；「当前状态」只读，不重写计划。
      有未吸收新文档/变化 → 先走 `本期变更`（plan 步的期中变更逻辑），不直接改用例/脚本。
      有未回执/退回/阻断执行的交接包 → 先走 `workflows/handoff.yaml` status/receive，不直接进入执行。
      测试包独立运行；PRD/提测单/UAT 为可选输入，缺则按主读/基线执行，不阻塞。
      结束按 AGENTS §5 输出六段压缩（只读可 2～3 行，6 个字段标签保留）。
      输出首条：route=workflow:testing | step=status | phase=… | gate=… | next_action=…

  - name: 分析需求
    id: analyze
    agent: test-analyzer
    hitl:
      - name: confirm_understanding
        when: understanding_needs_confirm
    output: 测试/功能测试/分析短表.md（轻量）；T2/T3 另出 测试/功能测试/需求理解-{范围}-{yyyyMMdd}.md
    notes: >
      两段职责：① 主读未点名 → 列候选+建议，一次一问选定即止（门1 **形式挂 generate 步**；本步先跑时仅代行提问，非独立门，不重问）。
      ② 主读已点名或刚选定 → 仍须产出需求模型/轻量分析短表（目标/范围/非目标/角色/状态/权限/规则/异常/oracle/冲突/GAP），不问主读、不设额外 hitl；禁止「已点名主读」整步跳过导致无分析短表。
      ③ 资料收取：主读/输入含新文件或资料根有变化 → 按 `规则/文档治理.md` §3【入站分析】（T1～T9）；确认前不改文件。确认采纳后同批：**多包 → `项目资料/{版本或主题}/`**；**单包 → `测试/资料/{版本或主题}/` 或 `_通用/`** → 同步 CR/计划/用例 → S1/S2/S3 进 `资料/_归档/`；工作产物不回写资料。
      输入是交接包（含 `00-交接说明.md` + `01-交接清单.md`）→ 先走 `workflows/handoff.yaml` receive 核对+回执；未签收不得建模/写计划。
      技能：`技能/test-basis-analysis/SKILL.md`（先建模再做分析）+ `技能/test-analysis-and-plan/SKILL.md`（计划方法）。
      必做：依据盘点（PRD/迭代方案/原型/接口/代码 diff/历史缺陷）→ 十要素需求模型 → 文档内部/跨文档/原型/代码一致性 → 九类歧义扫描 → AC 可测性与 oracle → TP 追溯种子。
      每条规则/状态/预期标来源（章节/页码/页面/接口/`文件:行`）；无来源写 GAP/待确认，不猜；现网实现只作现状，不作预期。
      先给 6～8 行理解回执，再一次一问至无实质缺口（95% 仅参考，`规则/核心/澄清.md`）；不确定项按 §2.1 分流（阻塞即时问，非阻塞收尾汇总）；关键歧义未裁决 → 不写计划/用例，可出草案但标假设与影响。
      需要产品/开发拍板的歧义/oracle/接口问题 → 按 `规则/协作/协作与交接.md` §3 发 `CLAR` 包（问题/原文/影响/建议）；收到答复后更新需求模型并回执。
      confirm_understanding：出示目标/范围与非目标/关键规则/AC 与 oracle/冲突与 GAP/置信度；确认后才进入 plan/generate。

  - name: 测试计划
    id: plan
    agent: test-planner
    hitl:
      - name: confirm_understanding
        when: understanding_needs_confirm
      - name: select_review_mode
        when: landing_doc_review_needed
      - name: confirm_plan
        when: plan_needs_confirm
    notes: >
      版本级/计划驱动：分析后、生成前产出/更新 测试/测试计划.md（模板 `规则/模板/10-计划/测试计划模板.md`）——测试对象与范围（含明确排除）、测试类型与轨道、资产清单、执行编排（P0～P9）、回归策略、缺陷管理、探索章程、环境数据账号工具、准入准出、角色风险度量。
      跨角色协作：计划 §17 写交接节点/回执，§18 写 C0～C3 变更/重规划触发；收到提测/需求/变更包先走 `workflows/handoff.yaml` receive；计划确认后按需发 `PLAN` 包给产品/开发。
      **需求依据**：计划 §2 范围/§3 类型/§9 编排/§12 章程必须引用 `analyze` 的需求模型/分析短表与 AC/TP；未裁决歧义不得写成确定范围；假设与 GAP 在计划中显式列出并标影响；无需求模型/短表 → 先回 analyze，不直接定计划。
      **依赖回归**：主读/GATE 有前序或供给依赖时，§2.2/§9/§10 写入依赖版 P0-Smoke 并开跑实测；禁「有界对照/假设前序已过」替代；默认不重跑依赖版归档全量。
      **计划是唯一编排载体**：生成按 §3.2 资产清单，执行按 §9，回归按 §10，缺陷按 §11，探索按 §12，报告按 §5/§9 对照。
      可选输入（不强制）：若项目已有 PRD/需求文档/提测单（任意路径/来源）则读入“依据”，用需求 AC/改动点/影响面/自测证据/已知问题校准范围与回归建议；无则一句话说明，按主读/基线/用户输入。
      **落地评审（与产品/开发统一）**：T1+ 首版/换代或范围·准出·缺陷策略实质变更 → 计划门摘要前先 `select_review_mode`（A 自行｜B AI）；选 B → `testcase-reviewer` + `技能/test-artifact-review`【自主分析】+计划量规，留痕 `测试/评审-计划-*.md`；选 A → 附分析摘要 + HUMAN_APPROVED。专项轻量追加节不强制。
      计划门：首版/换代或范围·准出·缺陷提交策略实质变更 → STOP 一行摘要（范围/测试类型/轨道顺序/缺陷提交策略/探索章程数/准出）请确认；同会话同载体只一次；专项/小改轻量追加一节，不设门。确认后更新 §0「计划状态=已确认」；实质变更置「变更中」并回计划门。
      理解门先行：`confirm_understanding` 触发时先确认需求模型/oracle/冲突/GAP；未确认不得把计划状态置「已确认」。T2/T3 或歧义≥2 → 分析短表亦可走同一 `select_review_mode`（并入本步或 analyze 收尾，不另开疲劳门）。
      **期中变更**（口令「本期变更/计划变更/增量变更/新文档更新测试计划」）：不新开整期计划；先建 `测试/变更/CR-*.md` + 影响分析；A 澄清/B 同范围增量 → 就地更新 §0/§2/§3.1/§3.2/§3.7/§14.3/§15/§16.1 + 受影响用例/脚本；C 实质变更 → §0 状态=变更中 + 计划门；D 缺陷驱动 → 缺陷轨。A/B 不重开计划门；**执行时机默认等计划模块/阶段位；提前仅限 P0/高风险、阻塞后续、独立且数据/入口就绪、有专门含变更构建；P0 冒烟可在构建/阶段边界先跑；执行前核构建含变更**；执行 P0 冒烟 + 变更用例 + 影响面，不默认全量。
      执行直达且无计划 → 落轻量计划（§1～§5 适用行 + §9 最小编排），随门2 并列确认，不另 STOP。
      分轨（接口/探索式/发布前）按需登记或轻量节（模板 §3.2 轨道行），不重复展开；独立口令可不依赖计划；计划驱动模式按各自 §3.2/§12 纳入编排。
      **计划总控**：每次落盘更新 §0（计划状态/当前阶段/当前门/下一动作/需人工/健康度/最后更新）与 §16.1 执行日志；门结论写 §0/§16。
      **归档**：当前 `测试/测试计划.md` 不移动；版本关闭见 `规则/文档治理.md` §7（计划/报告快照根 `_归档`；各轨资产进轨内 `_归档`；失效资料进 `资料/_归档`）；稳定冒烟/环境基线/可复用脚本不归档。
      **更新依据**：执行台账/证据、已批准 CR、实际日期/指标；禁聊天记忆/推测回写。
      **输入清点分片**（多Agent §1.5）：版本级输入 ≥5 份或资料量大 → 只读扇出（每份返回变更点/AC/影响面候选）；计划正文单写手；单份直做。
      技能：`技能/test-analysis-and-plan/SKILL.md` + 评审时 `技能/test-artifact-review/SKILL.md`。
    output: 测试/测试计划.md

  - name: 生成用例
    id: generate
    agent: testcase-agent
    hitl:
      - name: confirm_understanding
        when: understanding_needs_confirm
      - name: select_mainread
        when: mainread_unspecified_for_generate
      - name: confirm_commit
        when: standalone_generate_with_pending
    gate: coverage-map
    gate_when: functional_coverage_required
    notes: >
      门1：仅**新生成**且主读未点名时 STOP（analyze 已问过则跳过，不重问；用例评审不触发）。
      理解门：`confirm_understanding` 触发时先出示需求模型/oracle/冲突/GAP/置信度；未确认 → 先执行 analyze 步并确认，再回本步生成。
      生成前须已有需求模型/轻量分析短表（可与本步同轮由 analyze 逻辑产出）与现行测试计划（缺/超范围 → 先按 plan 步轻量补；输入含 PRD/原型但未建模 → 先按 `技能/test-basis-analysis/SKILL.md` 补，不直接写用例）；**探索式/接口/发布前独立口令可不要求完整计划**，只在 `测试/测试计划.md` §3.2 登记一行或按轨契约生成，不触发计划门；计划驱动模式必须按 `测试/测试计划.md` §3.2/§12。**随机业务流程**仅独立口令、**禁止**写入/登记测试计划；读 `轨契约/随机业务流程.md` + 随机用例模板；主读最新或 N-1；影响面+常青≥约70%、未入库坑≤约30%。
      **追溯红线**：每条用例至少指到一个 RQ/AC/F/R/TP 或页面/接口来源；预期（oracle）必须来自需求/AC/契约/用户裁决，不能来自现网实现；无来源先问或标“文档未声明”，不得臆造；映射无空行（覆盖三闸）。
      **计划驱动生成**：按 §3.2 资产清单逐项生成/登记——功能全量/专项→testcase-agent；接口→接口轨；发布前→发布前轨；探索式→计划 §12 章程 + `规则/模板/20-测试用例/探索式用例模板.md`；脚本按 `规则/专项/脚本执行.md` §1+§2。缺资产先补，计划项不静默跳过；超范围先更新计划/计划门。
      **大规模生成分片**（多Agent §1.5）：**≥3 模块且 ≥40 条** → 一模块一子代理，只写本轨 `.draft/generate/{模块}.md`（功能专项用 `.draft/S-{NN}-{主题}/`）草稿；编排统一 ID/模板/排序并合并，跑覆盖三闸；单模块/小批直做；禁多子代理写同一模块文件。
      能测尽测；参照影响面/变更点；探索式轨按章程而不是臆造业务步骤。
      独立生成（不续 execute）且有拟入库 → 生成后出示拟提交清单再 confirm_commit；同会话续 execute → 门3 只在 report。
      覆盖三闸见 testcase-agent（功能全量/专项）与 工作流 §2.1.0；功能用例落盘后运行 `python -B 测试规范/规则/tools/validate_testcase.py <用例文件>`（结构）并核 §3 映射无空行；再运行 `验证/Invoke-Gate.ps1 -Mode coverage`（覆盖闸，写 `.gate/测试规范/coverage.json`）；**`gate: coverage-map` 仅功能全量/专项的新生成/补生成**；探索式/随机业务流程/接口/发布前按各自轨契约（软覆盖），不套三闸。
      **生成后必衔接评审**：功能全量/专项（T1+）落盘且覆盖闸过后，同会话续执行或「按计划执行」前必须进入 `review-cases`；本步只做完稿自检+评分卡自打，**不替代**独立评审（独立性见 testcase-reviewer）。入口即止仅生成时，收尾「下一步」写明：先用例评审再执行。
      脚本编写/更新：按 `规则/专项/脚本执行.md` §2 + `规则/tools/playwright/README.md` 的脚本结构；接口确定性用例**同轮产出脚本**，不得标“待脚本化”。
      技能：`技能/testcase-design/SKILL.md`（先读再设计用例：技法 + 漏测谱系 + 断言写法）；接口轨读 `技能/test-interface/SKILL.md`。
    output: 测试/功能测试/ · 测试/接口测试/ · 测试/探索式测试/ · 测试/随机业务流程测试/（计划外） · 测试/发布前测试/{性能|安全|兼容|迁移}/ · 测试/脚本/（按计划 §3.2 资产；功能用例/台账/评审/证据同级；随机不进计划资产清单）

  - name: 用例与多轨资产评审
    id: review-cases
    agent: testcase-reviewer
    hitl:
      - name: select_review_mode
        when: landing_doc_review_needed
      - name: confirm_review
        when: review_needs_confirm
    gate: case-review
    gate_when: case_review_required
    output: 测试/{轨}/评审-{范围}-{yyyyMMdd-HHmm}.md + 【任务收尾】（评审结论置第 1 点）
    notes: >
      **主链一步（生成后 / 执行前）**：不重生成、不改写口径。细则 `规则/工作流.md` §2.5 + `技能/test-artifact-review` + `技能/testcase-review`。
      **范围不止功能用例**：功能全量/专项（强制）｜接口资产（计划驱动或进准出时强制）｜探索式（计划 §12 纳入时建议；T3 强制）｜发布前（T3/点名强制）｜随机业务流程仅点名。
      **先 STOP【评审方式】**：A 自行｜B AI 独立；可附自定义焦点（如「重点看权限/支付」）→ 选 B 时 AI 必须优先深析。未选不得进 P2。
      **选 A**：附【自主分析摘要】+ 自检/三闸摘要；HUMAN_APPROVED；不跑 `-Mode review`。
      **选 B**：独立性；**先【自主分析】**（策略/漏测假设/矛盾/过测欠测/取舍）再量规；功能→A1–A6/S1–S6+三闸；接口/探索/发布前→轨契约；需修回 generate（≤1）。
      **机器门（仅功能轨选 B）**：`case_review_required` → `-Mode review`；其它轨选 B 留痕即可（软机检）。
      **confirm_review**：需修/有条件放行时 STOP。

  - name: 执行测试
    id: execute
    agent: test-orchestrator
    hitl:
      - name: confirm_understanding
        when: understanding_needs_confirm
      - name: select_mainread
        when: exploratory_mainread_missing
      - name: confirm_scope
        when: scope_needs_confirm
    output: 执行结果/≤3 行简报（直接以 execute 为末步时按 AGENTS §5 六段，执行明细置第 1 点）
    notes: >
      门2（when `scope_needs_confirm`）：开跑前展示一行「主读《…》；计划《…》范围/轮次/准出；环境=…」→ 等确认；同一载体同会话只确认一次（「继续」沿用）。**随机业务流程**门2 行改为「主读《…》（最新|N-1）；影响面/常青范围；时间盒；环境=…」（无计划字段）。
      提测包未签收 → 先走 `workflows/handoff.yaml` receive；回执=退回或阻断缺口未解 → 不开跑；有条件接收 → 条件写进计划风险并记录。计划驱动已确认且提测已接收 → 直接开跑并附【已预授权执行：按计划】。
      理解门先行：`confirm_understanding` 触发时先确认需求模型/oracle/冲突/GAP；未确认不得开跑或把结果判为通过。
      探索式执行且未点名主读/无同戳用例 → 先按 `generate` 生成探索式用例/台账（门1 一问），再执行；不即兴臆造业务步骤。
      **随机业务流程**（计划外）：口令「执行随机业务流程/业务随机」→ 读 `轨契约/随机业务流程.md`；**禁止**被「按计划执行」调度；未点名主读或版本窗外 → 门1；无同戳用例先 generate；结论只落本轨、不进报告准出。
      **评审前置（功能全量/专项 · T1+）**：开跑 P2 前核最新 `评审-*.md` 结论=放行执行（或有条件放行且接受人已登记）且 `.gate/测试规范/review.json` 为 PASS（适用时）；未评审/需修未复核 → 先走 `review-cases`，禁跳过进功能全量。T0 SELF_CHECKED 须在计划/收尾有声明。
      **计划驱动（口令「按计划执行 / 执行测试计划」）**：读计划 §9.2 逐阶段执行（P0 准备→P1 冒烟→P2 功能→P3 接口→P4 探索式→P5 非功能→P6 回归→P7 UAT→P8 发布前/灰度→P9 报告）；**不含**随机业务流程（计划外，仅独立口令）。每阶段入口检查→按对应轨契约执行→出口检查→更新计划 §0（当前阶段/门/下一动作/健康度）+ §16.1 执行日志；并行仅按 §3.4/§9.2 且账号/数据/浏览器 profile/写域隔离；同条用例禁并行。**计划 §0「计划状态=已确认/执行中/待关闭」 → `confirm_scope` 条件（`scope_needs_confirm`）不满足 → 跳过并附【已预授权执行：按计划】直接开跑；计划外/未确认提交仍门3。**
      **回归并行**：每次缺陷修复后立即跑 原单+冒烟子集+影响面组（计划 §10），不等批末；高风险/连环缺陷提示升级；结果就地覆盖。
      **缺陷**：按计划 §11 提交策略——「发现即提交」→ 查重后直接提交（十段齐+证据+回写），不再逐条问；「按模块批末/阶段末/收尾确认」→ 到对应批次/阶段/收尾出拟提交清单，用户确认后只提交确认项；「仅导出」→ 出包。待实现=实现缺陷，纳入清单；阻塞默认不交。
      **探索式**：按计划 §12 章程穿插；session 记录→debrief→triage→缺陷/补用例/回归；不替代功能全量。
      **非功能**：按计划 §3.1/§9.2，构建稳定后执行；接口/发布前按各轨契约。
      **停止/恢复**：P0-Smoke 未过/环境不可用/数据合规风险/计划实质偏差 → 按计划 §6 暂停或回计划门；不静默降范围。
      计划与轮次按 `测试/测试计划.md`（无计划/不覆盖本范围 → 落轻量计划随本门并列确认）；R0 冒烟 → R1 正式 → R2+ 回归。
      数据准备（功能全量/专项）：门2 后扫本批前置三件套集中造齐（账号/入口/数据；优先 API/脚本；回写基线 §11/§14）——数据未齐不进冒烟（小批 ≤≈20 或已齐跳过；多Agent §1.1.1 ⓪）。
      冒烟前置（功能全量/专项）：先跑 P0-Smoke 冒烟行（多Agent §1.1.1；脚本档优先）；未全绿→环境级停轮报告、产品级拦阻断面（下游记阻塞点名上游）；用户点名跳过须收尾记注意项。
      口径待探查：先读现网实现值再断言（工作流 §3.0）；禁因方案无数字记 pending。有明确需求/AC/oracle 时以需求为准，现网值只作口径探查；实现与需求不一致 → 记失败/缺陷，不按实现改预期。
      **依据核对**：执行前读 `analyze` 需求模型/分析短表/TP 与用例追溯；用例无来源或 oracle 缺失 → 先补/问，不猜。
      执行形态（多Agent §1.1）：已脚本化用例（清单=已脚本化）优先**脚本档**（0 token 回归，`规则/专项/脚本执行.md`）；不可脚本化用例走模块子代理档/直跑档/拆分档；计划驱动跨轨细节见 `规则/专项/多Agent与输出.md` §4。
      子代理回收（多Agent §1.5）：返回 ≤30 行；主上下文只收摘要；并发 ≤3；同一用例/模块串行；批末核验后再下一批；Reviewer 只收 jsonl+证据+预期，不收 Worker 分析。
      脚本失败 → AI 复核一次后方可定性；脚本漂移先修脚本再重跑（`规则/专项/脚本执行.md` §3/§4）。
      「回归/重跑 {范围}」=重测既有用例、就地覆盖、只留最新结论；续跑缺终态先对账（禁未对账重复写操作）（多Agent §2.1）。
      工具：功能/探索式/随机业务流程轨 browser-mcp（基线 §8 绑定）+ 脚本执行器（基线「脚本执行」节，启用时）；接口/发布前轨按轨契约按需，不默认启用浏览器。
      可选能力（`能力/00-能力注册表.md`）：vision-ui（语义/视觉判定复核）、mobile-automation（移动端点名时）；不可用=降级（维持现行口径）。
      技能：`技能/test-execution-and-exploration/SKILL.md`（计划驱动/回归/探索式/随机业务流程；接口轨另读 `技能/test-interface/SKILL.md`；发布前轨另读 `技能/test-performance-security-compatibility/SKILL.md`）。
      MCP 细则：稳态含全链终局退程（多Agent §2.2）；异常细节仅红点/无工具/端口/并行冲突时点读。
      同方案无效 2 次换手段，禁同命令空重跑。**判 blocked 前四问**：能否造数/换样？能否换入口/角色？是否被测缺陷（→fail）？互异手段≥2 且总尝试≤3？任一未过不写 blocked。
      探索式/随机业务流程/接口/发布前方法与场景自备（见轨契约）。

  - name: 输出报告
    id: report
    agent: report-agent
    gate: report-consistency
    notes: >
      先产出报告正文与六段【任务收尾】，**门3 移至 handoff 步**，在骨架后单独问；不得先阻塞报告输出。
      报告正文写完后运行 `验证/Invoke-Gate.ps1 -Mode report`；门读计划/台账/报告，检查计数一致、P0、P0 计划覆盖、证据、覆盖缺口；未 PASS/CONDITIONAL 不得写“整体通过/可准出”。
      门回执在 `.gate/测试规范/report.json`；把 `verdict/gate/counts/p0/unverified` 回填报告 §0 后再复跑一次（回执必须与最终门一致）。非 PASS 禁用“全部通过/可发布”。
      `writeback` 只写 `.gate/测试规范/writeback.json`，不得覆盖 report 回执。
      全部阶段（P0～P9）结束或本步收尾时，按 AGENTS §5 输出最终【任务收尾】（执行明细置第 1 点，含汇报，可整段复制）；阶段中途只出 ≤3 行简报；收尾第 1 点纯执行汇报（代号带中文描述），第 4 点含待你确认表，第 6 点含当前/下一步。
      失败/待实现汇总与交平台建议并入第 1 点；是否交平台在下一步（handoff）只问一次（禁用例级刷屏）。
      对账工具优先（多Agent §1.5）：台账计数/证据可打开先用脚本；仅证据充分性/语义归因派核验子代理，返回差异清单 ≤30 行。
      版本级/全量/计划驱动：对照计划 §9.2 计划 vs 实际、§10 回归、§11 缺陷、§12 探索、§5 准出 → 出「准出评估」并更新 `测试/测试报告.md`（模板 `规则/模板/40-报告与评审/测试报告模板.md`；报告 §2 计划对照、§3 类型覆盖、§4 统计、§5 缺陷/回归/探索式、§6 覆盖缺口、§7 准出；滚动就地更新只留最新口径）。
      **需求覆盖**：报告对照需求模型/分析短表，列出 RQ/AC/TP→用例覆盖、歧义关闭/遗留、无来源预期与 GAP；未测项显式列缺口，不以“已执行”替代“已覆盖”。
      同步回写计划 §0（计划状态=待关闭/已关闭、当前门=准出、下一动作）、§16.1 执行日志、§16.2 归档索引；关闭时按 §16.2 生成快照，不移动当前计划。
      按 `规则/协作/协作与交接.md` §3/§4 生成 `TEST` 交接包（报告/计划对照/覆盖缺口/遗留/准出建议）给产品/开发；报告门未 PASS/CONDITIONAL 不得生成“可准出”包；更新 `交接台账.md`、计划 §0/§16.1；未回执不得写“产品/开发已接收/已准出”。
      版本关闭：按 `规则/文档治理.md` §7 分轨归档——功能→`功能测试/_归档/`、接口→`接口测试/_归档/`、探索式→`探索式测试/_归档/`、发布前→`发布前测试/{专项}/_归档/`；计划/报告/CR/交接→`测试/_归档/{yyyyMMdd}-{版本}/`；失效资料→`资料/_归档/{yyyyMMdd}-{版本}/` + 清单；部分/增量/参考不动；未确认不移动。
      更新 `测试/工作日志.md`（仅本文件）：索引表新增一行 + 里程碑条目——报告门 PASS/CONDITIONAL 写事件=`报告完成`；有准出评估写事件=`轮次/准出`；版本关闭归档另写=`版本关闭`（结论含准出口径；产出链到测试报告/计划；遗留/下一步）。无文件则先按工作日志模板创建。
      **不是**根 `CHANGELOG.md`、测试报告正文、也不是测试计划 §16.1 执行日志（细粒度过程仍写 §16.1/台账）。
      **禁止**创建或修改项目根 `CHANGELOG.md`。
      同步按 `规则/文档治理.md` 扫描工作文档与过程文件：长期/固定项（环境基线/P0 冒烟/可复用脚本）保留；版本绑定资产按上表分轨归档；临时/失败/重复文件列清理候选；确认后执行。
      专项/小批追加一节或仅收尾。可选：装配 report-render（`能力/00-能力注册表.md`）时渲染执行明细；准出评估仍以 `测试/测试报告.md` 为准。
      独立生成已在 generate 过门3 → 本步不重复确认。
    output: 测试/测试报告.md + 【任务收尾】（执行/生成明细置第 1 点）

  - name: 收尾与提交确认
    id: handoff
    agent: report-agent
    hitl: confirm_commit
    hitl_when: has_pending_commit_or_platform_ask
    output: 提交/交平台确认结果
    notes: >
      报告与六段骨架已输出（第4点含待你确认表）；此处只在骨架后问一次「是否提交入库/交平台」。
      交平台/回写前运行 `验证/Invoke-Gate.ps1 -Mode writeback`（写 `.gate/测试规范/writeback.json`）；无回执不得声称已回写；无权限走 export。
      计划 §11 为「发现即提交」的缺陷不重复问；按模块批末/阶段末/收尾确认的批次，按对应清单确认后执行；未确认则结束。
      本轮用过浏览器 MCP → 按 `规则/专项/多Agent与输出.md` §2.2 全链终局退程（本套 Chrome）。
