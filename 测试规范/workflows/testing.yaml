# 读取：仅当前 step 块（当前 - name: 至下一个）；全文件仅供维护，禁止整文件通读。
# AI 测试主流程（声明式 Workflow · 执行宿主执行）
# - 口令可切入任一步：仅执行 → 直接 execute（勿强制 analyze）；生成未点名主读才门1（一问即止，禁重问）
# - 无「测试规范接入：已完成」（兼容旧 landing=ok）时才按 onboard-agent 清单核验一次，打标后免检（AGENTS 开工第3点）
# - 正式轨：功能全量/专项 · 探索式 · 随机业务流程（计划外） · 接口 · 发布前（工作流 §1.2 + 规则/轨契约/）
# - 确认门只认步上 hitl（标量或列表，可带 when）；条件不满足则该门跳过，不算违例
# - 入口即止：单步口令只执行该步 + 收尾；「按计划执行」才按链走 analyze→plan→generate→review-cases→execute→report
workflow:
  id: testing
  name: AI测试流程
  version: 17
  read_index: 规则/读取索引.md

entry_points:
  分析需求: analyze
  理解PRD: analyze
  理解 PRD: analyze
  梳理测试依据: analyze
  需求建模: analyze
  测试计划: plan
  生成测试计划: plan
  功能测试计划: plan
  更新计划: plan
  本期变更: plan
  计划变更: plan
  增量变更: plan
  新文档更新测试计划: plan
  按测试计划执行: execute
  按计划执行: execute
  执行测试计划: execute
  继续测试计划: execute
  回归: execute
  重跑: execute
  脚本执行: execute
  跑脚本: execute
  执行: execute
  跑: execute
  专题: execute
  阶段二: execute
  当前状态: status
  计划状态: status
  下一步: status
  生成测试资产: generate
  生成用例: generate
  生成接口测试资产: generate
  生成探索式用例: generate
  生成随机业务流程: generate
  生成业务随机: generate
  生成性能测试资产: generate
  生成安全测试资产: generate
  生成兼容测试资产: generate
  用例评审: review-cases
  评审用例: review-cases
  测试用例评审: review-cases
  测试计划评审: review-cases
  接口资产评审: review-cases
  修改方案专项: generate
  执行测试: execute
  执行专项: execute
  执行接口测试: execute
  执行探索式测试: execute
  执行随机业务流程: execute
  执行业务随机: execute
  执行性能测试: execute
  执行安全测试: execute
  执行兼容性测试: execute
  测试报告: report
  出报告: report
  准出评估: report
  用例脚本: generate
  更新脚本: generate

trigger:
  - 生成测试资产
  - 执行测试
  - 测试计划 / 测试报告 / 生成测试计划
  - 本期变更 / 计划变更 / 增量变更 / 新文档更新测试计划
  - 按计划执行 / 执行测试计划 / 按测试计划执行 / 继续测试计划
  - 当前状态 / 下一步
  - 执行专题
  - 阶段二
  - 用例脚本（编写/执行）
  - 用例评审 / 评审用例 / 测试用例评审
  - 探索式 / 探索测试 / 随机业务流程 / 业务随机 / 接口 / 发布前（同文件，按轨契约分产物；随机为计划外）

preflight:
  skip_if: activeContext 测试规范接入：已完成
  once: 按 agents/onboard-agent.yaml 接入清单核验
  on_fail: onboard → write 测试规范接入：已完成 → resume

steps:
  - name: 当前状态与下一步
    id: status
    agent: test-planner
    output: 当前阶段/门/下一动作/需人工
    notes: >
      只读 `测试/测试计划.md` §0/§9/§16：报备计划状态、当前阶段、当前门、下一动作、需人工项、健康度。
      「下一步」只报动作与入口，不执行；「当前状态」只读，不重写计划。
      有未吸收新文档/变化 → 先走 `本期变更`（plan 步的期中变更逻辑），不直接改用例/脚本。
      有未回执/退回/阻断执行的交接包 → 先走 `workflows/handoff.yaml` status/receive，不直接进入执行。
      测试包独立运行；PRD/提测单/UAT 为可选输入，缺则按主读/基线执行，不阻塞。
      结束对照 `规则/模板/90-交接与收尾/收尾骨架.md` §2（只读可 2～3 行简报）。
      输出首条：route=workflow:testing | step=status | phase=… | gate=… | next_action=…

  - name: 分析需求
    id: analyze
    agent: test-analyzer
    hitl:
      - name: confirm_understanding
        when: understanding_needs_confirm
    output: 测试/功能测试/分析短表.md（轻量）；T2/T3 另出 测试/功能测试/需求理解-{范围}-{yyyyMMdd}.md
    notes: >
      门/产出：主读未点名 → 列候选+建议一次一问（门1 形式挂 generate）；已点名仍须产出需求模型/分析短表，禁跳过致无短表。
      交接包输入 → 先 `handoff.receive`；新资料 → `规则/文档治理.md` §3（确认前不改文件）。
      方法：`技能/test-basis-analysis`（必用）+ 按需 `test-analysis-and-plan` / `test-data-and-environment` / `ai-feature-testing`；澄清见 `规则/核心/澄清.md`。
      预期须有来源；无来源=GAP；现网不作预期。关键歧义未裁决 → 不写确定计划/用例。
      confirm_understanding：确认目标/范围/规则/AC·oracle/冲突·GAP 后才 plan/generate。

  - name: 测试计划
    id: plan
    agent: test-planner
    hitl:
      - name: confirm_understanding
        when: understanding_needs_confirm
      - name: select_review_mode
        when: landing_doc_review_needed
      - name: confirm_plan
        when: plan_needs_confirm
      - name: confirm_iteration_close
        when: iteration_close_needed
      - name: confirm_docs_migration
        when: docs_migration_needed
    notes: >
      产出/更新 `测试/测试计划.md`：只读模板 **§0+本轮待填节**（禁整模板通读）。计划是唯一编排载体（§3.2/§9/§10/§11/§12）。
      无需求模型/短表 → 先回 analyze。范围/类型/编排须引用 analyze；未裁决歧义不得写成确定项。
      门：`confirm_understanding` 未过不得「已确认」；T1+ 实质计划 → `select_review_mode` 后再 `confirm_plan`（摘要：范围/类型/轨道/缺陷策略/准出；同会话同载体一次）。
      交接包 → `handoff.receive`；`PLAN` 包先问后发。方法：`技能/test-analysis-and-plan`；数据/评审技能按需。
      期中变更/关版本：CR+影响分析；A/B 就地更、C 回计划门、D 缺陷轨；关账见 `规则/文档治理.md` §7（`confirm_iteration_close`）。
      每次落盘更新 §0 + §16.1；更新依据=台账/证据/已批 CR，禁聊天记忆。
    output: 测试/测试计划.md

  - name: 生成用例
    id: generate
    agent: testcase-agent
    hitl:
      - name: confirm_understanding
        when: understanding_needs_confirm
      - name: select_mainread
        when: mainread_unspecified_for_generate
      - name: confirm_commit
        when: standalone_generate_with_pending
    gate: coverage-map
    gate_type: machine
    gate_when: functional_coverage_required
    notes: >
      门1：仅**新生成**且主读未点名时 STOP（analyze 已问过则跳过，不重问；用例评审不触发）。
      理解门：`confirm_understanding` 触发时先出示需求模型/oracle/冲突/GAP/置信度；未确认 → 先执行 analyze 步并确认，再回本步生成。
      生成前须已有需求模型/轻量分析短表（可与本步同轮由 analyze 逻辑产出）与现行测试计划（缺/超范围 → 先按 plan 步轻量补；输入含 PRD/原型但未建模 → 先按 `技能/test-basis-analysis/SKILL.md` 补，不直接写用例）；**探索式/接口/发布前独立口令可不要求完整计划**，只在 `测试/测试计划.md` §3.2 登记一行或按轨契约生成，不触发计划门；计划驱动模式必须按 `测试/测试计划.md` §3.2/§12。**随机业务流程**仅独立口令、**禁止**写入/登记测试计划；读 `轨契约/随机业务流程.md` + 随机用例模板；主读最新或 N-1；影响面+常青≥约70%、未入库坑≤约30%。
      **追溯红线**：每条用例至少指到一个 RQ/AC/F/R/TP/`GATE/REL/§` 或页面/接口来源；预期（oracle）必须来自需求/AC/契约/用户裁决，不能来自现网实现（不得因现网只显示“—”就把“待补配置”改通过）；无来源先问或标“文档未声明”，不得臆造；映射无空行 + 覆盖单元至少 `GATE/AC/TP/F/R/§` + 深度档 + 数据链路/可观测性（覆盖三闸②，详版 `技能/testcase-design` §2.2/§2.4/§5）。
      **计划驱动生成**：按 §3.2 资产清单 + §3.7 装填逐项生成/登记——功能全量/专项→testcase-agent；接口→接口轨；发布前→发布前轨；探索式→计划 §12 章程 + `规则/模板/20-测试用例/探索式用例模板.md`；脚本按 `规则/专项/脚本执行.md` §1+§2。缺资产先补，计划项不静默跳过；超范围先更新计划/计划门。
      **域常青增量（默认）**：只打开计划 §3.7 **命中域**现行用例；有域文件→锚点增量改（**保 caseId**）+ 增改删表；无域文件→冷启动按域首生。**禁**无分析全仓重生；**禁**口令「继续」触发/隐式 generate（「继续」只属 execute 装填续跑）。**一遍过**=对本期命中范围宁多勿漏，≠全仓重生。同域无效合并≥2→有界重生（快照进轨内 `_归档/` 后整域重生）。接口：覆盖对照表可全维；默认可执行/可脚本=**高风险维**；`depth=full` 或发版/点名才补齐其余维。
      **大规模生成分片**（多Agent §1.5）：**≥3 域且 ≥40 条** → 一域一子代理，**只写**本轨 `.draft/generate/{域}.md`（功能专项用 `.draft/S-{NN}-{主题}/`）草稿；编排统一 ID/模板/排序并合并，跑覆盖三闸；单域/小批直做；**禁**多写手并行写同一正式域文件（分片仅 draft）。
      能测尽测（命中域内）；参照影响面/变更点；探索式轨按章程而不是臆造业务步骤。
      独立生成（不续 execute）且有拟入库 → 生成后出示拟提交清单再 confirm_commit；同会话续 execute → 门3 只在 report。
      覆盖三闸见 testcase-agent 与 工作流 §2.1.0（含深度档 + 视觉基础）；落盘后 `validate_testcase.py` + `验证/Invoke-Gate.ps1 -Mode coverage`（验用例「设计点覆盖映射」与「覆盖摘要」中的深度档/视觉基础行；写 `.gate/测试规范/coverage.json`）；无回执不得称覆盖闸通过；分片超时直做同一门槛。**`gate: coverage-map` 仅功能全量/专项新生成/补生成**；探索式/随机/接口/发布前按轨契约软覆盖。
      **生成后必衔接评审**：功能全量/专项（T1+）落盘且覆盖闸过后，同会话续执行或「按计划执行」前必须进入 `review-cases`；本步只做完稿自检+评分卡自打，**不替代**独立评审（独立性见 testcase-reviewer）。入口即止仅生成时，收尾「下一步」写明：先用例评审再执行。
      脚本编写/更新：按 `规则/专项/脚本执行.md` §2 + `规则/tools/playwright/README.md` 的脚本结构；接口确定性用例**同轮产出脚本**，不得标“待脚本化”。
      技能：`技能/testcase-design/SKILL.md`（先读再设计用例：技法 + 漏测谱系 + 断言写法）+ `技能/ai-feature-testing/SKILL.md`（AI 功能附加）；接口轨读 `技能/test-interface/SKILL.md`。
    output: 测试/功能测试/ · 测试/接口测试/ · 测试/探索式测试/ · 测试/随机业务流程测试/（计划外） · 测试/发布前测试/{性能|安全|兼容|迁移}/ · 测试/脚本/（按计划 §3.2 资产；功能用例/台账/评审/证据同级；随机不进计划资产清单）

  - name: 用例与多轨资产评审
    id: review-cases
    agent: testcase-reviewer
    hitl:
      - name: select_review_mode
        when: landing_doc_review_needed
      - name: confirm_review
        when: review_needs_confirm
    gate: case-review
    gate_type: machine
    gate_when: case_review_required
    output: 测试/{轨}/评审-{范围}-{yyyyMMdd-HHmm}.md + 【任务收尾】（评审结论置第 1 点）
    notes: >
      **主链一步（生成后 / 执行前）**：不重生成、不改写口径。细则 `规则/工作流.md` §2.5 + `技能/test-artifact-review` + `技能/testcase-review`。
      **范围不止功能用例**：功能全量/专项（强制）｜接口资产（计划驱动或进准出时强制）｜探索式（计划 §12 纳入时建议；T3 强制）｜发布前（T3/点名强制）｜随机业务流程仅点名。
      **先 STOP【评审方式】**：A 自行｜B AI 独立；可附自定义焦点（如「重点看权限/支付」）→ 选 B 时 AI 必须优先深析。未选不得进 P2。
      **选 A**：附【自主分析摘要】+ 自检/三闸摘要；HUMAN_APPROVED；不跑 `-Mode review`。
      **选 B**：独立性；**先【自主分析】**（策略/漏测假设/矛盾/过测欠测/取舍）再量规；功能→A1–A6/S1–S6+三闸；接口/探索/发布前→轨契约；需修回 generate（≤1）。
      **机器门（仅功能轨选 B）**：`case_review_required` → `-Mode review`；其它轨选 B 留痕即可（软机检）。
      **confirm_review**：需修/有条件放行时 STOP。

  - name: 执行测试
    id: execute
    agent: test-orchestrator
    gate: execute-batch
    gate_type: machine
    gate_when: module_batch_complete
    hitl:
      - name: confirm_understanding
        when: understanding_needs_confirm
      - name: select_mainread
        when: exploratory_mainread_missing
      - name: confirm_scope
        when: scope_needs_confirm
    output: 执行结果/≤3 行简报（末步对照 `规则/模板/90-交接与收尾/收尾骨架.md` §2）
    notes: >
      **批末机器门（`module_batch_complete`）**：本装填域/本批用例终态齐后跑 `验证/Invoke-Gate.ps1 -Mode execute -Scope "{装填域路径片段}"`（例 `-Scope 16-ASN`）；回执 `.gate/测试规范/execute.json` 须含 `scope`；只对 Scope（=计划装填矩阵命中域）内台账判 PASS/CONDITIONAL/FAIL。**不得**用无 Scope 的全仓扫描当本批结论；整版准出另跑 `-Mode report`。
      **装填行（必做）**：开跑前读测试计划模板 §0 与装填矩阵（计划 §3.7），展示 `suite=core|module|full` + 命中域 + 已终态/next。**有文件 ≠ 本轮跑**。口令「继续」**只续装填状态机**（沿用 suite/域/next），不重做影响分析、不隐式 generate。
      门2（when `scope_needs_confirm`）：开跑前展示一行「主读《…》；计划《…》suite=…/装填域/轮次/准出；环境=…」→ 等确认；同一载体同会话只确认一次（「继续」沿用装填行）。**随机业务流程**门2 行改为「主读《…》（最新|N-1）；影响面/常青范围；时间盒；环境=…」（无计划字段）。
      提测包未签收 → 先走 `workflows/handoff.yaml` receive；回执=退回或阻断缺口未解 → 不开跑；有条件接收 → 条件写进计划风险并记录。计划驱动已确认且提测已接收 → 直接开跑并附【已预授权执行：按计划】。
      理解门先行：`confirm_understanding` 触发时先确认需求模型/oracle/冲突/GAP；未确认不得开跑或把结果判为通过。
      探索式执行且未点名主读/无同戳用例 → 先按 `generate` 生成探索式用例/台账（门1 一问），再执行；不即兴臆造业务步骤。
      **随机业务流程**（计划外）：口令「执行随机业务流程/业务随机」→ 读 `轨契约/随机业务流程.md`；**禁止**被「按计划执行」调度；未点名主读或版本窗外 → 门1；无同戳用例先 generate；结论只落本轨、不进报告准出。
      **评审前置（功能全量/专项 · T1+）**：开跑 P2 前核最新 `评审-*.md` 结论=放行执行（或有条件放行且接受人已登记）且 `.gate/测试规范/review.json` 为 PASS（适用时）；未评审/需修未复核 → 先走 `review-cases`，禁跳过进功能全量。T0 SELF_CHECKED 须在计划/收尾有声明。
      **计划驱动（口令「按计划执行 / 执行测试计划」）**：读计划 §9.2 逐阶段执行（P0 准备→P1 冒烟→P2 功能→P3 接口→P4 探索式→P5 非功能→P6 回归→P7 UAT→P8 发布前/灰度→P9 报告）；**不含**随机业务流程（计划外，仅独立口令）。每阶段入口检查→按对应轨契约执行→出口检查→更新计划 §0（当前阶段/门/下一动作/健康度）+ §16.1 执行日志；并行仅按 §3.4/§9.2 且账号/数据/浏览器 profile/写域隔离；同条用例禁并行。**计划 §0「计划状态=已确认/执行中/待关闭」 → `confirm_scope` 条件（`scope_needs_confirm`）不满足 → 跳过并附【已预授权执行：按计划】直接开跑；计划外/未确认提交仍门3。**
      **回归并行**：每次缺陷修复后立即跑 原单+冒烟子集+影响面组（计划 §10），不等批末；高风险/连环缺陷提示升级；结果就地覆盖。
      **待实现/跨版本复测**：功能交付或阻塞条件恢复后，相关 `待实现/阻塞` 用例必须复测；未复测不得沿用旧结论；上一版 `失败/待实现/已修复` 进入本版回归（计划 §10）。
      **缺陷**：提交策略见 `规则/缺陷/缺陷协作.md` §6.1；计划侧对照测试计划「缺陷提交策略」节；门条件见本文件 hitl / defect 工作流。
      **探索式**：按计划 §12 章程穿插；session 记录→debrief→triage→缺陷/补用例/回归；不替代功能全量。
      **非功能**：按计划 §3.1/§9.2，构建稳定后执行；接口/发布前按各轨契约。
      **停止/恢复**：P0-Smoke 未过/环境不可用/数据合规风险/计划实质偏差 → 按计划 §6 暂停或回计划门；不静默降范围。
      计划与轮次按 `测试/测试计划.md`（无计划/不覆盖本范围 → 落轻量计划随本门并列确认）；R0 冒烟 → R1 正式 → R2+ 回归。
      数据准备（功能全量/专项）：门2 后扫本批**装填域**前置三件套集中造齐（账号/入口/数据；优先 API/脚本；回写基线 §11/§14）——数据未齐不进冒烟（小批 ≤≈20 或已齐跳过；多Agent §1.1.1 ⓪）。
      冒烟前置（功能全量/专项）：先跑 P0-Smoke（suite⊇core；多Agent §1.1.1；脚本档优先）；全绿 → **只跑计划装填矩阵命中域**（suite=module；发版/点名才 full），**禁**冒烟后扫全库；未全绿→环境级停轮报告、产品级拦阻断面（下游记阻塞点名上游）；用户点名跳过须收尾记注意项。
      口径待探查：先读现网实现值再断言（工作流 §3.0）；禁因方案无数字记 pending。有明确需求/AC/oracle 时以需求为准，现网值只作口径探查；实现与需求不一致 → 记失败/缺陷，不按实现改预期。
      **依据核对**：执行前读 `analyze` 需求模型/分析短表/TP 与用例追溯；用例无来源或 oracle 缺失 → 先补/问，不猜。
      执行形态（多Agent §1.1）：已脚本化用例（清单=已脚本化）优先**脚本档**（0 token 回归，`规则/专项/脚本执行.md`）；不可脚本化用例走模块子代理档/直跑档/拆分档；计划驱动跨轨细节见 `规则/专项/多Agent与输出.md` §4。
      子代理回收（多Agent §1.5）：返回 ≤30 行；主上下文只收摘要；并发 ≤3；同一用例/模块串行；批末核验后再下一批；Reviewer 只收 jsonl+证据+预期，不收 Worker 分析。
      脚本失败 → AI 复核一次后方可定性；脚本漂移先修脚本再重跑（`规则/专项/脚本执行.md` §3/§4）。
      「回归/重跑 {范围}」=重测既有用例、就地覆盖、只留最新结论；续跑缺终态先对账（禁未对账重复写操作）（多Agent §2.1）。
      工具：功能/探索式/随机业务流程轨 browser-mcp（基线 §8 绑定）+ 脚本执行器（基线「脚本执行」节，启用时）；接口/发布前轨按轨契约按需，不默认启用浏览器。
      **截图即视觉检**：浏览器 MCP/AI 直跑凡拍目标页截图 → 按工作流 §2.1.0 视觉六项同帧检；阻断→fail；非阻断→额外发现；已截必检；纯 API 无 UI 截图不适用。
      可选能力（`能力/00-能力注册表.md`）：vision-ui（语义/视觉难判时增强）；未装=AI 读图降级，**不免除**视觉六项。mobile-automation 仅移动端点名。
      技能：`技能/test-execution-and-exploration/SKILL.md`（计划驱动/回归/探索式/随机业务流程）+ `技能/test-data-and-environment/SKILL.md`（数据/环境/隔离）+ `技能/ai-feature-testing/SKILL.md`（AI 非确定性执行）；接口轨另读 `技能/test-interface/SKILL.md`；发布前轨另读 `技能/test-performance-security-compatibility/SKILL.md`。
      MCP 细则：稳态含全链终局退程（多Agent §2.2）；异常细节仅红点/无工具/端口/并行冲突时点读。
      同方案无效 2 次换手段，禁同命令空重跑。**判 blocked 前四问**：能否造数/换样？能否换入口/角色？是否被测缺陷（→fail）？互异手段≥2 且总尝试≤3？任一未过不写 blocked。
      探索式/随机业务流程/接口/发布前方法与场景自备（见轨契约）。

  - name: 输出报告
    id: report
    agent: report-agent
    next: handoff   # 报告门通过后只追加一次提交/交平台确认，不重跑执行
    gate: report-consistency
    gate_type: machine
    notes: >
      先产出报告正文与六段【任务收尾】，**门3 在 handoff 步**，在骨架后单独问；不得先阻塞报告输出。
      报告正文写完后运行 `验证/Invoke-Gate.ps1 -Mode report`；门读计划/台账/报告，检查计数一致、P0、P0 计划覆盖、证据、覆盖缺口；未 PASS/CONDITIONAL 不得写“整体通过/可准出”，且**本步停**——先修数据/证据或报阻塞。
      门通过 → 按 `next: handoff` 追加一次提交/交平台确认（只此一次）；门未过不得进入 handoff。
      门回执在 `.gate/测试规范/report.json`；把 `verdict/gate/counts/p0/unverified` 回填报告 §0 后再复跑一次（回执必须与最终门一致）。非 PASS 禁用“全部通过/可发布”。
      `writeback` 只写 `.gate/测试规范/writeback.json`，不得覆盖 report 回执。
      全部阶段结束对照 `规则/模板/90-交接与收尾/收尾骨架.md` §2；阶段中途 ≤3 行简报。
      失败/待实现汇总与交平台建议并入第 1 点；是否交平台在下一步（handoff）只问一次（禁用例级刷屏）。
      对账工具优先（多Agent §1.5）：台账计数/证据可打开先用脚本；仅证据充分性/语义归因派核验子代理，返回差异清单 ≤30 行。
      版本级/全量/计划驱动：对照计划 §9.2 计划 vs 实际、§10 回归、§11 缺陷、§12 探索、§5 准出 → 出「准出评估」并更新 `测试/测试报告.md`（模板 `规则/模板/40-报告与评审/测试报告模板.md`；报告 §2 计划对照、§3 类型覆盖、§4 统计、§5 缺陷/回归/探索式、§6 覆盖缺口、§7 准出；滚动就地更新只留最新口径）。
      **需求覆盖**：报告对照需求模型/分析短表，列出 RQ/AC/TP→用例覆盖、歧义关闭/遗留、无来源预期与 GAP；未测项显式列缺口，不以“已执行”替代“已覆盖”。
      同步回写计划 §0（计划状态=待关闭/已关闭、当前门=准出、下一动作）、§16.1 执行日志、§16.2 归档索引；关闭时按 §16.2 生成快照，不移动当前计划。
      **最优默认**：报告门 PASS/CONDITIONAL 后交付自洽 `测试报告.md`；**不**默认打 TEST 包。命中多文件证据/正式签收/仓外/点名 → 停问建议 TEST 包；确认后 `handoff.send`。未命中不机械每问。报告门未过不得建议「可准出」包。未收回执不得写“已接收/已准出”。
      版本关闭：按 `规则/文档治理.md` §7；**计划/报告快照**→`测试/_归档/{yyyyMMdd}-{版本}/`；**功能/接口域主档常青留下**（不因关账整轨搬走）；轨内 `_归档/` **仅**下线域/重生快照/旧探索轮——**禁**写成「功能→功能测试/_归档/」把整轨现行主档归档；探索式/发布前按轨契约；失效资料→`资料/_归档/{yyyyMMdd}-{版本}/` + 清单；仍被引用的设计输入/测试数据/稳定冒烟清单保留；未确认不移动。
      更新 `测试/工作日志.md`（仅本文件）：索引表新增一行 + 里程碑条目——报告门 PASS/CONDITIONAL 写事件=`报告完成`；有准出评估写事件=`轮次/准出`；版本关闭归档另写=`版本关闭`（结论含准出口径；产出链到测试报告/计划；遗留/下一步）。无文件则先按工作日志模板创建。
      **不是**根 `CHANGELOG.md`、测试报告正文、也不是测试计划 §16.1 执行日志（细粒度过程仍写 §16.1/台账）。
      **禁止**创建或修改项目根 `CHANGELOG.md`。
      同步按 `规则/文档治理.md` §7～§8（仅本步关版本时，非日常收尾）：先判 T1/T2/T4；长期/固定项（环境基线/P0 冒烟/可复用脚本）与仍被引用的设计输入/测试数据保留；版本绑定资产按上表分轨归档；已完结临时/失败/重复（含已完结 `.draft/`）列清理候选；确认后执行。
      专项/小批追加一节或仅收尾。可选：装配 report-render（`能力/00-能力注册表.md`）时渲染执行明细；准出评估仍以 `测试/测试报告.md` 为准。
      独立生成已在 generate 过门3 → 本步不重复确认。
    output: 测试/测试报告.md + 【任务收尾】（执行/生成明细置第 1 点）

  - name: 收尾与提交确认
    id: handoff
    agent: report-agent
    hitl: confirm_commit
    hitl_when: has_pending_commit_or_platform_ask
    output: 提交/交平台确认结果
    notes: >
      报告与六段骨架已输出（第4点含待你确认表）；此处只在骨架后问一次「是否提交入库/交平台」。
      交平台/回写前运行 `验证/Invoke-Gate.ps1 -Mode writeback`（写 `.gate/测试规范/writeback.json`）；无回执不得声称已回写；无权限走 export。
      计划 §11 为「发现即提交」的缺陷不重复问；按模块批末/阶段末/收尾确认的批次，按对应清单确认后执行；未确认则结束。
      本轮用过浏览器 MCP → 按 `规则/专项/多Agent与输出.md` §2.2 全链终局退程（本套 Chrome）。
