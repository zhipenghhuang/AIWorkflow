# 能力与技能体检：确认后可就地改本包技能/能力；体检必须走完整链
workflow:
  id: skill-audit
  name: 能力与技能体检
  version: 2
  read_index: 规则/读取索引.md
  chain: full   # 体检必须走完 scope→inventory→fit→propose→apply→wrap，不能停在 scope

entry_points:
  体检能力: scope
  能力技能体检: scope
  检查技能能力: scope
  能力优化: scope
  技能优化: scope
  优化能力: scope
  优化技能: scope
  优化技能能力: scope
  更新能力建议: scope
  更新技能: scope
  维护技能能力: scope
  通用优化技能: scope
  通用最优技能: scope

trigger:
  - 体检能力 / 能力技能体检 / 检查技能能力 / 能力优化 / 技能优化 / 优化能力 / 优化技能 / 优化技能能力
  - 更新能力建议 / 更新技能 / 维护技能能力
  - 通用优化技能 / 通用最优技能

steps:
  - name: 定范围与模式
    id: scope
    agent: onboard-agent
    output: 体检范围卡（模式 project/generic、范围、依据）
    notes: >
      读 playbook §1：含「通用/不按项目/通用最优」→ generic；无填实 `环境基线.md` → **强制 generic**；有填实 → project。
      范围：全量｜仅能力｜仅技能｜按轨。generic 默认全量。

  - name: 盘点
    id: inventory
    agent: onboard-agent
    output: 库存摘要（能力/技能/映射/缺口，含证据）
    notes: >
      能力注册表 + `环境基线.md` §17；`技能/README.md` 映射；抽查本范围 SKILL frontmatter；禁通读全部技能正文。
      输出【库存摘要】。

  - name: 适配分析
    id: fit
    agent: onboard-agent
    output: 适配分析表（够用/缺口/过重/冲突/重复/映射断裂 + 证据）
    notes: >
      project：对照环境基线、T 级、轨道、计划缺口、近期门/降级。generic：对照主选备选与技能完整性，不写环境特例。
      分类：够用｜缺口｜过重｜冲突｜重复｜映射断裂。

  - name: 出具建议
    id: propose
    agent: onboard-agent
    output: 测试/00-项目治理/能力技能体检-{yyyyMMdd}.md（工作产物，不进资料区）
    notes: >
      按 `规则/模板/00-接入与基线/能力技能体检报告模板.md` 与 playbook §3；P0 置顶。
      本包可就地改技能；未确认不改；可列「下一步：装配能力」。

  - name: 确认并应用
    id: apply
    agent: onboard-agent
    hitl: confirm_skill_changes
    hitl_when: skill_changes_pending
    output: 已应用变更清单 + ValidateTemplateRefs 自检结果
    notes: >
      有拟改项 → skill_changes_pending=true，出示【拟变更清单】确认后按 playbook §4 执行；否则跳过。
      改包后**必须**跑 `规则/tools/Invoke-TestWorkflow.ps1 -Action ValidateTemplateRefs`；失败不得声称完成；结果写入体检报告。

  - name: 收尾
    id: wrap
    agent: onboard-agent
    output: 【任务收尾】
    notes: >
      对照 `规则/模板/90-交接与收尾/收尾骨架.md` §2；第1点写模式/范围/建议数/已应用数

  - name: 拟提交
    id: commit
    agent: onboard-agent
    hitl: confirm_commit
    hitl_when: has_pending_commit
    output: 拟提交确认结果
    tools:
      - git
    notes: 有技能/能力/基线改动才走；拟提交清单按 `规则/模板/90-交接与收尾/收尾骨架.md` §0/§2 与 `AGENTS.md` §4 git；无变更跳过。
