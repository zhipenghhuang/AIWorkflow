# 能力与技能体检：入口即止（非 onboard 全链）；确认后可就地改本包技能/能力
workflow:
  id: skill-audit
  name: 能力与技能体检
  version: 1
  read_index: 规则/读取索引.md

entry_points:
  体检能力: scope
  能力技能体检: scope
  检查技能能力: scope
  能力优化: scope
  技能优化: scope
  优化能力: scope
  优化技能: scope
  优化技能能力: scope
  更新能力建议: scope
  更新技能: scope
  维护技能能力: scope
  通用优化技能: scope
  母版技能更新: scope
  母版能力优化: scope

trigger:
  - 体检能力 / 能力技能体检 / 检查技能能力 / 能力优化 / 技能优化 / 优化能力 / 优化技能 / 优化技能能力
  - 更新能力建议 / 更新技能 / 维护技能能力
  - 通用优化技能 / 母版技能更新 / 母版能力优化 / 通用最优技能

steps:
  - name: 定范围与模式
    id: scope
    agent: onboard-agent
    notes: >
      读 playbook §1：含「通用/母版/不按项目」→ generic；无填实 `环境基线.md` → **强制 generic**；有填实 → project。
      范围：全量｜仅能力｜仅技能｜按轨。generic 默认全量。

  - name: 盘点
    id: inventory
    agent: onboard-agent
    notes: >
      能力注册表 + `环境基线.md` §17；`技能/README.md` 映射；抽查本范围 SKILL frontmatter；禁通读全部技能正文。
      输出【库存摘要】。

  - name: 适配分析
    id: fit
    agent: onboard-agent
    notes: >
      project：对照环境基线、T 级、轨道、计划缺口、近期门/降级。generic：对照主选备选与技能完整性，不写环境特例。
      分类：够用｜缺口｜过重｜冲突｜重复｜映射断裂。

  - name: 出具建议
    id: propose
    agent: onboard-agent
    output: 测试/资料/_通用/能力技能体检报告.md（或用户指定）
    notes: >
      按 `规则/模板/00-接入与基线/能力技能体检报告模板.md` 与 playbook §3；P0 置顶。
      本包可就地改技能；未确认不改；可列「下一步：装配能力」。

  - name: 确认并应用
    id: apply
    agent: onboard-agent
    hitl: confirm_skill_changes
    hitl_when: skill_changes_pending
    notes: >
      有拟改项 → skill_changes_pending=true，出示【拟变更清单】确认后按 playbook §4 执行；否则跳过。
      改包后可选 ValidateTemplateRefs / 包自检。

  - name: 收尾
    id: wrap
    agent: onboard-agent
    output: 【任务收尾】
    notes: >
      按收尾骨架；第1点模式/范围/建议数/已应用数；第4点未执行项；第6点下一步。
