# 检查矩阵（测试轨 · 人读策略）
# 机器执行以 tools/test_gate.py 为准；本文件用于评审与调整。

version: 1
modes:
  coverage:
    required: [coverage-map]  # 含 §3 映射 + §4 深度档自检/视觉基础存在性
  review:
    required: [review-record, review-structure, review-verdict]
    optional: [coverage-receipt]
    manual: [a1-a6-sampling, s1-s6-suite, scorecard-rerun, independent-context]
  execute:
    required: [plan-exists, ledger-counts, evidence-exists, blocked-reasons, p0-status]
    optional: [coverage-map, p0-missing]
  report:
    required: [plan-exists, ledger-counts, report-counts, p0-status, p0-missing, report-verdict, evidence-exists, coverage-map]
    manual: [writeback-receipt]
  writeback:
    required: [writeback-receipt]
    manual: [note-status-same-round, attachment-check, platform-id]

# 高价值低成本（默认）
always:
  - plan-exists
  - ledger-counts
  - evidence-exists
  - p0-status
  - report-verdict

# 高价值中成本（按范围）
risk_based:
  - coverage-map
  - review-record
  - blocked-reasons
  - writeback-receipt
  # script-run-stamp / independent-sampling / a1-a6 语义审为人工+AI 量规项；
  # 机器只核评审记录结构与放行结论，不写成虚假 required。

# 低价值高成本（不做/少做）
avoid:
  - full-regression-every-patch
  - re-read-all-cases-every-report
  - screenshot-every-pass-case
  - new-docs-for-T0-T1
  - multiple-approval-layers
