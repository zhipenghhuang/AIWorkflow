workflow:
  id: intake
  name: 变更吸收
  version: 6
  read_index: 规则/读取索引.md

entry_points:
  新文档: scan
  新变化: scan
  变更: scan
  确认项: scan
  收件箱: scan
  变更吸收: scan

trigger:
  - 新文档 / 收件箱 / 吸收这份文档
  - 新变化 / 需求变化 / 方案变化 / 范围变化
  - 确认项 / 这个定了 / 按 B 方案
  - 变更吸收

steps:
  - name: 扫描新输入
    id: scan
    agent: iterate-lead
    output: 新输入候选清单
    notes: >
      技能：`技能/change-intake/SKILL.md`（先读再做）。
      输入是交接包（含 `00-交接说明.md` + `01-交接清单.md`）→ 先走 `workflows/handoff.yaml` receive 核对+回执；未签收不进入吸收。
      扫描：`资料/` 未登记/变化文件、`资料/资料索引.md` 断链、`文档索引.md`、`git status`；不再扫 `_收件箱`。
      对照文档索引/需求台账/待决项/开发计划，列出“未登记/未关联”的候选；不读全量历史，不直接改基线。
      多个候选 → 列清单让用户选；无新输入 → 报告“无新增”，不空转。
      先按 `规则/文档治理.md` §3【入站分析】（T1～T9 + 覆盖对照），输出四列；**确认前不改文件**。确认采纳后同批：**多包 → `项目资料/{版本或主题}/`**；**单包 → `开发/资料/{版本或主题}/` 或 `_通用/`** → 同步工作区（台账/方案/任务/计划/索引）→ S1/S2/S3 进 `开发/资料/_归档/{批次}/` + 清单；部分/增量/参考保留。放入≠分发他包。
      **文档抽取分片**（子代理编排 §2）：≥3 份新文档 → 只读扇出（每份返回 DOC/CR/OPEN/DEC 候选＋引用位置＋覆盖关系 ≤30 行）；登记/分类/影响集中；单份直做。

  - name: 分类与登记
    id: classify
    agent: iterate-lead
    output: DOC/CR/OPEN/DEC 登记
    notes: >
      分类：PRD/需求/迭代/专项/原型/设计/接口/技术/测试/验收/反馈/调研/竞品/会议/数据/原始/其他（细则 `规则/文档治理.md` §2）。
      输入为 PRD/迭代方案/需求文档/原型/接口或技术文档 → 先按 `技能/product-doc-analysis/SKILL.md` 产出理解摘要（来源/目标/范围/F-R-AC/冲突/GAP/置信度），再登记；不得只登记文件名。
      登记：`资料/` 文件给 DOC；变更给 CR；确认项关 OPEN 并写 DEC；原始资料只登记不升级基线。
      关联：R/AC/OPEN/CR/T；找不到 → 标 GAP，不硬套。
      歧义（新 PRD 还是确认/哪个迭代）→ 一次一问；不猜。
      更新 `文档索引`/`资料索引`；不直接覆盖正式文档；资料改名/落位/归档按 `规则/文档治理.md` 确认后执行。

  - name: 解析与理解
    id: parse
    agent: iterate-lead
    hitl: confirm_understanding
    hitl_when: understanding_needs_confirm
    output: 资料理解摘要（来源/目标/范围/F-R-AC/冲突/GAP/置信度）
    notes: >
      技能：`技能/product-doc-analysis/SKILL.md`（先读再做）；只读解析，不直接改基线。
      输入含 PRD/迭代方案/需求文档/原型/接口/技术文档 → 产出理解摘要；每条结论标 `[原文]`/`[推断]`/`[假设]`/`[待确认]`/`[GAP]` 并引用章节/页码/页面/组件。
      重点：目标与非目标、角色/场景、F/R/AC、状态机、权限、字段口径、异常/NFR、原型页面/组件/状态、文档间/原型/代码冲突、缺口与假设。
      原型只作 UI/交互依据，不反推后端规则；冲突列双方原文，待用户裁决。
      先给 6～8 行理解复述，再一次一问至无实质缺口（95% 仅参考，`规则/核心/澄清.md`）；未确认不得进入 impact/absorb。
      confirm_understanding：出示来源/目标/范围/非目标/F-R-AC/冲突/GAP/置信度；用户明确确认后才继续；已确认内容不重复问。
      理解摘要登记到 `文档索引`/`资料索引`；不新建重复文档、不改基线正文。

  - name: 影响分析
    id: impact
    agent: iterate-lead
    hitl:
      - name: confirm_change
        when: change_is_substantive
      - name: confirm_requirements
        when: requirements_need_confirm
    output: 影响矩阵/待确认项
    notes: >
      逐项分析：需求/AC、原型、架构/ADR、DB、API、前端、测试、任务/排期、发布/回滚、文档索引。
      按 `规则/协作/协作与交接.md` §6 判 C0～C3；C1+ 需通知受影响角色并发 `CHG` 包；C2/C3 重基线并过门；影响矩阵写入变更记录/吸收报告。
      基于 `parse` 理解摘要与冲突/GAP 分析；不得绕开理解摘要凭文件名/标题判断影响；未裁决冲突先列待确认，不静默选一边。
      跨版本/高价值且 ≥3 影响域 → 只读分域评估（每域返回受影响/依据/动作 ≤30 行）；影响矩阵与结论集中写，不并行改同一文档。
      每项写“受影响/不受影响 + 依据/动作”；禁止沉默。
      实质变更（范围/AC/优先级/架构/排期/发布）→ confirm_change：出示变更类型/影响矩阵/待更新文档/待确认项。
      需求基线/AC 被替换或新增 → confirm_requirements：出示差异/范围/AC/非目标，确认后冻结；未签收不得改基线。
      小澄清（C0/C1 无实质影响）可跳过门，更新后报告。

  - name: 局部更新
    id: absorb
    agent: iterate-lead
    hitl:
      - name: confirm_iteration_close
        when: iteration_close_needed
      - name: confirm_docs_migration
        when: docs_migration_needed
    output: 已更新文档/台账/任务 · 【迭代关账/归档候选】（如有）
    notes: >
      只改受影响章节；保留稳定 ID；正式产物直接替换旧结论（不留“已作废/旧方案”说明），变更前后与原因只记 CR/变更记录。
      更新：需求台账/PRD、迭代计划/任务清单、方案/ADR、DB/API/前端、测试/发布文档（按影响）。
      更新：`开发计划` §0（计划状态/当前门/下一动作）、§1（受影响阶段/范围）、§9/§10、§12 执行日志；`文档索引`、`activeContext`。
      更新 `交接台账.md`：受影响交接包标 `已取代/需重发`；C1+ 发 `CHG` 包并收回执；未回执不得把吸收标完成。
      不新建重复文档；同一主题就地更新；不同工作先问用户。
      本步只准备，不实施代码；实施走 change/iterate。
      **换迭代/关版本（强制）**：新迭代文档已采纳或换主题/换代 → 按 `规则/文档治理.md` §7；不确定当前是否结束 → STOP `confirm_iteration_close`；确认后按 §7.1 完整关账（分析分类/归档/清理/修链；跳过仅发版项）。用户说并行不关 → 只落新资料。

  - name: 吸收报告
    id: report
    agent: iterate-lead
    output: 【变更吸收报告】
    notes: >
      按 `规则/模板/10-规划与需求/变更吸收报告模板.md` 输出：输入/分类、关联、影响矩阵、已更新、待确认、下一步。
      需要开发 → 建议 `workflows/change.yaml`（局部）或 `iterate.yaml`（迭代）；只在文档层 → 关闭 CR/OPEN。
      未确认项列最前；不擅自实施、不提交/推送。
      第1点或附录须含关账/归档结果（已确认执行 / 并行不关 / 无候选 / 待确认清单）。

  - name: 收尾
    id: wrap
    agent: iterate-lead
    output: 【任务收尾】（变更吸收报告置第 1 点）
    notes: >
      按 AGENTS §2 输出【任务收尾】：第 1 点含【变更吸收报告】与汇报（可整段复制），第 2～6 点齐；
      更新文档索引/activeContext/开发计划；未确认/待实施项明示。
      本步先出骨架与拟提交清单；完整【拟提交】在下一步 commit 只展示一次。

  - name: 拟提交
    id: commit
    agent: iterate-lead
    hitl: confirm_commit
    hitl_when: has_pending_commit
    tools:
      - git
    notes: 无文件变更跳过；拟提交清单按 `规则/工作流.md` §2；吸收后的文档/索引/计划同批提交；提交后补一行结果，不重复六段。
