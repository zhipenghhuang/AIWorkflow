workflow:
  id: defect-fix
  name: 缺陷修复协作
  version: 9
  read_index: 规则/读取索引.md

entry_points:
  指派给我: pull
  我的待修: pull
  修复#: pull
  "#数字": pull
  落地优化方案: pull
  拉取产品回复: product_decision
  产品回复: product_decision
  产品退回: product_decision
  继续缺陷: product_decision

trigger:
  - 指派给我
  - 我的待修
  - 修复#
  - "#数字"           # 仅 #123 形态 → 点名（与 AGENTS 对齐）
  - 落地…#编号…优化方案
  - 拉取产品回复 / 产品回复 / 产品退回 / 继续缺陷

steps:
  - name: 平台可用性
    id: preflight
    agent: defect-fixer
    notes: >
      读项目档案 provider。若为「无」或未配置：
      route=workflow:change | reason=no_defect_platform | next_action=按现象走常规变更；
      禁止向用户索要编号、禁止空转拉平台。

  - name: 拉取与归组
    id: pull
    agent: defect-fixer
    tools:
      - defect-platform
    output: 清单摘要/分组
    notes: >
      拉取后读全单：提交信息（标题/steps/数据/环境/附件）＋历史备注/讨论＋产品评估/回复附件；
      **批量侦察**（子代理编排 §2）：≥5 单且读单成本高（多备注/附件/评估单）或合计 ≥20k token → 逐单只读扇出（一单/小批一子代理），返回「分类候选/证据缺口/查重键/产品评估要点」≤30 行；编排集中读回执并读关键单原文。
      同号重复修复预检；归组后进入 triage。
      历史预检跳过项：产品缺陷待产品确认 → 跳过标注「待产品」；已修复未再激活 → 跳过标注「已处理」；
      无法确认被激活 → 重新分类处置；产品已回复/已退回 → 直接进 product_decision。

  - name: 分类与处置
    id: triage
    agent: defect-fixer
    output: 分类结论（中文结论/依据/下一步）
    notes: >
      按 规则/缺陷修复协作.md §4.1/§7 分类：
      实现缺陷→implementation_required；产品缺陷/需求缺口/设计口径不明→product_defect；
      信息不足/无法复现/环境数据不一致/预期不明/重复/设计如此/非缺陷/外部/已在其它构建修复→need_clarification；
      延期/不修复须产品/项目确认，不得开发单方关闭。
      产品缺陷不得先写完整技术方案，只写评估单（§5.1）。
      混批含产品缺陷+实现缺陷：先处理产品缺陷（评估/交接）并 AWAIT_PRODUCT；实现项标「待下一批」，不静默丢、不先提交半批。
      pull 已标「待产品」→ 直接输出 AWAIT_PRODUCT，不重新评估/不重复 handoff。
      分类结论须引用原单 steps/数据/环境/设计依据，禁只看标题；批量时以侦察回执为输入，**分类/五选一/处置集中**，不采信子代理终态。
      内部处置码只用于路由，不写进平台备注。

  - name: 产品缺陷评估
    id: assess_product
    when: product_defect
    agent: defect-fixer
    output: 产品缺陷评估单（模板 规则/模板/产品缺陷评估模板.md）
    notes: >
      按 规则/缺陷修复协作.md §5.1：
      写 缺陷评估-{BUG-ID}-{主题}-{yyyyMMdd}.md，落 {文档事实源目录}/02-设计基线/缺陷评估/；
      只写判定依据/问题影响/方案选项 A/B/C/推荐/影响面/待产品确认；
      不写代码实现细节、不拆开发任务、不排开发排期；不得与正常迭代方案 方案-{主题}-… 混用。
      没有相符证明且不属于需求缺口变体 → 不判产品缺陷：按实现缺陷或 need_clarification 处理。

  - name: 评估单提交产品
    id: handoff_product
    when: product_defect
    agent: defect-fixer
    tools:
      - defect-platform
    hitl: confirm_remark
    output: 平台回写结果（备注+附件+指派产品）
    notes: >
      按 规则/缺陷文案模板.md §6.2 出备注全文；上传评估单附件并回查挂载；
      指派产品经理；状态按档案映射置「待产品确认/待评审」；resolution 不填。
      确认前展示备注全文+附件名+状态/指派变更；备注与状态同轮。
      提交后停，不进入 fix；输出 AWAIT_PRODUCT。

  - name: 等待产品处置
    id: await_product
    when: product_defect
    agent: defect-fixer
    output: 等待回执（AWAIT_PRODUCT）
    notes: >
      STOP：本步输出后结束，不执行 wrap/后续 step；不改代码、不提交、不部署、不按自己的评估方案实施。
      输出【缺陷修复处理总结】的待产品部分（评估单/附件/待决定项）+ 一行 AWAIT_PRODUCT；
      同批实现项/澄清项标「待下一批」，不静默丢；不输出提交菜单（未实施，无可提交代码）。
      下次用户说「拉取产品回复/产品回复/产品退回/继续缺陷」→ 从 product_decision 进入。

  - name: 产品处置读取
    id: product_decision
    when: product_decision_received
    agent: defect-fixer
    tools:
      - defect-platform
    output: 产品结论/附件/对齐清单
    notes: >
      入口直达（拉取产品回复/产品回复/产品退回/继续缺陷）视为本步条件成立；
      未读产品回复/附件前不得进 fix；平台仍无产品回复/仍指派产品 → 输出 AWAIT_PRODUCT，不重复 handoff。
      按 规则/缺陷修复协作.md §5.2/§5.3 读全单：状态/解决码/指派人/全部备注/附件/新产品文档/关联需求。
      归类：认可方案/修改后认可/判定实现缺陷/判定非问题/要求补充信息。
      仅“回派”无备注/附件说明 → 视为未确认，输出 AWAIT_PRODUCT 请产品补结论。
      认可或修改后认可或改判实现 → implementation_required + product_decision_requires_alignment；
      要求补充/非问题 → need_clarification；
      非问题按产品要求退回测试/关闭，不自行改代码。
      读不全（solutionChannel=manual）→ 请用户补关键附件/备注，禁只看标题或只读一句备注。

  - name: 文档对齐
    id: align
    when: product_decision_requires_alignment
    agent: defect-fixer
    output: 对齐记录（受影响文档/计划清单）
    notes: >
      仅产品回复且需实施（认可/修改后认可/改判实现）时执行；非问题/补充信息跳过，转 clarify。
      按 规则/缺陷修复协作.md §5.3：
      ≥3 份新产品文档 → 只读抽取扇出（每份返回变更点/AC/影响面候选 ≤30 行）；对齐结论由本步集中写，不并行改同一文档。
      产品新文档原件落 资料/项目文档/，登记 资料/资料索引.md；
      构成需求/范围/AC/接口/数据实质变更 → 按 workflows/intake.yaml 与 规则/工作流.md §0.1 做影响分析/CR；
      逐项对照评估单/原方案，列一致/差异/新增/删除；
      更新 01-需求基线/需求台账、02-设计基线/方案-…/ADR/接口/DB、03-计划与状态/任务清单、
      04-测试与验收/UAT、05-发布与交付/提测单/发布说明/回滚、开发计划 §0/§1/§12、
      项目档案 §2/§5/§7（新入口/命令/规范变化）、00-项目治理/变更记录（CR）、文档索引、activeContext；
      不适用写原因；未对齐不得 fix。

  - name: 红证与修复
    id: fix
    when: implementation_required
    agent: defect-fixer
    output: 修复/方案/验证结果
    notes: >
      修前红证；无根因不修；复现与写回按原单口径对齐、引用原单信息（协作 §6；红绿与换路径细则见 AGENTS §0.3-7）。
      实现缺陷→按 §6.1 修；产品已认可/修改后认可→按新产品文档/评估单实施（§5.2/§5.3）；
      产品改判实现缺陷→按产品说明修，备注引用产品结论。
      复杂实施再按 模板/方案模板.md 展开，文件名 方案-BUG-{id}-{主题}-{yyyyMMdd}.md；
      简单修复不强制完整方案，但须更新受影响文档/任务清单。
      **修复分片**（子代理编排 §2）：≥3 单且文件不重叠 → 一组一子代理（worker-agent；默认串行；同文件集合并组）；不达阈值直做；子代理禁 commit/push/改平台，返回 ≤30 行可直填备注的事实素材（规则/缺陷修复协作.md §4）。
      高风险/大改/破坏性缺陷：核验者≠实施者（派 reviewer-agent 独立核验，只给原单＋diff＋红绿命令；核验不替代门禁）。

  - name: 澄清/非缺陷回写
    id: clarify
    when: need_clarification
    agent: defect-fixer
    tools:
      - defect-platform
    hitl: confirm_remark
    output: 回写结果（【无法确认·待澄清】/重复/设计如此/非缺陷/外部/已在其它构建修复）
    notes: >
      按 规则/缺陷文案模板.md §6.4/§6.5：
      先按原单口径复现；一次列清缺什么/谁补/截止；给条件式下一步，避免来回踢皮球。
      平台备注用中文结论，禁英文处置码、类名、命令、仓库路径；本条是给测试看的。
      重复→duplicateBug=主单；设计如此→引用设计原文；外部→给外部证据；
      延期/不修复须产品/项目确认，不得开发单方关闭。
      不改代码；备注与状态同轮；确认前展示全文。

  - name: 门禁
    id: gates
    when: implementation_required
    agent: verifier-agent
    gate: completion-gate
    notes: >
      本批无代码/配置改动项 → 跳过（纯文档/纯评估）；有改动运行 `验证/Invoke-Gate.ps1`，门写 `.gate/completion.json`。
      日志分诊（子代理编排 §2）：原始日志落盘，先脚本过滤；仅多文件语义归因才派子代理，返回摘要 ≤30 行。
      失败不声称完成；存量失败只对账新增；工具/环境缺失 → BLOCKED。

  - name: 总结菜单
    id: menu
    when: implementation_required
    agent: defect-fixer
    hitl: select_menu
    output: 【缺陷修复处理总结】+【用户选择菜单】
    notes: >
      预授权（一次性/直接跑完）：声明默认界并直接执行（见 AGENTS §0.2）；默认只到本步输出
      （修复＋门禁＋总结菜单）待选择，仅含后续且范围不明时一问，
      禁静默连跑提交/推送/部署/回写；含后续由范围确认覆盖。总结与菜单必须同轮输出。
      产品缺陷项须列评估单/产品结论/对齐状态。

  - name: 提交推送部署回写
    id: close
    when: implementation_required
    agent: defect-fixer
    tools:
      - git
      - defect-platform
    hitl:
      - name: confirm_commit
        when: menu_includes_commit
      - name: confirm_deploy
        when: menu_includes_deploy
      - name: confirm_remark
        when: menu_includes_writeback
    output: 提交/部署/回写结果
    notes: >
      按菜单精确执行（组合=并集、重复步骤只执行一次）；确认门以本步 hitl 列表为准（专规不另造门）：
      含提交/推送 → confirm_commit（【拟提交】块）；含部署 → 先过就绪检查并产出/更新发布说明+回滚预案+上线检查单
      （模板/发布说明模板.md、模板/上线检查单模板.md，落 05-发布与交付/），再 confirm_deploy（版本/窗口/影响面/回滚决策人）；
      未批准不部署；含回写 → confirm_remark（§6 备注全文）。
      可与菜单同轮展示拟提交清单+备注全文+部署要点，用户一次确认后连续执行
      （预授权已含本步时，展示照常、免重复等待，见 AGENTS §0.2）。
      部署失败即停、不继续回写；部署后先冒烟再回写；未验证不得写成“已修复”。
      产品缺陷回写按 §6.3/§6.6，点名产品文档/评估单/对齐记录。

  - name: 发布后验证
    id: postrelease
    when: has_deployed
    agent: defect-fixer
    output: 发布后验证/发布记录
    notes: >
      条件步：本轮含部署才走。按发布说明跑主链路冒烟与关键回归；观察日志/指标/告警。
      触发回滚条件 → 按发布说明回滚，不恋战；更新 05-发布与交付/发布记录-{版本}.md、发布说明、文档索引、activeContext。
      失败/回滚不重复回写已回写项；需要时转 retro。

  - name: 复盘
    id: retro
    when: recurring_defect_or_incident
    agent: defect-fixer
    output: 复盘（{文档事实源目录}/06-复盘与改进/）
    notes: >
      条件步：重复缺陷/事故/回滚才走；技能 技能/retrospective-and-improvement/SKILL.md，模板 规则/模板/复盘模板.md。
      行动项必须有负责人/截止/验收；进任务清单或 06-复盘与改进/改进项.md。

  - name: 收尾
    id: wrap
    when: not_awaiting_product
    agent: defect-fixer
    output: 【任务收尾】（缺陷修复总结置第 1 点）
    notes: >
      按 AGENTS §2 输出【任务收尾】：第 1 点含【缺陷修复处理总结】与汇报（可整段复制），第 2～6 点齐；
      更新发布记录/文档索引/activeContext/开发计划；未验证/待回写/待产品/跳过项明示。
