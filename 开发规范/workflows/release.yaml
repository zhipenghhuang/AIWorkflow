# 发布/上线/部署从 readiness 起按链执行（就绪→验收→审批→部署→验证→记录→wrap/commit）；回滚为独立入口。
workflow:
  id: release
  name: 发布与上线
  version: 3
  read_index: 规则/读取索引.md

entry_points:
  发布: readiness
  上线: readiness
  发版: readiness
  生产部署: readiness
  正式部署: readiness
  回滚: rollback

trigger:
  - 发布 / 上线 / 发版
  - 生产部署 / 正式部署
  - 回滚
  - 发布后验证

# 裸说“部署/推服务器”不直接进入本工作流：先判目标环境。
# test/staging/本地/联调/测试服务器/UAT → S7 环境部署，版本保持 rc.N，不触发 confirm_deploy。
# prod/生产/正式 → 本工作流；无法判断先问，不得默认生产。

steps:
  - name: 发布就绪检查
    id: readiness
    agent: delivery-lead
    gate: release-readiness
    gate_type: checklist
    output: 上线检查单（开发/06-发布与交付/）
    notes: >
      **先判目标环境（硬前置）**：test/staging/UAT → 立即停止本工作流，按 S7 环境部署（版本按项目策略），不触发 `confirm_deploy`；只有 prod/生产/正式才继续。无法判断 → 只问一次“目标环境是 test/staging 还是生产？”，不得默认生产。
      技能：`技能/qa-handoff-and-release/SKILL.md`、`技能/acceptance-and-launch/SKILL.md`（先读再核）。
      读 `开发/开发计划.md`（旧项目可 `00-项目治理/开发计划.md`；L2+；无则提示缺口，不阻塞单包发布）。
      收到产品发布决策/UAT 交接包 → 先按 `workflows/handoff.yaml` receive 签收并回执；未签收不得把业务验收当已通过。
      按 `规则/模板/40-交付与发布/上线检查单模板.md` 逐项核：需求/AC、提测单/构建交接（无 QA 项目用自测报告/构建记录替代）、评审、
      测试报告/准出、UAT（如适用）、安全/依赖/密钥、配置/迁移、回滚预案、监控/告警/值班、通知、变更审批。
      **硬项**：有代码/配置改动的发布，必须读本轮 `.gate/开发规范/completion.json` 且 `verdict=COMPLETE`、`diff_hash`/提交与当前构建一致；并要求**工作区干净、构建来自已提交或已打 tag 的版本**；BLOCKED/旧回执/脏工作区 → NO-GO。纯文档发布写「不适用+依据」。
      **环境边界**：本工作流用于生产/正式发布；test/staging 部署不作为 S8，版本按项目版本策略，记录归 S7/`06-发布与交付/`；无生产部署形态写「不适用 + 依据」，正式基线按验收/迭代收口。生产发布必须是正式版（无 prerelease）；rc/QA 批次不得直接上生产。
      任一硬项不过 → NO-GO；例外写风险/补偿/批准人。上线检查单一版一档，落 `06-发布与交付/`。
      **证据分域**（子代理编排 §2）：L3/多系统 → 按检查域只读扇出（需求测试/安全依赖/配置迁移/回滚监控），各返回 pass/fail＋证据链接 ≤30 行；GO/NO-GO 由本步集中判定；小发布直做。
      输出 `release_ready=GO/NO-GO` 供后续步骤判断；审批记录由 approval 步回填，不在 readiness 阶段伪填“已审批”。

  - name: 业务验收
    id: acceptance
    when: has_uat
    agent: delivery-lead
    hitl: confirm_acceptance
    output: UAT/验收记录（开发/05-测试与验收/）
    notes: >
      条件步：有业务验收/产品签收要求才走。
      技能：`技能/acceptance-and-launch/SKILL.md`；模板 `规则/模板/40-交付与发布/UAT验收模板.md`。
      可选输入：项目已有 UAT/验收资料（任意路径/来源，含产品包/测试报告/用户提供）→ 直接引用/对照，不重复验收；没有 → 本步产 UAT（不要求安装其它包）。
      对照需求基线/PRD AC + 测试报告 + 提测单；结论=通过/有条件/不通过；失败/遗留不瞒报。
      confirm_acceptance：出示 AC 覆盖/失败项/遗留风险/发布建议，确认后进入审批；未签收不得审批（用户豁免须记录）。

  - name: 工程部署审批
    id: approval
    when: release_ready_and_acceptance_passed
    agent: delivery-lead
    hitl: confirm_deploy
    output: 工程部署审批记录
    notes: >
      工程 go/no-go：基于上线检查单 + UAT/验收 + 测试报告 + 风险/回滚；出示版本/窗口/影响面/回滚决策人；并核**干净工作区 + 已提交或已打 tag + completion=COMPLETE**。
      **目标必须是生产/正式环境**；test/staging 部署不触发本门，版本按项目策略。生产版本必须是正式版（无 prerelease）；rc/QA 批次直接上生产 → NO-GO。
      若项目已有业务发布决策（其它流程/产品包/用户确认）且 UAT 已过 → 本步只确认工程就绪，不重复业务决策；没有 → 本门覆盖业务+工程范围。
      未批准不得部署；禁止从脏工作区/未提交代码部署；有条件批准须列明条件与监控措施；发布内容/窗口/回滚变更 → 重新确认。输出 `release_approved=true/false` 供 deploy 判断。

  - name: 部署
    id: deploy
    when: release_approved
    agent: delivery-lead
    on_fail: 停止发布，按回滚预案处理；不得隐瞒失败或继续观察
    tools:
      - git
      - ci
      - release-automation
    output: 部署记录
    notes: >
      技能：`技能/acceptance-and-launch/SKILL.md`（先读再执行）。
      按项目档案 §8 发布方式/命令执行；部署前记录版本/构建/配置/数据快照/健康基线。
      **仅生产/正式环境**；test/staging 部署不走本步，记录归 S7/`06-发布与交付/`。
      按发布说明步骤逐步执行，每步可核对；失败即停，按回滚预案处置，不继续后续步骤。
      部署成功后先跑主链路冒烟，再跑关键回归；不要先跑全量。
      发布说明/发布记录纳入拟提交（如尚未提交）；密钥零入库。

  - name: 发布验证
    id: verify
    when: has_deployed
    agent: delivery-lead
    on_fail: 触发回滚/事故流程；未验证不得称发布成功
    tools:
      - browser-mcp
    output: 发布验证结果/发布记录
    notes: >
      技能：`技能/acceptance-and-launch/SKILL.md`（先读再验证）。
      按发布说明「线上验证要点」逐条核；对照发布前基线看错误率/延迟/吞吐/业务指标。
      指标/日志先脚本或现成面板取摘要；仅跨系统语义归因才派子代理，返回 ≤30 行。
      异常分级：可观察/需修复/需回滚；回滚触发条件成立 → 立即转 rollback，不恋战。
      记录实际步骤/结果/证据；更新发布记录草稿。

  - name: 回滚
    id: rollback
    when: release_failed_or_direct_rollback
    agent: delivery-lead
    on_fail: 升级事故处理；不重复无效操作，不掩盖数据/业务影响
    hitl: confirm_rollback
    tools:
      - git
      - ci
    output: 回滚记录
    notes: >
      条件步：部署失败或发布验证失败/触发回滚条件才走；技能：`技能/acceptance-and-launch/SKILL.md`。
      confirm_rollback 出示触发信号/回滚步骤/数据影响/预计时长。
      按发布说明回滚步骤执行；回滚后复跑冒烟与关键回归；记录时间线/影响/证据。
      回滚不是失败掩盖：进入 postrelease/retro，更新发布说明结论。

  - name: 发布后观察
    id: postrelease
    when: has_deployed
    agent: delivery-lead
    output: 发布后验证/观察记录
    notes: >
      条件步：部署成功才走；技能：`技能/acceptance-and-launch/SKILL.md`。
      按观察期看日志/指标/告警/关键业务；异常按分级处置。
      观察期结束出结论：成功/带风险成功/回滚；遗留项进 `08-复盘与改进/`。
      更新发布记录、发布说明、文档索引、activeContext。

  - name: 发布记录
    id: record
    when: has_deployed
    agent: delivery-lead
    output: 发布汇报/发布记录（开发/06-发布与交付/）
    notes: >
      技能：`技能/acceptance-and-launch/SKILL.md`（收尾/记录）。
      汇总：版本/构建、发布内容、实际步骤、验证结果、观察结论、遗留项、回滚（如有）；readiness=NO-GO 时记录 NO-GO 原因与下一步，不得写“已发布”。
      更新 `06-发布与交付/发布说明-{版本}.md`、`发布记录-{版本}.md`、根 `CHANGELOG.md`、`开发/文档索引.md`、`activeContext.md`。
      根 CHANGELOG：产品发版史（版本/日期 + 用户可见能力/破坏性/迁移·兼容/安全；产品语言；禁验证命令/接入/文档治理/过程项——验证写发布记录）。**多包输入**：优先产品对外变化摘要（工作日志「发布决策」/产品发布说明/范围差量）；无则本包发布说明+缺口一句。**软序**：有产品包宜已有发布决策或等价确认；有测试且本版要求准出宜无挡发版 P0；缺他包不阻塞。细则 `规则/文档治理.md` 版本记录。
      **同时**追加 `开发/工作日志.md` 事件=`发版`（索引+条目；链到发布说明与根 CHANGELOG 版本节）；无则按模板建。
      **三分清**：根 CHANGELOG＝发版史；工作日志＝里程碑；计划执行日志＝过程——功能清单勿只写工作日志却漏根/发布说明。
      发布完成后**建议**是否发 `REL` 结果包；确认后才 `handoff.send`。未回执不得写“已接收”。
      更新开发计划：S8 发布=完成/回滚，发布记录/证据/下一步链接。
      输出发布汇报；未验证/未观察项明示。

  - name: 发布复盘
    id: retro
    when: incident_or_major_release
    agent: delivery-lead
    output: 复盘（开发/08-复盘与改进/）
    notes: >
      条件步：事故/回滚/重大发布才走；技能 `技能/retrospective-and-improvement/SKILL.md`，模板 `规则/模板/60-复盘与改进/复盘模板.md`。
      更新开发计划：S9 收尾/复盘=完成，复盘/总结链接；项目关闭或继续下一迭代。
      行动项必须有负责人/截止/验收；进任务清单或 `08-复盘与改进/改进项.md`。

  - name: 收尾
    id: wrap
    agent: delivery-lead
    output: 【任务收尾】（发布/验证/回滚/复盘明细置第 1 点）
    notes: >
      对照 `规则/模板/90-交接与收尾/收尾骨架.md` §2
      更新发布记录/发布说明/文档索引 §1/activeContext/开发计划 §0；现状三处同拍（执行契约 §4 规则 7）；`sync=` 含 `triad=aligned|deferred:<原因>`；语义已变禁只改 activeContext。未验证/未观察/遗留项明示。
      发布产生的记录（CHANGELOG/发布说明/发布记录/工作日志）必须纳入拟提交；不得留在脏工作区。

  - name: 拟提交
    id: commit
    agent: delivery-lead
    hitl: confirm_commit
    hitl_when: has_pending_commit
    tools:
      - git
    output: 拟提交确认结果
    notes: 发布记录/发布说明/复盘/计划回写同批提交；拟提交清单按 `规则/工作流.md` §3；默认仅本地提交，推送/打 tag 单独确认。
