# 发布/上线/部署均从 readiness 起全链（就绪→验收→审批→部署→验证/回滚）；回滚为独立入口。
workflow:
  id: release
  name: 发布与上线
  version: 3
  read_index: 规则/读取索引.md

entry_points:
  发布: readiness
  上线: readiness
  发版: readiness
  部署: readiness
  回滚: rollback

trigger:
  - 发布 / 上线 / 发版
  - 部署
  - 回滚
  - 发布后验证

steps:
  - name: 发布就绪检查
    id: readiness
    agent: delivery-lead
    gate: release-readiness
    output: 上线检查单（{文档事实源目录}/05-发布与交付/）
    notes: >
      技能：`技能/qa-handoff-and-release/SKILL.md`、`技能/acceptance-and-launch/SKILL.md`（先读再核）。
      读 `{文档事实源目录}/开发计划.md`（旧项目可 `00-项目治理/开发计划.md`；L2+；无则提示缺口，不阻塞单包发布）。
      按 `规则/模板/上线检查单模板.md` 逐项核：需求/AC、提测单/构建交接（无 QA 项目用自测报告/构建记录替代）、评审、
      测试报告/准出、UAT（如适用）、安全/依赖/密钥、配置/迁移、回滚预案、监控/告警/值班、通知、变更审批。
      任一硬项不过 → NO-GO；例外写风险/补偿/批准人。上线检查单一版一档，落 `05-发布与交付/`。
      **证据分域**（子代理编排 §2）：L3/多系统 → 按检查域只读扇出（需求测试/安全依赖/配置迁移/回滚监控），各返回 pass/fail＋证据链接 ≤30 行；GO/NO-GO 由本步集中判定；小发布直做。
      输出 `release_ready=GO/NO-GO` 供后续步骤判断；审批记录由 approval 步回填，不在 readiness 阶段伪填“已审批”。

  - name: 业务验收
    id: acceptance
    when: has_uat
    agent: delivery-lead
    hitl: confirm_acceptance
    output: UAT/验收记录（{文档事实源目录}/04-测试与验收/）
    notes: >
      条件步：有业务验收/产品签收要求才走。
      技能：`技能/acceptance-and-launch/SKILL.md`；模板 `规则/模板/UAT验收模板.md`。
      可选输入：项目已有 UAT/验收资料（任意路径/来源，含产品包/测试报告/用户提供）→ 直接引用/对照，不重复验收；没有 → 本步产 UAT（不要求安装其它包）。
      对照需求基线/PRD AC + 测试报告 + 提测单；结论=通过/有条件/不通过；失败/遗留不瞒报。
      confirm_acceptance：出示 AC 覆盖/失败项/遗留风险/发布建议，确认后进入审批；未签收不得审批（用户豁免须记录）。

  - name: 工程部署审批
    id: approval
    when: release_ready_and_acceptance_passed
    agent: delivery-lead
    hitl: confirm_deploy
    output: 工程部署审批记录
    notes: >
      工程 go/no-go：基于上线检查单 + UAT/验收 + 测试报告 + 风险/回滚；出示版本/窗口/影响面/回滚决策人。
      若项目已有业务发布决策（其它流程/产品包/用户确认）且 UAT 已过 → 本步只确认工程就绪，不重复业务决策；没有 → 本门覆盖业务+工程范围。
      未批准不得部署；有条件批准须列明条件与监控措施；发布内容/窗口/回滚变更 → 重新确认。输出 `release_approved=true/false` 供 deploy 判断。

  - name: 部署
    id: deploy
    when: release_approved
    agent: delivery-lead
    tools:
      - git
      - ci
      - release-automation
    output: 部署记录
    notes: >
      技能：`技能/acceptance-and-launch/SKILL.md`（先读再执行）。
      按项目档案 §8 发布方式/命令执行；部署前记录版本/构建/配置/数据快照/健康基线。
      按发布说明步骤逐步执行，每步可核对；失败即停，按回滚预案处置，不继续后续步骤。
      部署成功后先跑主链路冒烟，再跑关键回归；不要先跑全量。
      发布说明/发布记录纳入拟提交（如尚未提交）；密钥零入库。

  - name: 发布验证
    id: verify
    when: has_deployed
    agent: delivery-lead
    tools:
      - browser-mcp
    output: 发布验证结果/发布记录
    notes: >
      技能：`技能/acceptance-and-launch/SKILL.md`（先读再验证）。
      按发布说明「线上验证要点」逐条核；对照发布前基线看错误率/延迟/吞吐/业务指标。
      指标/日志先脚本或现成面板取摘要；仅跨系统语义归因才派子代理，返回 ≤30 行。
      异常分级：可观察/需修复/需回滚；回滚触发条件成立 → 立即转 rollback，不恋战。
      记录实际步骤/结果/证据；更新发布记录草稿。

  - name: 回滚
    id: rollback
    when: release_failed
    agent: delivery-lead
    hitl: confirm_rollback
    tools:
      - git
      - ci
    output: 回滚记录
    notes: >
      条件步：部署失败或发布验证失败/触发回滚条件才走；技能：`技能/acceptance-and-launch/SKILL.md`。
      confirm_rollback 出示触发信号/回滚步骤/数据影响/预计时长。
      按发布说明回滚步骤执行；回滚后复跑冒烟与关键回归；记录时间线/影响/证据。
      回滚不是失败掩盖：进入 postrelease/retro，更新发布说明结论。

  - name: 发布后观察
    id: postrelease
    when: has_deployed
    agent: delivery-lead
    output: 发布后验证/观察记录
    notes: >
      条件步：部署成功才走；技能：`技能/acceptance-and-launch/SKILL.md`。
      按观察期看日志/指标/告警/关键业务；异常按分级处置。
      观察期结束出结论：成功/带风险成功/回滚；遗留项进 `06-复盘与改进/`。
      更新发布记录、发布说明、文档索引、activeContext。

  - name: 发布记录
    id: record
    agent: delivery-lead
    output: 发布汇报/发布记录（{文档事实源目录}/05-发布与交付/）
    notes: >
      技能：`技能/acceptance-and-launch/SKILL.md`（收尾/记录）。
      汇总：版本/构建、发布内容、实际步骤、验证结果、观察结论、遗留项、回滚（如有）；readiness=NO-GO 时记录 NO-GO 原因与下一步，不得写“已发布”。
      更新 `05-发布与交付/发布说明-{版本}.md`、`发布记录-{版本}.md`、根 `CHANGELOG.md`（版本/日期/变更/迁移/验证）、`{文档事实源目录}/文档索引.md`、`activeContext.md`。
      更新开发计划：S8 发布=完成/回滚，发布记录/证据/下一步链接。
      输出发布汇报；未验证/未观察项明示。

  - name: 发布复盘
    id: retro
    when: incident_or_major_release
    agent: delivery-lead
    output: 复盘（{文档事实源目录}/06-复盘与改进/）
    notes: >
      条件步：事故/回滚/重大发布才走；技能 `技能/retrospective-and-improvement/SKILL.md`，模板 `规则/模板/复盘模板.md`。
      更新开发计划：S9 收尾/复盘=完成，复盘/总结链接；项目关闭或继续下一迭代。
      行动项必须有负责人/截止/验收；进任务清单或 `06-复盘与改进/改进项.md`。

  - name: 收尾
    id: wrap
    agent: delivery-lead
    output: 【任务收尾】（发布/验证/回滚/复盘明细置第 1 点）
    notes: >
      按 AGENTS §2 输出【任务收尾】：第 1 点含汇报（可整段复制），第 2～6 点齐；
      更新发布记录/发布说明/文档索引/activeContext/开发计划；未验证/未观察/遗留项明示。
