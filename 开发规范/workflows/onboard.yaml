workflow:
  id: onboard
  name: 开发规范接入
  version: 8
  read_index: 规则/读取索引.md
  chain: full   # 接入必须走完 profile/docs/gitignore/verify，不能停在 mount

entry_points:
  接入开发规范: mount
  重新接入: migrate
  生成项目档案: profile
  装配能力: capabilities
  文档树: docs
  资料收取: materials
  资料整理: materials
  资料归档: materials
  资料巡检: materials
  文档整理: lifecycle
  文档巡检: lifecycle
  文档清理: lifecycle
  清理临时文件: lifecycle
  清理过程文件: lifecycle
  清理无效文件: lifecycle
  清理失效文件: lifecycle
  清理垃圾文件: lifecycle
  清理临时: lifecycle
  归档失效文档: lifecycle

trigger:
  - 接入开发规范
  - 重新接入
  - 生成项目档案
  - 装配能力
  - 文档树
  - 资料收取 / 资料整理 / 资料归档 / 资料巡检
  - 文档整理 / 文档巡检 / 文档清理 / 清理临时文件 / 清理过程文件 / 清理无效文件 / 清理失效文件 / 清理垃圾文件 / 清理临时 / 归档失效文档

steps:
  - name: 复制与挂载确认
    id: mount
    agent: onboard-agent
    output: 项目根 AGENTS.md 薄指针（已存在则追加，不覆盖）
    notes: >
      验收：项目根 AGENTS.md 已补入指向本包 AGENTS.md 的引导语句
      （样例见 规则/模板/00-接入与治理/根AGENTS薄指针.md；已有则追加、没有则新建）；
      未补入则按样例写入后再继续。**单包**时写明本会话只启用开发规范；多包时不写这一句。
      多包模式（项目根自动探测到两个及以上包目录）：不写「本会话只启用开发规范」；根 `AGENTS.md` 只做路由，按实际包目录补齐已启用包列表（本包及同项目其它包各一行）；三包自动探测共享资料/上下文。

  - name: 档案与规范
    id: profile
    agent: onboard-agent
    output: 项目档案.md（含 §7 项目规范要点 / §8 交付治理 / §9 文档归档）· activeContext.md
    notes: >
      按 规则/模板/00-接入与治理/项目档案模板.md 建档；§2 代码地图/门禁、§8 环境/发布/验收/安全、§9 文档根/分类/归档必须填实或写「无」。
      按 `规则/模板/00-接入与治理/版本策略模板.md` 产 `开发/06-发布与交付/版本策略.md`（版本格式/升级/环境/tag/审批；不确定写「待确认」）。
      §9 增记 `资料模式`（keep/mix/replace，默认 mix）/ `既有资料目录` / `资料根`；多包时资料根=`项目资料/`，索引=`项目资料/资料索引.md`。
      推断并填写 §1 `协作模式`/`流程偏好`：单包+无计划/测试/产品/交接 → 单人/轻量优先；多包或已有计划/QA/交接 → 团队/完整优先；用户可改，不额外提问。
      `activeContext.md`：无则按 `规则/模板/00-接入与治理/activeContext模板.md` 建（只含 `## 开发` + 跨包同步 + 运行时本包行）；已有则只补/更新本包分节与本包接入行，禁止整文件覆盖他包内容。
      检测到既有资料目录（`docs/`、`项目资料/` 等）→ 默认 `mix`，登记路径；用户点名 keep/replace 再改，不阻塞。
      项目规范少 → 内联档案 §7（勿为几行另建目录）；无对应栈写「不适用」。
      旧结构迁移（一次性）：检测到 `项目规范/` 目录 → 一问：并入 §7 并删除目录（默认建议）。
      产出后进入 docs 步建立文档树/索引。

  - name: 旧项目迁移
    id: migrate
    agent: onboard-agent
    hitl: confirm_docs_migration
    hitl_when: docs_migration_needed
    output: 迁移清单/更新后的路径
    notes: >
      「重新接入」先扫描旧结构，按 `规则/文档治理.md` §4 做覆盖对照，列迁移/改名/归档候选，经 `confirm_docs_migration` 确认后执行，不静默丢文件；docs 步不再重复确认。
      多包模式且 `doc_mode=keep/mix`：既有目录（如 `docs/`）不迁，只登记引用；只迁移本包旧结构与包内资料。`replace` 才按映射迁移。
      映射：旧 `docs/` → `开发/`（整树迁，不单移计划）；`docs/06-原始素材/`、`资料/项目文档/{ver}/`、`资料/原始素材/`、旧扁平前缀 → `开发/资料/{版本或主题}/` 或 `_通用/`（保持原名；类型写索引；禁项目文档层、禁强制类型前缀扁平）；旧 `开发/_归档/**/资料/` → `开发/资料/_归档/`；
      `docs/07-复盘与改进/` → `开发/08-复盘与改进/`；`docs/历史/` → `开发/_归档/`；
      `docs/00-项目治理/开发计划.md` → `开发/开发计划.md`。
      更新 `项目档案.md` §9、`文档索引.md`、资料索引、开发计划链接、activeContext；冲突/无法判断先问一次，不覆盖。
      迁移后核对链接，再进入 docs/control 步。

  - name: 文档树与归档
    id: docs
    agent: onboard-agent
    hitl: confirm_docs_migration
    hitl_when: docs_migration_needed
    output: 开发/（或档案所记文档根）+ 开发/文档索引.md + 根 CHANGELOG.md + 开发/工作日志.md + 需求台账/变更/待决/决策 + 资料索引
    notes: >
      按 规则/工作流.md §5 建标准树：开发计划.md / 文档索引.md / 资料/（`_通用/`+`{版本或主题}/`+`交接/`+`_归档/`+资料索引；禁 `项目文档/`）+
      00-项目治理 / 01-需求基线 / 02-方案设计 / 03-技术设计 / 04-计划与任务 / 05-测试与验收 / 06-发布与交付 / 07-运维与协作 / 08-复盘与改进 / 交接/（台账 + 包）/ _归档；无内容不建空目录。
      可先运行 `规则/tools/Initialize-Docs.ps1 -ProjectRoot <项目根> -DocsRoot 开发` 建目录/索引骨架（只建不删；`-DocsRoot` 仅兼容旧仓如 docs/，非第三套概念）。
      生成/更新 `开发/文档索引.md`（模板 规则/模板/00-接入与治理/文档索引模板.md）与 `资料/资料索引.md`（模板 规则/模板/00-接入与治理/资料索引模板.md）；分类映射写入 `项目档案.md` §9。
      根 `CHANGELOG.md`：有开发规范时为本项目**发布真值**（开发维护，给人看的项目发版史）；无则按 `规则/模板/00-接入与治理/CHANGELOG模板.md` 建（版本总览/首条=接入日/当前版本）；已有只补不覆盖。
      **仅开发写根**：产品/测试**不得**创建、修改或补链根 `CHANGELOG.md`；产品/测试岗位侧记用各自 `产品/工作日志.md`、`测试/工作日志.md`，**不再**维护包内 CHANGELOG。
      `开发/工作日志.md`：无则按 `规则/模板/00-接入与治理/工作日志模板.md` 创建（岗位里程碑侧记）；已有则跳过不覆盖。
      **三分清**：根 `CHANGELOG.md`＝用户可见发版史；`开发/工作日志.md`＝开发里程碑侧记；开发计划执行日志＝细粒度过程——三者勿混写。
      L2+ 建治理记录：`00-项目治理/变更记录.md`、`00-项目治理/待决项.md`、`00-项目治理/决策记录.md`；`01-需求基线/需求台账.md`。
      新文件优先放 `资料/{版本或主题}/` 或 `_通用/`；无法判断时可临时落 `资料/` 根并标「待分类」，由 `workflows/intake.yaml` 或 `materials` 步收取/分类后同批归位；不直接覆盖正式文档。
      多包模式：不重复建包内共享资料区；`项目资料/` 是共享根，不迁入 `开发/`；本包 `资料/` 只放本包专属/历史资料，共享资料在 `项目资料/` 保留一份主副本。
      一次性整理：根目录/文档根平铺 → 按分类归位；旧版/迭代快照移 `_归档/{yyyyMMdd}-{版本}/`（旧项目可用 `历史/`）；
      无法判断归属 → 先问用户，不擅自删；既有分类 → 按映射落位。新项目按 `资料/{版本或主题}/`；旧 `项目文档/`/扁平残留可登记，说「重新接入」再迁。
      confirm_docs_migration 仅在需要搬迁/删除/改结构时触发：出示拟搬迁清单与目标，确认后执行；migrate 步已确认过的同一迁移不重复问。
      根目录白名单：代码/构建文件、README、`CHANGELOG.md`、项目档案、activeContext、工作流包、文档根、测试根。

  - name: 资料收取与归档
    id: materials
    agent: onboard-agent
    hitl:
      - name: confirm_iteration_close
        when: iteration_close_needed
      - name: confirm_docs_migration
        when: docs_migration_needed
    output: 【资料收取与归档候选】（确认后执行落位/归档）
    notes: >
      扫描本包资料根 + 既有资料目录（档案 §9；keep/mix）+ 项目根（replace/用户投放）的未登记/变化文件；按 `规则/文档治理.md` §3～§5 分类 → 与同类型+同主题旧文件做覆盖对照
      （全量替代/全量覆盖/部分覆盖/增量补充/仅新增/重复/冲突）→ 输出【资料收取与归档候选】；**此时不改索引、不改名、不移动、不标记失效**。
      有未登记/变化文件、拟改名/搬迁/归档候选 → `docs_migration_needed=true`，停在本门等确认；无候选才继续。
      按 `规则/文档治理.md` §3～§4【入站分析】；确认前不改文件。确认采纳后同批：落位 `资料/{版本或主题}/` → 同步工作区 → S1/S2/S3 失效 → 移 `开发/资料/_归档/{yyyyMMdd}-{版本或批次}/` + 归档清单 → 更新索引/开发计划/activeContext。
      部分覆盖/增量补充/参考/待确认 → 保留原文件，不归档；冲突/无法判断 → 停下问一次。
      无候选 → 报「无未登记/失效候选」，不改文件。
      **换迭代/关版本（强制）**：确认采纳新迭代/换主题后按 `规则/文档治理.md` §7；不确定则 `confirm_iteration_close`；确认后 §7.1 完整关账（跳过仅发版项）。不依赖发版。

  - name: 文档治理检查
    id: lifecycle
    agent: onboard-agent
    hitl: confirm_docs_migration
    hitl_when: docs_migration_needed
    output: 【文档治理检查】（确认后执行更新/归档/清理）
    notes: >
      按 `规则/文档治理.md` §2～§5、§8 扫描工作文档与过程文件（本步=点名清理/巡检入口）：
      ① 分类：长期/固定、版本/迭代绑定、失效/替代、过程/临时；
      ② 判定：长期基线/项目档案就地更新；版本绑定方案/任务清单/UAT/提测单关闭时归档；部分覆盖保留；失效确认后归档；**已完结**临时/失败/重复列清理候选；用户可见版本关闭时根 `CHANGELOG.md` 同步发版史；里程碑关闭另在 `开发/工作日志.md` 记一条；
      ③ 输出【文档治理检查】：保留/更新/归档/清理/待确认；**确认前不改/不移/不删**。
      有候选 → `docs_migration_needed=true`，停在本门等确认；无候选 → 报「无生命周期候选」，不改文件。
      清理只删已知临时/缓存/未引用失败产物；进行中 draft、证据、当前计划/方案/任务清单、源文件、用户文件、密钥、根 `CHANGELOG.md`、`开发/工作日志.md` 永不自动删除；不确定移 `开发/_归档/_待清理/{yyyyMMdd}/` 并写清理清单。

  - name: 开发计划
    id: control
    agent: onboard-agent
    output: 开发计划（开发/开发计划.md；新项目建议 开发/开发计划.md）
    notes: >
      L2+ 新项目/新产品默认建：技能 `技能/development-plan/SKILL.md`；模板 `规则/模板/10-规划与需求/开发计划模板.md`。
      填一页状态/输入/阶段表（S0 进行中，其余未开始）/关联链接；已有则不覆盖，读现状后转 control sync。
      存量项目（已有版本/迭代/代码）→ 按现状回填当前阶段 Sx 与门，不默认从 S0 重跑；缺口写 §2。
      L0/L1 可写「不适用」或轻量开发卡；不强制引用其它包。
      输入缺口写 §2，由用户提供/选择已有资料，不阻塞打标。

  - name: 入库策略
    id: gitignore
    agent: onboard-agent
    hitl: confirm_gitignore
    output: .gitignore 更新 + `git check-ignore` 证据
    notes: >
      四选一确认资产入库范围（实例/模板/实例+模板/全不加入），写档案 §1，改 .gitignore；
      确保临时文件/凭据/本地日志不入库；文档索引与正式文档按选择入库。

  - name: 环境与工具检查
    id: capabilities
    agent: onboard-agent
    output: 项目档案 §6 能力可用性记录（默认静默；点名装配时另出建议）
    notes: >
      默认静默：不输出工具清单、不冒烟（可用性由首次使用时的对应流程自行探测与降级，如缺陷口令的 preflight）。
      仅当用户点名「装配能力」时，按 `能力/00-能力注册表.md` 盘点并给装配建议（安装指引指向 README「宿主适配」节）。
      例外：已配置且明显不可用、会影响预期的事项，一句话说明（如「缺陷平台暂不可用 → 缺陷口令将降级」）。
      记录（如需要）写 项目档案.md §6——自动记录，不是待办；禁强推、禁清单式输出。

  - name: 核验与打标
    id: verify
    agent: onboard-agent
    output: 开发/00-项目治理/接入核验-{yyyyMMdd}.md（①～⑨ 逐项 通过/缺口 + 证据）
    notes: >
      按 onboard-agent 接入清单核验（①～⑨，含文档树/索引/§8/§9/开发计划/写接入标记），逐项给「通过/缺口 + 证据路径」，不得只写“已核验”。
      跑 `规则/tools/Test-Template.ps1`；BLOCKED 不得打标。
      核验通过后写「开发规范接入：已完成」；此后按 AGENTS §0 第 3 点（接入状态）跳过落地检查。
      文档根有平铺/根目录有文档残留 → 不通过，回 docs 步整理；L2+ 缺开发计划 → 回 control 步补。

  - name: 收尾
    id: wrap
    agent: onboard-agent
    output: 【任务收尾】（接入明细置第 1 点，六段压缩）
    notes: >
      按 AGENTS §2 输出六段压缩（每段一行）；仅有例外/待处理项时逐条展开；禁逐项罗列工具。
