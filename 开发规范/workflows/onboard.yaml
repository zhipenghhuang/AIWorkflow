workflow:
  id: onboard
  name: 开发规范接入
  version: 6

entry_points:
  接入开发规范: mount
  重新接入: migrate
  生成项目档案: profile
  装配能力: capabilities
  文档整理: docs

trigger:
  - 接入开发规范
  - 重新接入
  - 生成项目档案
  - 装配能力
  - 文档整理

steps:
  - name: 复制与挂载确认
    id: mount
    agent: onboard-agent
    notes: >
      验收：项目根 AGENTS.md 已补入指向本包 AGENTS.md 的引导语句
      （样例见 规则/模板/根AGENTS薄指针.md；已有则追加、没有则新建）；
      未补入则按样例写入后再继续。写明本会话只启用开发规范。

  - name: 档案与规范
    id: profile
    agent: onboard-agent
    output: 项目档案.md（含 §7 项目规范要点 / §8 交付治理 / §9 文档归档）· activeContext.md
    notes: >
      按 规则/模板/项目档案模板.md 建档；§2 代码地图/门禁、§8 环境/发布/验收/安全、§9 文档根/分类/归档必须填实或写「无」。
      项目规范少 → 内联档案 §7（勿为几行另建目录）；无对应栈写「不适用」。
      旧结构迁移（一次性）：检测到 `项目规范/` 目录 → 一问：并入 §7 并删除目录（默认建议）。
      产出后进入 docs 步建立文档树/索引。

  - name: 旧项目迁移
    id: migrate
    agent: onboard-agent
    hitl: confirm_docs_migration
    hitl_when: docs_migration_needed
    output: 迁移清单/更新后的路径
    notes: >
      「重新接入」先扫描旧结构，列出迁移清单与目标，经 `confirm_docs_migration` 确认后执行，不静默丢文件；docs 步不再重复确认。
      映射：旧 `docs/` → `开发/`（整树迁，不单移计划）；`docs/06-原始素材/` → `开发/资料/原始素材/`；
      `docs/07-复盘与改进/` → `开发/06-复盘与改进/`；`docs/历史/` → `开发/_归档/`；
      `docs/00-项目治理/开发计划.md` → `开发/开发计划.md`。
      更新 `项目档案.md` §9、`文档索引.md`、开发计划链接、activeContext；冲突/无法判断先问一次，不覆盖。
      迁移后核对链接，再进入 docs/control 步。

  - name: 文档树与归档
    id: docs
    agent: onboard-agent
    hitl: confirm_docs_migration
    hitl_when: docs_migration_needed
    output: 文档事实源目录 + {文档事实源目录}/文档索引.md + 需求台账/变更/待决/决策 + _收件箱
    notes: >
      按 规则/工作流.md §5 建标准树：开发计划.md / 文档索引.md / 资料/项目文档 / 资料/原始素材 / 资料/资料索引.md /
      00-项目治理 / 01-需求基线 / 02-设计基线 / 03-计划与状态 / 04-测试与验收 / 05-发布与交付 / 06-复盘与改进 / _归档；无内容不建空目录。
      可先运行 `规则/tools/Initialize-Docs.ps1 -ProjectRoot <项目根> -DocsRoot <文档根>` 建目录/索引骨架（只建不删）。
      生成/更新 `{文档事实源目录}/文档索引.md`（模板 规则/模板/文档索引模板.md）；分类映射写入 `项目档案.md` §9。
      L2+ 建常青记录：`00-项目治理/变更记录.md`、`00-项目治理/待决项.md`、`00-项目治理/决策记录.md`；`01-需求基线/需求台账.md`；`资料/原始素材/_收件箱/`（模板见 `规则/模板/`）。
      新文件先进 `_收件箱/`，由 `workflows/intake.yaml` 吸收；不直接覆盖正式文档。
      一次性整理：根目录/文档根平铺 → 按分类归位；旧版/迭代快照移 `_归档/{yyyyMMdd}-{版本}/`（旧项目可用 `历史/`）；
      无法判断归属 → 先问用户，不擅自删；既有分类 → 按映射落位，不强行搬迁。
      confirm_docs_migration 仅在需要搬迁/删除/改结构时触发：出示拟搬迁清单与目标，确认后执行；migrate 步已确认过的同一迁移不重复问。
      根目录白名单：代码/构建文件、README、项目档案、activeContext、工作流包、文档根、测试根。

  - name: 开发计划
    id: control
    agent: onboard-agent
    output: 开发计划（{文档事实源目录}/开发计划.md；新项目建议 开发/开发计划.md）
    notes: >
      L2+ 新项目/新产品默认建：技能 `技能/development-plan/SKILL.md`；模板 `规则/模板/开发计划模板.md`。
      填一页状态/输入/阶段表（S0 进行中，其余未开始）/关联链接；已有则不覆盖，读现状后转 control sync。
      L0/L1 可写「不适用」或轻量开发卡；不强制引用其它包。
      输入缺口写 §2，由用户提供/选择已有资料，不阻塞打标。

  - name: 入库策略
    id: gitignore
    agent: onboard-agent
    hitl: confirm_gitignore
    notes: >
      四选一确认资产入库范围（实例/模板/实例+模板/全不加入），写档案 §1，改 .gitignore；
      确保临时文件/凭据/本地日志不入库；文档索引与正式文档按选择入库。

  - name: 环境与工具检查
    id: capabilities
    agent: onboard-agent
    notes: >
      默认静默：不输出工具清单、不冒烟（可用性由首次使用时的对应流程自行探测与降级，如缺陷口令的 preflight）。
      仅当用户点名「装配能力」时，按 `能力/00-能力注册表.md` 盘点并给装配建议（安装指引指向 README「宿主适配」节）。
      例外：已配置且明显不可用、会影响预期的事项，一句话说明（如「缺陷平台暂不可用 → 缺陷口令将降级」）。
      记录（如需要）写 项目档案.md §6——自动记录，不是待办；禁强推、禁清单式输出。

  - name: 核验与打标
    id: verify
    agent: onboard-agent
    notes: >
      按 onboard-agent 接入清单核验（①～⑨，含文档树/索引/§8/§9/开发计划/写接入标记）；
      核验通过后写「开发规范接入：已完成」；此后按 AGENTS §0-3 跳过落地检查。
      文档根有平铺/根目录有文档残留 → 不通过，回 docs 步整理；L2+ 缺开发计划 → 回 control 步补。

  - name: 收尾
    id: wrap
    agent: onboard-agent
    output: 【任务收尾】（接入明细置第 1 点，六段压缩）
    notes: >
      按 AGENTS §2 输出六段压缩（每段一行）；仅有例外/待处理项时逐条展开；禁逐项罗列工具。
