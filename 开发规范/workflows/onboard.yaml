workflow:
  id: onboard
  name: 开发规范接入
  version: 8
  read_index: 规则/读取索引.md
  chain: full   # 接入必须走完 profile/docs/gitignore/verify，不能停在 mount

entry_points:
  接入开发规范: mount
  重新接入: migrate
  生成项目档案: profile
  装配能力: capabilities
  文档树: docs
  资料收取: materials
  资料整理: materials
  资料归档: materials
  资料巡检: materials
  文档整理: lifecycle
  文档巡检: lifecycle
  文档清理: lifecycle
  清理临时文件: lifecycle
  清理过程文件: lifecycle
  清理无效文件: lifecycle
  清理失效文件: lifecycle
  清理垃圾文件: lifecycle
  清理临时: lifecycle
  归档失效文档: lifecycle

trigger:
  - 接入开发规范
  - 重新接入
  - 生成项目档案
  - 装配能力
  - 文档树
  - 资料收取 / 资料整理 / 资料归档 / 资料巡检
  - 文档整理 / 文档巡检 / 文档清理 / 清理临时文件 / 清理过程文件 / 清理无效文件 / 清理失效文件 / 清理垃圾文件 / 清理临时 / 归档失效文档

steps:
  - name: 复制与挂载确认
    id: mount
    agent: onboard-agent
    output: 项目根 AGENTS.md 包挂载段（已存在则追加，不覆盖）
    notes: >
      验收：项目根 AGENTS.md 已补入指向本包 AGENTS.md 的引导语句
      （样例见 规则/模板/00-接入与治理/根AGENTS薄指针.md；已有则追加、没有则新建）；
      未补入则按样例写入后再继续。**单包**时写明本会话只启用开发规范；多包时不写这一句。
      多包模式（项目根自动探测到两个及以上包目录）：不写「本会话只启用开发规范」；根 `AGENTS.md` 只做路由，按实际包目录补齐已启用包列表（本包及同项目其它包各一行）；三包自动探测共享资料/上下文。
      **分层**：母版只写入挂载段；不对根写入偏好/喜好正文（落地项目自写）。档案 §7 为项目技术事实摘要，不是偏好容器。

  - name: 档案与规范
    id: profile
    agent: onboard-agent
    output: 项目档案.md（含 §7 技术要点事实摘要 / §8 交付治理 / §9 文档归档）· activeContext.md
    notes: >
      **按实填档（硬）**：建档前有界探查仓库实情（依赖/目录/入口/构建与测试命令）；有根 `README.md` 则按**其实际结构**择要取用（不规定章节，见 `规则/核心/项目README.md`）。按 规则/模板/00-接入与治理/项目档案模板.md 建档；§1 一句话定位、§2 代码地图/门禁、§8/§9 据实填或「无」/「待确认」；**禁止**占位符未换就打「开发规范接入：已完成」。
      **根 README**：按用户偏好选档后写（见 `规则/核心/项目README.md`）；模板仅素材；已有不覆盖；点名生成/更新/整理时对照市面高标准给可选补强。
      按 `规则/模板/00-接入与治理/版本策略模板.md` 产 `开发/06-发布与交付/版本策略.md`（版本格式/升级/环境/tag/审批；不确定写「待确认」）。
      §9 增记 `资料模式`（keep/mix/replace，默认 mix）/ `原始资料根`（默认 `docs/`，其它名可）/ 索引=`{原始资料根}/资料索引.md`；本包副本根=`开发/资料/`。
      推断并填写 §1 `协作模式`/`流程偏好`：单包+无计划/测试/产品/交接 → 单人/轻量优先；多包或已有计划/QA/交接 → 团队/完整优先；用户可改，不额外提问。轻量优先=入口偏好，不降 AC/完成门/开发自验（`轻量交付.md` §0）。
      `activeContext.md`：无则按 `规则/模板/00-接入与治理/activeContext模板.md` 建（**总览一句话** + `## 开发` + 跨包同步 + 运行时本包行）；已有则只补/更新总览（若空）、本包分节与本包接入行，禁止整文件覆盖他包内容。总览口径对齐项目档案「一句话定位」。
      认根：用户指定优先；否则按 `规则/文档治理.md` §2.1 判定表；不确定问用户。登记后默认 `mix`；可改 keep/replace。无则建 `docs/`。
      技术要点少 → 内联档案 §7 事实摘要（勿为几行另建目录）；无对应栈写「不适用」。
      旧结构迁移（一次性）：检测到 `项目规范/` 目录 → 一问：并入 §7 事实摘要并删除目录（默认建议）。
      产出后进入 docs 步建立文档树/索引。

  - name: 旧项目迁移
    id: migrate
    agent: onboard-agent
    hitl: confirm_docs_migration
    hitl_when: docs_migration_needed
    output: 迁移清单/更新后的路径
    notes: >
      「重新接入」先扫描旧结构，按 `规则/文档治理.md` §4 做覆盖对照，列迁移/改名/归档候选，经 `confirm_docs_migration` 确认后执行，不静默丢文件；docs 步不再重复确认。
      **工作文档根硬固定 `开发/`**；**原始资料根**（推荐 `docs/`，其它名可）只登记/整理，主副本不迁入 `开发/`。
      `keep`/`mix`/`replace` 只管原树结构（仍无 `_归档/`）；均允许索引/复制/吸收。原夹文件禁止迁入 `开发/`。包内工作树与按需 `资料/` 副本另建。
      包内映射：`资料/项目文档/{ver}/`、`资料/原始素材/`、旧扁平前缀 → `开发/资料/{版本或主题}/` 或 `_通用/`（保持原名；类型写索引）；旧 `开发/_归档/**/资料/` → `开发/资料/_归档/`。
      更新 `项目档案.md` §9、`文档索引.md`、资料索引、开发计划链接、activeContext；冲突/无法判断先问一次，不覆盖。
      迁移后核对链接，再进入 docs/control 步。

  - name: 文档树与归档
    id: docs
    agent: onboard-agent
    hitl: confirm_docs_migration
    hitl_when: docs_migration_needed
    output: 开发/（或档案所记文档根）+ 开发/文档索引.md + 根 CHANGELOG.md + 开发/工作日志.md + 需求台账/变更/待决/决策 + 资料索引
    notes: >
      按 规则/工作流.md §5 建标准树：开发计划.md / 文档索引.md / 资料/（`_通用/`+`{版本或主题}/`+`_归档/`+资料索引；禁 `项目文档/`；禁 `资料/交接` 作主入口）+
      00-项目治理 / 01-需求基线 / 02-方案设计 / 03-技术设计 / 04-计划与任务 / 05-测试与验收 / 06-发布与交付 / 07-运维与协作 / 08-复盘与改进 / 交接/（台账；按需出站|入站/{类别}/）/ _归档；无内容不建空目录。
      可先运行 `规则/tools/Initialize-Docs.ps1 -ProjectRoot <项目根> -DocsRoot 开发` 建工作文档树/索引骨架（只建不删；`-DocsRoot` 固定工作根名，默认 `开发`）。
      确保原始资料根存在（默认建 `docs/` + `资料索引.md`；无 `_归档/`；子目录不强制）；生成/更新 `开发/文档索引.md` 与 `开发/资料/资料索引.md`、`{原始资料根}/资料索引.md`；写入 `项目档案.md` §9。
      根 `CHANGELOG.md`：有开发规范时为本项目**产品发版史**（开发维护；用户可见能力/破坏性/迁移/安全）；无则按 `规则/模板/00-接入与治理/CHANGELOG模板.md` 建**空骨架**（版本总览可填当前版本 + 空 `[Unreleased]`）；**禁止**写「规范接入/文档树/接入日」条目进根 CHANGELOG；已有只补不覆盖。
      **仅开发写根**：产品/测试**不得**创建、修改或补链根 `CHANGELOG.md`；产品/测试岗位侧记用各自 `产品/工作日志.md`、`测试/工作日志.md`，**不再**维护包内 CHANGELOG。
      `开发/工作日志.md`：无则按 `规则/模板/00-接入与治理/工作日志模板.md` 创建；已有则跳过不覆盖。接入完成可追加一条事件=`接入/治理`（**只写工作日志**）。
      **三分清**：根 `CHANGELOG.md`＝产品发版史；`开发/工作日志.md`＝开发里程碑（含接入/治理）；开发计划执行日志＝细粒度过程——三者勿混写。
      L2+ 建治理记录：`00-项目治理/变更记录.md`、`00-项目治理/待决项.md`、`00-项目治理/决策记录.md`；`01-需求基线/需求台账.md`。
      中途/存量：原始资料根**索引全登记**；复制/吸收按任务需要，可仅索引。新输入主副本必留根内。
      根散落文档 → 先收入原始资料根（不迁入当工作区正文）。工作区平铺 → 归位 `开发/`。confirm_docs_migration 仅改结构时触发。
      根白名单：代码/构建、README、`CHANGELOG.md`、项目档案、activeContext、工作流包、`开发/`/`测试/`/`产品/`、原始资料根。

  - name: 资料收取与归档
    id: materials
    agent: onboard-agent
    hitl:
      - name: confirm_iteration_close
        when: iteration_close_needed
      - name: confirm_docs_migration
        when: docs_migration_needed
    output: 【资料收取与归档候选】（确认后执行落位/归档）
    notes: >
      扫描本包资料根 + 原始资料根（档案 §9；keep/mix）+ 项目根（replace/用户投放）的未登记/变化文件；按 `规则/文档治理.md` §3～§5 分类 → 与同类型+同主题旧文件做覆盖对照
      （全量替代/全量覆盖/部分覆盖/增量补充/仅新增/重复/冲突）→ 输出【资料收取与归档候选】；**此时不改索引、不改名、不移动、不标记失效**。
      有未登记/变化文件、拟改名/搬迁/归档候选 → `docs_migration_needed=true`，停在本门等确认；无候选才继续。
      按 `规则/文档治理.md` §2～§4；确认前不改文件。确认后：索引必做 → 按需复制 → 按需 R0～R2 吸收；S1/S2/S3 只动包内副本/工作区旧稿。存量未点名的保持仅索引。
      部分覆盖/增量补充/参考/待确认 → 保留原文件，不归档；冲突/无法判断 → 停下问一次。归档前做引用检查：被当前计划/技术设计/测试/验收引用的文档保留原位或标“基线”，不标失效。
      无候选 → 报「无未登记/失效候选」，不改文件。
      **换迭代/关版本（强制）**：确认采纳新迭代/换主题后按 `规则/文档治理.md` §7；不确定则 `confirm_iteration_close`；确认后先按 §3 判 T1/T2/T4，再按 §7.1 关账（跳过仅发版项）；T2/T4 保留仍被引用的基础设计/流程图/原型，只归档被替代增量与工作文档。不依赖发版。

  - name: 文档治理检查
    id: lifecycle
    agent: onboard-agent
    hitl: confirm_docs_migration
    hitl_when: docs_migration_needed
    output: 【文档治理检查】（确认后执行更新/归档/清理）
    notes: >
      按 `规则/文档治理.md` §2～§5、§8 扫描工作文档与过程文件（本步=点名清理/巡检入口）：
      ① 分类：长期/固定、版本/迭代绑定、失效/替代、过程/临时；
      ② 判定：长期基线/项目档案就地更新；版本绑定方案/任务清单/UAT/提测单关闭时归档；部分覆盖保留；失效确认后归档；**已完结**临时/失败/重复列清理候选；用户可见版本关闭时根 `CHANGELOG.md` 同步发版史；里程碑关闭另在 `开发/工作日志.md` 记一条；
      ②.1 归档前做引用检查：被当前计划/技术设计/测试/验收引用的方案、基础设计、流程图保留原位或标“基线”，不标失效。
      ③ 输出【文档治理检查】：保留/更新/归档/清理/待确认；**确认前不改/不移/不删**。
      有候选 → `docs_migration_needed=true`，停在本门等确认；无候选 → 报「无生命周期候选」，不改文件。
      清理只删已知临时/缓存/未引用失败产物与过期运行态（`.gate/frontend` 旧截图、`.gate/开发规范/` 非 JSON 媒体、`.gate/logs`）；进行中 draft、现行证据、当前计划/方案/任务清单、源文件、用户文件、密钥、根 `CHANGELOG.md`、`开发/工作日志.md` 永不自动删除；不确定移 `开发/_归档/_待清理/{yyyyMMdd}/` 并写清理清单。

  - name: 开发计划
    id: control
    agent: onboard-agent
    output: 开发计划（开发/开发计划.md）
    notes: >
      L2+ 新项目/新产品默认建：技能 `技能/development-plan/SKILL.md`；模板 `规则/模板/10-规划与需求/开发计划模板.md`。
      填一页状态/输入/阶段表（S0 进行中，其余未开始）/关联链接；已有则不覆盖，读现状后转 control sync。
      存量项目（已有版本/迭代/代码）→ 按现状回填当前阶段 Sx 与门，不默认从 S0 重跑；缺口写 §2。
      L0/L1 可写「不适用」或轻量开发卡；不强制引用其它包。
      输入缺口写 §2，由用户提供/选择已有资料，不阻塞打标。

  - name: 入库策略
    id: gitignore
    agent: onboard-agent
    hitl: confirm_gitignore
    output: .gitignore 更新 + `git check-ignore` 证据
    notes: >
      四选一确认资产入库范围（实例/模板/实例+模板/全不加入），写档案 §1，改 .gitignore；
      确保临时文件/凭据/本地日志不入库；文档索引与正式文档按选择入库。

  - name: 环境与工具检查
    id: capabilities
    agent: onboard-agent
    output: 开发/能力/00-能力清单.md（默认静默；点名装配时另出建议）
    notes: >
      若无 `开发/能力/`：自 `规则/模板/00-接入与治理/能力/` 复制骨架（不覆盖已有清单正文）。
      默认静默：不输出全量工具清单、不冒烟；首次使用按契约降级（如缺陷 preflight）。
      仅当用户点名「装配能力」时：对照契约+参考目录+现清单，确认后写入 `开发/能力/`；刷档案 §6 索引；安装指引见 README「宿主适配」。
      例外：已配置且明显不可用、会影响预期的事项，一句话说明。禁强推、禁写回包内契约。

  - name: 核验与打标
    id: verify
    agent: onboard-agent
    output: 开发/00-项目治理/接入核验-{yyyyMMdd}.md（①～⑨ 逐项 通过/缺口 + 证据）
    notes: >
      按 onboard-agent 接入清单核验（①～⑨，含文档树/索引/§8/§9/开发计划/写接入标记），逐项给「通过/缺口 + 证据路径」，不得只写“已核验”。
      跑 `规则/tools/Test-Template.ps1`；BLOCKED 不得打标。
      核验通过后写「开发规范接入：已完成」；此后按 AGENTS §0 第 3 点（接入状态）跳过落地检查。
      文档根有平铺/根目录有文档残留 → 不通过，回 docs 步整理；L2+ 缺开发计划 → 回 control 步补。

  - name: 收尾
    id: wrap
    agent: onboard-agent
    output: 【任务收尾】（接入明细置第 1 点，六段压缩）
    notes: >
      对照 `规则/模板/90-交接与收尾/收尾骨架.md` §2 输出六段压缩（须含【遵守自检】）；仅例外/待处理展开；禁逐项罗列工具
