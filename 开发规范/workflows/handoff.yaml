# 开发协作交接（接收 / 发送 / 回执 / 变更通知 / 状态）
# 入口即止：send/receive/status/change_* 各自独立，不自动串跑。
workflow:
  id: handoff
  name: 协作交接
  version: 1
  read_index: 规则/读取索引.md

entry_points:
  生成交接包: send
  提测交接包: send
  交接给测试: send
  交接给产品: send
  发布交接包: send
  接收交接包: receive
  接收产品文档: receive
  接收测试报告: receive
  签收交接包: receive
  导入交接包: receive
  交接回执: receive
  交接状态: status
  待回执: status
  发变更通知: change_send
  变更通知: change_send
  同步变更: change_receive
  收到变更: change_receive
  变更影响分析: change_receive
  重规划: replan
  计划调整: replan
  重新基线: replan
  计划偏离: replan

trigger:
  - 生成交接包 / 提测交接包 / 交接给测试 / 交接给产品 / 发布交接包
  - 接收交接包 / 接收产品文档 / 接收测试报告 / 签收交接包 / 导入交接包 / 交接回执
  - 交接状态 / 待回执
  - 发变更通知 / 变更通知 / 同步变更 / 收到变更 / 变更影响分析
  - 重规划 / 计划调整 / 重新基线 / 计划偏离

steps:
  - name: 交接状态
    id: status
    agent: iterate-lead
    output: 交接台账摘要（待回执/超时/退回/阻断）
    notes: >
      只读 `开发/交接/交接台账.md` 与 `开发/开发计划.md` §0/§12；不重写计划、不发包。
      报备：当前未回执 n 个、超时 n 个、退回 n 个、阻断下游的 HO-ID、下一步入口。
      有未登记新包（`开发/资料/交接/` 有目录但台账无记录）→ 建议先 `receive`，不直接实施。
      台账缺失 → 按 `规则/模板/90-交接与收尾/交接台账模板.md` 建，但不虚构历史。
      输出首条：route=workflow:handoff | step=status | pending=… | overdue=… | next_action=…

  - name: 生成交接包
    id: send
    agent: iterate-lead
    hitl: confirm_handoff
    hitl_when: handoff_send_required
    output: "开发/交接/{HO-ID}/ + 【交接包已生成】"
    notes: >
      先读 `规则/协作/协作与交接.md` §4 与 `规则/模板/90-交接与收尾/交接包说明模板.md`、`规则/模板/90-交接与收尾/交接清单模板.md`。
      选类型与接收方（§3）：CLAR（需求澄清→产品）、DES（技术方案→产品/测试）、PLAN（任务/排期→产品/测试）、CHG（技术变更→产品/测试）、
      QA（提测→测试）、BUG（产品缺陷评估→产品）、FIX（修复/回归→测试）、REL（发布→产品/测试/运维）、RETRO（复盘）。
      **前置硬条件**：QA=完成门 `COMPLETE` 且提测单/证据齐；REL=`confirm_deploy` 已过或发布审批齐；CHG=变更确认；
      BUG=评估单完成；FIX=修复/门禁完成。未过门不得生成“可提测/可发布”包。
      无论单包/多包同仓，一律生成完整包 `00/01/02/03/04`；冻结版本/提交/构建 → 按最小必带复制到 `02-文档/`、证据到 `03-证据/` → 写 `00/01` → 复制空白回执模板到 `04-回执/`（模板必带，默认不强制填）。
      运行 `python 开发规范/规则/tools/validate_handoff.py <包路径>`（可用时）；缺件/占位符/版本不符先修。
      更新 `交接台账.md`（状态=已发送）、开发计划 §0/§12、文档索引、activeContext；**不得写已接收**；已发送即可继续本侧准备，不以等回执阻塞日常。
      传递：多包同仓 → 输出「同仓直读：开发/交接/{HO-ID}/」，**禁止**再让用户拷/转到对方 `资料/交接/`；仓外/单包 → 发文件夹或可选 ZIP `{HO-ID}.zip`。
      输出【交接包已生成】：HO-ID/类型/接收方/路径/传递方式/必带/阻断/回执（默认可选；点名正式签收或发布/C2/C3 再填）/状态=已发送。
      confirm_handoff：出示接收方/类型/必带/缺口/传递方式请确认；已由上一门确认同一发送时跳过。

  - name: 接收与签收
    id: receive
    agent: iterate-lead
    hitl:
      - name: confirm_change
        when: handoff_change_substantive
      - name: confirm_plan
        when: plan_needs_confirm
    output: 接收回执 + 开发计划/文档更新 + 台账状态
    notes: >
      读包顺序：`00-交接说明.md` → `01-交接清单.md` → `02-文档/` → `03-证据/`。
      定位：多包同仓 → 直接打开发送方路径（如 `产品/交接/{HO-ID}/`），**不要求**拷入 `开发/资料/交接/`；仓外 → 在用户放置处读文件夹/ZIP，台账可登记路径，归档有用时再可选拷到 `开发/资料/交接/`。
      核对五件事：清单齐/版本对/阻断缺口/互相矛盾/需开发拍板项；结论=接受/有条件接受/退回。
      回执默认可选；用户点名正式签收或发布/C2/C3 → 填写 `04-回执/接收回执.md` 并回传，台账改 `已接收/有条件接收/退回`。无回执只可称已发送，不得称已接收；正式签收时不得替对方签收。
      按包类型更新：REQ/DES → 需求理解包/需求基线/方案/前端设计；PLAN → 开发计划 §1/§5；QA → 无（开发发出）；
      TEST → 失败/缺口/遗留进任务清单/修复计划；BUG → 缺陷台账/修复；CHG → 影响分析/方案/排期；REL → 发布记录。
      核对后再进入实施/修复；有阻断缺口 → 正式回执=退回，不实施；有条件 → 条件写进计划风险与责任人/截止。
      更新 `交接台账.md`、开发计划 §0/§1/§12、文档索引、activeContext。

  - name: 发送变更通知
    id: change_send
    agent: iterate-lead
    hitl: confirm_change
    hitl_when: handoff_change_substantive
    output: "开发/交接/{CHG-HO-ID}/ + 更新后的受影响文档"
    notes: >
      先按 `workflows/change.yaml`/`intake.yaml` 完成变更分析/方案/任务/CR；本步只负责“通知包”。
      按 `规则/协作/协作与交接.md` §6 判 C0/C1/C2/C3；C2/C3 必须先过 `confirm_change`，计划级再 `confirm_plan`。
      必带：变更单/决策、更新后的需求/AC/方案/接口/数据、影响矩阵、接收方必须做的事/截止、兼容/回滚/迁移、生效版本。
      受影响角色逐个发（产品/测试）；同一变更一个包可多接收方，但回执逐个登记。
      更新 `交接台账.md`、开发计划 §0/§2/§10/§12、文档索引、activeContext；输出【变更通知已生成】+ 回执截止。
      未确认不得发；不得用口头/聊天替代变更包。

  - name: 接收变更并适配
    id: change_receive
    agent: iterate-lead
    hitl:
      - name: confirm_change
        when: handoff_change_substantive
      - name: confirm_plan
        when: plan_needs_confirm
    output: 变更影响分析 + 开发计划/文档调整 + 回执
    notes: >
      读变更包 00/01/02；按 §6 判级别；核对变更单、影响矩阵、生效版本、回滚/兼容。
      先做影响分析：需求/AC、原型/设计、架构/DB/API/前端、任务/排期、测试/发布、依赖。
      更新需求基线/方案/ADR/任务清单/开发计划；C0 就地更新并答复；C1 更新并回执；C2/C3 重基线并过门，必要时反向发 `CHG`。
      更新 `交接台账.md`、开发计划 §0/§1/§2/§5/§6/§10/§12、文档索引、activeContext；填写回执。
      与现有方案/代码冲突 → 列冲突，不静默选一边；未裁决前不实施。

  - name: 重规划
    id: replan
    agent: iterate-lead
    hitl: confirm_plan
    hitl_when: plan_needs_confirm
    output: 更新后的开发计划 + 重规划记录
    notes: >
      按 `规则/协作/协作与交接.md` §6.2 触发（需求/方案/依赖/门禁/CI/产能/发布窗口）执行；先冻结当前基线快照，再做影响矩阵。
      选一个动作并写理由：保持+加缓冲｜重排｜砍范围/降级 MVP｜拆波次｜重设计｜暂停升级｜重新基线；C2/C3 必须过 `confirm_plan`。
      同轮更新开发计划 §0/§1/§2/§5/§6/§10/§12、任务清单、`交接台账.md`、文档索引、activeContext；受影响的 `QA/REL/FIX` 包标 `已取代` 并重发。
      重规划后重过受影响门（方案/清单/完成门/发布门）；未过门不得把阶段标完成；向产品/测试发 `CHG` 包并收回执。

  - name: 收尾
    id: wrap
    agent: iterate-lead
    output: 【任务收尾】（交接/回执/变更置第 1 点）
    notes: >
      按 AGENTS §2 输出【任务收尾】：第 1 点含 HO-ID/方向/类型/对方/包路径/状态/回执/阻断项与汇报（可整段复制），第 2～6 点齐。
      更新开发计划 §0/§1/§12、activeContext、文档索引；未回执/退回/待补项明示。
      本步只出骨架与拟提交清单；提交门在下一步。

  - name: 拟提交
    id: commit
    agent: implementer
    hitl: confirm_commit
    hitl_when: has_pending_commit
    tools:
      - git
    notes: 无文件变更跳过；拟提交清单按 `规则/工作流.md` §2；提交后补一行结果，不重复六段。
