# 读取：仅当前 step 块（当前 - name: 至下一个）；全文件仅供维护，禁止整文件通读。
# 入口即止：clarify/design/review-docs/review/deliver/commit 为单步入口；未标 chain: full 时只到该步 + 收尾。
workflow:
  id: change
  name: 常规代码变更
  version: 10
  read_index: 规则/读取索引.md

entry_points:
  常规变更: clarify
  澄清: clarify
  需求澄清: clarify
  提交: commit
  推送: commit
  分析PRD: analyze_input
  分析 PRD: analyze_input
  理解需求: analyze_input
  解析原型: analyze_input
  出方案: design
  方案评审: review-docs
  文档评审: review-docs
  设计文档评审: review-docs
  代码评审: review
  提测: deliver
  提测单: deliver
  发布说明: deliver
  回滚预案: deliver

trigger:
  - 常规变更
  - 澄清
  - 分析 PRD / 迭代方案 / 需求文档 / 页面原型 / 理解需求 / 解析原型
  - 出方案 / 需求澄清 / 方案评审 / 文档评审
  - 代码评审
  - 提测 / 提测单 / 发布说明 / 回滚预案
  # 未命中 defect-fix / iterate / onboard / release / retro 的实施类，由 AGENTS §3 兜底至此

steps:
  - name: 对齐与澄清
    id: clarify
    agent: implementer
    hitl:
      - name: confirm_iteration_close
        when: iteration_close_needed
      - name: confirm_docs_migration
        when: docs_migration_needed
    output: 需求理解包 + 验收清单草案（目标/范围/AC/非目标/假设/检查/证据）
    notes: >
      先按 `规则/核心/澄清.md`：给「需求理解包」（目标/用户与场景/范围/规则/权限/异常/AC/约束/假设/来源），列「缺口清单」并写影响；**一次只问一个问题**并附建议，直到没有实质性缺口或剩余缺口被明确接受为假设。有实质缺口时在 `analyze_input`/`requirements` 的 `confirm_understanding`/`confirm_requirements` 停；无缺口直接进后续步骤，不另造门。不重复问已确认项。
      验收清单草案：每条 AC 写「判定 + 检查 + 证据」；L0/L1 可写在任务卡/开发卡，L2+ 按 `验证/模板/验收清单.yaml` 落 acceptance 文件（见 `验证/README.md`），确认后冻结。
      技能：`技能/requirements-and-spec/SKILL.md`（先读再澄清）。
      输入是原始想法/无 PRD → 先按 `技能/product-shaping/SKILL.md` 给 3～5 行产品判断（问题/用户/价值/MVP/非目标/成功标准），不强制产品定义卡；报错/回归先复现/红证/根因，不直接改。
      需求/验收点不明且本机可用 spec-clarify（能力注册表）时按需澄清；不可用按 `规则/核心/澄清.md`。
      变更分级见 AGENTS §0.1；L0 微改可轻量但不得跳过理解回执，L2+ 进入 requirements。
      任务开始先写本轮任务标记：`验证/Invoke-Gate.ps1 -StartTask -TaskId "<任务ID>" -ProjectRoot "."`（写 `.gate/task.json`：`task_id`/`started_at`/`base_commit`；门按 base 算 diff，截图须晚于 started_at/验收清单）。
      L2+ 先读 `开发/开发计划.md`（旧项目可 `00-项目治理/开发计划.md`）；无则按 `技能/development-plan/SKILL.md` 创建（或提示缺口），报备当前阶段/下一步。
      输入含外部 PRD/方案/原型/专项/未决确认 → 先按 `规则/文档治理.md` §2～§4；确认前不改文件。确认后：主副本必留原始资料根并索引 → 按需复制 → 按需 R0～R2；原件不迁。本包方案/基线正文写工作区。完整吸收链优先 `intake`。
      确认采纳或换代/换主题后按 `规则/文档治理.md` §7（不确定则 `confirm_iteration_close`；确认后先判 T1/T2/T4，再按 §7.1 关账，T2/T4 保留仍被引用的基础设计/流程图/原型；跳过仅发版项）。
      输入是交接包（含 `00-交接说明.md` + `01-交接清单.md`）→ 先走 `workflows/handoff.yaml` receive 核对+回执，再按包内文档做需求理解；未签收不得进入分析。
      输入含 PRD/迭代方案/原型/需求文档 → 下一步 `analyze_input` 必须执行；不得只凭标题/摘要写需求卡。

  - name: 产品资料解析与理解确认
    id: analyze_input
    when: has_product_docs_or_prototypes
    agent: implementer
    hitl: confirm_understanding
    hitl_when: understanding_needs_confirm
    output: 需求理解包（开发/01-需求基线/理解-{主题}-{yyyyMMdd}.md；§0 Brief+Delta 必填）
    notes: >
      技能：`技能/product-doc-analysis/SKILL.md`（先读再做）；模板 `规则/模板/10-规划与需求/需求理解包模板.md`；只读输入，不改代码/基线。
      输入含 PRD、迭代方案、需求文档、页面原型、截图、接口/技术文档时必走；单文档/小改用轻量 §0+迷你 Delta，L2+ 或多文档用完整包（§0 门面 + 下钻）。
      **§0 必填**：【业务与变更简报】+【本期差量表】（增/改/删）+【影响摘要】；有产品迭代变更摘要/计划 §3.0/变更单 Delta → 引用对账不另造 ID；无则自建并标「待产品确认」。
      下钻：来源清单、角色/场景、F/R/AC、状态机、权限、字段、异常/NFR、原型、冲突表、GAP/假设、追溯种子、确认状态（见技能 §4）。
      读迭代方案按技能 §1.1：验收矩阵先分 `DEV-AC / QA-AC / REL-AC`；只有 `DEV-AC` 进理解包/开发范围，`QA-AC/REL-AC` 转测试/UAT 交接，不写成开发任务。
      每条结论标 `[原文]`/`[推断]`/`[假设]`/`[待确认]`/`[GAP]`/`[开发择优]`，引用到章节/页码/页面/组件；找不到来源写 GAP，不猜；不确定项标归属 P/D/S（`规则/核心/澄清.md` §1.1）。
      原型只作 UI/交互依据，不反推后端规则；与 PRD 冲突列冲突表（P/S），由用户裁决；方案自相矛盾归 S 出【待确认单】并停实施；文档「由开发确认」归 D：择优+理由→用户确认，默认不甩产品；代码是现状事实，不是需求真值。
      一次一问至无实质缺口（见 `规则/核心/澄清.md`）。未确认、无理解包 Brief/本期差量表、或 S 未关闭不得进入 requirements/design/implement。
      需要产品拍板的冲突/口径（P/S，可转发产品=是）→ 先出【待确认单·产品】供用户转发；经用户确认后再按 `规则/协作/协作与交接.md` §3 发 `CLAR`；收到答复后更新理解包并回执。
      confirm_understanding：**主屏出示 §0 Brief+差量表 + 待确认单摘要**（禁止仅用 6～8 行复述代替差量表；L0 迷你 Delta 除外）；用户明确确认后才继续；已确认内容不重复问。
      产出后更新 `文档索引.md`/`activeContext`（有资料变化时同步 `资料索引`）；不覆盖 PRD/基线正文。

  - name: 需求基线
    id: requirements
    when: new_feature_or_scope_change_or_requested
    agent: implementer
    hitl: confirm_requirements
    hitl_when: requirements_need_confirm
    output: 需求基线（开发/01-需求基线/）
    notes: >
      条件步：新功能/范围变更/验收不明才走；小改用轻量需求卡（背景/目标/AC/非目标）。
      输入：已有 `analyze_input` 需求理解包 → 直接引用，不重读全文；无理解包但含外部 PRD/原型 → 先回 analyze_input 补；没有 PRD → 一句话说明缺口，由用户提供/选择只用已有资料/按模板 `规则/模板/10-规划与需求/需求基线模板.md` 补一份。
      可选输入（不强制）：项目已有 PRD/需求文档（任意路径/来源）→ 引用并只补技术验收/差距/非功能；不得重写或臆造业务需求。
      技能：`技能/requirements-and-spec/SKILL.md`。
      必过：用户故事、AC（条件+动作+可观测结果，逐条可追溯到理解包/原文）、NFR（性能/安全/隐私/兼容/可观测）、明确不做、假设/依赖、签收；理解包的冲突/GAP 未裁决项必须继承，不得静默消失。基线只收 `DEV-AC`；`QA-AC/REL-AC` 不进开发 AC/任务。
      新功能/范围变更/AC 实质变化 → 视为 requirements_need_confirm=true；未确认不得进设计/排期。
      confirm_requirements：出示范围/AC/NFR/非目标与未决项，确认后冻结；若 confirm_understanding 已确认范围/AC，只确认新增/变化与正式签收，不重复同一问题；未签收不得进设计/排期（用户豁免须记录；已有 PRD 且已签收 → 只确认技术差距）。
      L2+ 基线落盘后：若本轮跳过 design，仍须经 `review-docs` 选 A/B（基线亦属落地文档）；有 design 则与方案一并在 review-docs 审。

  - name: 方案与设计
    id: design
    when: new_feature_or_architecture_or_breaking_change_or_high_risk_or_requested
    agent: implementer
    output: 方案/ADR（开发/02-方案设计/）
    notes: >
      条件步：新功能/接口或数据变更、架构级/新子系统/破坏性/高风险或点名「出方案」才走；L0 单文件小改可跳过。
      技能：`技能/solution-design/SKILL.md`（先读再产；按变更面加载 02A～02F）+ `技能/engineering-quality/SKILL.md` + `技能/cross-layer-consistency/SKILL.md`（权限/状态/数据基数/多表面时：单一谓词+四维矩阵）+ `技能/observability-and-instrumentation/SKILL.md`（生产可诊断性）+ `技能/ai-application-engineering/SKILL.md`（AI/LLM 变更）；前端补设计时再读 `技能/frontend-design` + 前端设计说明模板。
      模板 `规则/模板/20-设计与技术/方案模板.md`，架构决策另落 ADR。
      必答：范围/接口/数据/迁移/权限/失败与回滚/兼容/观测/测试策略/未决项；逐条响应 RP/F/R/AC/NFR；冲突/GAP 未裁决 → 不实施。
      **领域侦察分片**（L3/≥3 领域）：只读 scout；正文单写手。
      落盘后进入 `review-docs`（选 A/B + 授权）；本步不弹 confirm_spec。「只出方案」→ design 后仍进 review-docs 再收尾。

  - name: 落地文档评审
    id: review-docs
    when: landing_doc_review_needed
    agent: doc-reviewer
    hitl:
      - name: select_review_mode
        when: landing_doc_review_needed
      - name: confirm_spec
    output: 评审-文档-*.md 或 HUMAN_APPROVED 声明
    notes: >
      **实施前必经**（L2+ 有新基线/方案/ADR/前端设计说明，或口令方案评审/文档评审）。技能：`技能/design-doc-review/SKILL.md`。
      **STOP【评审方式】**：A 自行评审通过｜B AI 独立评审；未选不得进 implement。
      **选 A**：出示 D1–D8/评分卡自检摘要 → 用户确认 → HUMAN_APPROVED → `confirm_spec` 确认基线/方案可实施；仅基线时确认基线，不重复 `confirm_requirements`。
      **选 B**：`doc-reviewer` 异上下文按 D1–D8 审；留痕 `开发/02-方案设计/评审-文档-{主题}-{时间}.md`（仅基线则可落 `01-需求基线/`）；需修回 design/requirements（≤1）；通过后再授权。
      评审对象=本轮新增/变更的基线+方案+ADR+前端设计说明（有则全列）。点名「方案评审」且已有方案 → 本步选模式+审，不重产。
      **与代码评审分轨**：本步不审 diff；代码仍走 `review`。

  - name: 任务清单
    id: plan
    when: multi_file_or_new_feature_or_requested
    agent: iterate-lead
    hitl: confirm_backlog
    hitl_when: backlog_approval_required
    output: 任务清单 + 冻结的验收清单（开发/04-计划与任务/）
    notes: >
      条件步：多文件/新功能/跨模块才走；单文件 L0 可跳过。
      技能：`技能/task-breakdown/SKILL.md`（先读再拆）+ `技能/cross-layer-consistency/SKILL.md`（权限/状态/数据基数/多表面时先填四维矩阵）；硬门 `规则/核心/实施质量门.md`（SC/债项）；模板 `规则/模板/30-计划与任务/任务清单模板.md`。
      本步只读，不改代码/配置；拆完先自检（RP 覆盖/AC/**每任务 SC 表**/依赖无环/并行安全/L 已拆/检查点/四维矩阵/裁剪债项），再 confirm_backlog（清单+节奏三选）。
      验收清单：每任务 AC 对应「检查 + 证据」；L2+ 按 `验证/模板/验收清单.yaml` 落 acceptance 文件（见 `验证/README.md`，含 sc_trace/cross_layer/baseline_smoke/debts）并确认后冻结；实施中新增/变更 AC 走变更记录。
      新建/更新清单 → L2+ 或范围/节奏实质变化才 `backlog_approval_required=true`；L1 小批只通知；需审批时未确认不得实施。
      更新开发计划：S3 任务与排期=进行中/完成，任务清单链接、里程碑、依赖、风险；清单未完成时禁止覆盖；不同工作先问用户。

  - name: 实施
    id: implement
    agent: implementer
    precondition: clarify 已完成；按级别适用的 requirements/design/review-docs/plan 已完成并确认；任务 SC 已抽或已标不适用；缺一停，不跳过门直接写代码
    on_fail: 回 design/review-docs 或 requirements；不得以「先写再补」绕过
    output: 代码/配置改动
    notes: >
      **动手前硬门**：先按 `规则/核心/实施质量门.md` DEV-IQ-09 自主【实施预检】（扫描表 §3.1）；命中 DEV-IQ-10 重要面 → 同批硬补（SC+防护+负面自测）后再改代码；未出示预检不得动手。方法 `技能/implementation-and-selftest/SKILL.md` §0.5。
      技能：`implementation-and-selftest`（先读再改）+ `engineering-quality` + `cross-layer-consistency`（权限/状态/数据基数/多表面时）+ 预检命中面再读 `threat-modeling`/`performance-and-capacity`/`observability-and-instrumentation` 当前节；失败时 + `debugging-and-error-recovery`；AI 变更 + `ai-application-engineering`；质量硬门 `实施质量门.md`；前端需补设计再读前端设计说明模板，否则按产品设计实现。
      实现前读需求理解包的「必须保留/可优化/未提供」与验收清单 AC/**SC**；原型/PRD 冲突或缺失 → 停下说明并 OPEN，不按截图猜后端规则、接口或状态机，不静默选边。
      按验收清单+SC 实施；自测预期只认方案（冲突停工，禁改断言刷绿）；每完成一个可验证单元即跑对应检查并留证据；前端按 `验证/frontend/验收清单.md` 留状态/视口/console/network 截图。
      可测逻辑同步补测；装配 docs-mcp 时按其核对最新文档（防幻觉 API）；
      本机可用 unit-test-gen 时按覆盖缺口驱动单测（禁无断言凑覆盖率）；不可用=手写+门禁。
      **实施分片**（子代理编排 §2）：**≥3 个可独立任务且文件集不相交** → 一组一子代理；文件不相交可并行≤3；开跑 `mode=`；超时降级直做；批末定向门禁→核验→下一批；单文件/L0 直做；子代理不改清单/计划。
      改动面超出清单/预期先停下说明；高风险变更用开关/可回滚路径。
      **前置自检**：本步开始前逐项核 `precondition`；L2+ 若 review-docs/plan 被跳过，回对应步补齐，不得直接实施。

  - name: 代码评审
    id: review
    when: review_required
    agent: reviewer-agent
    tools:
      - code-review
      - security-scan
      - design-review
    output: 评审结论/缺口 + `.gate/review.md`
    notes: >
      条件步：L2+/L3、高风险/大改/破坏性变更或点名「代码评审」必走；L0 单文件、确实低风险的 L1 单点可跳过，但须在计划/验收记录理由与风险接受人；免审不免自测/证据。
      评审范围必须覆盖本轮完成门 diff；若门禁 diff 含未审波次，评审记录必须补覆盖，否则不得判 `COMPLETE`。
      多波次二选一：每波独立评审+过门，或整迭代只过 S5 全量评审；不得混用。S5 已有波次评审时做集成/AC/证据/抽样复审，不逐行重审；S5 是唯一评审时必须全量覆盖。
      评审完成后写 `.gate/review.md`（reviewer/implementer/verdict/AC 覆盖/缺口），供完成门核对；L2+ 缺评审记录 = BLOCKED。
      本步由 `reviewer-agent` 独立核验，核验者≠实施者；`code-review` 只是工具，不替代独立角色。
      技能：`技能/code-review/SKILL.md`（五轴 + 全量覆盖 + 安全/供应链，先读再审）+ `技能/engineering-quality/SKILL.md` §5（质量 rubric）+ `技能/cross-layer-consistency/SKILL.md`（权限/状态/数据基数/多表面时按四维矩阵核）。
      本机可用 code-review 时按其评审全量 diff；不可用按 `agents/reviewer-agent.yaml` 人工清单。
      security-scan 可用时跑密钥/依赖/许可证/SAST 最小集；不可用=人工清单并记降级。
      UI/前端变更：design-review 可用时按 Vercel Web Interface Guidelines 审；不可用按 `技能/frontend-design/SKILL.md` §9 评分卡人工核。
      **评审分片**（子代理编排 §2）：>400 行有效 diff 或 L3 → 按维度只读扇出（正确性/安全/性能/测试覆盖），编排去重；最终结论由本步 reviewer 定；小 diff 直做。
      只报正确性/需求覆盖/安全/性能/范围缺口；需修回 implement，同回合重验≤1；核验不替代门禁。
      **需求覆盖核对**：验收清单 AC → diff/测试，逐条判「已覆盖/未覆盖/不适用+依据」；缺覆盖列缺口，不以代码风格替代需求核对。
      **证据核对**：只看本轮 diff/测试/截图证据；完成门由下一步 verify 统一运行；评审不声称完成。前端变更核对状态/视口/console/network/截图。

  - name: 自验与完成门
    id: verify
    when: code_changed_or_requested
    agent: verifier-agent
    gate: completion-gate
    gate_type: machine
    output: .gate/开发规范/completion.json + 验证回执
    notes: >
      有代码/配置改动才跑；按 `验证/检查矩阵.yaml` 取最小充分集（细则 `规则/核心/验证规则.md` + 取重时 `规则/核心/实施质量门.md` §8）。
      **开发自验（硬）**：无 QA / 无正式测试报告时，L1+ 且触及用户路径/交互/业务规则/接口行为 → 必按 `技能/test-design-and-execution/SKILL.md` 出轻量报告（或方案卡/验收附录含完整 verdict/P0/AC·SC 走查/证据）；仅 build/lint/单测绿不算功能自验完成。口径 `规则/核心/轻量交付.md` §4.1。有正式测试报告 → 引用，不重复造、不冒充准出。
      **质量对账**：核对 acceptance 的 implement_preflight/sc_trace/cross_layer/baseline_smoke/debts（或任务卡等价字段）；有行为却缺预检、或取重缺项 → 不得报全覆盖通过。
      运行 `验证/Invoke-Gate.ps1 -Acceptance <任务清单/开发卡>`；门读验收清单/diff/证据/process，自己跑关键检查并写 `.gate/开发规范/completion.json`。
      纯澄清无改动跳过本步；失败不声称完成；存量失败只对账新增。
      非 `COMPLETE` → **本步结束，不得进入 deliver/commit/release_handoff**；先修复、补证据或报阻塞。
      工具/环境缺失 → BLOCKED，不得以“人工清单已过”替代；前端变更必须有状态/视口/console/network/截图证据。
      **日志分诊**（子代理编排 §2）：原始日志落盘，先脚本过滤失败摘要；仅多文件语义归因才派子代理，返回「通过数/新增失败/堆栈摘要」≤30 行。
      收尾先写 `【验证回执】` +（无 QA 时）`【开发自验】`；`验证/Test-Report.ps1` 对账。

  - name: 提测与发布文档
    id: deliver
    when: has_qa_or_deploy_or_requested
    agent: implementer
    hitl: confirm_intent
    hitl_when: intent_needs_confirm
    output: 提测单/发布说明/回滚预案（开发/06-发布与交付/）
    notes: >
      条件步：有 QA 交接或含部署/发版才走；无 QA 且无部署可跳过。
      **意图择优**：口令已点名「提测单/发布说明」或流水线自然到达且产物唯一 → 一行回执后直写；产物/接收方有歧义 → `confirm_intent` 停等后再写 `06-发布与交付/`。
      **跳过本步 ≠ 跳过自验**：无提测单时，verify 的开发自验报告/AC 走查仍须齐（`轻量交付.md` §4.1）；收尾写【开发自验】。
      技能：`技能/qa-handoff-and-release/SKILL.md`；模板 `规则/模板/40-交付与发布/提测单模板.md`、发布说明模板；质量硬门 `规则/核心/实施质量门.md` §6～§7。
      **最优默认：一份完整自洽提测单**（市面 Ready-for-QA 内容层）；项目/迭代背景、环境/账号/数据、业务规则、AC/场景、已知问题、**裁剪债项、沿用基线再验摘要**写进正文；禁「见开发/…」。
      **测试对象是部署环境**：提测单只写实际部署版本；不写文档版本/commit/tag/`.deploy-rev`，不要求测试读本地文件、进服务器目录或执行开发命令；内部测试演示账号可写明文并标注「仅测试」。
      **不写开发/测试流程**：版本策略、测试轮次、缺陷平台、准入/退回、测试报告模板、开发自测命令都不写；测试范围/轮次/缺陷管理由测试决定。管理员能在系统内创建账号/数据的，直接写清。
      自检结论只用于判断是否可提测，不写门禁路径/命令；未 `COMPLETE` 不得标“可提测”；无债项声明的口头裁剪不得提测。
      **附加包按需**：由 AI 在交付前判断；仅当多文件证据/正式签收/仓外ZIP/同发发版材料/用户点名 → 停问并按 handoff 另行处理；不改变提测单内容，不在单内预填 HO/回执/包材料清单。
      落 06-发布与交付/；提测单一次性完整，测试开始后不靠改单补信息；文档纳入随后 commit。

  - name: 发布交接
    id: release_handoff
    when: has_deploy
    agent: delivery-lead
    output: 发布就绪包
    notes: >
      条件步：含部署/发版才走；本步不直接部署。
      就绪包=提测单+发布说明+回滚预案+测试报告/UAT（如有）；上线检查单由 `release.readiness` 产出，本步不重复造。
      **建议**是否发 `REL` 包；确认后才 `handoff.send`。未回执不得写“已交接运维/产品”。
      发包与否不影响：用户口令「发布」进 `release.yaml`；本链不自动部署、不越过 `confirm_deploy`。
      更新开发计划：S8 发布=进行中，发布说明/上线检查单/回滚链接。

  - name: 收尾
    id: wrap
    agent: implementer
    output: 【任务收尾】（六段 + 汇报，可整段复制）
    notes: >
      更新 activeContext（焦点/最近变化/下一步/仍生效决策）、文档索引、任务清单状态；
      更新开发计划：§0 当前阶段/健康度/下一动作、§1 阶段状态/产出/证据/下一步 3 件事、§12 执行日志（L2+）。
      有代码改动读本轮 `.gate/开发规范/completion.json`；无代码改动写 `verification=not_applicable + 自检依据`。对照 `规则/模板/90-交接与收尾/收尾骨架.md` §2（含验证回执与遵守自检）
      有门回执时运行 `验证/Test-Report.ps1 -Report <收尾文件>`；lint 不通过先修报告，不得带假完成措辞。
      若发布已转 release，收尾注明发布状态与后续入口。
      未提交默认不得开始下一任务（例外=基线检查选项 C/D 且用户确认）。
      本步先出骨架与拟提交清单；完整【拟提交】在下一步 commit 只展示一次。

  - name: 拟提交
    id: commit
    agent: implementer
    hitl: confirm_commit
    hitl_when: has_pending_commit
    tools:
      - git
    output: 拟提交清单
    notes: >
      本任务无文件变更 → 跳过本步与 hitl，直接六段收尾；
      提交前确认：基线/本任务-前序-无关统计；代码/配置 + 任务清单 + 需求/方案 + 提测/发布文档 + 文档索引/activeContext + 本轮 wrap 更新同批或紧随文档提交；里程碑变更追加 `开发/工作日志.md`；**仅**用户可见版本关闭/发版同步根 `CHANGELOG.md`；
      【拟提交】须含基线/本任务-前序-无关统计/建议拆分/当前分支/是否推送/CI/PR·合并意图（规则/工作流.md §2）；对照项目档案 §1 分支策略，不符先问；**默认仅本地提交，推送须单独确认**；
      禁擅自切主干、直推受保护分支、开/合并 PR、force push（除非用户点名或档案合并要求且已在拟提交确认）；
      提交后回填提测单/发布说明的提交 hash（deliver 先产文档时写“待提交”）；
      发版类任务可装配 release-automation（能力注册表）联动版本/根 CHANGELOG（仍须另写工作日志发版条）。
      提交信息与粒度见 规则/工作流.md §2；密钥零入库。
