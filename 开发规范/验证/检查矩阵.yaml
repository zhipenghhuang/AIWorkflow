# 检查矩阵（开发轨 · 人读策略）
# 机器执行以 tools/gate.py 为准；本文件用于评审与调整，不要求 gate 解析。
# 原则：高价值低成本默认做；高价值中成本按风险做；低价值高成本不做。

version: 1
# 检查 id 名实：profile 配了 lint_scoped/test_scoped/e2e_scoped（含 {files}）→ targeted-* / affected-e2e；
# 未配 → project-lint / project-test / project-e2e（全仓命令，勿宣称「只跑受影响」）。
levels:
  L0:
    description: 单文件/文案/配置；无行为、契约、权限、数据变化
    required: [build, test-or-targeted-test, smoke]
    optional: [screenshot]
  L1:
    description: 多文件、普通功能、前端行为变化
    required: [build, lint-or-targeted-lint, test-or-targeted-test, smoke]
    frontend_required: [e2e-or-affected-e2e, screenshots-desktop-mobile, states-console-network, design-qa]
    optional: [a11y-basic, visual-diff]
  L2:
    description: 跨模块、接口/数据变更、新功能
    required: [build, lint-or-targeted-lint, unit, integration, review-record]
    frontend_required: [e2e-or-affected-e2e, screenshots-desktop-mobile, states-console-network, design-qa]
    manual: [review]
    optional: [contract-test, security-scan]
  L3:
    description: 权限/资金/迁移/公共 API/安全合规/破坏性
    required: [L2, security-scan, security-evidence, rollback-evidence, independent-review]
    manual: [rollback-drill, release-readiness, postrelease]
    optional: [migration-rehearsal, load-test]

post_gate:
  - report-lint   # iterate/change/defect-fix wrap 后由 验证/Test-Report.ps1；不属于 implementation gate

change_types:
  frontend:
    globs:
      - "**/*.tsx"
      - "**/*.jsx"
      - "**/*.vue"
      - "**/*.svelte"
      - "**/*.css"
      - "**/*.scss"
      - "**/*.html"
      - "**/*.htm"
      - "**/pages/**"
      - "**/components/**"
      - "**/views/**"
      - "**/templates/**"
      - "**/layouts/**"
    min_level: L1
    notes: 纯文案/配置可 L0-light，但仍需受影响页面截图 + console 无 error。
  api:
    globs:
      - "**/api/**"
      - "**/*controller*"
      - "**/*.proto"
      - "**/openapi*"
      - "**/swagger*"
    min_level: L2
  db:
    globs:
      - "**/migrations/**"
      - "**/*.sql"
    min_level: L3
  auth_payment:
    globs:
      - "**/auth/**"
      - "**/login/**"
      - "**/payment/**"
      - "**/pay/**"
      - "**/security/**"
      - "**/permission/**"
      - "**/role/**"
    min_level: L3
  docs:
    globs:
      - "**/*.md"
      - "**/*.txt"
    min_level: L0
    required: [links, placeholders]

# 高价值低成本（默认）
always:
  - acceptance-checklist
  - build
  - test-or-targeted-test
  - smoke

# 高价值中成本（按风险）
risk_based:
  - lint-or-targeted-lint
  - e2e-or-affected-e2e
  - frontend-screenshots
  - frontend-states
  - frontend-console
  - frontend-network
  - a11y-basic
  - independent-review

# 低价值高成本（不做/少做）
avoid:
  - full-regression-every-change   # 未配 *_scoped 时 project-* 已是全仓；发布/L3 另跑全量
  - pixel-diff-every-page
  - exhaustive-a11y-every-change
  - multiple-approval-layers
  - new-docs-for-L0-L1
  - read-all-rules-every-task
