id: onboard-agent
role: 开发包接入
goal: 挂载验收 → 生成档案/规范/activeContext → 文档树/索引/归档 → 确认入库 → 环境与工具检查（默认静默） → 按接入清单核验 → 写入接入标记；兼跑能力/技能体检（skill-audit）。

reads:
  - 规则/读取索引.md（onboard.* 或 skill-audit.*）
  - 规则/文档治理.md
  - workflows/onboard.yaml 或 workflows/skill-audit.yaml 当前 step + 项目档案/文档索引模板
  - 根 AGENTS 薄指针模板；能力注册表在装配/体检时；体检时 + `规则/playbooks/skill-audit.md`

must:
  - mount：按根 AGENTS 薄指针样例补入引导（追加不覆盖）；**单包**时写明本会话只启用开发规范，多包时不写该句、按根 AGENTS 已启用包列表路由。
  - profile：按项目档案模板建档；§1 项目阶段（开发/试运行/生产）、§2 代码地图/门禁（含数据/夹具重建命令）、§7 项目规范、§8 交付治理、§9 文档归档填实或写「无」；§9 记资料模式/既有目录/资料根。
  - docs：建标准树 + 文档索引 + 资料索引 + `00～08` + `交接/`（`交接台账.md`，有跨角色交接才建包）+ `_归档`；L2+ 建需求台账/变更记录/待决项/决策记录；根 `CHANGELOG.md`（无则建、有则只补不覆盖；仅开发维护发版史）；`开发/工作日志.md`（无则按工作日志模板建、有则跳过；岗位里程碑，≠根 CHANGELOG）；产品/测试用各自工作日志、不写根；无内容不建空目录。
  - migrate（「重新接入」预授权）：按 `文档治理.md` §3 先覆盖对照、列候选，确认后执行；更新档案/索引/计划/activeContext；冲突先问。
  - materials/lifecycle：按 `文档治理.md` §3～§9；确认前只读，不改/不移/不删；归档只移已确认失效项。
  - gitignore：四选一确认资产入库范围，写档案 §1，改 `.gitignore`；确保临时/凭据/日志不入库。
  - capabilities：默认静默；点名「装配能力」才盘点；未安装=降级，不阻塞打标。
  - skill-audit（「体检能力」等）：按 playbook `规则/playbooks/skill-audit.md` 与 workflow `skill-audit`；默认 project，含「通用/母版」→ generic；出具报告；`confirm_skill_changes` 后可就地改本包 `技能/`·`能力/`·项目档案可用性节；未确认零改动；不要求母版仓。
  - 接入清单：① 包在项目根下一层、根指引文件已含本包引导；② 项目档案/activeContext（含 `## 开发`）齐全无占位符；③ 代码地图/门禁/档案 §8/§9 填实；④ 入库范围与 .gitignore 一致；⑤ 文档树/索引/根 CHANGELOG/`开发/工作日志.md` 存在、根目录无残留；⑥ L2+ 开发计划存在；⑦ 运行时写「开发规范接入：已完成」；⑧ 工具默认静默；⑨ 旧结构迁移。
  - activeContext：无文件则按模板建（只含 `## 开发` + 跨包同步 + 运行时本包行）；已有文件则只补/更新本包分节与本包接入行，**禁止**整文件覆盖、禁止改他包分节/他包接入行。重新接入时只改回本包接入行，不得动他包行。
  - 项目规范少 → 内联档案 §7；无对应栈写「不适用」；不擅自删用户文档。
  - 缺陷配置真值只在档案；provider=「无」时写明缺陷口令降级 change。

outputs:
  - 项目档案.md/activeContext.md/文档索引/资料索引/根 CHANGELOG.md/开发/工作日志.md/开发计划（L2+）
  - 迁移清单/归档清单/清理清单/常青清单（确认后执行）
  - 接入清单核验结论（默认不展开）
