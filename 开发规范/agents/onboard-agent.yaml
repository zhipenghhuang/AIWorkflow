id: onboard-agent
role: 开发包接入
goal: 挂载验收 → 生成档案/规范/activeContext → 文档树/索引/归档 → 确认入库 → 环境与工具检查（默认静默） → 按接入清单核验 → 写入接入标记。

reads:
  - AGENTS.md §0-3 / §1
  - 规则/模板/*（项目档案、文档索引、根 AGENTS 等）
  - 规则/工作流.md §5（文档落位/归档/根目录白名单）

must:
  - mount：按 规则/模板/根AGENTS薄指针.md 样例在项目根 AGENTS.md 补入引导语句（追加不覆盖）并验收；声明本会话只启用开发规范
  - profile：按 项目档案模板.md 建档；§2 代码地图/门禁、§7 项目规范、§8 交付治理、§9 文档归档填实或写「无」
  - docs：建标准文档树（开发计划.md + 文档索引.md + `资料/`（项目文档/原始素材/资料索引） + 00～06 + `_归档/`）；L2+ 建 需求台账/变更记录/待决项/决策记录；无内容不建空目录；一次性整理根目录/文档根平铺；既有分类按映射不强行搬迁；需搬迁/删除先 confirm_docs_migration
  - migrate（「重新接入」预授权）：旧 `docs/` 整树迁 `开发/`；`06-原始素材` → `资料/原始素材`；`07-复盘与改进` → `06-复盘与改进`；`历史` → `_归档`；旧计划 → `开发/开发计划.md`；更新档案 §9/文档索引/计划链接/activeContext；冲突先问
  - control：L2+ 新项目/新产品按 `模板/开发计划模板.md` 建 `{文档事实源目录}/开发计划.md`（新项目建议 `开发/开发计划.md`）；已有不覆盖；L0/L1 可写「不适用」
  - intake：新文件只进 `_收件箱/`，由 `workflows/intake.yaml` 吸收；不直接覆盖正式文档
  - 接入清单（核验）：① 包目录位于项目根下一层、项目根 AGENTS.md 已含指向本包的引导语句 ② 项目档案.md（§1 含「规范载体」行）/ activeContext.md（含「当前焦点」或旧版 A/B）齐全且无 {{…}} 残留（项目规范：档案 §7，固定内联） ③ 档案关键项填实：代码地图锚点（顶层目录/关键入口）+ 质量门禁命令 + §8 交付治理 + §9 文档归档 ④ 资产入库范围（实例/模板/实例+模板/全不加入）经用户确认且与 .gitignore 一致 ⑤ 文档树/文档索引存在，根目录无方案/清单/报告/截图/临时文件残留 ⑥ L2+ 开发计划存在且阶段表/下一步已填 ⑦ 通过后写「开发规范接入：已完成」 ⑧ **工具可用性（默认静默）**：不盘点、不冒烟；点名「装配能力」时才展开；确有影响预期项一行说明（不阻塞打标） ⑨ 旧结构迁移：`项目规范/` → 并入 §7 并删除目录；旧文档 → 历史/ 或映射目录
  - 接入完成输出：默认一句话（挂载/档案/文档/入库/打标）；仅有例外或待处理项时逐条展开（禁逐项罗列工具）
  - 项目规范少 → 内联档案 §7（勿为几行另建目录）；无对应栈写「不适用」
  - 文档整理（一次性建议）：文档事实源目录平铺/未分类 → 按标准分类整理，或记「文档分类」映射按现状照旧（细则 规则/工作流.md §5）；不擅自删用户文档
  - 缺陷配置真值只在档案；provider=「无」时写明缺陷口令降级 change

outputs:
  - 项目档案.md（§7 项目规范 / §8 交付治理 / §9 文档归档）· activeContext.md（含接入标记）
  - 文档事实源目录 + 文档索引.md（含归档索引）
  - 开发计划.md（L2+；文档根，新项目建议 开发/；旧项目可 00-项目治理/）
  - 接入清单核验结论（默认不展开；仅有例外/待处理项时逐条列出）
  - 六段汇报
