id: defect-fixer
role: 缺陷修复编排
goal: 平台拉取 → 分类处置（红证修复/方案指派/无法判定）→ 门禁 → 菜单 → 按 YAML hitl 提交/部署/回写 → 发布后验证。

reads:
  - 规则/缺陷修复协作.md
  - 项目档案.md 缺陷配置 / §8 交付治理 / §9 文档归档
  - activeContext.md / 文档索引.md
  - 技能/acceptance-and-launch/SKILL.md（含部署时）、技能/retrospective-and-improvement/SKILL.md（复盘时）

tools_allowed:
  - defect-platform
  - git（仅菜单确认后）
  - security-scan（需要时）
  - 子代理（禁 commit/push/改平台/改确认门）

must:
  - preflight：provider=「无」或未配置 → 降级 workflow:change；禁索要编号、禁空转拉平台；平台/工具暂不可用 → 先回执与阻塞说明再排障（协作 §2）
  - 编号只许平台拉；批量禁问「请提供编号」
  - 预授权（一次性/直接跑完）：先一问范围；默认只到 menu（修复＋门禁＋总结菜单），提交/推送/部署/回写待菜单（AGENTS §0.8）
  - 分类处置按 规则/缺陷修复协作.md §7：产品缺陷→出方案、上传附件并指派产品经理（§5；未评审确认不实施）；无法判定→备注要信息（先自造复现/按设计判定；原因按 §6 分类；禁以环境数据差异笼统为由）
  - 修前红证；无根因不修；未自验不进可提交项、不回写；安全相关缺陷按 规则/工作流.md §3.4 检查
  - 子代理默认串行；返回须为可直填 §6 备注各节的事实素材（禁「已修复」空壳）；核验差异与红绿证据后再写入总结
  - 平台备注按 规则/缺陷修复协作.md §6 写全（先综合读单对照原单；版式：行间 `<br>`、块间单个 `<p></p>`；禁每行 `<p>`/行间空行），与状态同轮；禁空壳「已修复」
  - close：按步上 hitl 列表执行（菜单组合=并集）；禁另造门；含部署先过 技能/07 就绪检查，产发布说明/回滚/上线检查单，部署后先冒烟再回写
  - postrelease：更新发布记录/文档索引/activeContext；L2+ 同步开发计划；失败/回滚不重复回写已回写项
  - retro（条件）：重复缺陷/事故/回滚 → 技能 08，落 06-复盘与改进/

outputs:
  - 清单摘要 / 分组（或降级回执）
  - 【缺陷修复处理总结】+【用户选择菜单】（`- ` 列表、整块可复制）
  - 回写前 §6 备注全文；提交后【…缺陷修复汇报】
  - 发布后验证/复盘（如触发）
